<svg viewBox="0 0 960 490" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: a kind Kubernetes cluster with Calico, four pods across two namespaces segmented by label-based policy</title>
  <desc>
    A single Linux host (an Ubuntu VM, a cloud VM, or WSL2) runs Docker, kind, kubectl, and calicoctl. Inside it a kind Kubernetes cluster uses the Calico CNI as its dataplane and policy engine. Two namespaces hold four pods. Namespace dc (data center) holds web (label app=web, a client) and db (label app=db, PostgreSQL on 5432). Namespace ot (operations) holds hmi (label app=hmi, the operator) and plc (label app=plc, a Modbus listener on 502). Calico policy permits web to db on TCP 5432 and hmi to plc on TCP 502, and denies the compromised-hmi-to-db cross-namespace flow on 5432, which is the lateral movement. Calico also protects the cluster node itself with a HostEndpoint and governs flows to endpoints outside the cluster with NetworkSets.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="490" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Kubernetes Microsegmentation with Calico</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="12.2" fill="#4b5563">A kind cluster with the Calico CNI; label-based NetworkPolicy allows web-&gt;db and hmi-&gt;plc and denies the cross-namespace hmi-&gt;db lateral movement</text>
  <g transform="translate(0,10)">
  <rect x="60" y="56" width="840" height="36" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480.0" y="77.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">Single Linux host · Ubuntu 22.04 VM / cloud VM / WSL2 · Docker + kind + kubectl + calicoctl</text>
  <rect x="60" y="104" width="840" height="26" rx="6" fill="#f4f7fb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480.0" y="122.0" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">kind Kubernetes cluster · CNI = Calico · a HostEndpoint protects the node, NetworkSets govern external endpoints</text>
  <rect x="80" y="162" width="380" height="26" rx="6" fill="#f0faf2" stroke="#166534" stroke-width="1.5"/>
  <text x="270.0" y="180.0" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">namespace: dc  (data center)</text>
  <rect x="100" y="204" width="160" height="74" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="180.0" y="227.6" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">web</text>
  <text x="180.0" y="245.6" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">app=web</text>
  <text x="180.0" y="263.6" text-anchor="middle" font-size="9.5" font-weight="400" fill="#374151">client</text>
  <rect x="290" y="204" width="160" height="74" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="370.0" y="227.6" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">db</text>
  <text x="370.0" y="245.6" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">app=db</text>
  <text x="370.0" y="263.6" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7f1d1d">PostgreSQL :5432</text>
  <line x1="260" y1="241" x2="290" y2="241" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="258" y="300" font-size="10.5" fill="#166534">5432</text>
  <rect x="500" y="162" width="380" height="26" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="690.0" y="180.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">namespace: ot  (operations)</text>
  <rect x="520" y="204" width="160" height="74" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="600.0" y="227.6" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">hmi</text>
  <text x="600.0" y="245.6" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">app=hmi</text>
  <text x="600.0" y="263.6" text-anchor="middle" font-size="9.5" font-weight="400" fill="#374151">operator</text>
  <rect x="710" y="204" width="160" height="74" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="790.0" y="227.6" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">plc</text>
  <text x="790.0" y="245.6" text-anchor="middle" font-size="10" font-weight="700" fill="#7c2d12">app=plc</text>
  <text x="790.0" y="263.6" text-anchor="middle" font-size="9.5" font-weight="700" fill="#374151">Modbus :502</text>
  <line x1="680" y1="241" x2="710" y2="241" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="688" y="300" font-size="10.5" fill="#166534">502</text>
  <line x1="520" y1="320" x2="450" y2="320" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="300" y="348" font-size="10.5" fill="#b91c1c">hmi → db 5432 DENIED (lateral movement)</text>
  <line x1="80" y1="392" x2="120" y2="392" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="128" y="396" font-size="11" fill="#166534">Legitimate flow (allowed)</text>
  <line x1="383" y1="392" x2="423" y2="392" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="431" y="396" font-size="11" fill="#b91c1c">Lateral movement (denied)</text>
  <line x1="686" y1="392" x2="726" y2="392" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-neutral)"/>
  <text x="734" y="396" font-size="11" fill="#6b7280">Pod (app label)</text>
  </g>
</svg>
