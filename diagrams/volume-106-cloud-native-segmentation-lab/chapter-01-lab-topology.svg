<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: the same web/db/hmi estate built and segmented natively on AWS, Azure, and GCP</title>
  <desc>
    Your workstation runs the aws, az, and gcloud CLIs with a budget alert set. The same three-tier estate is built on all three clouds: a web app tier, a db PostgreSQL database on 5432, and an hmi operator workstation. On AWS the segmentation primitive is a security group that references the web security group as the source of 5432, plus a stateless network ACL on the db subnet. On Azure it is an NSG rule written by Application Security Group, allowing the web ASG to reach the db ASG on 5432 and denying the hmi ASG. On GCP it is a VPC firewall rule targeting the db service account, allowing only the web service account on 5432. In every column the legitimate web to db flow on 5432 is allowed and the hmi to db lateral-movement flow is denied by identity. The volume is single-track because the clouds are real accounts, so cost discipline and a full teardown are part of the lab.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="470" fill="#ffffff"/>
  <text x="490.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Cloud-Native Microsegmentation on AWS, Azure, and GCP</text>
  <text x="490.0" y="50" text-anchor="middle" font-size="13" fill="#4b5563">The same three-tier estate on each cloud, segmented with the cloud's own native primitive; web-&gt;db:5432 allowed, hmi-&gt;db denied by identity</text>
  <rect x="30" y="54" width="930" height="34" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="495.0" y="74.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Your workstation · aws + az + gcloud CLIs · budget alert set before any billable resource</text>
  <rect x="30" y="100" width="290" height="24" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="175.0" y="117.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">AWS · Security Groups + NACL</text>
  <rect x="38" y="140" width="125" height="56" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="100.5" y="162.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">web  (web-sg)</text>
  <text x="100.5" y="180.8" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">app tier</text>
  <rect x="187" y="140" width="125" height="56" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="249.5" y="162.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">db  (db-sg)</text>
  <text x="249.5" y="180.8" text-anchor="middle" font-size="9" font-weight="700" fill="#7f1d1d">db · :5432</text>
  <line x1="163" y1="168" x2="187" y2="168" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="180" y="212" font-size="10.5" fill="#166534">5432 allow</text>
  <rect x="38" y="232" width="125" height="56" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="100.5" y="254.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">hmi  (hmi-sg)</text>
  <text x="100.5" y="272.9" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">operator</text>
  <line x1="163" y1="250" x2="249" y2="196" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="162" y="300" font-size="10.5" fill="#b91c1c">hmi -&gt; db DENIED</text>
  <rect x="38" y="352" width="274" height="40" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="175.0" y="375.1" text-anchor="middle" font-size="9" font-weight="700" fill="#111827">db-sg allows 5432 from web-sg · NACL denies mgmt subnet</text>
  <rect x="350" y="100" width="290" height="24" rx="6" fill="#f0faf2" stroke="#166534" stroke-width="1.5"/>
  <text x="495.0" y="117.0" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Azure · NSG + ASG</text>
  <rect x="358" y="140" width="125" height="56" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="420.5" y="162.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">web  (web-asg)</text>
  <text x="420.5" y="180.8" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">app tier</text>
  <rect x="507" y="140" width="125" height="56" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="569.5" y="162.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">db  (db-asg)</text>
  <text x="569.5" y="180.8" text-anchor="middle" font-size="9" font-weight="700" fill="#7f1d1d">db · :5432</text>
  <line x1="483" y1="168" x2="507" y2="168" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="500" y="212" font-size="10.5" fill="#166534">5432 allow</text>
  <rect x="358" y="232" width="125" height="56" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="420.5" y="254.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">hmi  (hmi-asg)</text>
  <text x="420.5" y="272.9" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">operator</text>
  <line x1="483" y1="250" x2="569" y2="196" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="482" y="300" font-size="10.5" fill="#b91c1c">hmi -&gt; db DENIED</text>
  <rect x="358" y="352" width="274" height="40" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="495.0" y="375.1" text-anchor="middle" font-size="9" font-weight="700" fill="#111827">NSG allows web-asg -&gt; db-asg:5432 · denies hmi-asg</text>
  <rect x="670" y="100" width="290" height="24" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="815.0" y="117.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">GCP · Firewall + Service Account</text>
  <rect x="678" y="140" width="125" height="56" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="740.5" y="162.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">web  (web-sa)</text>
  <text x="740.5" y="180.8" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">app tier</text>
  <rect x="827" y="140" width="125" height="56" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="889.5" y="162.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">db  (db-sa)</text>
  <text x="889.5" y="180.8" text-anchor="middle" font-size="9" font-weight="700" fill="#7f1d1d">db · :5432</text>
  <line x1="803" y1="168" x2="827" y2="168" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="820" y="212" font-size="10.5" fill="#166534">5432 allow</text>
  <rect x="678" y="232" width="125" height="56" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="740.5" y="254.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">hmi  (hmi-sa)</text>
  <text x="740.5" y="272.9" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">operator</text>
  <line x1="803" y1="250" x2="889" y2="196" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="802" y="300" font-size="10.5" fill="#b91c1c">hmi -&gt; db DENIED</text>
  <rect x="678" y="352" width="274" height="40" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="815.0" y="375.1" text-anchor="middle" font-size="9" font-weight="700" fill="#111827">rule allows web-sa -&gt; db-sa:5432 · denies all else</text>
  <line x1="30" y1="410" x2="70" y2="410" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="78" y="414" font-size="11" fill="#166534">Allowed by identity (web -&gt; db:5432)</text>
  <line x1="432" y1="410" x2="472" y2="410" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="480" y="414" font-size="11" fill="#b91c1c">Lateral movement (hmi -&gt; db, denied)</text>
  <line x1="834" y1="410" x2="874" y2="410" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="882" y="414" font-size="11" fill="#33415c">Native segmentation primitive</text>
</svg>
