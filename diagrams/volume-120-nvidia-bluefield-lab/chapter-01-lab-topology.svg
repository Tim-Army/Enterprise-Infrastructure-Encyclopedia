<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: NVIDIA BlueField DPUs enforcing per-workload segmentation out-of-band of the host</title>
  <desc>
    Each protected workload sits behind its own NVIDIA BlueField DPU on the server's network adapter, which enforces segmentation at the NIC on its own Arm cores in a trust domain isolated from the host CPU. The web workload is behind DPU-web, whose policy permits only web to db on 5432; the hmi workload is behind DPU-hmi, whose policy permits only hmi to plc on 502. The db and plc targets sit on the network. Every other flow, such as web to plc and hmi to db, is denied at the workload's own DPU. Because the DPU is a separate computer from the host, a fully compromised host with root cannot see, disable, or alter the DPU policy, so the segmentation survives host compromise. The volume is design-leaning two-track: Track 1 describes BlueField and DOCA, Track 2 reproduces the out-of-band property with Linux namespaces and nftables.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Per-Server DPU Microsegmentation with NVIDIA BlueField</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="9.8" fill="#4b5563">Each workload sits behind its own BlueField DPU, which enforces policy at the NIC in an isolated trust domain the host cannot tamper with; the segmentation survives host compromise</text>
  <rect x="300" y="42" width="320" height="42" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="460.0" y="60.4" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">DOCA / management</text>
  <text x="460.0" y="73.3" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">per-server DPU policy (out-of-band)</text>
  <rect x="45" y="120" width="110" height="52" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="100.0" y="140.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">web</text>
  <text x="100.0" y="158.8" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">workload</text>
  <rect x="230" y="116" width="200" height="60" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="330.0" y="140.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111827">BlueField DPU (isolated)</text>
  <text x="330.0" y="158.3" text-anchor="middle" font-size="9" font-weight="700" fill="#166534">policy: web -&gt; db</text>
  <rect x="560" y="120" width="120" height="52" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="620.0" y="140.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">db · :5432</text>
  <text x="620.0" y="158.7" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">target</text>
  <line x1="155" y1="146" x2="230" y2="146" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-neutral)"/>
  <line x1="430" y1="146" x2="560" y2="146" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="455" y="114" font-size="10.5" fill="#166534">5432 allow</text>
  <rect x="45" y="250" width="110" height="52" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="100.0" y="270.9" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">hmi</text>
  <text x="100.0" y="288.9" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">workload</text>
  <rect x="230" y="246" width="200" height="60" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="330.0" y="270.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111827">BlueField DPU (isolated)</text>
  <text x="330.0" y="288.3" text-anchor="middle" font-size="9" font-weight="700" fill="#166534">policy: hmi -&gt; plc</text>
  <rect x="560" y="250" width="120" height="52" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="620.0" y="270.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">plc · :502</text>
  <text x="620.0" y="288.7" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">target</text>
  <line x1="155" y1="276" x2="230" y2="276" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-neutral)"/>
  <line x1="430" y1="276" x2="560" y2="276" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="455" y="244" font-size="10.5" fill="#166534">502 allow</text>
  <text x="45" y="345" font-size="9.5" font-weight="700" fill="#b91c1c">web -&gt; plc and hmi -&gt; db are denied at the workload's own DPU</text>
  <rect x="700" y="110" width="220" height="96" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="810.0" y="129.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Host compromise</text>
  <text x="810.0" y="145.5" text-anchor="middle" font-size="9" font-weight="400" fill="#7f1d1d">cannot see or change</text>
  <text x="810.0" y="161.5" text-anchor="middle" font-size="9" font-weight="400" fill="#7f1d1d">the DPU policy —</text>
  <text x="810.0" y="177.5" text-anchor="middle" font-size="9" font-weight="400" fill="#7f1d1d">enforcement survives</text>
  <text x="810.0" y="193.5" text-anchor="middle" font-size="9" font-weight="700" fill="#7f1d1d">root on the host</text>
  <line x1="45" y1="400" x2="85" y2="400" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="93" y="404" font-size="11" fill="#166534">Permitted by the DPU policy</text>
  <line x1="366" y1="400" x2="406" y2="400" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="414" y="404" font-size="11" fill="#b91c1c">Out-of-band (host cannot tamper)</text>
  <line x1="732" y1="400" x2="772" y2="400" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="780" y="404" font-size="11" fill="#33415c">DOCA / management</text>
</svg>
