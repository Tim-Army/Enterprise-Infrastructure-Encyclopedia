<svg xmlns="http://www.w3.org/2000/svg" width="700" height="456" viewBox="0 0 700 456" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="House-style line-art wireframe of the Proxmox Edit Linux Bridge dialog for vmbr1: Autostart and VLAN aware checked, Bridge ports nic2, MTU 1500, and the VLAN IDs field containing 3 6 99 entered space-separated (not comma-separated), highlighted with a 'spaces, not commas' note.">
  <title>Proxmox Edit Linux Bridge dialog</title>
  <desc>House-style line-art wireframe of the Proxmox Edit Linux Bridge dialog for vmbr1: Autostart and VLAN aware checked, Bridge ports nic2, MTU 1500, and the VLAN IDs field containing 3 6 99 entered space-separated (not comma-separated), highlighted with a 'spaces, not commas' note.</desc>
  <rect x="0" y="0" width="700" height="456" fill="#ffffff"/>
  <text x="24" y="30" text-anchor="start" font-size="15" font-weight="700" fill="#111827">Edit: Linux Bridge — VLAN IDs use spaces, not commas</text>
  <rect x="24" y="46" width="652" height="372" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/>
  <rect x="24" y="46" width="652" height="32" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="1.5"/>
  <text x="40" y="67" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Edit: Linux Bridge</text>
  <text x="48" y="114" text-anchor="start" font-size="11" font-weight="600" fill="#374151">Name:</text><rect x="176" y="97" width="150" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="186" y="111" text-anchor="start" font-size="11" font-weight="400" fill="#111827">vmbr1</text>
  <text x="48" y="156" text-anchor="start" font-size="11" font-weight="600" fill="#374151">IPv4/CIDR:</text><rect x="176" y="139" width="150" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="186" y="153" text-anchor="start" font-size="11" font-weight="400" fill="#111827"></text>
  <text x="48" y="198" text-anchor="start" font-size="11" font-weight="600" fill="#374151">Gateway (IPv4):</text><rect x="176" y="181" width="150" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="186" y="195" text-anchor="start" font-size="11" font-weight="400" fill="#111827"></text>
  <text x="48" y="240" text-anchor="start" font-size="11" font-weight="600" fill="#374151">IPv6/CIDR:</text><rect x="176" y="223" width="150" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="186" y="237" text-anchor="start" font-size="11" font-weight="400" fill="#111827"></text>
  <text x="48" y="282" text-anchor="start" font-size="11" font-weight="600" fill="#374151">Gateway (IPv6):</text><rect x="176" y="265" width="150" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="186" y="279" text-anchor="start" font-size="11" font-weight="400" fill="#111827"></text>
  <text x="380" y="114" text-anchor="start" font-size="11" font-weight="600" fill="#374151">Autostart:</text><rect x="510" y="99" width="16" height="16" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="513" y="112" text-anchor="start" font-size="12" font-weight="700" fill="#166534">✓</text>
  <text x="380" y="156" text-anchor="start" font-size="11" font-weight="600" fill="#374151">VLAN aware:</text><rect x="510" y="141" width="16" height="16" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="513" y="154" text-anchor="start" font-size="12" font-weight="700" fill="#166534">✓</text>
  <text x="380" y="198" text-anchor="start" font-size="11" font-weight="600" fill="#374151">Bridge ports:</text><rect x="508" y="181" width="110" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="518" y="195" text-anchor="start" font-size="11" font-weight="400" fill="#111827">nic2</text>
  <text x="380" y="240" text-anchor="start" font-size="11" font-weight="600" fill="#374151">Comment:</text><rect x="508" y="223" width="110" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="518" y="237" text-anchor="start" font-size="11" font-weight="400" fill="#111827"></text>
  <line x1="48" y1="330" x2="652" y2="330" stroke="#6b7280" stroke-width="1"/>
  <text x="48" y="364" text-anchor="start" font-size="11" font-weight="600" fill="#374151">MTU:</text><rect x="176" y="347" width="80" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="186" y="361" text-anchor="start" font-size="11" font-weight="400" fill="#111827">1500</text>
  <text x="380" y="364" text-anchor="start" font-size="11" font-weight="600" fill="#374151">VLAN IDs:</text><rect x="508" y="347" width="140" height="20" rx="3" fill="#f0faf2" stroke="#166534" stroke-width="1.4"/><text x="518" y="361" text-anchor="start" font-size="11" font-weight="700" fill="#166534">3 6 99</text>
  <text x="48" y="405" text-anchor="start" font-size="10.5" font-weight="700" fill="#166534">Enter multiple VLAN IDs separated by spaces — 3 6 99 — never commas.</text>
  <rect x="470" y="392" width="16" height="16" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="473" y="405" text-anchor="start" font-size="12" font-weight="700" fill="#166534">✓</text>
  <text x="492" y="404" text-anchor="start" font-size="11" font-weight="500" fill="#374151">Advanced</text>
  <rect x="600" y="390" width="60" height="22" rx="4" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="630.0" y="405.0" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">OK</text>
</svg>
