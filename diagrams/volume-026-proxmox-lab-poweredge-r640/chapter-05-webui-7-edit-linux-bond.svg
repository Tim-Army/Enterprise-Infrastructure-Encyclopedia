<svg xmlns="http://www.w3.org/2000/svg" width="700" height="456" viewBox="0 0 700 456" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="House-style line-art wireframe of the Proxmox Edit Linux Bond dialog: Name bond2, Autostart ticked, Slaves nic3 nic4 entered space-separated (not comma-separated), Mode LACP (802.3ad), and hash policy layer2+3.">
  <title>Proxmox Edit Linux Bond dialog</title>
  <desc>House-style line-art wireframe of the Proxmox Edit Linux Bond dialog: Name bond2, Autostart ticked, Slaves nic3 nic4 entered space-separated (not comma-separated), Mode LACP (802.3ad), and hash policy layer2+3.</desc>
  <rect x="0" y="0" width="700" height="456" fill="#ffffff"/>
  <text x="24" y="30" text-anchor="start" font-size="15" font-weight="700" fill="#111827">Edit: Linux Bond — Slaves use spaces, not commas</text>
  <rect x="24" y="46" width="652" height="372" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.5"/>
  <rect x="24" y="46" width="652" height="32" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="1.5"/>
  <text x="40" y="67" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Edit: Linux Bond</text>
  <text x="48" y="114" text-anchor="start" font-size="11" font-weight="600" fill="#374151">Name:</text><rect x="176" y="97" width="150" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="186" y="111" text-anchor="start" font-size="11" font-weight="400" fill="#111827">bond2</text>
  <text x="48" y="156" text-anchor="start" font-size="11" font-weight="600" fill="#374151">IPv4/CIDR:</text><rect x="176" y="139" width="150" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="186" y="153" text-anchor="start" font-size="11" font-weight="400" fill="#111827"></text>
  <text x="48" y="198" text-anchor="start" font-size="11" font-weight="600" fill="#374151">Gateway (IPv4):</text><rect x="176" y="181" width="150" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="186" y="195" text-anchor="start" font-size="11" font-weight="400" fill="#111827"></text>
  <text x="48" y="240" text-anchor="start" font-size="11" font-weight="600" fill="#374151">IPv6/CIDR:</text><rect x="176" y="223" width="150" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="186" y="237" text-anchor="start" font-size="11" font-weight="400" fill="#111827"></text>
  <text x="48" y="282" text-anchor="start" font-size="11" font-weight="600" fill="#374151">Gateway (IPv6):</text><rect x="176" y="265" width="150" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="186" y="279" text-anchor="start" font-size="11" font-weight="400" fill="#111827"></text>
  <text x="380" y="114" text-anchor="start" font-size="11" font-weight="600" fill="#374151">Autostart:</text><rect x="510" y="99" width="16" height="16" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="513" y="112" text-anchor="start" font-size="12" font-weight="700" fill="#166534">✓</text>
  <text x="380" y="156" text-anchor="start" font-size="11" font-weight="600" fill="#374151">Slaves:</text><rect x="508" y="139" width="120" height="20" rx="3" fill="#f0faf2" stroke="#166534" stroke-width="1.4"/><text x="518" y="153" text-anchor="start" font-size="11" font-weight="700" fill="#166534">nic3 nic4</text>
  <text x="380" y="198" text-anchor="start" font-size="11" font-weight="600" fill="#374151">Mode:</text><rect x="508" y="181" width="130" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="518" y="195" text-anchor="start" font-size="11" font-weight="400" fill="#111827">LACP (802.3ad)</text><text x="626" y="195" text-anchor="start" font-size="11" font-weight="700" fill="#374151">▾</text>
  <text x="380" y="240" text-anchor="start" font-size="11" font-weight="600" fill="#374151">Hash policy:</text><rect x="508" y="223" width="110" height="20" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="518" y="237" text-anchor="start" font-size="11" font-weight="400" fill="#111827">layer2+3</text><text x="606" y="237" text-anchor="start" font-size="11" font-weight="700" fill="#374151">▾</text>
  <line x1="48" y1="330" x2="652" y2="330" stroke="#6b7280" stroke-width="1"/>
  <text x="48" y="360" text-anchor="start" font-size="10.5" font-weight="700" fill="#166534">Slaves are space-separated — nic3 nic4 — never commas. LACP (802.3ad) needs a matching switch port-channel.</text>
  <rect x="470" y="392" width="16" height="16" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="473" y="405" text-anchor="start" font-size="12" font-weight="700" fill="#166534">✓</text>
  <text x="492" y="404" text-anchor="start" font-size="11" font-weight="500" fill="#374151">Advanced</text>
  <rect x="600" y="390" width="60" height="22" rx="4" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="630.0" y="405.0" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">OK</text>
</svg>
