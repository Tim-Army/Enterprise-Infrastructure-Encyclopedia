  <text x="800.0" y="240.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">Modbus</text>
  <line x1="125" y1="146" x2="125" y2="190" stroke="#94a3b8" stroke-width="1.1"/>
  <line x1="350" y1="146" x2="350" y2="190" stroke="#94a3b8" stroke-width="1.1"/>
  <line x1="575" y1="146" x2="575" y2="190" stroke="#94a3b8" stroke-width="1.1"/>
  <line x1="800" y1="146" x2="800" y2="190" stroke="#94a3b8" stroke-width="1.1"/>
  <line x1="190" y1="214" x2="285" y2="214" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="120" y="296" font-size="10.5" fill="#166534">WEB-&gt;DB 5432 permit</text>
  <line x1="510" y1="236" x2="415" y2="236" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="360" y="330" font-size="10.5" fill="#b91c1c">HMI-&gt;DB DENIED (lateral)</text>
  <line x1="640" y1="214" x2="735" y2="214" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="600" y="296" font-size="10.5" fill="#166534">HMI-&gt;PLC 502 permit</text>
  <line x1="60" y1="420" x2="100" y2="420" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="108" y="424" font-size="11" fill="#166534">Permitted by SGACL (group tag)</text>
  <line x1="408" y1="420" x2="448" y2="420" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="456" y="424" font-size="11" fill="#b91c1c">Lateral movement (matrix default deny)</text>
  <line x1="828" y1="420" x2="868" y2="420" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="876" y="424" font-size="11" fill="#33415c">Policy engine (ISE)</text>
  </g>
</svg>
