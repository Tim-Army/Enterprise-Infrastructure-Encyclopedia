<svg viewBox="0 0 960 516" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: Cisco ISE as policy engine and an IOS-XE enforcer applying an SGACL matrix to four tagged endpoints</title>
  <desc>
    Cisco ISE at 10.10.0.10 is the policy engine: it defines the Security Group Tags, holds the SGACL egress matrix, and distributes IP-SGT bindings over SXP. An IOS-XE enforcement device registers with ISE over RADIUS, downloads the matrix, learns the bindings over SXP, and enforces on egress with cts role-based enforcement. Four endpoints carry Security Group Tags: web is WEB value 10, db is DB value 20 listening on 5432, hmi is HMI value 30, and plc is PLC value 40 listening on 502. The egress matrix is default-deny with two permits: WEB to DB on 5432 and HMI to PLC on 502. The HMI to DB flow is the lateral movement, denied by the matrix default. The volume is two-track: Track 1 uses real ISE and IOS-XE, Track 2 reproduces the IP-SGT binding table and the tag-to-tag matrix with Linux nftables on a single host.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="516" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Fabric Microsegmentation with Cisco ISE and TrustSec</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="11.5" fill="#4b5563">ISE defines SGTs and the SGACL matrix; the IOS-XE enforcer downloads it and enforces by group tag; WEB-&gt;DB:5432 and HMI-&gt;PLC:502 permitted, HMI-&gt;DB denied</text>
