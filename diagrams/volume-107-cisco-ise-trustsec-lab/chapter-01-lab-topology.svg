  <text x="480.0" y="68.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Cisco ISE  ·  policy engine</text>
  <text x="480.0" y="82.8" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">SGTs · SGACL egress matrix · SXP · 10.10.0.10</text>
  <rect x="190" y="118" width="580" height="28" rx="6" fill="#f4f7fb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480.0" y="137.0" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">IOS-XE enforcer  ·  cts role-based enforcement  ·  downloads SGACL matrix, enforces on egress</text>
  <line x1="470" y1="94" x2="470" y2="118" stroke="#33415c" stroke-width="1.4"/>
  <line x1="490" y1="94" x2="490" y2="118" stroke="#33415c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="500" y="110" font-size="9" fill="#374151">RADIUS + SXP (IP-SGT bindings)</text>
  <rect x="60" y="190" width="130" height="62" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="125.0" y="209.5" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">web</text>
  <text x="125.0" y="224.8" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">SGT WEB = 10</text>
  <text x="125.0" y="240.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">app tier</text>
  <rect x="285" y="190" width="130" height="62" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="350.0" y="209.5" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">db</text>
  <text x="350.0" y="224.8" text-anchor="middle" font-size="9" font-weight="700" fill="#7f1d1d">SGT DB = 20 · :5432</text>
  <text x="350.0" y="240.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">PostgreSQL</text>
  <rect x="510" y="190" width="130" height="62" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="575.0" y="209.5" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">hmi</text>
  <text x="575.0" y="224.8" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">SGT HMI = 30</text>
  <text x="575.0" y="240.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">operator</text>
  <rect x="735" y="190" width="130" height="62" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="800.0" y="209.5" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">plc</text>
