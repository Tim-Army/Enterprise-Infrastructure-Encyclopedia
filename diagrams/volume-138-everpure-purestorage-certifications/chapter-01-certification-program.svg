<svg viewBox="0 0 960 584" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 program map: the Everpure IT Professional Certification program</title>
  <desc>
    Everpure, the company formerly known as Pure Storage, offers twelve IT Professional Certifications across four levels through Everpure Academy. The Associate level has one certification, Data Storage, at 200 US dollars. The Professional level has four at 300 dollars each: FlashArray Storage, FlashBlade Storage, Portworx Enterprise, and Cyber Resilience. The Specialist level has six at 300 dollars each: FlashArray Implementation, FlashBlade Implementation, FlashArray Support, FlashBlade Support, Cloud, and Migration. The Expert level has one, Platform Architect, at 400 dollars. All exams are multiple choice, delivered online and proctored with a webcam, and are closed book with no external materials permitted. Training is not required because each exam is designed to test on-the-job experience. Certifications are valid for three years and renewed by retaking the updated exam; additionally the Associate Data Storage certification renews automatically when any higher certification is earned, and Continuing Everpure Education credits apply to selected FlashArray exams. Badges issue through Credly. The rebrand is partial: the company and certifications are now Everpure, while the FlashArray, FlashBlade, Portworx, and Evergreen product names are unchanged, the conference remains Pure Accelerate, and the academy is still hosted at academy.purestorage.com.
  </desc>
