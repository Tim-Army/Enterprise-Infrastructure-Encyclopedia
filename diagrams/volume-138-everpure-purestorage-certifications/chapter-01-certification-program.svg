  <text x="480.0" y="237.0" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">Products: FlashArray (block) · FlashBlade (file + object) · FlashBlade//EXA (AI/HPC) · Portworx (Kubernetes) · Evergreen//One (as-a-service)</text>
  <rect x="40" y="268" width="880" height="56" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="480.0" y="285.6" text-anchor="middle" font-size="8.5" font-weight="700" fill="#111827">Exam mechanics: multiple choice · ONLINE PROCTORED (webcam) · CLOSED BOOK — no external materials</text>
  <text x="480.0" y="299.0" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">Training NOT required: &quot;each exam is designed to test your on-the-job experience&quot; · Credly badges</text>
  <text x="480.0" y="312.3" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">Valid 3 YEARS — retake the updated exam, OR: DSA auto-renews · CEE credits (SELECT FlashArray exams only)</text>
  <text x="40" y="358" font-size="9.5" font-weight="700" fill="#166534">Note the Specialist split: IMPLEMENTATION (deploying) vs SUPPORT (diagnosing) are different jobs — choose the one that matches your work.</text>
  <text x="40" y="377" font-size="9.5" font-weight="400" fill="#374151">Modeled free in Python: upgrade sequencing &amp; controller headroom · volume/host mapping · file-vs-object · reduction ratios · RPO &amp; the speed of light · immutability vs dwell time · K8s PVs.</text>
