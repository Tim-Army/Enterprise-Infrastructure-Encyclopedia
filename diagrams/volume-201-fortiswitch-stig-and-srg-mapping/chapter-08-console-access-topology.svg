<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Chapter 08 console access: OpenGear IM7216-2-DAC-LMV serial, management, out-of-band, and cellular paths</title>
<desc>The optional OpenGear console server og-201 connects NET1 (10.201.0.13) to segment 0, the out-of-band management network that also holds gw-201 and the management ports of the two FortiSwitches. Administrators on segment 20 reach og-201 through gw-201 and use SSH to TCP port 3000 plus the serial port number. og-201 reaches RADIUS, syslog, NTP, and SNMP hosts on segment 10 through gw-201. NET2 (10.201.100.2) joins segment 100, an isolated break-glass network with no gateway, where oob-admin-201 (10.201.100.10) sits. Serial port 1 connects to the console of sw-648f-1, port 2 to sw-2048f-1, and port 3 to the optional fgt-201. An optional cellular LTE link provides a failover path when an active SIM is installed.</desc>
