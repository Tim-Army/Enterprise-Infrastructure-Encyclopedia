<svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Chapter 999 shared lab topology: two FortiSwitches, a hypervisor of virtual machines, and two routing peers</title>
<desc>Two FortiSwitch units under test, sw-648f-1 (FS-648F-FPOE) and sw-2048f-1 (FS-2048F), are joined by routed link L5 (VLAN 2005, 10.201.200.8/31 to .9/31). Each switch has an 802.1Q trunk to one hypervisor that hosts gw-201, the service hosts svc-201a and svc-201b (RADIUS, syslog, NTP, SNMP, flow, files), ca-201, dhcp-201, admin-201, static and attacker hosts, an optional fgt-201, and the routing peers rtr-peer-1 (AS 65202) and rtr-peer-2 (AS 65203). Routed links L1 and L2 join sw-648f-1 to the peers, and L3 and L4 join sw-2048f-1 to the peers. Test endpoints and vx-host-a connect to sw-648f-1 and vx-host-b to sw-2048f-1. A dashed out-of-band management network, segment 0, joins the management port of each switch to gw-201. All addresses come from 10.201.0.0/16 and fd00:db8:201::/112.</desc>
<rect x="0" y="0" width="960" height="760" fill="#ffffff"/>
<text x="480" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">Shared lab topology (Chapter 999): 10.201.0.0/16 and fd00:db8:201::/112</text>
