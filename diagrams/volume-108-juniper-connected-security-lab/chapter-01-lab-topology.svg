<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: a vSRX firewall enforcing zone policies over a four-zone estate</title>
  <desc>
    A vSRX firewall, optionally managed by Security Director, segments a four-zone estate. The web endpoint is in zone APP, db is in zone DB listening on 5432, hmi is in zone MGMT, and plc is in zone OT listening on 502. Security policies permit APP to DB on 5432 and MGMT to OT on 502, and the SRX default inter-zone deny drops everything else, including the MGMT to DB lateral flow from hmi to db. Connected Security adds reactive containment: a dynamic address group can quarantine a compromised host by membership, with a standing deny policy, without editing a rule. The volume is two-track: Track 1 uses a real vSRX, Track 2 reproduces zones and policies with Linux nftables.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Firewall Microsegmentation with Juniper Connected Security</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="13" fill="#4b5563">A vSRX segments four security zones; policies permit APP-&gt;DB:5432 and MGMT-&gt;OT:502, the default denies the rest, and a dynamic group can quarantine a host</text>
  <rect x="330" y="50" width="300" height="44" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480.0" y="68.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">vSRX firewall  ·  Security Director</text>
  <text x="480.0" y="82.8" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">zones · policies · dynamic-address groups</text>
  <rect x="190" y="118" width="580" height="28" rx="6" fill="#f4f7fb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480.0" y="137.0" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">vSRX enforcement  ·  default inter-zone deny  ·  permit by policy (address + application)</text>
  <line x1="480" y1="94" x2="480" y2="118" stroke="#33415c" stroke-width="1.4"/>
  <rect x="60" y="190" width="130" height="62" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
