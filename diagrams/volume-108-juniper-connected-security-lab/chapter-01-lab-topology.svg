  <text x="575.0" y="240.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">operator</text>
  <rect x="735" y="190" width="130" height="62" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
