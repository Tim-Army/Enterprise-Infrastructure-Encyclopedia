<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: a kind Kubernetes cluster with Cilium, five pods across two namespaces segmented at L3/L4 and L7</title>
  <desc>
    A single Linux host runs Docker, kind, kubectl, cilium, and hubble. Inside it a kind Kubernetes cluster uses the Cilium CNI with an eBPF dataplane. Namespace dc (data center) holds web (label app=web, a client), db (label app=db, PostgreSQL on 5432), and api (label app=api, an HTTP service on 8080 used for the Layer 7 demo). Namespace ot (operations) holds hmi (label app=hmi, the operator) and plc (label app=plc, a Modbus listener on 502). Cilium permits web to db on TCP 5432 and hmi to plc on TCP 502 at Layer 3/4, restricts web to the api at Layer 7 so only HTTP GET /get is allowed and POST /post is denied, and denies the compromised-hmi-to-db cross-namespace flow, the lateral movement. Hubble observes every flow, its identities, and its verdict.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Kubernetes Microsegmentation with Cilium (eBPF + L7)</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="13" fill="#4b5563">A kind cluster with the Cilium CNI; identity-based L3/L4 policy plus Layer 7 HTTP and DNS policy, all observed in Hubble</text>
  <rect x="60" y="54" width="840" height="34" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480.0" y="74.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">Single Linux host · Docker + kind + kubectl + cilium + hubble</text>
  <rect x="60" y="100" width="840" height="26" rx="6" fill="#f4f7fb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480.0" y="118.0" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">kind Kubernetes cluster · CNI = Cilium (eBPF) · Hubble observes every flow and verdict</text>
  <rect x="70" y="156" width="300" height="24" rx="6" fill="#f0faf2" stroke="#166534" stroke-width="1.5"/>
  <text x="220.0" y="173.0" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">namespace: dc  (data center)</text>
  <rect x="85" y="190" width="130" height="60" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="150.0" y="209.7" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">web</text>
  <text x="150.0" y="224.4" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">app=web</text>
  <text x="150.0" y="239.0" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">client</text>
  <rect x="232" y="190" width="130" height="60" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="297.0" y="209.7" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">db</text>
  <text x="297.0" y="224.4" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">app=db</text>
  <text x="297.0" y="239.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7f1d1d">PostgreSQL :5432</text>
  <rect x="158" y="268" width="140" height="60" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="228.0" y="287.7" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">api</text>
  <text x="228.0" y="302.4" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">app=api</text>
  <text x="228.0" y="317.0" text-anchor="middle" font-size="9" font-weight="700" fill="#374151">HTTP :8080</text>
  <line x1="215" y1="220" x2="232" y2="220" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="178" y="292" font-size="10.5" fill="#166534">5432</text>
  <line x1="150" y1="250" x2="210" y2="268" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="150" y="348" font-size="10.5" fill="#166534">HTTP: GET /get allowed · POST denied (L7)</text>
  <rect x="500" y="156" width="380" height="24" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="690.0" y="173.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">namespace: ot  (operations)</text>
  <rect x="520" y="190" width="150" height="60" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="595.0" y="209.7" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">hmi</text>
  <text x="595.0" y="224.4" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">app=hmi</text>
  <text x="595.0" y="239.0" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">operator</text>
  <rect x="700" y="190" width="150" height="60" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="775.0" y="209.7" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">plc</text>
  <text x="775.0" y="224.4" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7c2d12">app=plc</text>
  <text x="775.0" y="239.0" text-anchor="middle" font-size="9" font-weight="700" fill="#374151">Modbus :502</text>
  <line x1="670" y1="220" x2="700" y2="220" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="678" y="292" font-size="10.5" fill="#166534">502</text>
  <line x1="520" y1="300" x2="372" y2="300" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="360" y="328" font-size="10.5" fill="#b91c1c">hmi → db 5432 DENIED (lateral movement)</text>
  <line x1="70" y1="392" x2="110" y2="392" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="118" y="396" font-size="11" fill="#166534">Legitimate flow (allowed)</text>
  <line x1="373" y1="392" x2="413" y2="392" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="421" y="396" font-size="11" fill="#b91c1c">Lateral movement (denied)</text>
  <line x1="676" y1="392" x2="716" y2="392" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-neutral)"/>
  <text x="724" y="396" font-size="11" fill="#6b7280">Pod (app label)</text>
</svg>
