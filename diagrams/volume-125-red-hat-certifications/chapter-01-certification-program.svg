<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 program map: the Red Hat certification program restructured for 2026</title>
  <desc>
    Red Hat's 2026 certification program has five tracks — Enterprise Linux, Ansible, OpenShift, Cloud-Native Applications, and a new provisional AI track — across five progressive levels: Technologist, Systems Administrator or Developer, Engineer, Specialist electives, and Architect. Every exam is 100 percent performance-based on live systems. RHCSA, exam EX200, now based on RHEL 10, is the shared Level 2 foundation and the RHCE prerequisite. RHCE, exam EX294, is the Ansible track Engineer exam; EX342 is the Enterprise Linux Engineer exam; the OpenShift track runs EX180 to EX280 on OpenShift 4.18 to EX380; Cloud-Native runs EX188 to EX288. The 2026 change is a track-specific RHCA: an Administrator exam plus an Engineer exam plus three Specialist electives within the same track, replacing the old any-five-specialists rule. EX318 virtualization is retired in favor of EX316 OpenShift Virtualization, and renewal offers retake, level up, or advance. All labs run free on a Red Hat Developer subscription, AlmaLinux or Rocky, and CRC.
  </desc>
