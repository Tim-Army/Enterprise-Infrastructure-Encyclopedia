  <line x1="575" y1="146" x2="575" y2="190" stroke="#94a3b8" stroke-width="1.1"/>
  <line x1="800" y1="146" x2="800" y2="190" stroke="#94a3b8" stroke-width="1.1"/>
  <line x1="190" y1="214" x2="285" y2="214" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="105" y="300" font-size="10.5" fill="#166534">SG-Web-&gt;SG-DB 5432</text>
  <line x1="510" y1="236" x2="415" y2="236" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="350" y="330" font-size="10.5" fill="#b91c1c">SG-Mgmt-&gt;SG-DB DENIED</text>
  <line x1="640" y1="214" x2="735" y2="214" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="600" y="300" font-size="10.5" fill="#166534">SG-Mgmt-&gt;SG-OT 502</text>
  <rect x="150" y="356" width="260" height="44" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="280.0" y="374.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">MSS macro: firewall redirect</text>
  <text x="280.0" y="388.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">SG-Web -&gt; SG-DB inspected</text>
  <line x1="237" y1="228" x2="237" y2="356" stroke="#166534" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="60" y1="430" x2="100" y2="430" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="108" y="434" font-size="11" fill="#166534">Permitted by group policy</text>
  <line x1="363" y1="430" x2="403" y2="430" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="411" y="434" font-size="11" fill="#b91c1c">Denied (default between groups)</text>
  <line x1="720" y1="430" x2="760" y2="430" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="768" y="434" font-size="11" fill="#33415c">CloudVision (groups + MSS)</text>
  </g>
</svg>
