  <text x="480.0" y="68.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">CloudVision · EOS fabric</text>
  <text x="480.0" y="82.8" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">security groups + MSS policy</text>
  <rect x="190" y="118" width="580" height="28" rx="6" fill="#f4f7fb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480.0" y="137.0" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">EOS fabric  ·  group policy at line rate  ·  default deny between groups</text>
  <line x1="480" y1="94" x2="480" y2="118" stroke="#33415c" stroke-width="1.4"/>
  <rect x="60" y="190" width="130" height="62" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="125.0" y="209.5" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">web</text>
  <text x="125.0" y="224.8" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">SG-Web</text>
  <text x="125.0" y="240.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">10.120.1.10</text>
  <rect x="285" y="190" width="130" height="62" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="350.0" y="209.5" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">db</text>
  <text x="350.0" y="224.8" text-anchor="middle" font-size="9" font-weight="700" fill="#7f1d1d">SG-DB · :5432</text>
  <text x="350.0" y="240.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">PostgreSQL</text>
  <rect x="510" y="190" width="130" height="62" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="575.0" y="209.5" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">hmi</text>
  <text x="575.0" y="224.8" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">SG-Mgmt</text>
