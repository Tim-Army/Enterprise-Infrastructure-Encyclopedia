  <text x="800.0" y="209.5" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">plc</text>
  <text x="800.0" y="224.8" text-anchor="middle" font-size="9" font-weight="700" fill="#7c2d12">SG-OT · :502</text>
  <text x="800.0" y="240.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">Modbus</text>
  <line x1="125" y1="146" x2="125" y2="190" stroke="#94a3b8" stroke-width="1.1"/>
