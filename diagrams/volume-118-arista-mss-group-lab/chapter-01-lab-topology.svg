<svg viewBox="0 0 960 516" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: Arista EOS enforcing group policy with an MSS macro firewall redirect</title>
  <desc>
    CloudVision manages an Arista EOS fabric that enforces group-based policy in the switch silicon at line rate. Endpoints are in security groups: web in SG-Web, db in SG-DB listening on 5432, hmi in SG-Mgmt, and plc in SG-OT listening on 502. MSS-Group permits only SG-Web to SG-DB on 5432 and SG-Mgmt to SG-OT on 502, denying every other group pair including SG-Mgmt to SG-DB. MSS macro-segmentation redirects the SG-Web to SG-DB flow through an inserted firewall for inspection without re-cabling, so a malicious payload on that flow is dropped. The volume is two-track: Track 1 describes EOS and CloudVision, Track 2 reproduces group policy and the firewall redirect with Linux nftables.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="516" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Group-Based Fabric Segmentation with Arista MSS-Group</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="10.9" fill="#4b5563">EOS enforces group policy at line rate (SG-Web-&gt;SG-DB, SG-Mgmt-&gt;SG-OT; default deny); MSS macro redirects the SG-Web-&gt;SG-DB flow through a firewall for inspection</text>
