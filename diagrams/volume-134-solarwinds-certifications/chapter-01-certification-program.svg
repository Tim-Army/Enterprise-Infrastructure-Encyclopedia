<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 program map: the SolarWinds Certified Professional certification program</title>
  <desc>
    The SolarWinds Certified Professional program awards one credential, SCP, earned by passing a product-specific exam rather than by climbing a tiered ladder. The process has three steps: sign up by registering with SolarWinds, study using that exam's preparation guide plus virtual and on-demand training through the Customer Portal for customers with a product under active maintenance, and schedule through PSI Services proprietary remote proctoring. The fee is 200 US dollars, or 60,000 THWACK community points exchanged in the THWACK store for an SCP voucher delivered by email within three business days. The portfolio has been rebranded around SolarWinds Observability and split into SaaS and Self-Hosted editions, Self-Hosted being the on-premises Orion lineage. Eleven exams are current: Observability SaaS Fundamentals; Observability Self-Hosted Fundamentals, Network Monitoring, Network Management, Architecture and Design, Diagnostics and Troubleshooting, and Federal Fundamentals; Server and Application Monitor; Database Performance Analyzer; Database Management; and Service Desk. Supporting resources are product documentation, virtual classrooms, eLearning videos, and the THWACK community forum; SolarWinds notes that third-party training is not reviewed, monitored, or endorsed by them. The volume teaches the underlying monitoring disciplines and models them free in Python.
  </desc>
