  <text x="480.0" y="349.0" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">Fee: US$200  —  OR  —  60,000 THWACK community points -&gt; SCP Voucher (3 business days): the exam is effectively free for active contributors</text>
  <text x="40" y="404" font-size="9.5" font-weight="700" fill="#991b1b">Use the official prep guide: SolarWinds states third-party training is "not reviewed, monitored, or endorsed" — and the search results are full of braindumps for RETIRED exams</text>
