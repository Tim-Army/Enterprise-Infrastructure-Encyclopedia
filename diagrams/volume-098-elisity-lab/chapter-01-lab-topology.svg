  <rect x="430" y="420" width="270" height="62" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="565.0" y="440.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">el-db01 · Database</text>
  <text x="565.0" y="455.4" text-anchor="middle" font-size="9" font-weight="700" fill="#7f1d1d">PostgreSQL :5432 · CROWN JEWELS</text>
  <text x="565.0" y="470.7" text-anchor="middle" font-size="9.5" font-weight="700" fill="#374151">10.10.40.40</text>
  <line x1="225" y1="398" x2="240" y2="398" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-data)"/>
  <rect x="240" y="520" width="665" height="26" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="572.5" y="538.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">VMnet3 — Host-only · 'OT Cell' (isolated, no host adapter) · 10.10.30.0/24</text>
  <rect x="430" y="555" width="270" height="66" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="565.0" y="575.7" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">el-ot01 · 'PLC'</text>
  <text x="565.0" y="592.4" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">Modbus TCP :502 · PLC</text>
  <text x="565.0" y="609.0" text-anchor="middle" font-size="9" font-weight="700" fill="#7c2d12">AGENTLESS · 10.10.30.50</text>
  <line x1="225" y1="533" x2="240" y2="533" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-data)"/>
  <line x1="375" y1="347" x2="470" y2="420" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="300" y="372" font-size="10.5" fill="#166534">5432 (AppServer→Database)</text>
  <line x1="720" y1="347" x2="640" y2="420" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="640" y="372" font-size="10.5" fill="#b91c1c">5432 DENIED (HMI→Database)</text>
  <line x1="775" y1="347" x2="690" y2="555" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
