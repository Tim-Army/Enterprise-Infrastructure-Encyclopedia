  <text x="375.0" y="335.7" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">10.10.20.11</text>
  <rect x="650" y="285" width="250" height="62" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="775.0" y="305.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">el-win01</text>
  <text x="775.0" y="320.4" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">Win2022 · SCADA/HMI · HMI</text>
  <text x="775.0" y="335.7" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">10.10.20.21</text>
  <line x1="225" y1="263" x2="240" y2="263" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="240" y="385" width="665" height="26" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 4"/>
