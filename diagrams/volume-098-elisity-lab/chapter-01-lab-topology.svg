<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: a five-VM estate segmented with Elisity, identity-based policy enforced on the network with the database isolated behind the enforcement point</title>
  <desc>
    A Windows 11 host running VMware Workstation Pro hosts four virtual-network segments joined by one four-legged Linux router, el-gw, which stands in for the Elisity-managed access switch and is the single network enforcement point every cross-segment flow crosses. The IT/Corporate segment (VMnet8 NAT, 192.168.170.0/24) carries the host, which doubles as the attacker 'IT laptop', and the VMware NAT gateway. The Data Center segment (VMnet2 host-only, 10.10.20.0/24) holds el-app01 (nginx, classified AppServer) and el-win01 (Windows SCADA/HMI, classified HMI). The Database segment (VMnet4 host-only, 10.10.40.0/24) isolates el-db01 (PostgreSQL, classified Database, the crown jewels) behind el-gw so all access to it is policed at the enforcement point. The OT cell (VMnet3 host-only, 10.10.30.0/24) is isolated with no host adapter and holds el-ot01, an agentless Modbus PLC classified as PLC in the IdentityGraph. Two legitimate identity-to-identity flows are allowed: AppServer to Database on TCP 5432, and HMI to PLC on Modbus TCP 502. The lateral-movement flow from the compromised HMI to the Database on 5432 is denied at el-gw by identity-based policy, with no agent on any endpoint.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="720" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Elisity Identity-Based Segmentation Across Four Segments</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="8.6" fill="#4b5563">el-gw is the network enforcement point (Elisity access-switch stand-in) every cross-segment flow crosses; the database is isolated behind it; policy is written by identity, enforced with no endpoint agents</text>
