  <text x="485.0" y="91.2" text-anchor="middle" font-size="9.5" font-weight="400" fill="#374151">Elisity admin + 'IT laptop' (attacker, Lab 5.3)</text>
  <line x1="485" y1="102" x2="485" y2="132" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <rect x="55" y="150" width="170" height="470" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="140.0" y="318.2" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">el-gw</text>
  <text x="140.0" y="336.2" text-anchor="middle" font-size="10" font-weight="400" fill="#374151">Ubuntu 22.04</text>
  <text x="140.0" y="354.2" text-anchor="middle" font-size="10" font-weight="400" fill="#374151">4-legged router</text>
  <text x="140.0" y="372.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">= NETWORK</text>
  <text x="140.0" y="390.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">ENFORCEMENT POINT</text>
  <text x="140.0" y="408.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">(Elisity access-</text>
  <text x="140.0" y="426.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">switch stand-in)</text>
  <text x="140.0" y="444.2" text-anchor="middle" font-size="9" font-weight="700" fill="#374151">.170.10 / .20.254</text>
  <text x="140.0" y="462.2" text-anchor="middle" font-size="9" font-weight="700" fill="#374151">.30.254 / .40.254</text>
  <rect x="240" y="132" width="665" height="26" rx="6" fill="#eef2f8" stroke="#33415c" stroke-width="1.5"/>
  <text x="572.5" y="150.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">VMnet8 — NAT · 'IT / Corporate' · 192.168.170.0/24</text>
  <rect x="720" y="166" width="180" height="40" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
