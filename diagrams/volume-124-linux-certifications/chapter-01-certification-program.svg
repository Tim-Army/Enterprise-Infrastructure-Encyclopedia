<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 program map: the two vendor-neutral Linux certification programs</title>
  <desc>
    Two vendor-neutral Linux certification programs. LPI, the Linux Professional Institute, has an Essentials tier with lifetime validity: Linux Essentials exam 010, Security Essentials 020, Web Development Essentials 030, and Open Source Essentials 050. Its professional ladder, five-year validity, runs LPIC-1 with exams 101-500 and 102-500, then LPIC-2 with exams 201-450 and 202-450 requiring an active LPIC-1, then four LPIC-3 specialties requiring an active LPIC-2: 300 Mixed Environments, 303 Security, 305 Virtualization and Containerization, and 306 High Availability and Storage Clusters. The Open Technology track has DevOps Tools Engineer exam 701 and BSD Specialist exam 702. The Linux Foundation has the multiple-choice LFCA Certified IT Associate and the performance-based LFCS Certified System Administrator, with five weighted domains, two-year validity; the LFCT Cloud Technician certification is inactive. Every lab in the volume is runnable on free standard Linux.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Program Map: Vendor-Neutral Linux Certifications (LPI + Linux Foundation)</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="10.2" fill="#4b5563">LPI's Essentials + LPIC-1/2/3 ladder + Open Technology track (weighted public objectives, 5-yr) and the Linux Foundation's LFCA + performance-based LFCS (2-yr); LFCT inactive</text>
  <rect x="35" y="60" width="560" height="34" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="315.0" y="80.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">LPI (Linux Professional Institute) — public weighted objectives</text>
  <rect x="35" y="108" width="560" height="40" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="315.0" y="131.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">Essentials (lifetime): Linux 010 · Security 020 · Web Dev 030 · Open Source 050</text>
  <rect x="35" y="162" width="175" height="46" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="122.5" y="181.3" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">LPIC-1</text>
  <text x="122.5" y="196.3" text-anchor="middle" font-size="8" font-weight="400" fill="#374151">101-500 + 102-500 (v5.0)</text>
  <rect x="230" y="162" width="175" height="46" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="317.5" y="181.3" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">LPIC-2</text>
  <text x="317.5" y="196.3" text-anchor="middle" font-size="8" font-weight="400" fill="#374151">201-450 + 202-450 (v4.5)</text>
  <rect x="425" y="162" width="170" height="46" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="510.0" y="181.3" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">LPIC-3 (x4)</text>
  <text x="510.0" y="196.3" text-anchor="middle" font-size="8" font-weight="400" fill="#374151">300·303·305·306</text>
  <line x1="210" y1="185" x2="230" y2="185" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <line x1="405" y1="185" x2="425" y2="185" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="35" y="222" width="560" height="34" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="315.0" y="242.2" text-anchor="middle" font-size="9" font-weight="700" fill="#111827">Open Technology (5-yr): DevOps Tools Engineer 701 · BSD Specialist 702</text>
  <rect x="630" y="60" width="295" height="34" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="777.5" y="80.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Linux Foundation</text>
  <rect x="630" y="108" width="295" height="40" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="777.5" y="125.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">LFCA — Certified IT Associate</text>
  <text x="777.5" y="138.0" text-anchor="middle" font-size="8" font-weight="400" fill="#374151">60 MCQ · pre-professional breadth</text>
  <rect x="630" y="162" width="295" height="60" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="777.5" y="180.7" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111827">LFCS — Certified System Administrator</text>
  <text x="777.5" y="195.3" text-anchor="middle" font-size="8" font-weight="400" fill="#374151">performance-based · 2 hrs · 2-yr validity</text>
  <text x="777.5" y="210.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#166534">Ops 25 · Net 25 · Storage 20 · Cmds 20 · Users 10</text>
  <rect x="630" y="236" width="295" height="20" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="777.5" y="249.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7f1d1d">LFCT (Cloud Technician) — INACTIVE</text>
  <text x="35" y="300" font-size="9.5" font-weight="700" fill="#1d4ed8">Two philosophies: LPI tests knowledge from weighted public objectives; LFCS tests doing, in a live terminal</text>
  <text x="35" y="320" font-size="9.5" font-weight="400" fill="#374151">Chaining: LPIC-2 needs active LPIC-1, LPIC-3 needs active LPIC-2 · every lab runs free on any Linux machine</text>
  <line x1="35" y1="345" x2="75" y2="345" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="83" y="349" font-size="11" fill="#166534">LPI professional ladder (5-yr)</text>
  <line x1="383" y1="345" x2="423" y2="345" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-data)"/>
  <text x="431" y="349" font-size="11" fill="#b45309">Top credentials / performance-based</text>
  <line x1="776" y1="345" x2="816" y2="345" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="824" y="349" font-size="11" fill="#b91c1c">Inactive — do not target</text>
</svg>
