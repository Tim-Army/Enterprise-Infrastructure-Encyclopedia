<svg viewBox="0 0 960 528" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Tim's Lab network topology</title>
  <desc>
    A single Cisco Nexus 9300 switch (nexus-9k-1) trunks the data VLANs to five Dell PowerEdge hosts at rack units ru08 through ru12, each with four 10 Gb NICs, native VLAN 1611, and uplinks north via port-channel1. The Unraid NAS sits on VLAN 1. iDRAC out-of-band management and the switch mgmt0 live on the separate 10.30.99.0/24 segment.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="528" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Tim's Lab — Network Topology</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="11.1" fill="#4b5563">One Cisco Nexus trunks the data VLANs to five PowerEdge hosts (native 1611); out-of-band management is a separate segment, reached by routing, not a data VLAN.</text>
  <g transform="translate(0,8)">
  <rect x="350" y="84" width="260" height="58" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480.0" y="103.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">nexus-9k-1</text>
  <text x="480.0" y="117.5" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">Cisco Nexus 9300 · NX-OS 7.0(3)I2(2d)</text>
  <text x="480.0" y="131.6" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">trunk (native 1611) · LACP · inter-VLAN</text>
  <line x1="480" y1="84" x2="480" y2="58" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="494" y="70" text-anchor="start" font-size="9.5" font-weight="600" fill="#6b7280">↑ port-channel1 (uplink)</text>
  <line x1="480" y1="142" x2="101" y2="222" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="18" y="222" width="166" height="58" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="101.0" y="241.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">ru08</text>
  <text x="101.0" y="255.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">PowerEdge (TBD)</text>
  <text x="101.0" y="269.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">4×10G · vmnic0–3</text>
  <line x1="480" y1="142" x2="291" y2="222" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="208" y="222" width="166" height="58" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="291.0" y="241.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">ru09</text>
  <text x="291.0" y="255.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">PowerEdge (TBD)</text>
  <text x="291.0" y="269.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">4×10G · vmnic0–3</text>
  <line x1="480" y1="142" x2="481" y2="222" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="398" y="222" width="166" height="58" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="481.0" y="241.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">ru10</text>
  <text x="481.0" y="255.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">PowerEdge (TBD)</text>
  <text x="481.0" y="269.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">4×10G · vmnic0–3</text>
  <line x1="480" y1="142" x2="671" y2="222" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="588" y="222" width="166" height="58" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="671.0" y="241.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">ru11</text>
  <text x="671.0" y="255.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">PowerEdge (TBD)</text>
  <text x="671.0" y="269.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">4×10G · vmnic0–3</text>
  <line x1="480" y1="142" x2="861" y2="222" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="778" y="222" width="166" height="58" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="861.0" y="241.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">ru12</text>
  <text x="861.0" y="255.2" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">proxmox-1</text>
  <text x="861.0" y="269.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">R640 · Proxmox VE · .10</text>
  <text x="150" y="205" text-anchor="middle" font-size="9.5" font-weight="600" fill="#166534">trunk · 4×10G per host</text>
  <rect x="18" y="322" width="230" height="52" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="133.0" y="339.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">unraid-1</text>
  <text x="133.0" y="352.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">Unraid NAS · 192.168.1.209 · VLAN 1</text>
  <text x="133.0" y="365.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">→ nexus-9k-1 Eth1/33-34 · bulk / ISO</text>
  <rect x="18" y="410" width="924" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="480.0" y="432.9" text-anchor="middle" font-size="11" font-weight="700" fill="#7c2d12">Out-of-band management — 10.30.99.0/24</text>
  <text x="480.0" y="450.9" text-anchor="middle" font-size="9" font-weight="400" fill="#7c2d12">Nexus mgmt0 .250  ·  iDRAC on every host (access VLAN 1611)  ·  reached by routing through 10.30.161.1, not by a data-VLAN tag</text>
  <line x1="18" y1="494" x2="58" y2="494" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="66" y="498" font-size="11" fill="#166534">Data trunk (tagged VLANs)</text>
  <line x1="321" y1="494" x2="361" y2="494" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-data)"/>
  <text x="369" y="498" font-size="11" fill="#b45309">Storage / VLAN 1</text>
  <line x1="543" y1="494" x2="583" y2="494" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="591" y="498" font-size="11" fill="#b91c1c">Out-of-band management</text>
  </g>
</svg>
