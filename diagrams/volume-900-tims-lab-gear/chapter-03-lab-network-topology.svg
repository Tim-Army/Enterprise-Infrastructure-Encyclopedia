<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Tim's Lab network topology</title>
  <desc>
    From the top: an ISP modem hands off to the UCGF (Ubiquiti UniFi Cloud Gateway Fiber) on WAN1; the UCGF is the router, firewall, DHCP server and Wi-Fi controller and holds the .1 gateway for every VLAN. A 10 Gb SFP+ uplink (UCGF port 6 to port-channel1) reaches a single Cisco Nexus 9000 C9396PX switch (nexus-9k-1) that trunks the data VLANs to five Dell PowerEdge hosts at rack units ru08 through ru12, each with four 10 Gb NICs, native VLAN 1611. The Unraid NAS sits on VLAN 1. iDRAC out-of-band management and the switch mgmt0 live on the separate 10.30.99.0/24 segment.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Tim's Lab — Network Topology</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="11.1" fill="#4b5563">ISP modem → UCGF edge gateway → one Cisco Nexus that trunks the data VLANs to five PowerEdge hosts (native 1611); out-of-band management is a separate segment.</text>
  <rect x="392" y="70" width="176" height="44" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="480.0" y="88.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">ISP modem</text>
  <text x="480.0" y="102.8" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">internet handoff (redacted)</text>
  <line x1="480" y1="114" x2="480" y2="132" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="494" y="128" text-anchor="start" font-size="9" font-weight="600" fill="#6b7280">WAN1 · UCGF port 5</text>
  <rect x="350" y="132" width="260" height="58" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480.0" y="151.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">UCGF — UniFi Cloud Gateway Fiber</text>
  <text x="480.0" y="165.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">edge router · firewall · DHCP · Wi-Fi</text>
  <text x="480.0" y="179.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">holds .1 gateway for every VLAN</text>
  <line x1="480" y1="190" x2="480" y2="214" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="494" y="208" text-anchor="start" font-size="9" font-weight="600" fill="#6b7280">port 6 SFP+ 10 GbE ↔ port-channel1</text>
  <rect x="350" y="214" width="260" height="58" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480.0" y="233.6" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">nexus-9k-1</text>
  <text x="480.0" y="247.6" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">Cisco Nexus 9000 C9396PX · NX-OS 7.0(3)I2(2d)</text>
  <text x="480.0" y="261.6" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">Layer 2 trunk (native 1611) · LACP</text>
  <line x1="480" y1="272" x2="101" y2="352" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="18" y="352" width="166" height="58" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="101.0" y="371.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">ru08</text>
  <text x="101.0" y="385.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">PowerEdge (TBD)</text>
  <text x="101.0" y="399.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">4×10G · vmnic0–3</text>
  <line x1="480" y1="272" x2="291" y2="352" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="208" y="352" width="166" height="58" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="291.0" y="371.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">ru09</text>
  <text x="291.0" y="385.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">PowerEdge (TBD)</text>
  <text x="291.0" y="399.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">4×10G · vmnic0–3</text>
  <line x1="480" y1="272" x2="481" y2="352" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="398" y="352" width="166" height="58" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="481.0" y="371.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">ru10</text>
  <text x="481.0" y="385.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">PowerEdge (TBD)</text>
  <text x="481.0" y="399.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">4×10G · vmnic0–3</text>
  <line x1="480" y1="272" x2="671" y2="352" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="588" y="352" width="166" height="58" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="671.0" y="371.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">ru11</text>
  <text x="671.0" y="385.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">PowerEdge (TBD)</text>
  <text x="671.0" y="399.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">4×10G · vmnic0–3</text>
  <line x1="480" y1="272" x2="861" y2="352" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="778" y="352" width="166" height="58" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="861.0" y="371.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">ru12</text>
  <text x="861.0" y="385.2" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">proxmox-1</text>
  <text x="861.0" y="399.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">R640 · Proxmox VE · .10</text>
  <text x="150" y="335" text-anchor="middle" font-size="9.5" font-weight="600" fill="#166534">trunk · 4×10G per host</text>
  <rect x="18" y="452" width="230" height="52" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="133.0" y="469.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">unraid-1</text>
  <text x="133.0" y="482.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">Unraid NAS · 192.168.1.209 · VLAN 1</text>
  <text x="133.0" y="495.2" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">→ nexus-9k-1 Eth1/33-34 · bulk / ISO</text>
  <rect x="18" y="528" width="924" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="480.0" y="550.9" text-anchor="middle" font-size="11" font-weight="700" fill="#7c2d12">Out-of-band management — 10.30.99.0/24</text>
  <text x="480.0" y="568.9" text-anchor="middle" font-size="9" font-weight="400" fill="#7c2d12">Nexus mgmt0 .250  ·  iDRAC on every host (access VLAN 1611)  ·  reached by routing through 10.30.99.1 (UCGF), not by a data-VLAN tag</text>
  <line x1="18" y1="606" x2="58" y2="606" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="66" y="610" font-size="11" fill="#33415c">Edge / uplink</text>
  <line x1="213" y1="606" x2="253" y2="606" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="261" y="610" font-size="11" fill="#166534">Data trunk (tagged VLANs)</text>
  <line x1="516" y1="606" x2="556" y2="606" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-data)"/>
  <text x="564" y="610" font-size="11" fill="#b45309">Storage / VLAN 1</text>
  <line x1="738" y1="606" x2="778" y2="606" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="786" y="610" font-size="11" fill="#b91c1c">Out-of-band management</text>
</svg>
