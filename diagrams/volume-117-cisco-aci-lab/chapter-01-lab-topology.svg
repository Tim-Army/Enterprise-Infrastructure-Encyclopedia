  <text x="480.0" y="50" text-anchor="middle" font-size="11.6" fill="#4b5563">The APIC drives EPGs and contracts; traffic between EPGs is denied unless a contract permits it; Web-&gt;DB:5432 and Mgmt-&gt;OT:502 permitted, Mgmt-&gt;DB denied</text>
