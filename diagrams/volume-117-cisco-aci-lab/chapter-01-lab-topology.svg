<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: Cisco ACI EPGs and contracts enforcing an application-centric whitelist</title>
  <desc>
    The APIC drives a Nexus 9000 spine-leaf fabric with an application-centric whitelist. Endpoints live in Endpoint Groups: web in EPG-Web, db in EPG-DB listening on 5432, hmi in EPG-Mgmt, and plc in EPG-OT listening on 502. Contracts permit only Web to DB on 5432 and Mgmt to OT on 502; every other EPG pair, including Mgmt to DB from hmi to db, is denied by the whitelist default. uSeg micro-EPGs can reclassify a compromised endpoint into a deny-all quarantine by attribute, and intra-EPG isolation denies traffic between members of the same EPG. The volume is two-track: Track 1 describes APIC configuration, Track 2 reproduces EPGs and contracts with Linux nftables.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
