<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: Claroty xDome baselining traffic passively and pushing a derived policy to an enforcer</title>
  <desc>
    A passive collector on a SPAN/mirror sees the network without being inline and feeds Claroty xDome, which discovers assets, builds a communication baseline, groups assets into virtual zones, and derives a least-privilege zone-to-zone policy. Because xDome is passive, it pushes the policy to an integrated enforcer -- a firewall or NAC -- that applies allow-only-baseline. The four assets are web in zone IT-App, db in zone IT-Data listening on 5432, hmi in zone OT-Ops, and plc in zone OT-Control listening on 502. The sanctioned baseline permits web to db on 5432 and hmi to plc on 502; the hmi to db flow was never sanctioned in the baseline, so the derived policy denies it and xDome flags any attempt as a deviation. The volume is two-track: Track 1 describes the real xDome, Track 2 reproduces the loop with tcpdump as the collector and an nftables policy as the enforcer.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Observe-then-Enforce OT Segmentation with Claroty xDome</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="10.5" fill="#4b5563">A passive collector baselines traffic; xDome derives a zone policy; an integrated enforcer applies allow-only-baseline, denying and flagging the unbaselined hmi-&gt;db flow</text>
