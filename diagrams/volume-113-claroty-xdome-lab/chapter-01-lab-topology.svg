  <rect x="70" y="248" width="130" height="58" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="135.0" y="266.9" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">web</text>
  <text x="135.0" y="280.9" text-anchor="middle" font-size="9" font-weight="700" fill="#166534">IT-App</text>
  <text x="135.0" y="294.9" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">10.70.1.10</text>
  <rect x="290" y="248" width="130" height="58" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="355.0" y="266.9" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">db</text>
  <text x="355.0" y="280.9" text-anchor="middle" font-size="9" font-weight="700" fill="#7f1d1d">IT-Data · :5432</text>
  <text x="355.0" y="294.9" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">PostgreSQL</text>
  <rect x="510" y="248" width="130" height="58" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="575.0" y="266.9" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">hmi</text>
  <text x="575.0" y="280.9" text-anchor="middle" font-size="9" font-weight="700" fill="#166534">OT-Ops</text>
  <text x="575.0" y="294.9" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">operator</text>
  <rect x="730" y="248" width="130" height="58" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="795.0" y="266.9" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">plc</text>
  <text x="795.0" y="280.9" text-anchor="middle" font-size="9" font-weight="700" fill="#7f1d1d">OT-Control · :502</text>
  <text x="795.0" y="294.9" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">Modbus</text>
  <line x1="135" y1="220" x2="135" y2="248" stroke="#94a3b8" stroke-width="1.1"/>
  <line x1="355" y1="220" x2="355" y2="248" stroke="#94a3b8" stroke-width="1.1"/>
  <line x1="575" y1="220" x2="575" y2="248" stroke="#94a3b8" stroke-width="1.1"/>
  <line x1="795" y1="220" x2="795" y2="248" stroke="#94a3b8" stroke-width="1.1"/>
  <line x1="200" y1="275" x2="290" y2="275" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="120" y="336" font-size="10.5" fill="#166534">web-&gt;db 5432 baseline</text>
  <line x1="640" y1="275" x2="730" y2="275" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="600" y="336" font-size="10.5" fill="#166534">hmi-&gt;plc 502 baseline</text>
  <line x1="510" y1="298" x2="420" y2="298" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="300" y="366" font-size="10.5" fill="#b91c1c">hmi-&gt;db DENIED + FLAGGED (deviation)</text>
  <line x1="50" y1="398" x2="90" y2="398" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="98" y="402" font-size="11" fill="#166534">Sanctioned baseline flow (allowed)</text>
  <line x1="434" y1="398" x2="474" y2="398" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="482" y="402" font-size="11" fill="#b91c1c">Unbaselined flow (denied + flagged)</text>
  <line x1="827" y1="398" x2="867" y2="398" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="875" y="402" font-size="11" fill="#33415c">xDome (derives policy)</text>
</svg>
