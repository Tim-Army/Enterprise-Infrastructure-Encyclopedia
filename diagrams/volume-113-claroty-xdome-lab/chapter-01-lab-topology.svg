  <text x="480.0" y="62.4" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Claroty xDome</text>
  <text x="480.0" y="75.3" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">discovery · baseline · zones · derived policy</text>
  <rect x="60" y="116" width="160" height="44" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="140.0" y="134.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">collector (SPAN)</text>
  <text x="140.0" y="148.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">passive discovery</text>
  <rect x="740" y="116" width="160" height="44" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="820.0" y="134.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">enforcer</text>
  <text x="820.0" y="148.7" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">firewall / NAC</text>
  <line x1="140" y1="116" x2="330" y2="86" stroke="#33415c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="150" y="108" font-size="8.5" fill="#374151">mirror feed</text>
  <line x1="630" y1="86" x2="820" y2="116" stroke="#33415c" stroke-width="1.2"/>
  <text x="640" y="108" font-size="8.5" fill="#374151">derived policy</text>
  <rect x="50" y="196" width="860" height="24" rx="6" fill="#f4f7fb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480.0" y="213.0" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">Monitored network  ·  enforcer applies allow-only-baseline  ·  everything else denied + flagged</text>
  <line x1="140" y1="196" x2="140" y2="160" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="3 3"/>
