<svg viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: five devices on one VLAN, each isolated to a network of one around the Airgap enforcement point</title>
  <desc>
    Five devices share one flat VLAN 10.100.1.0/24: web at .10, db at .20 on 5432, hmi at .30, plc at .40 on 502, and an infected victim at .50. Airgap collapses every device into a network of one by controlling ARP and DHCP, so each device's only neighbor is the enforcement point and there is no direct Layer 2 path between any two devices even on the same subnet. The enforcement point denies east-west by default and permits only the sanctioned web to db flow on 5432; every other pair, including the infected victim, is isolated so ransomware cannot spread. A single ransomware kill switch can sever all east-west instantly. No agent is installed on any device and no IP or VLAN changes. The volume is two-track: Track 1 describes Zscaler/Airgap, Track 2 builds the isolation with /32 host views and an nftables enforcer.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Agentless Network-of-One Isolation with Zscaler/Airgap</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="13" fill="#4b5563">Every device on one VLAN is isolated to a network of one; all east-west is brokered by the enforcement point, which permits only web-&gt;db:5432 and can kill-switch all lateral traffic</text>
  <rect x="360" y="188" width="240" height="78" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480.0" y="212.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Airgap enforcement point</text>
  <text x="480.0" y="230.8" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">network-of-one · default deny</text>
  <text x="480.0" y="248.8" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7f1d1d">ransomware kill switch</text>
  <rect x="55" y="70" width="120" height="50" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="115.0" y="90.3" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">web</text>
  <text x="115.0" y="107.3" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">.10</text>
  <rect x="400" y="48" width="130" height="50" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="465.0" y="68.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">db · :5432</text>
  <text x="465.0" y="85.0" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">.20</text>
  <rect x="700" y="70" width="130" height="50" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="765.0" y="90.3" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">victim</text>
  <text x="765.0" y="107.3" text-anchor="middle" font-size="8.5" font-weight="400" fill="#7f1d1d">.50 (infected)</text>
  <rect x="70" y="330" width="120" height="50" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="130.0" y="350.4" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">hmi</text>
  <text x="130.0" y="367.4" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">.30</text>
  <rect x="710" y="330" width="130" height="50" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="775.0" y="350.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">plc · :502</text>
  <text x="775.0" y="367.0" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">.40</text>
  <line x1="190" y1="355" x2="360" y2="250" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="710" y1="355" x2="600" y2="250" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="175" y1="100" x2="360" y2="210" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="215" y="150" font-size="10.5" fill="#166534">web</text>
  <line x1="465" y1="188" x2="465" y2="98" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="475" y="150" font-size="10.5" fill="#166534">db:5432 sanctioned</text>
  <line x1="760" y1="120" x2="600" y2="210" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="640" y="165" font-size="10.5" fill="#b91c1c">isolated (no spread)</text>
  <text x="220" y="300" font-size="9.5" font-weight="700" fill="#374151">same VLAN 10.100.1.0/24 — no direct L2 path; all east-west brokered</text>
  <line x1="55" y1="398" x2="95" y2="398" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="103" y="402" font-size="11" fill="#166534">Sanctioned flow (web -&gt; db)</text>
  <line x1="376" y1="398" x2="416" y2="398" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="424" y="402" font-size="11" fill="#b91c1c">Infected / isolated (no lateral path)</text>
  <line x1="787" y1="398" x2="827" y2="398" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="835" y="402" font-size="11" fill="#33415c">Enforcement point (+ kill switch)</text>
</svg>
