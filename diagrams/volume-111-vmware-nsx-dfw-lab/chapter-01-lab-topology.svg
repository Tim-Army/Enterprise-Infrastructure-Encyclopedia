<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: the NSX Distributed Firewall enforcing at each vNIC across four workloads on one subnet</title>
  <desc>
    All four workloads share a single subnet 10.50.1.0/24 with no gateway between them. NSX Manager defines security tags, dynamic groups, and a distributed firewall policy and distributes the rules to every VM's vNIC, where the DFW enforces in the hypervisor kernel. web carries tag role=web, db carries role=db and listens on 5432, hmi carries role=hmi, and plc carries role=plc and listens on 502. The DFW permits Web to Database on 5432 and Operators to OT on 502 with a zero-trust Drop default; the hmi to db lateral flow is denied at db's own vNIC even though hmi and db are direct same-subnet peers -- the case a centralized firewall or ISFW cannot see. The volume is two-track: Track 1 uses a real NSX Manager and ESXi transport node, Track 2 reproduces distributed enforcement by having each workload namespace enforce its own nftables ruleset.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Distributed Microsegmentation with VMware NSX DFW</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="11.3" fill="#4b5563">All four workloads on one subnet; NSX distributes tag-group rules to every vNIC, so hmi-&gt;db is denied at db's own interface with no gateway between the peers</text>
  <rect x="320" y="44" width="320" height="42" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480.0" y="62.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">NSX Manager  ·  tags · groups · DFW policy</text>
  <text x="480.0" y="75.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">distributes rules to every vNIC</text>
  <rect x="50" y="106" width="860" height="26" rx="6" fill="#f4f7fb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480.0" y="124.0" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">One L2 segment 10.50.1.0/24  ·  DFW enforces at each vNIC  ·  no gateway between peers</text>
  <line x1="480" y1="86" x2="135" y2="106" stroke="#33415c" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="480" y1="86" x2="355" y2="106" stroke="#33415c" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="480" y1="86" x2="575" y2="106" stroke="#33415c" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="480" y1="86" x2="795" y2="106" stroke="#33415c" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="60" y="168" width="150" height="66" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="135.0" y="188.2" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">web</text>
  <text x="135.0" y="204.8" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">role=web</text>
  <text x="135.0" y="221.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">10.50.1.10</text>
  <text x="135" y="163" text-anchor="middle" font-size="8" font-weight="700" fill="#1d4ed8">[vNIC-DFW]</text>
  <rect x="280" y="168" width="150" height="66" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="355.0" y="188.2" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">db</text>
  <text x="355.0" y="204.8" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7f1d1d">role=db · :5432</text>
  <text x="355.0" y="221.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">PostgreSQL</text>
  <text x="355" y="163" text-anchor="middle" font-size="8" font-weight="700" fill="#1d4ed8">[vNIC-DFW]</text>
  <rect x="500" y="168" width="150" height="66" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="575.0" y="188.2" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">hmi</text>
  <text x="575.0" y="204.8" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">role=hmi</text>
  <text x="575.0" y="221.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">operator</text>
  <text x="575" y="163" text-anchor="middle" font-size="8" font-weight="700" fill="#1d4ed8">[vNIC-DFW]</text>
  <rect x="720" y="168" width="150" height="66" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="795.0" y="188.2" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">plc</text>
  <text x="795.0" y="204.8" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7f1d1d">role=plc · :502</text>
  <text x="795.0" y="221.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">Modbus</text>
  <text x="795" y="163" text-anchor="middle" font-size="8" font-weight="700" fill="#1d4ed8">[vNIC-DFW]</text>
  <line x1="210" y1="198" x2="280" y2="198" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="120" y="262" font-size="10.5" fill="#166534">Web-&gt;Database 5432 allow</text>
  <line x1="650" y1="198" x2="720" y2="198" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="610" y="262" font-size="10.5" fill="#166534">Operators-&gt;OT 502 allow</text>
  <line x1="500" y1="224" x2="430" y2="224" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="300" y="300" font-size="10.5" fill="#b91c1c">hmi-&gt;db DENIED at db's vNIC (same subnet, no gateway)</text>
  <line x1="50" y1="388" x2="90" y2="388" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="98" y="392" font-size="11" fill="#166534">Permitted by DFW rule</text>
  <line x1="317" y1="388" x2="357" y2="388" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="365" y="392" font-size="11" fill="#b91c1c">Same-subnet lateral (denied at vNIC)</text>
  <line x1="719" y1="388" x2="759" y2="388" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="767" y="392" font-size="11" fill="#33415c">NSX Manager (policy)</text>
</svg>
