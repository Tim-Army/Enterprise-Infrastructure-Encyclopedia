<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 program map: the current Citrix certification program</title>
  <desc>
    The Citrix certification program under Cloud Software Group has two tracks. The Virtualization track: CCA-V, whose exam Citrix Virtual Apps and Desktops Administration replaced the retired 1Y0-204, leads to CCP-V, Citrix Virtual Apps and Desktops 7 Advanced Administration. The App Delivery and Security track: CCA-AppDS is one credential with two exam options, NetScaler 14.x Essentials and NetScaler Gateway, or Deploy and Manage Citrix ADC 14.x with Traffic Management; either leads to CCP-AppDS, exam 1Y0-342 NetScaler Advanced Topics covering Web App Firewall, nFactor authentication, and NetScaler Console. Exams are delivered on Webassessor by Kryterion. The Expert tier, CCE-V and CCE-N, is discontinued, and the program is under an announced comprehensive overhaul with additional certifications planned.
  </desc>
  <defs>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Program Map: Citrix Certifications under Cloud Software Group</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="13" fill="#4b5563">Two tracks, five exams, no Expert tier — Webassessor delivery, ~10% performance-based items on AppDS forms, and an announced program overhaul in progress</text>
  <rect x="280" y="42" width="400" height="42" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480.0" y="60.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">Cloud Software Group — Webassessor (Kryterion) delivery</text>
  <text x="480.0" y="73.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">program overhaul announced: re-verify before scheduling</text>
  <rect x="60" y="130" width="380" height="40" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="250.0" y="153.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Virtualization track (Citrix Virtual Apps and Desktops)</text>
  <rect x="60" y="195" width="380" height="56" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="250.0" y="217.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">CCA-V — CVAD Administration</text>
  <text x="250.0" y="235.7" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">replaces retired 1Y0-204 · ~60-65 Q · 90 min · ~65%</text>
  <rect x="60" y="285" width="380" height="56" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="250.0" y="307.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">CCP-V — CVAD 7 Advanced Administration</text>
  <text x="250.0" y="325.7" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">prerequisite: CCA-V · 60-70 Q · 64% pass</text>
  <line x1="250" y1="251" x2="250" y2="285" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-neutral)"/>
  <rect x="520" y="130" width="380" height="40" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="710.0" y="153.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">App Delivery and Security track (NetScaler 14.x)</text>
  <rect x="520" y="195" width="380" height="56" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="710.0" y="217.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">CCA-AppDS — one credential, two exam options</text>
  <text x="710.0" y="235.7" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">Gateway  · or ·  Traffic Management (CLI sims)</text>
  <rect x="520" y="285" width="380" height="56" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="710.0" y="307.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">CCP-AppDS — 1Y0-342 NetScaler Advanced Topics</text>
  <text x="710.0" y="325.7" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">WAF · nFactor · NetScaler Console · prereq: either CCA</text>
  <line x1="710" y1="251" x2="710" y2="285" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-neutral)"/>
  <text x="60" y="380" font-size="9.5" font-weight="700" fill="#b91c1c">Retired: Expert tier (CCE-V, CCE-N) · 1Y0-204 · the old exam-code system (1Y0-342 is the last)</text>
  <text x="60" y="400" font-size="9.5" font-weight="400" fill="#374151">AppDS forms: ~10% performance-based items — lab hours at the NetScaler CLI (free on CPX Express)</text>
  <line x1="60" y1="425" x2="100" y2="425" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-neutral)"/>
  <text x="108" y="429" font-size="11" fill="#6b7280">Associate level</text>
  <line x1="273" y1="425" x2="313" y2="425" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-data)"/>
  <text x="321" y="429" font-size="11" fill="#b45309">Professional level (top of ladder)</text>
  <line x1="657" y1="425" x2="697" y2="425" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="705" y="429" font-size="11" fill="#33415c">Program / delivery platform</text>
</svg>
