<svg viewBox="0 0 960 524" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 program map: the ISA/IEC 62443 Cybersecurity Certificate Program</title>
  <desc>
    The ISA/IEC 62443 Cybersecurity Certificate Program has four certificates mapped to the industrial automation and control systems security lifecycle. Certificate 1, Cybersecurity Fundamentals Specialist, course IC32, is the mandatory gate covering zones and conduits, security levels, and the seven foundational requirements. After it, in any order: Certificate 2 Cybersecurity Risk Assessment Specialist, course IC33, the Assess phase; Certificate 3 Cybersecurity Design Specialist, course IC34, the Design phase; and Certificate 4 Cybersecurity Maintenance Specialist, course IC37, the Operate and Maintain phase. Earning all four automatically confers the ISA/IEC 62443 Cybersecurity Expert designation, with no separate exam. The credentials do not expire. Everything is grounded in the IEC 62443 standard family, and the volume models zones, conduits, security levels, and risk scoring with free Linux primitives.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="524" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Program Map: ISA/IEC 62443 Cybersecurity Certificate Program</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="9.4" fill="#4b5563">Certificate 1 Fundamentals Specialist (IC32) is the mandatory gate; Risk Assessment (IC33), Design (IC34), and Maintenance (IC37) follow in any order; all four confer the Expert designation</text>
  <g transform="translate(0,24)">
