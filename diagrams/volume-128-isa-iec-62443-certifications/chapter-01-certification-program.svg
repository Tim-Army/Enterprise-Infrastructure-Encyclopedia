  <text x="790.0" y="258.3" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">course IC37 · Operate/Maintain</text>
  <line x1="480" y1="172" x2="790" y2="220" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="300" y="320" width="360" height="44" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="480.0" y="338.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">ISA/IEC 62443 Cybersecurity Expert</text>
  <text x="480.0" y="352.7" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">automatic on all four certificates — no separate exam</text>
  <line x1="170" y1="272" x2="400" y2="320" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-data)"/>
  <line x1="480" y1="272" x2="480" y2="320" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-data)"/>
  <line x1="790" y1="272" x2="560" y2="320" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-data)"/>
  <text x="30" y="405" font-size="9.5" font-weight="700" fill="#b91c1c">OT priority inversion: availability &amp; safety outrank confidentiality (A-I-C) — every control decision follows from it</text>
  <text x="30" y="424" font-size="9.5" font-weight="400" fill="#374151">Core mechanics: zones + conduits, security levels (SL 0-4) as a vector over FR1-FR7 — modeled free on Linux (namespaces/nftables/python)</text>
  <line x1="30" y1="450" x2="70" y2="450" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-neutral)"/>
  <text x="78" y="454" font-size="11" fill="#6b7280">Mandatory Fundamentals gate</text>
  <line x1="351" y1="450" x2="391" y2="450" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="399" y="454" font-size="11" fill="#166534">Lifecycle specialist (any order)</text>
  <line x1="717" y1="450" x2="757" y2="450" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-data)"/>
  <text x="765" y="454" font-size="11" fill="#b45309">Expert (all four)</text>
  </g>
