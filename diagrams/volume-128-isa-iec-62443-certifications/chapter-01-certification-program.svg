  <text x="480.0" y="60.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">IEC 62443 standard family (1-x / 2-x / 3-x / 4-x)</text>
  <text x="480.0" y="73.0" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">credentials do not expire · standard evolves — re-read editions</text>
  <rect x="340" y="120" width="280" height="52" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="480.0" y="140.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Certificate 1 — Fundamentals Specialist</text>
  <text x="480.0" y="158.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">course IC32 · MANDATORY GATE</text>
  <rect x="30" y="220" width="280" height="52" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="170.0" y="240.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111827">Cert 2 — Risk Assessment</text>
  <text x="170.0" y="258.3" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">course IC33 · Assess</text>
  <line x1="480" y1="172" x2="170" y2="220" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="340" y="220" width="280" height="52" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="480.0" y="240.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111827">Cert 3 — Design</text>
  <text x="480.0" y="258.3" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">course IC34 · Design</text>
  <line x1="480" y1="172" x2="480" y2="220" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <rect x="650" y="220" width="280" height="52" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
