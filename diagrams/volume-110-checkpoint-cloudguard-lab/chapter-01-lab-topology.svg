<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: a Check Point management server installing an ordered rulebase to a Security Gateway that enforces it over four segments</title>
  <desc>
    A Check Point management server, driven through SmartConsole and the mgmt_cli API, defines objects and a single ordered access rulebase and installs policy to a Security Gateway. The gateway enforces the rulebase east-west over four segments: web in segment APP with tag role=web, db in segment DB with tag role=db listening on 5432, hmi in segment MGMT with tag role=hmi, and plc in segment OT with tag role=plc listening on 502. The rulebase permits web to db with the PGSQL service and hmi to plc with the MODBUS service; the explicit Cleanup rule drops everything else, including the hmi to db lateral flow. CloudGuard data-center and dynamic objects import membership from cloud or vCenter tags so the policy follows workloads as they are created, moved, or re-addressed. The volume is two-track: Track 1 uses a real Management plus Gateway, Track 2 reproduces the rulebase and tag-based objects with Linux nftables.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
