<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 program map: the IBM Professional Certification Program</title>
  <desc>
    The IBM Professional Certification Program has 62 current certifications across seven portfolios: AI, watsonx and quantum including Qiskit; security centered on the QRadar SIEM V7.5 ladder plus Guardium and Verify Access; data platforms covering Db2 for z/OS, Db2 LUW and Informix; analytics with Cognos, Planning Analytics and Cloud Pak for Data; integration and messaging with MQ, App Connect, API Connect, DataPower and Sterling; automation, observability and AIOps with Cloud Pak for Business Automation, Business Automation Workflow, FileNet, Turbonomic, Instana and Cloud Pak for AIOps; and systems and asset management with z/OS, AIX, IBM i, WebSphere, Maximo and TRIRIGA. Exams are delivered by Pearson VUE in test centers or online with OnVUE, badges issue on Credly, six PLUS combination certifications bundle a Red Hat Certified Specialist OpenShift exam, and five credentials are flagged Retiring soon. IBM certifications are distinct from TechXchange badges and Coursera IBM Professional Certificates.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
