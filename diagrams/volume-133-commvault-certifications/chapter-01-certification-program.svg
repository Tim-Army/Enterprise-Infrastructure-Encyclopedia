<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 program map: the Commvault Readiverse Academy certification program</title>
  <desc>
    Commvault's certification program runs in Readiverse Academy and was rebuilt in June 2026 around four tiers on one path. Commvault Cloud Practitioner covers foundational platform and cyber resilience knowledge and is earned through the Commvault Cloud Administrator course of about four hours, the Cyber Resilience course of about four hours, one workload course of about thirty minutes, exams for both the Administrator and Cyber Resilience components, and claiming a digital badge. Commvault Cloud Specialist adds expanded operational, workload, and security depth. Commvault Cloud Professional adds advanced recovery and workload expertise including Cloud Rewind or Cleanroom Recovery coursework. Commvault Cloud Expert covers cloud engineering and resilience leadership with Cloud Engineer coursework, advanced feature courses, Cloud Rewind, and Cleanroom Recovery. All four tiers rest on the same three learning pillars: foundational platform skills, cyber resilience, and workload and feature expertise. Named certifications include Commvault Cloud Administrator, the Cyber Resilience Certification, and SaaS certifications for Threat Scan, Cleanroom Recovery, and Cloud Rewind. Workload courses cover Microsoft 365, Active Directory and Entra ID, file server protection, VMware, and Oracle. Credentials are vendor-validated through coursework, hands-on lab activities, and validated assessments, and Commvault is an ISC2 CPE Authorized Submitter so the training also earns continuing education credit. The volume models these disciplines free in Python.
  </desc>
