<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: Nozomi baselining Modbus and a function-aware enforcer between the operator and the PLC</title>
  <desc>
    Nozomi Guardian passively dissects the Modbus protocol on a SPAN down to the function code and baselines the industrial process, feeding Vantage. A function-aware enforcer sits between the hmi operator at 10.80.1.30 and the plc at 10.80.1.40 on port 502. The enforcer permits Modbus read functions (3 and 4), denies Modbus write functions (6 and 16) and any non-Modbus payload, and flags a register value that falls outside its learned range of 20 to 80 as a process anomaly even on a permitted read. The volume is two-track: Track 1 describes the real Nozomi Guardian and Vantage, Track 2 builds a minimal Modbus server and a function-aware proxy in Python plus nftables.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Protocol-Aware OT Segmentation with Nozomi</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="11.3" fill="#4b5563">Nozomi dissects Modbus to the function code and baselines the process; the enforcer allows reads, denies writes and non-Modbus, and flags out-of-range values</text>
  <rect x="300" y="44" width="360" height="42" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480.0" y="62.4" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Nozomi Guardian / Vantage</text>
  <text x="480.0" y="75.3" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">deep protocol dissection · process baseline</text>
  <line x1="480" y1="86" x2="480" y2="160" stroke="#33415c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="490" y="126" font-size="8.5" fill="#374151">SPAN (passive)</text>
  <rect x="60" y="170" width="130" height="60" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="125.0" y="189.2" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">hmi</text>
  <text x="125.0" y="203.8" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">operator</text>
  <text x="125.0" y="218.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">10.80.1.30</text>
  <rect x="360" y="160" width="240" height="80" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="480.0" y="185.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">function-aware enforcer</text>
  <text x="480.0" y="203.7" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">Modbus READ = allow</text>
  <text x="480.0" y="221.7" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7f1d1d">WRITE / non-Modbus = deny</text>
  <rect x="740" y="170" width="150" height="60" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="815.0" y="189.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">plc · :502</text>
  <text x="815.0" y="203.7" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">Modbus PLC</text>
  <text x="815.0" y="218.3" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7c2d12">reg0 range 20-80</text>
  <line x1="190" y1="200" x2="360" y2="200" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="230" y="174" font-size="10.5" fill="#166534">Modbus</text>
  <line x1="600" y1="200" x2="740" y2="200" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="630" y="174" font-size="10.5" fill="#166534">read only</text>
  <text x="620" y="286" font-size="9.5" font-weight="700" fill="#b91c1c">read value out of [20,80] -&gt; ANOMALY flagged</text>
  <line x1="60" y1="330" x2="100" y2="330" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="108" y="334" font-size="11" fill="#166534">Modbus read (allowed)</text>
  <line x1="327" y1="330" x2="367" y2="330" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="375" y="334" font-size="11" fill="#b91c1c">Write / non-Modbus (denied)</text>
  <line x1="648" y1="330" x2="688" y2="330" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="696" y="334" font-size="11" fill="#33415c">Nozomi (dissect + baseline)</text>
</svg>
