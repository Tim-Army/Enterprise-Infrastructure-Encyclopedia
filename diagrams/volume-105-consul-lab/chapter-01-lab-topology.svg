<svg viewBox="0 0 960 512" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: a kind Kubernetes cluster with HashiCorp Consul, meshed services and one un-meshed PLC, plus a VM joining the same mesh</title>
  <desc>
    A single Linux host runs Docker, kind, kubectl, helm, and the consul CLI. Inside it a kind Kubernetes cluster runs Consul servers and Connect. Meshed services web (ServiceAccount web), api (api, an HTTP service on 8080), db (db, PostgreSQL on 5432), and hmi (hmi, the operator) each have a Consul Connect sidecar and a SPIFFE identity; plc (app=plc, a Modbus listener on 502) is un-meshed. Consul secures mesh traffic with mutual TLS and authorizes with service intentions: a default-deny wildcard plus exact allows permits web to db on 5432 and web to api on 8080, with an L7 intention restricting the api to HTTP GET /get; the compromised-hmi-to-db flow is denied because no intention allows it. Consul's defining trait is multi-platform reach: a service running on a VM runs a Consul dataplane, joins the same mesh, and obeys the same intentions as the Kubernetes services. The un-meshed plc still needs a CNI network policy beneath the mesh.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="512" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Multi-Platform Microsegmentation with HashiCorp Consul</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="11.4" fill="#4b5563">Consul Connect gives each service a SPIFFE identity and mTLS; service intentions authorize by service; the same mesh and intentions span Kubernetes and VMs</text>
  <g transform="translate(0,12)">
  <rect x="60" y="54" width="840" height="34" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480.0" y="74.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">Single Linux host · Docker + kind + kubectl + helm + consul</text>
  <rect x="60" y="100" width="840" height="26" rx="6" fill="#f4f7fb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480.0" y="118.0" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">kind Kubernetes cluster · Consul servers + Connect · mTLS + service intentions (SPIFFE identity)</text>
  <rect x="70" y="156" width="300" height="24" rx="6" fill="#f0faf2" stroke="#166534" stroke-width="1.5"/>
  <text x="220.0" y="173.0" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Kubernetes services  (Consul Connect)</text>
  <rect x="85" y="190" width="130" height="60" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="150.0" y="209.2" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">web  +sidecar</text>
  <text x="150.0" y="223.8" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">svc: web</text>
  <text x="150.0" y="238.5" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">client</text>
  <rect x="232" y="190" width="130" height="60" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="297.0" y="209.2" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">db  +sidecar</text>
  <text x="297.0" y="223.8" text-anchor="middle" font-size="9" font-weight="700" fill="#7f1d1d">svc: db · :5432</text>
  <text x="297.0" y="238.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">PostgreSQL</text>
  <rect x="158" y="268" width="140" height="60" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="228.0" y="287.2" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">api  +sidecar</text>
  <text x="228.0" y="301.9" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">svc: api</text>
  <text x="228.0" y="316.5" text-anchor="middle" font-size="9" font-weight="700" fill="#374151">HTTP :8080</text>
  <line x1="215" y1="220" x2="232" y2="220" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="140" y="292" font-size="10.5" fill="#166534">5432 (mTLS, intention allow)</text>
  <line x1="150" y1="250" x2="210" y2="268" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="150" y="346" font-size="10.5" fill="#166534">8080 (L7 intention: GET /get)</text>
  <rect x="500" y="156" width="380" height="24" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="690.0" y="173.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">operator (meshed) + un-meshed PLC</text>
  <rect x="520" y="190" width="150" height="60" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="595.0" y="209.2" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">hmi  +sidecar</text>
  <text x="595.0" y="223.8" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">svc: hmi</text>
  <text x="595.0" y="238.5" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">operator</text>
  <rect x="700" y="190" width="150" height="60" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="775.0" y="209.2" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">plc  NO sidecar</text>
  <text x="775.0" y="223.8" text-anchor="middle" font-size="9" font-weight="700" fill="#7c2d12">app=plc · :502</text>
  <text x="775.0" y="238.5" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">un-meshed</text>
  <line x1="670" y1="220" x2="700" y2="220" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="640" y="292" font-size="10.5" fill="#166534">502 (needs CNI policy)</text>
  <line x1="520" y1="300" x2="372" y2="300" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="365" y="328" font-size="10.5" fill="#b91c1c">hmi → db DENIED (no intention allows it)</text>
  <line x1="480" y1="180" x2="480" y2="372" stroke="#33415c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="300" y="372" width="360" height="40" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480.0" y="395.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111827">VM service · Consul dataplane · joins the SAME mesh, SAME intentions</text>
  <line x1="70" y1="428" x2="110" y2="428" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="118" y="432" font-size="11" fill="#166534">Allowed (mTLS + intention)</text>
  <line x1="382" y1="428" x2="422" y2="428" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="430" y="432" font-size="11" fill="#b91c1c">Lateral movement (denied)</text>
  <line x1="685" y1="428" x2="725" y2="428" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="733" y="432" font-size="11" fill="#33415c">Multi-platform reach (VM)</text>
  </g>
</svg>
