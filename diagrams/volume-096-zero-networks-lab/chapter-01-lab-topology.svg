<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: a five-VM IT/OT estate segmented agentlessly with Zero Networks, native firewalls on the servers and neighbor-enforced protection for the PLC</title>
  <desc>
    A Windows 11 host running VMware Workstation Pro hosts three virtual-network segments joined by one three-legged Linux router, zn-gw, whose native firewall Zero Networks programs remotely and which is the enforcement point for the OT cell. The IT/Corporate segment (VMnet8 NAT, 192.168.170.0/24) carries the host itself, which doubles as the attacker 'IT laptop', and the VMware NAT gateway. The Data Center segment (VMnet2 host-only, 10.10.20.0/24) holds three workloads whose native firewalls are remotely programmed: zn-app01 (nginx), zn-db01 (PostgreSQL, the crown jewels), and zn-win01 (Windows Server SCADA/HMI, Windows Firewall). The OT cell (VMnet3 host-only, 10.10.30.0/24) is isolated with no host adapter and holds zn-ot01, a Modbus PLC that exposes no manageable firewall; it is protected by policy on its managed neighbors and on zn-gw. Two flows are legitimate and allowed: zn-app01 to zn-db01 on TCP 5432, and zn-win01 (the HMI) to zn-ot01 on Modbus TCP 502. The lateral-movement flow from the compromised zn-win01 to zn-db01 on 5432 is denied, and administrative ports such as SSH 22 and RDP 3389 are closed until a just-in-time MFA grant opens them.
  </desc>
