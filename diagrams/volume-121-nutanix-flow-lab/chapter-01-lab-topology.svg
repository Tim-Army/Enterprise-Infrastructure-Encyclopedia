  <text x="480.0" y="60.4" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Prism Central (Flow)</text>
  <text x="480.0" y="73.3" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">categories + policy · monitor -&gt; apply</text>
  <rect x="45" y="130" width="870" height="40" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="480.0" y="153.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">AHV virtual switch — enforcement point (agentless, beneath every guest)</text>
  <line x1="480" y1="84" x2="480" y2="130" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="492" y="112" font-size="10.5" fill="#33415c">policy</text>
  <rect x="45" y="210" width="180" height="64" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="135.0" y="229.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">web · .10</text>
  <text x="135.0" y="245.7" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">AppTier: web</text>
  <text x="135.0" y="261.7" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">Environment: corp</text>
  <line x1="135" y1="170" x2="135" y2="210" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-neutral)"/>
  <rect x="275" y="210" width="180" height="64" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="365.0" y="229.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">db · :5432 · .20</text>
  <text x="365.0" y="245.7" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">AppTier: db</text>
  <text x="365.0" y="261.7" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">Environment: corp</text>
  <line x1="365" y1="170" x2="365" y2="210" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-neutral)"/>
  <rect x="505" y="210" width="180" height="64" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="595.0" y="229.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">hmi · .30</text>
  <text x="595.0" y="245.7" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">AppTier: hmi</text>
  <text x="595.0" y="261.7" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">Environment: ot</text>
  <line x1="595" y1="170" x2="595" y2="210" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-neutral)"/>
  <rect x="735" y="210" width="180" height="64" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="825.0" y="229.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">plc · :502 · .40</text>
  <text x="825.0" y="245.7" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">AppTier: plc</text>
  <text x="825.0" y="261.7" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">Environment: ot</text>
  <line x1="825" y1="170" x2="825" y2="210" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-neutral)"/>
  <line x1="225" y1="242" x2="275" y2="242" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="228" y="232" font-size="10.5" fill="#166534">5432</text>
  <line x1="685" y1="242" x2="735" y2="242" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="696" y="232" font-size="10.5" fill="#166534">502</text>
  <text x="45" y="320" font-size="9.5" font-weight="700" fill="#b91c1c">isolation: Environment:corp &lt;-X-&gt; Environment:ot — the lateral hmi -&gt; db path dies by name</text>
  <text x="45" y="340" font-size="9.5" font-weight="400" fill="#374151">application: only web -&gt; db:5432 and hmi -&gt; plc:502 are permitted (default-deny)</text>
  <rect x="700" y="360" width="220" height="74" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="810.0" y="378.8" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Quarantine</text>
  <text x="810.0" y="393.2" text-anchor="middle" font-size="9" font-weight="400" fill="#7f1d1d">one category assignment</text>
  <text x="810.0" y="407.8" text-anchor="middle" font-size="9" font-weight="400" fill="#7f1d1d">cuts a VM off entirely —</text>
  <text x="810.0" y="422.2" text-anchor="middle" font-size="9" font-weight="700" fill="#7f1d1d">beats every permit</text>
  <line x1="45" y1="430" x2="85" y2="430" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="93" y="434" font-size="11" fill="#166534">Permitted by application policy</text>
  <line x1="402" y1="430" x2="442" y2="430" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="450" y="434" font-size="11" fill="#b91c1c">Quarantine (top precedence)</text>
  <line x1="723" y1="430" x2="763" y2="430" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="771" y="434" font-size="11" fill="#33415c">Prism Central / categories</text>
  </g>
</svg>
