<svg viewBox="0 0 960 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Chapter 1 lab topology: Xage brokering access to a database and a legacy PLC by identity</title>
  <desc>
    The Xage Fabric holds identities and access policy in a decentralized, tamper-resistant store and distributes them to enforcement points. Each protected asset sits behind a broker and has no direct network path. In the IT row, the web application's service identity svc-web is brokered to the database on 5432. In the OT row, the operator identity op-hmi is brokered to a legacy Modbus PLC on 502. An attacker with no valid identity is denied at the broker even though the PLC has no authentication of its own. The volume is two-track: Track 1 describes the real Xage Fabric at design level, Track 2 builds a working identity-broker with socat and nftables so the asset is reachable only through the broker.
  </desc>
  <defs>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Chapter 1 Lab Topology: Identity-Brokered OT Access with Xage</text>
  <text x="480.0" y="50" text-anchor="middle" font-size="11.7" fill="#4b5563">Every connection is brokered through an identity check; assets have no direct path; a legacy PLC is reachable only by a granted, authenticated identity</text>
  <rect x="300" y="44" width="360" height="42" rx="8" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480.0" y="62.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">Xage Fabric  ·  identities + access policy</text>
  <text x="480.0" y="75.2" text-anchor="middle" font-size="9" font-weight="400" fill="#374151">decentralized · tamper-resistant</text>
  <rect x="50" y="135" width="110" height="54" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="105.0" y="156.8" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">web</text>
  <text x="105.0" y="174.8" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">IT app</text>
  <rect x="275" y="135" width="140" height="54" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="345.0" y="156.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">broker (node)</text>
  <text x="345.0" y="174.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">identity check</text>
  <rect x="530" y="135" width="120" height="54" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="590.0" y="156.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">db · :5432</text>
  <text x="590.0" y="174.7" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">PostgreSQL</text>
  <line x1="160" y1="162" x2="275" y2="162" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="175" y="127" font-size="10.5" fill="#166534">svc-web</text>
  <line x1="415" y1="162" x2="530" y2="162" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="430" y="127" font-size="10.5" fill="#166534">brokered</text>
  <rect x="50" y="240" width="110" height="54" rx="8" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <text x="105.0" y="261.9" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">hmi</text>
  <text x="105.0" y="279.9" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">operator</text>
  <rect x="275" y="240" width="140" height="54" rx="8" fill="#f0faf2" stroke="#166534" stroke-width="2"/>
  <text x="345.0" y="261.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">broker (node)</text>
  <text x="345.0" y="279.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">identity check</text>
  <rect x="530" y="240" width="120" height="54" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.25" stroke-dasharray="4 3"/>
