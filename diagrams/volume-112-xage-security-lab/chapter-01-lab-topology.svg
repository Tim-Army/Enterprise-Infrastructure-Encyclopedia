  <text x="590.0" y="279.7" text-anchor="middle" font-size="8.5" font-weight="400" fill="#374151">legacy Modbus</text>
  <line x1="160" y1="267" x2="275" y2="267" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="175" y="232" font-size="10.5" fill="#166534">op-hmi</text>
  <line x1="415" y1="267" x2="530" y2="267" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="430" y="232" font-size="10.5" fill="#166534">brokered</text>
  <line x1="470" y1="86" x2="345" y2="135" stroke="#33415c" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="490" y1="86" x2="345" y2="240" stroke="#33415c" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="50" y="330" width="110" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="105.0" y="348.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">attacker</text>
  <text x="105.0" y="362.7" text-anchor="middle" font-size="8.5" font-weight="400" fill="#7f1d1d">no identity</text>
  <line x1="160" y1="352" x2="275" y2="300" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="175" y="372" font-size="10.5" fill="#b91c1c">DENIED at broker</text>
  <text x="680" y="188" font-size="9.5" font-weight="700" fill="#374151">Assets have no direct path;</text>
  <text x="680" y="204" font-size="9.5" font-weight="700" fill="#374151">reachable only via broker.</text>
  <line x1="50" y1="398" x2="90" y2="398" stroke="#166534" stroke-width="1.75" marker-end="url(#arrow-alt)"/>
  <text x="98" y="402" font-size="11" fill="#166534">Brokered by valid identity</text>
  <line x1="362" y1="398" x2="402" y2="398" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-warn)"/>
  <text x="410" y="402" font-size="11" fill="#b91c1c">No identity (denied)</text>
  <line x1="620" y1="398" x2="660" y2="398" stroke="#33415c" stroke-width="1.75" marker-end="url(#arrow-mgmt)"/>
  <text x="668" y="402" font-size="11" fill="#33415c">Xage Fabric (policy)</text>
</svg>
