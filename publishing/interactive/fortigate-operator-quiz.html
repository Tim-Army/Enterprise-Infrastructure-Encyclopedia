IP, Same as Default Gateway, Specify","Same as System DNS, Same as Address Range, Custom","Same as System DNS, Same as Interface IP, Specify","Automatic, Same as Interface IP, Manual"],"a":2,"rat":"The DNS Server field offers Same as System DNS (the default, using FortiGate's own DNS), Same as Interface IP, and Specify for a custom entry. The other option sets are not what the field shows.","src":"Original practice item","diff":"medium"},{"n":75,"ln":32,"lesson":2,"section":"DHCP Server","topic":"DHCP Server - Address Range definition","q":"How does the FortiGate DHCP server settings define the pool of addresses it will lease out?","opts":["As a single network address written in CIDR prefix notation","As a netmask paired with a default gateway","As a comma-separated list of individual host addresses","As one or more entries, each giving a Starting IP and an End IP"],"a":3,"rat":"The Address Range is entered as rows with a Starting IP and an End IP that bound the block FortiGate leases. It is not a CIDR network, a netmask/gateway pair, or a comma-separated host list.","src":"Original practice item","diff":"easy"},{"n":76,"ln":33,"lesson":2,"section":"DHCP Server","topic":"Lab configuration requirements","q":"In the lab, besides assigning the LAN-facing interface its correct IP address, what additional job must that interface perform so internal clients receive their network settings automatically?","opts":["Act as a DHCP server","Act as a DHCP relay","Run in transparent mode","Act as a DNS server"],"a":0,"rat":"The LAN interface is configured as a DHCP server so attached clients get addresses and settings automatically. A DHCP relay would only forward requests to a separate server, and DNS/transparent mode do not hand out leases.","src":"Original practice item","diff":"easy"},{"n":77,"ln":34,"lesson":2,"section":"DHCP Server","topic":"DHCP server configuration","q":"Where in the FortiGate GUI is a DHCP server enabled for a given network in this lab?","opts":["Globally under Network > DNS","Per interface, by turning on the DHCP Server toggle inside that interface's Edit Interface screen","Under Policy & Objects as a DHCP policy","On a single System > DHCP Server page that applies to every interface at once"],"a":1,"rat":"DHCP is configured per interface: the DHCP Server section with its Enable toggle lives inside the Edit Interface dialog. There is no global DHCP page or DHCP policy object driving it.","src":"Original practice item","diff":"easy"},{"n":78,"ln":35,"lesson":2,"section":"Static Routes","topic":"Static route components","q":"A static route is built from three parts. Which part is the IP address of the next hop that FortiGate forwards matching traffic to?","opts":["Destination","Interface","Gateway address","Administrative distance"],"a":2,"rat":"The gateway address is the next-hop IP that FortiGate sends matching traffic to. Destination selects which traffic matches, Interface is the egress port, and administrative distance is a route preference value, not one of the three core parts.","src":"Original practice item","diff":"medium"},{"n":79,"ln":36,"lesson":2,"section":"Static Routes","topic":"Static routes - GUI location","q":"In the FortiOS 7.6 web GUI, which menu path leads to where you add a new static route?","opts":["Network > Policy Routes","Network > Routing Objects","Dashboard > Network","Network > Static Routes"],"a":3,"rat":"Static routes are created under Network > Static Routes with Create New. Policy Routes and Routing Objects are separate menu items, and Dashboard > Network is for monitoring rather than creating routes.","src":"Original practice item","diff":"easy"},{"n":80,"ln":37,"lesson":2,"section":"Static Routes","topic":"Static routes - default route destination","q":"When you build a static default route on a FortiGate, what value belongs in the Destination (subnet) field?","opts":["0.0.0.0/0.0.0.0","172.16.20.2","0.0.0.0/255.255.255.255","10.0.0.0/8"],"a":0,"rat":"A default route uses the all-zeros destination 0.0.0.0/0.0.0.0 so it matches any traffic without a more specific route. 172.16.20.2 would be the gateway, not the destination, and the other subnets are not the default.","src":"Original practice item","diff":"medium"},{"n":81,"ln":38,"lesson":2,"section":"Static Routes","topic":"Static routes - destination selection types","q":"When defining the Destination of a new static route, which two destination types does the New Static Route dialog let you choose between?","opts":["Subnet and Named Address","Subnet and Internet Service","IP Range and FQDN","Interface and Gateway"],"a":1,"rat":"The Destination selector offers Subnet or Internet Service; a default route uses Subnet with 0.0.0.0/0. Named Address, IP Range/FQDN, and Interface/Gateway are not the two destination-type choices offered here.","src":"Original practice item","diff":"medium"},{"n":82,"ln":39,"lesson":2,"section":"Static Routes","topic":"Static routes - administrative distance","q":"An administrator at Acme opens Network > Static Routes and clicks Create New to add a route on a FortiGate running FortiOS 7.6. Before changing anything, what value is pre-filled in the Administrative Distance field?","opts":["1","5","10","110"],"a":2,"rat":"The New Static Route dialog pre-populates Administrative Distance with 10, the default for static routes on FortiGate. 110 is the default distance used by OSPF, not by static routes.","src":"Original practice item","diff":"medium"},{"n":83,"ln":40,"lesson":2,"section":"Static Routes","topic":"Static routes - interface resolution from gateway","q":"While building a static route on a FortiGate, an engineer enters a gateway address of 10.200.1.254. If that gateway is reachable through the interface named wan1 (port2), what does the FortiGate do with the Interface field?","opts":["The route cannot be saved until the interface is chosen by hand","It substitutes a virtual any interface as a placeholder","It stays empty until the OK button is pressed","It is filled in automatically with wan1 (port2)"],"a":3,"rat":"When the gateway IP is entered, FortiGate looks up which interface can reach that next hop and auto-fills the Interface field, here wan1 (port2). The administrator does not have to select the interface manually, so it is not left blank or pending until OK.","src":"Original practice item","diff":"hard"},{"n":84,"ln":41,"lesson":2,"section":"Monitoring & Diagnostics","topic":"Static Routing - routing table columns","q":"When you view the list of configured static routes under Network > Static Routes on a FortiGate, which group of columns describes each configured entry?","opts":["Type, Destination, Gateway IP, Interfaces, Distance, Priority","Type, Source, Next Hop, VLAN, Metric, Weight","Protocol, Destination, Netmask, Gateway, Cost, TTL","Destination, Gateway IP, Interfaces, Metric, Distance, Priority"],"a":0,"rat":"The static route list presents six columns: Type, Destination, Gateway IP, Interfaces, Distance, and Priority. Metric is a property of dynamic routes rather than a column here, so the option that swaps in Metric is incorrect.","src":"Original practice item","diff":"hard"},{"n":85,"ln":42,"lesson":2,"section":"Monitoring & Diagnostics","topic":"Monitoring the routing table","q":"A FortiOS 7.6 administrator wants to see only the routes that are currently active in the forwarding table (the routes actually in use). Which location in the FortiGate GUI shows this?","opts":["Network > Static Routes","Dashboard > Network > Static and Dynamic Routing","Network > Routing Objects","Log & Report > Routing Monitor"],"a":1,"rat":"The Dashboard > Network > Static and Dynamic Routing widget displays the live routing table, meaning only the active routes. Network > Static Routes instead lists every route that has been configured, whether or not it is active.","src":"Original practice item","diff":"medium"},{"n":86,"ln":43,"lesson":2,"section":"Monitoring & Diagnostics","topic":"Routes missing from the routing table","q":"A static route to 192.168.50.0/24 through wan1 (port6) is present in the FortiGate configuration, yet it never shows up in the active routing table. Which condition explains why an otherwise valid route is excluded?","opts":["The route's administrative distance is set to 255","The destination overlaps a connected network","The outgoing interface, port6, is administratively down","The gateway has not been learned via DHCP"],"a":2,"rat":"A configured route is only installed in the routing table when its outgoing interface is up; because port6 is disabled, the route is left out. A route becomes active again once its interface comes back up, its configuration is corrected, or it is no longer beaten by a better route.","src":"Original practice item","diff":"hard"},{"n":87,"ln":1,"lesson":3,"section":"Firewall Policy Fundamentals","topic":"Definition of firewall policies","q":"On a FortiGate, which statement best describes what a firewall policy is?","opts":["A collection of rules that decides whether network traffic is allowed and, once allowed, how FortiGate handles it","An entry in the routing table that picks the egress interface for a packet","A translation rule that maps private addresses onto a public address","A profile that scans traffic for malware and intrusion attempts"],"a":0,"rat":"A firewall policy is a set of rules that controls whether traffic is accepted and, if it is, how FortiGate processes it. The other choices describe routing, NAT, and security profiles, which are distinct features rather than the definition of a policy.","src":"Original practice item","diff":"easy"},{"n":88,"ln":2,"lesson":3,"section":"Matching Traffic to Policies","topic":"Policy match criteria - Service","q":"When a firewall policy uses a Service object to match traffic, which attribute of the traffic does that Service object evaluate?","opts":["Source port","Destination port","Incoming interface","IP protocol version"],"a":1,"rat":"A Service object matches traffic on its destination port (and protocol), for example HTTP on TCP/80. The incoming interface and the source/destination addresses are separate match criteria handled by other fields in the policy.","src":"Original practice item","diff":"medium"},{"n":89,"ln":3,"lesson":3,"section":"Matching Traffic to Policies","topic":"Source and destination field criteria","q":"In a FortiGate firewall policy, the Source and Destination fields can each be defined using which pair of criteria?","opts":["User or user group","MAC address or FQDN","IP subnet or Internet Services","Schedule or service"],"a":2,"rat":"Both the Source and Destination fields accept an IP subnet (a firewall address) or an Internet Service. Adding a user or user group is an extra option available only on the Source side, and schedule and service are entirely separate policy fields.","src":"Original practice item","diff":"medium"},{"n":90,"ln":4,"lesson":3,"section":"Matching Traffic to Policies","topic":"Using an IP subnet in a policy","q":"Before you can reference a particular IP subnet as the source or destination of a firewall policy on FortiGate, what must you create first?","opts":["An Internet Service object for that subnet","A virtual IP that maps the subnet","Firewall authentication for that subnet","A firewall address object that represents that subnet"],"a":3,"rat":"To use a subnet in a policy you first define a firewall address object for it (for example the LAN subnet), then select that object in the Source or Destination field. Internet Service objects, virtual IPs, and firewall authentication address different needs and are not how a plain subnet is defined.","src":"Original practice item","diff":"medium"},{"n":91,"ln":5,"lesson":3,"section":"Matching Traffic to Policies","topic":"Using a user as the policy source","q":"You want a firewall policy to match a specific authenticated user as its source rather than an IP address. How is this accomplished on FortiGate?","opts":["Enable firewall authentication on the policy, then add the specific users or user groups","Create a firewall address object holding the user's IP address","Leave the source set to the default ALL object","Build an Internet Service object that stands in for the user"],"a":0,"rat":"Matching on a user requires firewall authentication to be configured; you then select the intended users or user groups as the source. The default ALL object matches every address, and neither an address object nor an Internet Service object identifies a user.","src":"Original practice item","diff":"medium"},{"n":92,"ln":6,"lesson":3,"section":"Matching Traffic to Policies","topic":"Internet Service Database (ISDB)","q":"A firewall policy can use an Internet Service from the Internet Service Database (ISDB) as its source or destination. What information does the ISDB provide?","opts":["The MAC addresses of endpoints that have been quarantined","The IP subnets of well-known web providers such as Meta and YouTube","The application-control signatures that identify cloud apps","A list of FQDN objects resolved by the FortiGate DNS server"],"a":1,"rat":"The ISDB is a maintained list of the public IP ranges belonging to common internet service providers such as Meta, YouTube, and others, and administrators can add custom entries. It is not a store of MAC addresses, application signatures, or DNS-resolved FQDNs.","src":"Original practice item","diff":"medium"},{"n":93,"ln":7,"lesson":3,"section":"Policy Table and Evaluation","topic":"Policy table structure","q":"In the simplified firewall policy table used to illustrate policy structure, which set of columns describes each policy row?","opts":["ID, Source Address, Destination Address, Schedule, NAT","Name, Incoming Interface, Outgoing Interface, Security Profiles, Log","Name, From, To, Service, Action","Sequence, Source, Destination, Application, Inspection Mode"],"a":2,"rat":"The simplified table lists Name, From, To, Service, and Action for each policy, for example a policy named Internet access from port1 to wan allowing HTTP/HTTPS/DNS with an ACCEPT action. The other column sets mix in fields that are not part of this simplified view.","src":"Original practice item","diff":"easy"},{"n":94,"ln":8,"lesson":3,"section":"Policy Table and Evaluation","topic":"Implicit deny / no match","q":"The last entry in a FortiGate policy list is the Implicit Deny rule (any source, any destination, service ALL, action Deny). What does FortiGate do with traffic that fails to match any explicit policy above it?","opts":["It accepts the traffic but flags it as unmatched in the logs","It redirects the traffic to the management interface","It queues the traffic until an administrator approves it","It drops the traffic"],"a":3,"rat":"Any traffic that does not match an explicit policy falls through to the implicit deny rule and is dropped. FortiGate does not accept, redirect, or hold unmatched traffic.","src":"Original practice item","diff":"medium"},{"n":95,"ln":9,"lesson":3,"section":"Traffic Processing and Inspection","topic":"Post-accept processing","q":"Once a firewall policy accepts a session, which further actions can FortiGate perform depending on that policy's configuration?","opts":["Network address translation (NAT) and traffic logging","Spanning-tree recalculation and VLAN trunking","HA failover and configuration synchronization","Static route redistribution and OSPF adjacency"],"a":0,"rat":"For accepted traffic, a policy can additionally apply NAT and generate traffic logs (alongside any security profiles it references). Spanning tree, HA, and dynamic routing are unrelated to what a single firewall policy applies to a session.","src":"Original practice item","diff":"medium"},{"n":96,"ln":10,"lesson":3,"section":"Traffic Processing and Inspection","topic":"Inspection modes (flow vs proxy)","q":"Compared with flow-based inspection, how does proxy-based inspection handle traffic on a FortiGate?","opts":["It inspects packets as they stream through, with no buffering","It reassembles and examines the content as a whole, inspecting more data points but adding latency","It looks only at the TCP three-way handshake and skips the payload","It turns off NAT so the content can be altered in transit"],"a":1,"rat":"Proxy-based inspection buffers and evaluates the content as a complete object, allowing more thorough inspection at the cost of added latency. Inspecting packets on the fly without buffering describes flow-based mode instead.","src":"Original practice item","diff":"hard"},{"n":97,"ln":1,"lesson":4,"section":"Log Types and Categories","topic":"FortiGate log types","q":"FortiGate groups its logs into three top-level categories. Which option correctly names all three?","opts":["Traffic, Event, and Security (UTM)","Forward, Local, and Sniffer","Traffic, System, and Antivirus","Event, VPN, and Web filter"],"a":0,"rat":"The three main log categories are Traffic, Event, and Security (UTM). The other choices list subtypes instead: Forward/Local/Sniffer are Traffic subtypes, and Antivirus/Web filter are Security (UTM) subtypes.","src":"Original practice item","diff":"easy"},{"n":98,"ln":2,"lesson":4,"section":"Log Types and Categories","topic":"Traffic log subtypes","q":"Within the Traffic log category on a FortiGate, which three subtypes are included?","opts":["System, User, and Router","Forward, Local, and Sniffer","Antivirus, Application control, and Web filter","Forward, System, and VPN"],"a":1,"rat":"The Traffic category is made up of the Forward, Local, and Sniffer subtypes. System/User/Router are Event subtypes and Antivirus/Application control/Web filter are Security (UTM) subtypes, so those options belong to other categories.","src":"Original practice item","diff":"medium"},{"n":99,"ln":3,"lesson":4,"section":"Log Types and Categories","topic":"Event log subtypes","q":"Which option lists subtypes that fall under the FortiGate Event log category?","opts":["Forward, Local, Sniffer","Antivirus, Application control, Web filter","System, User, Router, VPN","System, Antivirus, Router, Web filter"],"a":2,"rat":"Event log subtypes include System, User, Router, and VPN. Forward/Local/Sniffer are Traffic subtypes and Antivirus/Application control/Web filter are Security (UTM) subtypes; the last option mixes Event and Security subtypes together.","src":"Original practice item","diff":"medium"},{"n":100,"ln":4,"lesson":4,"section":"Log Types and Categories","topic":"Traffic Logs definition","q":"Traffic Logs on a FortiGate record information about traffic passing through the device as well as its management traffic. Which additional kind of traffic do they capture?","opts":["Traffic mirrored to a FortiAnalyzer collector","Traffic captured while FortiGate runs in transparent bridge mode","Traffic forwarded to a remote syslog server","Traffic received when the FortiGate is set up as a one-arm sniffer"],"a":3,"rat":"Traffic Logs also record the traffic seen when the FortiGate acts as a one-arm sniffer. FortiAnalyzer, transparent mode, and syslog are valid FortiGate features but are not what Traffic Logs are defined to capture here.","src":"Original practice item","diff":"hard"},{"n":101,"ln":5,"lesson":4,"section":"Log Types and Categories","topic":"Sniffer Traffic / one-arm sniffer","q":"When a FortiGate interface is configured as a one-arm sniffer, what role does that interface take on?","opts":["An inline intrusion prevention system (IPS) that blocks matching traffic","A transparent-mode firewall bridging two segments","An intrusion detection system (IDS) that only observes traffic without controlling it","A dedicated out-of-band management interface"],"a":2,"rat":"A one-arm sniffer turns the interface into an IDS that passively monitors a copy of the traffic without acting on it. Because it cannot block or alter traffic, it is not an inline IPS; the other options describe unrelated interface roles.","src":"Original practice item","diff":"medium"},{"n":102,"ln":6,"lesson":4,"section":"Log Types and Categories","topic":"Log subtypes / Event logs","q":"Which FortiGate log subtype captures records of configuration changes made to the device?","opts":["System Events","Forward Traffic","Local Traffic","Security Events"],"a":0,"rat":"System Events (part of the Event category) record device-level activity such as configuration changes. Forward and Local Traffic logs record sessions, and Security Events record UTM inspection results, so none of those track configuration changes.","src":"Original practice item","diff":"easy"},{"n":103,"ln":7,"lesson":4,"section":"Viewing Logs in the GUI","topic":"Viewing logs in the GUI","q":"After logging in to the FortiGate web interface, which left-menu item do you open to reach the log pages?","opts":["Log & Report on the left menu","Security Profiles on the left menu","Dashboard > Status","System > Log Settings"],"a":0,"rat":"The Log & Report menu is the entry point for logs; expanding it reveals Forward Traffic, Local Traffic, Sniffer Traffic, System Events, Security Events, Reports, and Log Settings. The other menu items exist but are not where the log pages live.","src":"Original practice item","diff":"medium"},{"n":104,"ln":8,"lesson":4,"section":"Viewing Logs in the GUI","topic":"Local Traffic log page","q":"The Local Traffic page displays management traffic and traffic that originates from the FortiGate itself. Which of the following is specifically included on that page?","opts":["Web-browsing sessions forwarded on behalf of internal users","FortiGuard and NTP updates and communication with FortiManager and FortiAnalyzer","Antivirus detections and web-filter block actions","Packets captured on a one-arm sniffer interface"],"a":1,"rat":"Local Traffic logs cover sessions to and from the FortiGate itself, such as FortiGuard and NTP updates and its communication with FortiManager and FortiAnalyzer. User web browsing appears in Forward Traffic, block actions in Security logs, and captured packets in Sniffer Traffic.","src":"Original practice item","diff":"hard"},{"n":105,"ln":9,"lesson":4,"section":"Viewing Logs in the GUI","topic":"System Events page views","q":"The FortiGate System Events page organizes system operation events into which two views?","opts":["Summary and Details","Table and Chart","Events and Alerts","Summary and Logs"],"a":3,"rat":"System Events are presented in a Summary view and a Logs view. Details, Table/Chart, and Events/Alerts are not the names of the two tabs on this page.","src":"Original practice item","diff":"easy"},{"n":106,"ln":10,"lesson":4,"section":"Viewing Logs in the GUI","topic":"System Events Summary tab","q":"On the Summary tab of the System Events page, what does the line chart present, and what do the panes (footers) beneath it show?","opts":["The chart aggregates events by severity level, and each footer shows the five most frequent events for a particular log subtype","The chart aggregates events by source interface, and each footer lists the five newest events overall","The chart aggregates events by destination IP, and each footer lists the top five administrators","The chart aggregates events by log ID, and each footer lists the five largest log files"],"a":0,"rat":"The Summary tab shows a line chart of events aggregated by severity level, with footer panes that each cover one log subtype and list its five most common events. The other options misrepresent both the chart's grouping and the contents of the footers.","src":"Original practice item","diff":"medium"},{"n":107,"ln":11,"lesson":4,"section":"Viewing Logs in the GUI","topic":"Security Events page","q":"On the Summary tab of the Security Events page, which three details are shown for each enabled security log subtype?","opts":["The source interface, the severity level, and where the log is stored","The category, the action taken, and the number of instances FortiGate detected","The policy ID, the bytes transferred, and the session duration","The user name, the VDOM, and the destination country"],"a":1,"rat":"For each enabled security log subtype, the Summary tab displays the category, the action taken, and the count of instances detected, along with footers of the most common events. The other option sets describe fields that are not summarized here.","src":"Original practice item","diff":"medium"},{"n":108,"ln":12,"lesson":4,"section":"Viewing Logs in the GUI","topic":"Log & Report views / Local Traffic","q":"Which Log & Report view shows traffic that terminates on or originates from the FortiGate itself, such as its management traffic?","opts":["Forward Traffic","Local Traffic","Sniffer Traffic","Security Events"],"a":1,"rat":"The Local Traffic view lists sessions that begin or end on the FortiGate, including management traffic. Forward Traffic instead logs sessions passing through the FortiGate between other hosts.","src":"Original practice item","diff":"medium"},{"n":109,"ln":13,"lesson":4,"section":"Viewing Logs in the GUI","topic":"Security Events log details","q":"An analyst expands a Security Events log entry in the FortiGate GUI to inspect a critical detection. Which external destination does the expanded Log Details pane provide a hyperlink to?","opts":["The FortiGuard encyclopedia page for the detected threat","The FortiCloud subscription and billing dashboard","The FortiAnalyzer stored report archive","The Fortinet TAC support ticket submission form"],"a":0,"rat":"When you open the Log Details of a security event, FortiGate offers a link out to the relevant FortiGuard threat page so you can research the detection. The link is for threat intelligence lookup, not for billing, report archives, or opening support cases.","src":"Original practice item","diff":"medium"},{"n":110,"ln":14,"lesson":4,"section":"Filtering Logs","topic":"Filtering logs by column","q":"While reviewing traffic logs in the FortiGate GUI, an operator right-clicks a value inside one of the table columns. What menu appears, and what two choices does it present for that value?","opts":["A 'Sort by <column name>' menu with Ascending and Descending","An 'Export <column name>' menu with CSV and PDF","A 'Filter by <column name>' menu with Contains and Does not contain","A 'Group by <column name>' menu with Merge and Split"],"a":2,"rat":"Right-clicking a cell value opens a 'Filter by <column name>' context menu whose two options are Contains and Does not contain, letting you quickly include or exclude that value. Sorting, exporting, and grouping are separate actions and are not the choices offered by this right-click menu.","src":"Original practice item","diff":"medium"},{"n":111,"ln":15,"lesson":4,"section":"Filtering Logs","topic":"Filtering logs","q":"An administrator applies a filter in the FortiGate log view to narrow down the entries on screen. What happens to the log records that do not match the applied filter?","opts":["They are permanently erased from the log database","They are automatically pushed to FortiAnalyzer for archiving","They are relocated to memory storage until the filter is removed","Nothing is removed; the filter only changes which records are shown"],"a":3,"rat":"Filtering is purely a display control: it hides non-matching entries from view but does not delete or move any stored logs. Clearing the filter brings the full set back, so no records are erased, archived, or relocated by filtering.","src":"Original practice item","diff":"easy"},{"n":112,"ln":16,"lesson":4,"section":"Filtering Logs","topic":"Log filtering in the GUI","q":"Which statement correctly describes how log filtering works in the FortiGate GUI?","opts":["Filtering is offered only in the Forward Traffic log view","Only the Date/Time column may be used as a filter","Filters can be applied exclusively by editing the CLI configuration","The same filtering approach applies across every log category, and a filter can be built on any column"],"a":3,"rat":"The identical filtering techniques are available in all log categories, and you can add a filter based on any displayed column (for example Application Name or Policy ID). Filtering is therefore not restricted to one view, a single column, or CLI-only configuration.","src":"Original practice item","diff":"medium"},{"n":113,"ln":17,"lesson":4,"section":"Configuring Logging and Storage","topic":"Log storage options","q":"An administrator wants to store logs on the FortiGate's local disk. In the FortiGate GUI, which navigation path is used to configure local disk logging?","opts":["Log & Report > Log Settings > Local Logs","System > Settings > Logging","Log & Report > Forward Traffic","Security Fabric > Logging > Local Disk"],"a":0,"rat":"Local disk logging is enabled under Log & Report > Log Settings, in the Local Logs section. This simple option suits small deployments and lab use; the other paths either do not exist or point to log viewing rather than storage configuration.","src":"Original practice item","diff":"medium"},{"n":114,"ln":18,"lesson":4,"section":"Configuring Logging and Storage","topic":"Global logging settings","q":"In the global logging settings, the Local traffic logging feature controls logging for a specific category of traffic. Which traffic does it cover?","opts":["Forwarded traffic that passes between two hosts through the FortiGate","Traffic originating from or destined to the FortiGate itself (local-in and local-out)","Only traffic carried inside encrypted VPN tunnels","Packets captured by a one-arm sniffer interface"],"a":1,"rat":"Local traffic logging handles local-in and local-out traffic, meaning sessions that terminate on or originate from the FortiGate itself, which is useful for auditing management access and spotting attacks against the device. Traffic passing between two hosts is forwarded traffic, logged separately in firewall policies.","src":"Original practice item","diff":"medium"},{"n":115,"ln":19,"lesson":4,"section":"Configuring Logging and Storage","topic":"Firewall policy logging","q":"When logging is configured within firewall policies, which of the following types of traffic is NOT logged by default?","opts":["Traffic accepted by a policy that has Log Allowed Traffic enabled","Local-in traffic terminating on the FortiGate","Traffic dropped by the Implicit Deny policy","Traffic scanned by an applied AntiVirus profile"],"a":2,"rat":"Traffic denied by the Implicit Deny policy is not logged unless you explicitly turn that logging on, so it is off by default. Allowed traffic is captured through the Log Allowed Traffic option on a policy (Security Events or All Sessions), which is a deliberate configuration choice.","src":"Original practice item","diff":"medium"},{"n":116,"ln":20,"lesson":4,"section":"Configuring Logging and Storage","topic":"Configuring log settings","q":"Which statement accurately describes FortiGate's default logging behavior out of the box?","opts":["Every log type is enabled by default and needs no configuration","Only security/UTM logs are turned on by default","Logging is on by default but held in memory until a disk is added","Logging is not enabled by default for all log types, so it must be configured"],"a":3,"rat":"FortiGate does not enable every log type automatically, so the administrator must configure what to log, where it is stored, and (for traffic logs) which policies generate them. It is therefore incorrect to assume all logging works with no setup.","src":"Original practice item","diff":"easy"},{"n":117,"ln":21,"lesson":4,"section":"Configuring Logging and Storage","topic":"Enabling logging on a firewall policy","q":"An administrator needs a firewall policy to produce log entries for the sessions it permits. What must be done to the policy to achieve this?","opts":["Change the policy action to Deny","Turn on Sniffer mode on the ingress interface","Edit the policy and enable Log Allowed Traffic","Switch the policy's inspection mode to flow-based"],"a":2,"rat":"Logging of permitted sessions is controlled by the Log Allowed Traffic setting inside the firewall policy, so you edit the policy and enable it (choosing Security Events or All Sessions). Setting the action to Deny or changing inspection mode does not turn on logging of accepted traffic.","src":"Original practice item","diff":"medium"},{"n":118,"ln":1,"lesson":5,"section":"Authentication Concepts and Methods","topic":"Authentication methods (local vs remote)","q":"FortiGate firewall authentication is grouped into two broad password-based method types. What are those two types?","opts":["Local password authentication and remote password authentication","Certificate-based authentication and token-based authentication","Single sign-on authentication and two-factor authentication","Active authentication and passive authentication"],"a":0,"rat":"The two categories of firewall authentication are local password authentication (credentials stored on the FortiGate) and remote password authentication (credentials verified by an external server). The other pairs describe related FortiGate features but are not the two method categories.","src":"Original practice item","diff":"easy"},{"n":119,"ln":2,"lesson":5,"section":"Authentication Concepts and Methods","topic":"Purpose of firewall authentication","q":"Consider a workstation at 10.20.5.42 whose user, Priya, must sign in before browsing. What core capability does firewall authentication give the FortiGate?","opts":["It encrypts every packet exchanged between the workstation and the FortiGate","It identifies the real user behind an IP address rather than treating the session as anonymous","It hands out IP addresses to internal hosts through DHCP","It automatically blocks all traffic sourced from unknown IP addresses"],"a":1,"rat":"Firewall authentication ties a session to a known identity, so the FortiGate can enforce policy on the actual user (Priya) instead of an anonymous IP address. It is an identity mechanism, not an encryption service, an address-assignment service, or a blanket IP block.","src":"Original practice item","diff":"medium"},{"n":120,"ln":3,"lesson":5,"section":"Authentication Concepts and Methods","topic":"Local vs remote authentication selection","q":"A small office runs a single FortiGate and has no external authentication server. Which firewall authentication type best fits this deployment?","opts":["Remote authentication","Two-factor authentication","Local authentication","Fortinet Single Sign-On (FSSO)"],"a":2,"rat":"With one FortiGate and no external server, local authentication is the right choice because user credentials are stored directly on the FortiGate. Remote authentication and FSSO both depend on an external server, which this site does not have.","src":"Original practice item","diff":"medium"},{"n":121,"ln":4,"lesson":5,"section":"Authentication Concepts and Methods","topic":"Local vs remote authentication selection","q":"An organization operates several FortiGate devices across multiple sites and has deployed a FortiAuthenticator. Which firewall authentication type best fits this environment?","opts":["Local authentication","Guest authentication","Exempt authentication","Remote authentication"],"a":3,"rat":"Remote authentication is ideal here because a central FortiAuthenticator lets all the FortiGates validate users against one shared external database. Local authentication would force duplicate user accounts on each device, which does not scale across multiple sites.","src":"Original practice item","diff":"medium"},{"n":122,"ln":5,"lesson":5,"section":"Configuring Local Authentication","topic":"Configuring local authentication","q":"In the ordered workflow for setting up local authentication on a FortiGate, what is the first task?","opts":["Create a user account","Configure a remote authentication server","Build a firewall policy that requires authentication","Enable two-factor authentication"],"a":0,"rat":"Local authentication begins by creating a user account so the credentials are stored on the FortiGate itself. Configuring a remote server belongs to remote authentication, while the firewall policy and any two-factor setup come later in the sequence.","src":"Original practice item","diff":"medium"},{"n":123,"ln":6,"lesson":5,"section":"Configuring Local Authentication","topic":"Users/Groups Creation Wizard GUI path","q":"Which FortiGate GUI menu path launches the wizard used to create a new local firewall user account?","opts":["User & Authentication > User Groups","User & Authentication > User Definition","User & Authentication > LDAP Servers","Policy & Objects > Firewall Policy"],"a":1,"rat":"New local users are created under User & Authentication > User Definition, which opens the creation wizard (user type, credentials, contact, and extra info steps). User Groups builds groups, LDAP Servers defines a remote server, and Firewall Policy is unrelated to creating users.","src":"Original practice item","diff":"easy"},{"n":124,"ln":7,"lesson":5,"section":"Configuring Local Authentication","topic":"User group types / guest accounts","q":"An administrator is creating a user group that will manage temporary guest accounts. In the Create User Group form, which value must be selected in the Type field to enable guest-specific settings?","opts":["Firewall","Fortinet Single Sign-On (FSSO)","Guest","RADIUS Single Sign-On"],"a":2,"rat":"Choosing Guest as the group Type reveals the guest-specific options such as guest details and expiration. Firewall, FSSO, and RADIUS Single Sign-On are the other valid group types but none of them exposes the guest account settings.","src":"Original practice item","diff":"medium"},{"n":125,"ln":8,"lesson":5,"section":"Configuring Local Authentication","topic":"Guest account expiration settings","q":"When configuring a guest user group, the Expiration section's Start Countdown option offers two settings for when the account timer begins. In the example, which setting is chosen so the countdown starts only once the guest actually connects?","opts":["On Account Creation","On Password Reset","On Group Assignment","After First Login"],"a":3,"rat":"Selecting After First Login delays the expiration countdown until the guest's initial successful login, which is useful when accounts are created in advance. The only other real choice is On Account Creation; On Password Reset and On Group Assignment are not offered.","src":"Original practice item","diff":"hard"},{"n":126,"ln":9,"lesson":5,"section":"Configuring Local Authentication","topic":"User group Type options","q":"When creating a new user group under User & Authentication > User Groups, which of the following is NOT a valid group Type option in the dropdown?","opts":["TACACS+ Single Sign-On","Firewall","Fortinet Single Sign-On (FSSO)","RADIUS Single Sign-On (RSSO)"],"a":0,"rat":"The user group Type dropdown offers exactly Firewall, Fortinet Single Sign-On (FSSO), RADIUS Single Sign-On (RSSO), and Guest. There is no TACACS+ Single Sign-On type, even though TACACS+ is supported elsewhere as a remote authentication server.","src":"Original practice item","diff":"medium"},{"n":127,"ln":10,"lesson":5,"section":"Configuring Remote Authentication","topic":"Configure Remote Authentication task list","q":"In the four-step workflow for configuring remote authentication on a FortiGate, what is the final task?","opts":["Create the firewall policy","Verify the configuration and monitor users","Define the LDAP server","Add the user to a group"],"a":1,"rat":"The closing step of the remote authentication workflow is to verify the configuration and monitor the authenticated users, confirming everything works end to end. Defining the server and adding users to groups are earlier setup tasks.","src":"Original practice item","diff":"medium"},{"n":128,"ln":11,"lesson":5,"section":"Configuring Remote Authentication","topic":"LDAP server default port","q":"An administrator adds a new LDAP server object on the FortiGate for remote authentication. What value is pre-populated by default in the Server Port field?","opts":["636","1812","389","3268"],"a":2,"rat":"The default LDAP Server Port on FortiGate is 389, the standard cleartext LDAP port. Port 636 is LDAPS, 1812 is RADIUS authentication, and 3268 is the Active Directory Global Catalog, none of which is the LDAP default.","src":"Original practice item","diff":"medium"},{"n":129,"ln":12,"lesson":5,"section":"Configuring Remote Authentication","topic":"LDAP Bind Type behavior","q":"While editing an LDAP server object, an administrator changes the Bind Type from Simple to Regular. Which additional fields appear and must be filled in as a result?","opts":["Common Name Identifier and Distinguished Name","Server IP/Name and Server Port","Secure Connection and Exchange server","Username and Password"],"a":3,"rat":"Regular bind requires the FortiGate to authenticate to the LDAP directory first, so selecting it exposes Username and Password fields for the bind account. The Server IP/Port and Common Name Identifier fields are present regardless of Bind Type.","src":"Original practice item","diff":"hard"},{"n":130,"ln":13,"lesson":5,"section":"Firewall Policy Authentication and Lab","topic":"Lab simulation task order","q":"In the firewall authentication lab task list (create a user account, configure remote authentication, create a user group, then verify and monitor), which task is fourth?","opts":["Add authentication to the firewall policy","Create a user account","Configure remote authentication","Verify and monitor firewall authentication"],"a":0,"rat":"After creating the user account, configuring remote authentication, and creating the user group, the fourth task is to add authentication to the firewall policy by referencing the group. Verifying and monitoring is the fifth and final task.","src":"Original practice item","diff":"easy"},{"n":131,"ln":14,"lesson":5,"section":"Firewall Policy Authentication and Lab","topic":"Users/groups as firewall policy source","q":"An 'Internet Access' policy already uses 'Internal Network' as its source address. To also require that only members of the authenticated 'sales' group are allowed, which policy field must the group be added to?","opts":["Destination","User/group","Service","Outgoing interface"],"a":1,"rat":"A user group is added to the policy's User/group field, alongside the source address, which forces users to authenticate as members of that group before the policy applies. Destination, Service, and Outgoing interface do not enforce user identity.","src":"Original practice item","diff":"medium"},{"n":132,"ln":15,"lesson":5,"section":"Firewall Policy Authentication and Lab","topic":"Triggering the authentication login prompt","q":"After a policy is set to require authentication, how does the user cause the FortiGate firewall-authentication login prompt to appear?","opts":["By signing in to the FortiGate management GUI as admin","By opening an SSH session to the FortiGate","By opening a web browser and trying to reach an external site such as https://www.example.com","By pinging the network's default gateway"],"a":2,"rat":"The prompt is triggered when the user opens a browser and attempts to reach a website through the authenticating policy, at which point FortiGate intercepts the HTTP/HTTPS request and presents the login page. Logging in to the GUI, using SSH, or pinging the gateway does not invoke firewall authentication.","src":"Original practice item","diff":"medium"},{"n":133,"ln":1,"lesson":6,"section":"Security Fabric, FortiCloud & FortiCare","topic":"Fabric & Cloud","q":"Why does FortiCare matter to a network administrator managing Fortinet devices?","opts":["It lets administrators design secure network topologies.","It removes the need for security appliances because FortiGuard handles everything.","It guarantees privacy by automatically encrypting all network traffic.","It delivers technical support, firmware updates, and device management tools."],"a":3,"rat":"FortiCare is Fortinet's support and lifecycle service, giving administrators access to technical support, firmware updates, and device management tooling. It is not a design tool, a replacement for security devices, or a traffic-encryption feature.","src":"Original practice item","diff":"easy"},{"n":134,"ln":2,"lesson":6,"section":"Security Fabric, FortiCloud & FortiCare","topic":"Fabric & Cloud","q":"An administrator wants to raise the Security Rating score reported by the Fortinet Security Fabric. Which action improves that score?","opts":["Run an integrity check on every end device.","Create a configuration revision or back up the configuration.","Upgrade the FortiGate to the newest mature firmware release.","Implement one or more of the recommended best practices."],"a":3,"rat":"The Security Rating audits the fabric against Fortinet best practices and lists recommendations; applying those recommended best practices is what raises the score. Backing up the config or upgrading firmware are good hygiene but are not how the rating itself is improved.","src":"Original practice item","diff":"medium"},{"n":135,"ln":3,"lesson":6,"section":"Security Fabric, FortiCloud & FortiCare","topic":"Fabric & Cloud","q":"Which three of the following are services or features of the FortiCloud management portal? (Choose three.)","opts":["Identity and access management (IAM)","Organization management","Asset management","FortiGuard threat intelligence","Network traffic filtering"],"a":0,"rat":"The FortiCloud portal provides identity and access management (IAM), organization management, and asset management for administering accounts and devices. FortiGuard threat intelligence and network traffic filtering are FortiGate/FortiGuard functions rather than FortiCloud portal features.","src":"Original practice item","diff":"hard","multi":true,"correct":[0,1,2]},{"n":136,"ln":4,"lesson":6,"section":"Security Fabric, FortiCloud & FortiCare","topic":"Fabric & Cloud","q":"A network administrator at Meridian Retail wants a single portal to oversee all of the company's Fortinet products, user accounts, and subscription services. What is the main advantage FortiCloud offers in this role?","opts":["It removes the requirement to write any security policies because a managed policy service does it for you.","It swaps out on-premises Fortinet appliances entirely for cloud-only equivalents.","It gives you one centralized place to manage devices, users, and services.","It auto-tunes each FortiGate's security features without any administrator input."],"a":2,"rat":"FortiCloud's core value is a single, centralized console for managing Fortinet devices, users, and subscriptions. It does not eliminate the need for policies or replace hardware, and it does not silently self-configure every device.","src":"Original practice item","diff":"medium"},{"n":137,"ln":5,"lesson":6,"section":"Security Fabric, FortiCloud & FortiCare","topic":"Fabric & Cloud","q":"When you build out the Fortinet Security Fabric, which two destinations can serve as the centralized logging backend? (Choose two.)","opts":["FortiAnalyzer","FortiGate Cloud","A generic third-party syslog server","FortiSOAR"],"a":0,"rat":"The Security Fabric relies on either FortiAnalyzer or FortiGate Cloud as its centralized logging repository. A plain syslog server is not a Fabric logging backend, and FortiSOAR handles orchestration and response rather than log storage.","src":"Original practice item","diff":"medium","multi":true,"correct":[0,1]},{"n":138,"ln":6,"lesson":6,"section":"Security Fabric, FortiCloud & FortiCare","topic":"Fabric & Cloud","q":"In the Fortinet ecosystem, what is FortiCare mainly responsible for?","opts":["Delivering technical support, firmware updates, and device lifecycle services such as registration and RMA.","Building and pushing firewall rules to Fortinet appliances.","Watching and shaping network traffic to improve throughput.","Scanning the network to flag hosts and applications that are missing patches."],"a":0,"rat":"FortiCare is Fortinet's support and lifecycle service, covering technical support, updates, registration, and RMA. It does not author firewall policy, shape traffic, or perform vulnerability scanning.","src":"Original practice item","diff":"easy"},{"n":139,"ln":7,"lesson":6,"section":"Security Fabric, FortiCloud & FortiCare","topic":"Fabric & Cloud","q":"Within the Fortinet Security Fabric, what does the Security Rating measure and how is the score produced?","opts":["A gauge of the current throughput and latency of the network.","A numeric score generated by auditing device configurations against Fortinet best practices.","A measure of how well the Fabric interoperates with non-Fortinet equipment.","A figure derived from counting how many security log entries have been recorded."],"a":1,"rat":"The Security Rating runs configuration checks against Fortinet's recommended best practices and returns a numeric score. It is not a performance metric, a compatibility index, or a tally of log volume.","src":"Original practice item","diff":"medium"},{"n":140,"ln":8,"lesson":6,"section":"Security Fabric, FortiCloud & FortiCare","topic":"Fabric & Cloud","q":"Which statement most accurately characterizes FortiCloud?","opts":["A web utility whose only function is editing firewall rules on a FortiGate.","A paid feed that supplies threat intelligence signature updates.","A cloud offering that pushes policies, watches the network, and administers devices.","A cloud-based platform for managing Fortinet devices and services."],"a":3,"rat":"FortiCloud is best defined broadly as the cloud platform for managing Fortinet devices and services. The narrower descriptions each capture only a fragment of what it does or describe a different offering.","src":"Original practice item","diff":"hard"},{"n":141,"ln":9,"lesson":6,"section":"Security Fabric, FortiCloud & FortiCare","topic":"Fabric & Cloud","q":"A developer wants a cloud model where they write and run their own application code and own the data, but never have to patch the operating system, runtime, or underlying servers. Which cloud service model fits this?","opts":["IaaS","SECaaS","SaaS","PaaS"],"a":3,"rat":"In PaaS the provider maintains the infrastructure, OS, and runtime while the customer is responsible only for their applications and data. With IaaS the customer would also manage the OS, and with SaaS the vendor manages the application too.","src":"Original practice item","diff":"medium"},{"n":142,"ln":10,"lesson":6,"section":"Security Fabric, FortiCloud & FortiCare","topic":"Fabric & Cloud","q":"When deploying FortiGate into a public cloud environment, what is the recommended way to position it relative to the provider's own security features?","opts":["Rip out every native cloud security control and rely solely on FortiGate.","Run FortiGate together with the cloud provider's native security tools.","Limit FortiGate to load-balancing duties for cloud workloads.","Restrict FortiGate to private-cloud deployments only."],"a":1,"rat":"The guidance is for FortiGate to complement, not replace, the cloud provider's native security controls, giving layered defense. Removing native controls, restricting FortiGate to load balancing, or barring it from public clouds are all incorrect.","src":"Original practice item","diff":"medium"},{"n":143,"ln":11,"lesson":6,"section":"Security Fabric, FortiCloud & FortiCare","topic":"Fabric & Cloud","q":"Which of the following is a genuine use of Security Fabric automation stitches?","opts":["Tracking how much disk space FortiAnalyzer is consuming","Producing scheduled weekly summary reports for managers","Handing out security ratings to freshly onboarded devices","Automatically isolating an endpoint after malicious behavior is detected"],"a":3,"rat":"An automation stitch pairs a trigger with an action, such as quarantining a host once malicious activity is flagged. The other choices describe monitoring, reporting, or rating tasks rather than trigger-driven automated response.","src":"Original practice item","diff":"easy"},{"n":144,"ln":12,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"Which two goals can an attacker pursue by deploying malware against an organization? (Choose two.)","opts":["Force a high availability (HA) cluster to fail over","Physically burn out the device's network ports","Demand a ransom payment","Exfiltrate proprietary intellectual property"],"a":2,"rat":"Malware such as ransomware is commonly used to extort payment and to steal intellectual property. It cannot physically destroy hardware ports, and triggering an HA failover is not a malware objective.","src":"Original practice item","diff":"easy","multi":true,"correct":[2,3]},{"n":145,"ln":13,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"For the intrusion prevention system (IPS) engine to catch attacks hidden inside HTTPS sessions, why must SSL inspection be enabled?","opts":["By default the IPS engine can only read traffic that uses outdated cipher suites.","SSL inspection speeds up the network by letting encrypted flows skip inspection.","SSL inspection decrypts the session so the IPS can examine the payload for threats.","If SSL inspection is off, the IPS drops all encrypted traffic automatically."],"a":2,"rat":"IPS can only match signatures against data it can read, so SSL inspection must decrypt the traffic first to expose threats inside encrypted sessions. IPS does not automatically block encrypted traffic, and SSL inspection does not bypass or accelerate flows.","src":"Original practice item","diff":"medium"},{"n":146,"ln":14,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"What role does the FortiGuard Labs signature database play for a FortiGate?","opts":["It lets the FortiGate record traffic volumes and usage trends.","It supplies pre-built secure configuration templates to the FortiGate.","It keeps the FortiGate defended against the newest malware and threat variants.","It scans the FortiGate itself and repairs software vulnerabilities."],"a":2,"rat":"FortiGuard Labs continuously publishes signatures so the FortiGate stays protected against emerging malware and threats. The database is not a usage tracker, a template library, or a self-patching tool.","src":"Original practice item","diff":"easy"},{"n":147,"ln":15,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"By what method does the FortiGate IPS engine use signatures to spot malicious traffic?","opts":["It drops every packet that crosses the firewall.","It compares inspected packets against a database of known-threat signatures.","It tracks which websites individual users visit.","It decrypts SSL/TLS traffic on its own."],"a":1,"rat":"The IPS engine inspects packets and matches them against a signature database of known threats to identify malicious activity. It does not block all traffic, monitor browsing habits, or perform decryption by itself (that requires an SSL inspection profile).","src":"Original practice item","diff":"easy"},{"n":148,"ln":16,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"Which class of capability does FortiGuard Labs contribute to the FortiGuard Security Services portfolio?","opts":["Network segmentation and access control","Advanced threat intelligence and prevention","Data encryption and secure communications","Endpoint protection and vulnerability management"],"a":1,"rat":"FortiGuard Labs is the research arm that delivers advanced threat intelligence and prevention, powering real-time protection across Fortinet products. Segmentation, encryption, and endpoint management are handled by other components, not FortiGuard Labs.","src":"Original practice item","diff":"easy"},{"n":149,"ln":17,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"FortiGuard Labs organizes its offerings into three principal categories. Which option lists them correctly?","opts":["Threat hunting, intrusion detection, and firewall management","Data encryption, network segmentation, and access control","Machine learning, antivirus, and network monitoring","Trusted AI/machine learning, real-time threat protection, and threat hunting with outbreak alerts"],"a":3,"rat":"FortiGuard Labs groups its work into trusted AI/machine learning, real-time threat protection, and threat hunting with outbreak alerting. The other lists mix in unrelated firewall, encryption, or segmentation functions.","src":"Original practice item","diff":"medium"},{"n":150,"ln":18,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"In an Application Control profile, which set of actions can you assign to an application or application category?","opts":["Authenticate, log, encrypt, or back up","Allow, encrypt, compress, or redirect","Monitor, allow, block, or quarantine","Monitor, optimize, redirect, or shape"],"a":2,"rat":"Application Control lets you set an application or category to Monitor, Allow, Block, or Quarantine. The other option sets list actions that Application Control does not provide.","src":"Original practice item","diff":"easy"},{"n":151,"ln":19,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"Which scanning method identifies already-known malware by matching content against signatures in the FortiGuard Labs database?","opts":["Grayware scan","Behavioral analysis scan","Machine learning (ML)/artificial intelligence (AI) scan","Antivirus scan"],"a":3,"rat":"The antivirus (signature) scan compares files against known-malware signatures from FortiGuard. Grayware detection targets unwanted programs, and behavioral or ML/AI methods look for unknown threats rather than exact signature matches.","src":"Original practice item","diff":"easy"},{"n":152,"ln":20,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"In the FortiGate log viewer, under which log category do antivirus detection entries appear?","opts":["Sniffer Traffic","Security Events","System Events","Forward Traffic"],"a":1,"rat":"Antivirus and other UTM/security-profile detections are logged under Security Events. System Events cover device-level activity, while Forward Traffic and Sniffer Traffic are traffic logs, not security detections.","src":"Original practice item","diff":"easy"},{"n":153,"ln":21,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"To turn on antivirus scanning for traffic matched by a firewall policy, which antivirus object do you attach to that policy?","opts":["Antivirus schedule","Antivirus engine version","Antivirus exclusion list","Antivirus profile"],"a":3,"rat":"You enable scanning by selecting an Antivirus profile on the firewall policy. There is no scheduling, engine-version, or exclusion-list object that you attach to a policy to enable AV.","src":"Original practice item","diff":"easy"},{"n":154,"ln":22,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"A FortiGate has one interface operating as a one-arm intrusion detection (IDS) sniffer. Under which log category will its detections show up?","opts":["Forward Traffic","System Events","Sniffer Traffic","Local Traffic"],"a":2,"rat":"A one-arm sniffer / IDS interface records its findings under Sniffer Traffic. Forward and Local Traffic apply to traffic passing through or destined to the FortiGate, and System Events cover device operations.","src":"Original practice item","diff":"medium"},{"n":155,"ln":23,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"Users on the internal network are streaming YouTube, and you want to review the log entries generated for that activity. Where in the GUI do you look?","opts":["Log and Report > Security Events > Application Control","Log and Report > Security Events > Intrusion Prevention","Log and Report > Security Events > Antivirus","Log and Report > Security Events > Web Filter"],"a":0,"rat":"YouTube is recognized by Application Control as an application, so its activity is logged under Security Events > Application Control. Intrusion Prevention, Antivirus, and Web Filter logs record different inspection types.","src":"Original practice item","diff":"medium"},{"n":156,"ln":24,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"Why does the intrusion prevention system (IPS) require SSL inspection to catch threats carried inside encrypted traffic?","opts":["SSL inspection decrypts the traffic so the IPS can inspect the payload and detect threats.","SSL inspection boosts performance by letting encrypted traffic skip inspection.","Without SSL inspection the IPS drops all encrypted traffic by default.","The IPS engine can only parse legacy encryption algorithms out of the box."],"a":0,"rat":"SSL inspection decrypts the session so its contents become visible to the IPS engine, which can then match signatures against the payload. The IPS does not block encrypted traffic outright, and inspection does not bypass or accelerate flows.","src":"Original practice item","diff":"medium"},{"n":157,"ln":25,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"Setting aside the optional sensor-tuning work, what is the final step when configuring IPS on a FortiGate so that it actually inspects traffic?","opts":["Blocking malicious URLs and botnet command-and-control (C&C) traffic","Editing the sensor's signatures and filters","Applying the IPS sensor to a firewall policy","Enabling SSL inspection on the traffic of interest"],"a":2,"rat":"An IPS sensor only takes effect once it is referenced by a firewall policy, so applying the sensor to a policy is the concluding step. Editing signatures is tuning, and URL/C&C blocking and SSL inspection are separate features.","src":"Original practice item","diff":"medium"},{"n":158,"ln":26,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"How does the FortiGate IPS recognize traffic that violates the expected structure of a protocol standard?","opts":["By running the traffic through protocol decoders","By decrypting the network packets","By inspecting the SSL certificates presented","By profiling individual user behavior"],"a":0,"rat":"IPS protocol decoders parse each session against the rules of its protocol and flag anything that deviates from the standard. Decryption, certificate analysis, and user-behavior profiling are handled by other mechanisms.","src":"Original practice item","diff":"medium"},{"n":159,"ln":27,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"Peer-to-peer applications often hop ports and disguise themselves to slip past filtering. How does FortiGate Application Control counter these evasion tactics?","opts":["By checking requests against a list of blocked URLs","By reviewing flow-based inspection statistics","By permitting traffic only on a fixed set of well-known ports","By inspecting traffic for known application signatures and patterns"],"a":3,"rat":"Application Control identifies an application from its traffic signatures and patterns rather than its port, so it still recognizes P2P apps even when they change ports. URL block lists and fixed-port allowances are exactly the port/URL-based controls that P2P evasion defeats.","src":"Original practice item","diff":"hard"},{"n":160,"ln":28,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"How is grayware best defined?","opts":["Brand-new, previously unseen malware variants","Established malware for which signatures already exist","Unwanted programs installed without the user's genuine consent","Suspicious files forwarded to a sandbox for detonation"],"a":2,"rat":"Grayware describes unsolicited, unwanted software such as adware or toolbars that gets installed without the user's clear consent. It is neither classic signature-based malware nor a sandboxing process.","src":"Original practice item","diff":"easy"},{"n":161,"ln":29,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"In broad terms, how does an intrusion prevention system defend a network against attacks?","opts":["By analyzing traffic to identify and stop potential threats","By encrypting all traffic that originates from untrusted IP addresses","By permitting only secured access methods to reach network resources","By dropping every inbound connection from any previously unseen source"],"a":0,"rat":"An IPS inspects traffic and compares it against threat signatures and anomaly rules to detect and block attacks. It does not encrypt traffic, act as an access-control gateway, or blindly drop all new inbound connections.","src":"Original practice item","diff":"easy"},{"n":162,"ln":30,"lesson":6,"section":"FortiGuard, Threats & IPS","topic":"FortiGuard & IPS","q":"In which network architecture has controlling application traffic become especially important because applications frequently change ports to avoid detection?","opts":["Traditional client-server architecture","Peer-to-peer architecture","Distributed architecture","Cloud-based architecture"],"a":1,"rat":"Peer-to-peer applications like BitTorrent hop between dynamic ports specifically to dodge port-based filtering, making application control especially relevant there. Client-server, distributed, and cloud designs do not rely on that port-evasion behavior in the same way.","src":"Original practice item","diff":"hard"},{"n":163,"ln":31,"lesson":6,"section":"Firewall Policies & Authentication","topic":"Policies & Auth","q":"A workstation at Meridian Freight sends traffic through a FortiGate before any login prompt is presented. Which attribute of that traffic can the FortiGate already identify?","opts":["The name of the application generating the session","The account name of the person at the keyboard","The IP address the packets are coming from","The DNS domain the traffic originated in"],"a":2,"rat":"Before firewall authentication takes place, the FortiGate can see the packet's source IP address but has no way to tie it to a specific user identity — that link only exists once the user authenticates.","src":"Original practice item","diff":"easy"},{"n":164,"ln":32,"lesson":6,"section":"Firewall Policies & Authentication","topic":"Policies & Auth","q":"On a FortiGate protecting the Aurora Labs network, what role do firewall policies serve?","opts":["They decide which traffic is permitted and how it is handled","They apply cryptographic protection to traffic in transit","They passively observe traffic without acting on it","They discard every session arriving from outside the network"],"a":0,"rat":"Firewall policies are the rules that determine whether a session is accepted or denied and which processing is applied to it. Encryption and pure monitoring are separate functions, not the core purpose of a policy.","src":"Original practice item","diff":"easy"},{"n":165,"ln":33,"lesson":6,"section":"Firewall Policies & Authentication","topic":"Policies & Auth","q":"An administrator at Coastal Systems wants FortiGate to identify staff who authenticate against an external RADIUS server. What is the recommended way to build this?","opts":["Add a local user account, reference that account as the policy source, and confirm the result in the logs.","Build a user group and point a firewall policy's source at that group with no further mapping.","Build a user group, associate the authenticated remote users with that group, then use the group as the source of a firewall policy.","Point the firewall policy source at the IP address of the external authentication server."],"a":2,"rat":"For remote authentication you create a user group, map the users returned by the remote server into it, and then reference that group as the policy source. Referencing the server's own IP or a bare group with no membership mapping would not identify individual users.","src":"Original practice item","diff":"hard"},{"n":166,"ln":34,"lesson":6,"section":"Firewall Policies & Authentication","topic":"Policies & Auth","q":"Which pair of values can be evaluated in the Source field of a FortiGate firewall policy?","opts":["Ingress interface and TCP service","IP address and authenticated user","Hardware MAC address and domain name","Address group and device hostname"],"a":1,"rat":"The Source field matches on an address (IP) and, when firewall authentication is used, on a user or user group. Service and interface are configured in their own separate policy fields.","src":"Original practice item","diff":"medium"},{"n":167,"ln":35,"lesson":6,"section":"Firewall Policies & Authentication","topic":"Policies & Auth","q":"A small branch of Larkspur Design wants every employee on the LAN to reach the internet through one policy. Which two things can you set as the Source of that firewall policy? (Choose two.)","opts":["Users or user groups","Application control signatures","Security profile sets","The address object for the LAN subnet"],"a":0,"rat":"A policy Source can be an address object (such as the LAN subnet) and optionally users or user groups. Application signatures and security profiles are inspection settings applied to accepted traffic, not selectable as a Source.","src":"Original practice item","diff":"medium","multi":true,"correct":[0,3]},{"n":168,"ln":36,"lesson":6,"section":"Firewall Policies & Authentication","topic":"Policies & Auth","q":"Why would an administrator define a firewall address object on a FortiGate?","opts":["To designate which interfaces a policy uses for ingress and egress","To set whether a policy accepts or denies traffic","To represent an IP host or subnet so it can be matched as a policy source or destination","To turn on web filtering for a particular host"],"a":2,"rat":"An address object stands in for a host or subnet so that it can be referenced in the Source or Destination of a policy. Interfaces, the accept/deny action, and web filtering are all configured elsewhere.","src":"Original practice item","diff":"medium"},{"n":169,"ln":37,"lesson":6,"section":"Firewall Policies & Authentication","topic":"Policies & Auth","q":"You want a firewall policy on FortiGate to use a well-known cloud application as its destination. How do you specify it?","opts":["Pick the application from the Internet Service Database (ISDB).","Enter the MAC address associated with the application.","Type in the IP subnet the application is hosted on.","Attach a virtual IP that represents the application."],"a":0,"rat":"Internet services are added to a policy's source or destination by selecting the appropriate entry from the FortiGuard-maintained Internet Service Database, which already tracks the relevant address ranges. Manually entering subnets, MACs, or a VIP is not how ISDB destinations work.","src":"Original practice item","diff":"medium"},{"n":170,"ln":38,"lesson":6,"section":"Firewall Policies & Authentication","topic":"Policies & Auth","q":"In which situation is remote authentication a better fit than local authentication on FortiGate?","opts":["When traffic from locally defined accounts should be deprioritized","When several FortiGate devices must authenticate the same users or groups","When there is no authentication server reachable on the network","When the FortiGate model cannot store local user accounts"],"a":1,"rat":"Remote authentication keeps credentials in one central server, so multiple FortiGates can validate the same users and groups without duplicating accounts. It requires a reachable auth server, so the absence of one would rule it out.","src":"Original practice item","diff":"medium"},{"n":171,"ln":39,"lesson":6,"section":"Firewall Policies & Authentication","topic":"Policies & Auth","q":"Why is referencing a user group, rather than individual accounts, considered best practice in firewall policies?","opts":["It makes it easier to watch which users are currently authenticated.","It keeps the firewall configuration simpler to build and maintain.","It applies a stronger encryption algorithm to the login exchange.","It automatically includes every user account that exists on the device."],"a":1,"rat":"Pointing a policy at a group lets you manage access by editing group membership once instead of rewriting policies for each user, which keeps the configuration simpler. Groups do not change encryption strength or automatically enroll all accounts.","src":"Original practice item","diff":"medium"},{"n":172,"ln":40,"lesson":6,"section":"Firewall Policies & Authentication","topic":"Policies & Auth","q":"How would an administrator confirm which users have logged in successfully through FortiGate authentication?","opts":["By watching a live threat-map animation of security events","By subscribing to third-party threat intelligence feeds","By statistically profiling raw traffic patterns","By reading the authentication logs and the related dashboards"],"a":3,"rat":"Successful logins are recorded in the user/authentication logs and surfaced on the FortiGate dashboards, which is where an administrator reviews them. Threat feeds and traffic profiling do not report authentication outcomes.","src":"Original practice item","diff":"medium"},{"n":173,"ln":41,"lesson":6,"section":"Firewall Policies & Authentication","topic":"Policies & Auth","q":"Why does the position of a policy in the FortiGate firewall policy list matter?","opts":["It prevents naming collisions between policies that share the same label","It guarantees that security traffic is logged ahead of ordinary traffic","It ensures narrowly scoped policies are evaluated before broader ones","It lets high-priority traffic be processed with less CPU overhead"],"a":2,"rat":"FortiGate reads the policy table from top to bottom and stops at the first match, so a more specific policy has to sit above a broader one or it will never be reached. Ordering is about match precedence, not logging sequence or CPU load.","src":"Original practice item","diff":"medium"},{"n":174,"ln":42,"lesson":6,"section":"Firewall Policies & Authentication","topic":"Policies & Auth","q":"Once a firewall policy has accepted a session, which two additional inspections can FortiGate apply to it? (Choose two.)","opts":["Antivirus scanning","The accept-or-deny packet decision","Application control","Prompting the user to authenticate"],"a":0,"rat":"After a policy accepts a session, security profiles such as antivirus scanning and application control can inspect it. The accept decision itself and user authentication both happen as part of matching the policy, before that point.","src":"Original practice item","diff":"medium","multi":true,"correct":[0,2]},{"n":175,"ln":43,"lesson":6,"section":"Web Filtering & SSL Inspection","topic":"Web & SSL","q":"When FortiGuard category filtering is in use, on what basis are websites allowed or blocked?","opts":["On the numeric IP address that hosts the site","On a live malware scan performed against the site","On the category FortiGuard has assigned to the site's content","On the values found in the site's HTTP response headers"],"a":2,"rat":"FortiGuard classifies sites into content categories, and the web filter permits or denies access according to the category rating for the requested site. It is not driven by the raw IP address or by inspecting HTTP headers.","src":"Original practice item","diff":"easy"},{"n":176,"ln":44,"lesson":6,"section":"Web Filtering & SSL Inspection","topic":"Web & SSL","q":"With FortiGuard category filtering set to block a category, what does a user experience when they browse to a site in that category?","opts":["The browser shows a replacement message stating the site is blocked.","The browser shows a caution page but lets the user proceed anyway.","The browser asks the user to supply valid credentials to continue.","The site loads normally while the visit is quietly recorded in the logs."],"a":0,"rat":"A category set to the Block action returns a FortiGate replacement (block) page and stops the request. The proceed-anyway behavior belongs to the separate Warning action, not Block.","src":"Original practice item","diff":"medium"},{"n":177,"ln":45,"lesson":6,"section":"Web Filtering & SSL Inspection","topic":"Web & SSL","q":"How does SSL certificate inspection fundamentally differ from SSL deep inspection on FortiGate?","opts":["Certificate inspection creates certificate errors, whereas deep inspection eliminates certificate warnings.","Certificate inspection needs a publicly trusted CA, whereas deep inspection relies on the FortiGate CA certificate.","Certificate inspection covers HTTPS only, whereas deep inspection covers several SSL-encrypted protocols.","Certificate inspection decrypts and reads the payload, whereas deep inspection merely checks the server's identity."],"a":2,"rat":"Certificate inspection only reads the certificate and SNI of HTTPS sessions without decrypting them, while deep inspection actually decrypts and can inspect a range of SSL-encrypted protocols such as HTTPS, SMTPS, and POP3S. The last option reverses which mode decrypts.","src":"Original practice item","diff":"hard"},{"n":178,"ln":46,"lesson":6,"section":"Web Filtering & SSL Inspection","topic":"Web & SSL","q":"Which two actions are part of setting up web filtering based on FortiGuard category filters? (Choose two.)","opts":["Reinstall FortiOS so the newest FortiGuard database is present.","List out each individual website you intend to block or permit.","Attach the web filter security profile to the relevant firewall policy.","Create a web filter security profile that uses FortiGuard category ratings."],"a":2,"rat":"You build a web filter profile that acts on FortiGuard categories and then apply that profile to a firewall policy. Category filtering does not require enumerating individual sites or reinstalling FortiOS to update the database.","src":"Original practice item","diff":"medium","multi":true,"correct":[2,3]},{"n":179,"ln":47,"lesson":6,"section":"Web Filtering & SSL Inspection","topic":"Web & SSL","q":"During SSL deep inspection with the default FortiGate CA certificate, why does a client browser pop up a certificate warning?","opts":["The browser has no support for SSL deep inspection at all.","The re-signed certificate makes FortiGate look like a man-in-the-middle attacker.","The FortiGate is signing sessions with a CA the browser does not trust.","The FortiGate cannot decrypt the SSL-encrypted session."],"a":2,"rat":"Deep inspection re-signs each session with the FortiGate CA, and any browser that does not already trust that CA raises a warning. Importing the FortiGate CA into the browser's trust store clears the warning.","src":"Original practice item","diff":"medium"},{"n":180,"ln":48,"lesson":6,"section":"Web Filtering & SSL Inspection","topic":"Web & SSL","q":"Which FortiGate inspection mode reassembles and evaluates the complete content before deciding what to do with it?","opts":["Application-level inspection","Proxy-based inspection","Stateful inspection","Flow-based inspection"],"a":1,"rat":"Proxy-based inspection buffers the full object and examines it as a whole, giving more thorough analysis at the cost of added latency, whereas flow-based inspection evaluates packets as they stream through.","src":"Original practice item","diff":"medium"},{"n":181,"ln":49,"lesson":6,"section":"Web Filtering & SSL Inspection","topic":"Web & SSL","q":"Why do organizations and individuals deploy web filtering? (Choose two.)","opts":["To keep employees focused and productive","To reduce congestion on the network","To add more raw bandwidth to the link","To make the browsing experience feel faster for everyone"],"a":0,"rat":"Blocking distracting or bandwidth-heavy sites both preserves employee productivity and eases network congestion. Web filtering does not create additional bandwidth on the circuit.","src":"Original practice item","diff":"medium","multi":true,"correct":
