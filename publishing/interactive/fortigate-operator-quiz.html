<html lang="en">
<head>
<meta charset="utf-8">

<title>FortiGate Operator Quiz</title>
<style>
:root{
  --bg:#E9ECEF; --surface:#FFFFFF; --surface-2:#F3F5F7; --surface-3:#EAEEF2;
  --ink:#14181D; --muted:#59636E; --faint:#8A939D; --border:#D8DDE3;
  --accent:#E4002B; --accent-2:#B00722; --miss:#B45309; --miss-tint:#FBEEDD; --miss-border:#E6C48A;
  --ok:#0B8A54; --ok-tint:#E6F4EC; --ok-border:#9BD3B4;
  --bad:#C8102E; --bad-tint:#FBE9EC; --bad-border:#E9A9B4;
  --btn-bg:#14181D; --btn-fg:#FFFFFF; --btn-bg-hover:#000000;
  --focus:#1668E3; --chip:#EDF0F3;
  --shadow:0 1px 2px rgba(20,24,29,.06), 0 8px 24px rgba(20,24,29,.07);

}
:root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
  --bg:#0F1317; --surface:#171C22; --surface-2:#1E252C; --surface-3:#252E37;
  --ink:#E7ECF1; --muted:#93A0AD; --faint:#6B7783; --border:#2A333C;
  --accent:#FF3B4E; --accent-2:#FF6472; --miss:#F0A94B; --miss-tint:#2A2012; --miss-border:#6E5325;
  --ok:#35D08A; --ok-tint:#12251C; --ok-border:#1F6B47;
  --bad:#FF6472; --bad-tint:#2A1519; --bad-border:#7A2733;
  --btn-bg:#EAEEF2; --btn-fg:#14181D; --btn-bg-hover:#FFFFFF;
  --focus:#5AA0FF; --chip:#222A32;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45); --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0F1317; --surface:#171C22; --surface-2:#1E252C; --surface-3:#252E37;
  --ink:#E7ECF1; --muted:#93A0AD; --faint:#6B7783; --border:#2A333C;
  --accent:#FF3B4E; --accent-2:#FF6472; --miss:#F0A94B; --miss-tint:#2A2012; --miss-border:#6E5325;
  --ok:#35D08A; --ok-tint:#12251C; --ok-border:#1F6B47;
  --bad:#FF6472; --bad-tint:#2A1519; --bad-border:#7A2733;
  --btn-bg:#EAEEF2; --btn-fg:#14181D; --btn-bg-hover:#FFFFFF;
  --focus:#5AA0FF; --chip:#222A32;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45); --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif; margin:0; line-height:1.15; text-wrap:balance}
a{color:var(--accent)} button{font-family:inherit}
.bar{position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:2px solid var(--accent); box-shadow:var(--shadow-sm)}
.bar-in{max-width:900px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:14px}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.mark{width:20px; height:20px; border-radius:4px; background:var(--accent); flex:none; box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.brand b{font-family:"Archivo"; font-weight:800; font-size:15px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand span{color:var(--faint); font-size:11px; letter-spacing:.12em; text-transform:uppercase}
.bar-spacer{flex:1}
.readout{font-size:12px; color:var(--muted); display:flex; gap:14px; align-items:center}
.readout b{color:var(--ink); font-weight:600}
.iconbtn{background:transparent; border:1px solid var(--border); color:var(--muted); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:15px; display:grid; place-items:center; transition:.15s}
.iconbtn:hover{color:var(--ink); border-color:var(--faint)}
main{max-width:900px; margin:0 auto; padding:28px 20px 80px}
.eyebrow{font-family:"IBM Plex Mono"; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600}
.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow)}
.hero{padding:40px 34px 34px}
.hero h1{font-size:clamp(28px,4.6vw,42px); font-weight:800; letter-spacing:-.02em; margin-top:14px}
.hero .lede{color:var(--muted); font-size:17px; max-width:62ch; margin:16px 0 0}
.pillrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:22px}
.pill{font-family:"IBM Plex Mono"; font-size:12px; padding:6px 11px; border-radius:999px; background:var(--chip); color:var(--muted); border:1px solid var(--border)}
.pill b{color:var(--ink)} .pill.miss{background:var(--miss-tint); border-color:var(--miss-border); color:var(--miss)}
.lessons{display:grid; grid-template-columns:repeat(auto-fit,minmax(288px,1fr)); gap:16px; margin-top:26px}
.lesson-card{border:1px solid var(--border); border-radius:14px; background:var(--surface-2); padding:20px 20px 22px; display:flex; flex-direction:column}
.lesson-card .lnum{font-family:"IBM Plex Mono"; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:600}
.lesson-card h3{font-size:17px; font-weight:700; margin:7px 0 0; letter-spacing:-.01em}
.lesson-card .lc-count{font-family:"IBM Plex Mono"; font-size:12px; color:var(--muted); margin-top:4px}
.lesson-card .lc-count .m{color:var(--miss)}
.lesson-card ul{margin:14px 0 0; padding:0; list-style:none; display:grid; gap:7px}
.lesson-card li{position:relative; padding-left:20px; font-size:12px; color:var(--muted); line-height:1.4}
.lesson-card li::before{content:""; position:absolute; left:2px; top:7px; width:7px; height:7px; border-radius:2px}
.lesson-card .lc-btn{margin-top:auto; padding-top:18px}
.lesson-card button{width:100%; appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:10px; padding:11px 16px; font-size:14px; font-weight:600; cursor:pointer; transition:.15s}
.lesson-card button:hover{border-color:var(--faint); background:var(--surface-3)}
.toggles{display:flex; flex-wrap:wrap; gap:10px 22px; margin-top:26px; padding-top:22px; border-top:1px solid var(--border)}
.tog{display:flex; align-items:center; gap:9px; font-size:14px; color:var(--muted); cursor:pointer; user-select:none}
.tog input{position:absolute; opacity:0; width:0; height:0}
.sw{width:38px; height:22px; border-radius:999px; background:var(--surface-3); border:1px solid var(--border); position:relative; transition:.18s; flex:none}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.3); transition:.18s}
.tog input:checked + .sw{background:var(--accent); border-color:var(--accent)}
.tog input:checked + .sw::after{transform:translateX(16px)}
.actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:26px}
.btn{appearance:none; border:1px solid transparent; border-radius:10px; padding:12px 22px; font-size:15px; font-weight:600; cursor:pointer; transition:.15s}
.btn-primary{background:var(--btn-bg); color:var(--btn-fg)} .btn-primary:hover{background:var(--btn-bg-hover)}
.btn-miss{background:var(--miss); color:#fff; border-color:var(--miss)} .btn-miss:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--border)} .btn-ghost:hover{border-color:var(--faint); background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px} .btn:disabled{opacity:.45; cursor:default}
.qhead{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:22px 30px 0; flex-wrap:wrap}
.qhead .eyebrow .lt{color:var(--faint)}
.qhead .tags{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.diff{font-family:"IBM Plex Mono"; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:4px 9px; border-radius:6px; font-weight:600; white-space:nowrap; border:1px solid var(--border); color:var(--muted); background:var(--surface-2)}
.diff.easy{color:var(--ok); border-color:var(--ok-border); background:var(--ok-tint)}
.diff.hard{color:var(--accent); border-color:var(--border)}
.mbadge{font-family:"IBM Plex Mono"; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; padding:4px 9px; border-radius:6px; font-weight:600; white-space:nowrap; color:var(--miss); background:var(--miss-tint); border:1px solid var(--miss-border)}
.qtext{padding:14px 30px 2px; font-size:20px; font-weight:600; font-family:"Archivo"; letter-spacing:-.01em; line-height:1.32}
.mhint{padding:4px 30px 0; font-family:"IBM Plex Mono"; font-size:11.5px; color:var(--accent); font-weight:600}
.opts{display:grid; gap:10px; padding:14px 30px 6px}
.opt{display:flex; align-items:flex-start; gap:13px; width:100%; text-align:left; background:var(--surface-2); border:1.5px solid var(--border); border-radius:11px; padding:13px 15px; cursor:pointer; transition:.13s; color:var(--ink); font-size:15.5px; line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--faint); background:var(--surface-3)}
.opt:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.opt .lz{font-family:"IBM Plex Mono"; font-weight:600; font-size:13px; width:24px; height:24px; border-radius:6px; background:var(--surface); border:1px solid var(--border); display:grid; place-items:center; flex:none; color:var(--muted); margin-top:1px; transition:.13s}
.opt.multi .lz{border-radius:5px}
.opt.sel{border-color:var(--ink); background:var(--surface-3)}
.opt.sel .lz{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.opt.correct{border-color:var(--ok-border); background:var(--ok-tint)} .opt.correct .lz{background:var(--ok); color:#fff; border-color:var(--ok)}
.opt.wrong{border-color:var(--bad-border); background:var(--bad-tint)} .opt.wrong .lz{background:var(--bad); color:#fff; border-color:var(--bad)}
.opt:disabled{cursor:default} .opt .otext{flex:1; min-width:0}
.opt .fmark{font-weight:700; font-size:15px; flex:none; margin-top:1px}
.opt.correct .fmark{color:var(--ok)} .opt.wrong .fmark{color:var(--bad)}
.feedback{margin:8px 30px 0; border-radius:12px; padding:0; max-height:0; overflow:hidden; transition:max-height .28s ease, margin .28s ease}
.feedback.show{max-height:520px; margin:16px 30px 0}
.fb-in{padding:16px 18px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2)}
.fb-in.ok{border-color:var(--ok-border); background:var(--ok-tint)} .fb-in.no{border-color:var(--bad-border); background:var(--bad-tint)}
.fb-verdict{font-family:"Archivo"; font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:6px}
.fb-in.ok .fb-verdict{color:var(--ok)} .fb-in.no .fb-verdict{color:var(--bad)}
.fb-rat{font-size:14.5px; color:var(--ink)}
.fb-src{margin-top:10px; font-family:"IBM Plex Mono"; font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.fb-src .tag{border:1px solid var(--border); border-radius:5px; padding:2px 7px; background:var(--surface)}
.qfoot{display:flex; align-items:center; gap:16px; padding:20px 30px 24px; margin-top:8px}
.progress{flex:1; height:7px; border-radius:999px; background:var(--surface-3); overflow:hidden}
.progress > i{display:block; height:100%; width:0; background:var(--accent); border-radius:999px; transition:width .35s ease}
.foot-btns{display:flex; gap:10px} .btn-sm{padding:10px 18px; font-size:14px}
.hint{font-family:"IBM Plex Mono"; font-size:11px; color:var(--faint); text-align:center; margin-top:16px}
.hint kbd{background:var(--surface); border:1px solid var(--border); border-bottom-width:2px; border-radius:5px; padding:1px 6px; font-size:11px; color:var(--muted)}
.score-wrap{padding:38px 34px 30px; text-align:center}
.score-ring{width:150px; height:150px; margin:6px auto 0; position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .pct{position:absolute; inset:0; display:grid; place-items:center}
.score-ring .pct b{font-family:"Archivo"; font-weight:800; font-size:38px; letter-spacing:-.02em; display:block; line-height:1}
.score-ring .pct small{color:var(--muted); font-size:12px; font-family:"IBM Plex Mono"}
.verdict-line{font-family:"Archivo"; font-weight:700; font-size:22px; margin-top:18px}
.score-sub{color:var(--muted); margin-top:6px}
.tally{display:grid; gap:9px; padding:26px 34px; border-top:1px solid var(--border)}
.tally h3, .review h3{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-family:"IBM Plex Mono"; font-weight:600; margin-bottom:4px}
.tally .lesson-head{font-family:"Archivo"; font-weight:700; font-size:14px; color:var(--ink); margin-top:10px}
.trow{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center}
.trow .tn{font-size:13.5px; color:var(--ink)} .trow .tv{font-family:"IBM Plex Mono"; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.tbar{grid-column:1/-1; height:6px; border-radius:999px; background:var(--surface-3); overflow:hidden} .tbar > i{display:block; height:100%; border-radius:999px}
.review{padding:8px 34px 30px}
.miss{border:1px solid var(--border); border-radius:11px; padding:14px 16px; margin-top:12px; background:var(--surface-2)}
.miss .mq{font-weight:600; font-size:14.5px; margin-bottom:9px}
.miss .ml{font-size:13.5px; display:flex; gap:8px; align-items:baseline; margin-top:3px}
.miss .ml .k{font-family:"IBM Plex Mono"; font-size:11px; font-weight:600; padding:1px 6px; border-radius:4px; flex:none}
.miss .k.ok{background:var(--ok-tint); color:var(--ok); border:1px solid var(--ok-border)}
.miss .k.no{background:var(--bad-tint); color:var(--bad); border:1px solid var(--bad-border)}
.miss .msrc{font-family:"IBM Plex Mono"; font-size:11px; color:var(--faint); margin-top:9px}
.end-actions{display:flex; gap:12px; justify-content:center; padding:6px 34px 4px; flex-wrap:wrap}
.filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px}
.fchip{font-family:"IBM Plex Mono"; font-size:12px; padding:7px 13px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; transition:.13s}
.fchip:hover{border-color:var(--faint); color:var(--ink)} .fchip.on{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.fchip.miss.on{background:var(--miss); border-color:var(--miss); color:#fff}
.lesson-banner{display:flex; align-items:baseline; gap:12px; margin:26px 0 14px; padding-bottom:10px; border-bottom:2px solid var(--border)}
.lesson-banner .lb-tag{font-family:"IBM Plex Mono"; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase}
.lesson-banner h2{font-family:"Archivo"; font-size:19px; font-weight:700}
.sgroup{margin-bottom:12px}
.sgroup > summary{cursor:pointer; list-style:none; padding:15px 20px; background:var(--surface); border:1px solid var(--border); border-radius:12px; display:flex; align-items:center; gap:12px; font-family:"Archivo"; font-weight:700; font-size:15px}
.sgroup > summary::-webkit-details-marker{display:none}
.sgroup > summary .cnt{margin-left:auto; font-family:"IBM Plex Mono"; font-size:12px; color:var(--muted); font-weight:400}
.sgroup > summary .caret{color:var(--faint); transition:.2s; font-size:13px}
.sgroup[open] > summary .caret{transform:rotate(90deg)}
.sgroup[open] > summary{border-radius:12px 12px 0 0; border-bottom-color:transparent}
.sbody{border:1px solid var(--border); border-top:none; border-radius:0 0 12px 12px; padding:6px 20px 8px}
.sq{padding:18px 0; border-bottom:1px solid var(--border)} .sq:last-child{border-bottom:none}
.sq .sqq{font-weight:600; font-size:15.5px; display:flex; gap:10px; align-items:baseline}
.sq .sqq .n{font-family:"IBM Plex Mono"; color:var(--accent); font-weight:600; flex:none}
.sq .sqq .mb{font-family:"IBM Plex Mono"; font-size:10px; color:var(--miss); border:1px solid var(--miss-border); background:var(--miss-tint); border-radius:4px; padding:1px 5px; flex:none; align-self:center}
.sopts{display:grid; gap:6px; margin:12px 0 0}
.sopt{display:flex; gap:11px; align-items:flex-start; padding:9px 12px; border-radius:9px; font-size:14.5px; border:1px solid transparent}
.sopt .sl{font-family:"IBM Plex Mono"; font-size:12px; color:var(--muted); flex:none; width:18px}
.sopt.ok{background:var(--ok-tint); border-color:var(--ok-border)} .sopt.ok .sl{color:var(--ok); font-weight:600} .sopt.ok .ck{color:var(--ok); margin-left:auto; font-weight:700}
.srat{margin-top:12px; font-size:14px; color:var(--muted); border-left:2px solid var(--border); padding-left:12px}
.ssrc{margin-top:9px; font-family:"IBM Plex Mono"; font-size:11px; color:var(--faint)}
.foot-note{text-align:center; color:var(--faint); font-size:12px; margin-top:40px; font-family:"IBM Plex Mono"; line-height:1.7}
.lesson-card.l1 .lnum{color:var(--accent)}
.lesson-card.l1 li::before{background:var(--accent)}
.qhead .eyebrow .lt.l1{color:var(--accent)}
.lesson-banner.l1 .lb-tag{color:var(--accent)}
.sq.l1 .sqq .n{color:var(--accent)}
.lesson-card.l2 .lnum{color:#2E7DE9}
.lesson-card.l2 li::before{background:#2E7DE9}
.qhead .eyebrow .lt.l2{color:#2E7DE9}
.lesson-banner.l2 .lb-tag{color:#2E7DE9}
.sq.l2 .sqq .n{color:#2E7DE9}
.lesson-card.l3 .lnum{color:#12A594}
.lesson-card.l3 li::before{background:#12A594}
.qhead .eyebrow .lt.l3{color:#12A594}
.lesson-banner.l3 .lb-tag{color:#12A594}
.sq.l3 .sqq .n{color:#12A594}
.lesson-card.l4 .lnum{color:#D08018}
.lesson-card.l4 li::before{background:#D08018}
.qhead .eyebrow .lt.l4{color:#D08018}
.lesson-banner.l4 .lb-tag{color:#D08018}
.sq.l4 .sqq .n{color:#D08018}
.lesson-card.l5 .lnum{color:#8B5CF6}
.lesson-card.l5 li::before{background:#8B5CF6}
.qhead .eyebrow .lt.l5{color:#8B5CF6}
.lesson-banner.l5 .lb-tag{color:#8B5CF6}
.sq.l5 .sqq .n{color:#8B5CF6}
.lesson-card.l6 .lnum{color:#0EA5E9}
.lesson-card.l6 li::before{background:#0EA5E9}
.qhead .eyebrow .lt.l6{color:#0EA5E9}
.lesson-banner.l6 .lb-tag{color:#0EA5E9}
.sq.l6 .sqq .n{color:#0EA5E9}
@media (max-width:640px){ .hero{padding:30px 22px 26px} .qhead,.qtext,.opts,.qfoot,.feedback.show,.mhint{padding-left:20px; padding-right:20px} .feedback.show{margin-left:20px; margin-right:20px} .score-wrap,.tally,.review,.end-actions{padding-left:22px; padding-right:22px} .brand span{display:none} .readout .rd-sec{display:none} }

<script>
const LESSONS=[{"id": 1, "name": "Access & Management", "short": "Access & Mgmt", "objectives": ["Identify the methods available to manage and access a FortiGate (GUI over HTTPS vs CLI; console cable, SSH, and the built-in CLI console)", "Describe FortiGate as an NGFW and its platform components, model tiers, and advanced features (SD-WAN, VDOMs, automation stitches, Security Fabric, FortiGuard)", "Log in to a FortiGate for the first time and complete the Setup Wizard steps", "Recognize FortiGate factory-default settings (default admin account, complex-password policy, and the default management IP address and interface)", "Apply best practices to secure administrative access to a FortiGate (trusted hosts, 2FA, secure protocols, restricted access, NTP time)", "Connect to and navigate the FortiGate GUI Status dashboard (Video 1 demo)", "Access the FortiGate CLI over the console on a VM and verify interface configuration (Video 2 demo)"], "sections": ["FortiGate Platform & Features", "Management & Access Methods", "First-Time Access & Factory Defaults", "The Setup Wizard", "Console & SSH CLI Access", "Securing Administrative Access", "Demo 1 · Connecting to the GUI", "Demo 2 · VM Console / CLI Login"]}, {"id": 2, "name": "System Settings & Basic Networking", "short": "System & Networking", "objectives": ["Configure additional administrator accounts and assign administrator profiles", "Configure FortiGate networking interfaces (roles, addressing modes, and administrative access)", "Configure VLANs on FortiGate (NAT mode, transparent mode, and the virtual VLAN switch)", "Configure a FortiGate interface as a DHCP server", "Configure static routes and a default route", "Monitor static routes and the FortiGate routing table"], "sections": ["System Settings & Administration", "Networking Interfaces", "DHCP Server", "Static Routes", "Monitoring & Diagnostics"]}, {"id": 3, "name": "Firewall Policies", "short": "Firewall Policies", "objectives": ["Define a firewall policy and explain how FortiGate uses policies to decide whether traffic is accepted and how it is processed.", "Identify the criteria FortiGate uses to match traffic to a firewall policy, including service, source and destination fields, users, and the Internet Service Database.", "Explain how firewall address objects and firewall authentication are used to define policy sources and destinations.", "Describe the structure of the firewall policy table and the implicit deny behavior applied to traffic that matches no explicit policy.", "Compare the processing FortiGate applies to accepted traffic, including NAT, logging, and flow-based versus proxy-based inspection."], "sections": ["Firewall Policy Fundamentals", "Matching Traffic to Policies", "Policy Table and Evaluation", "Traffic Processing and Inspection"]}, {"id": 4, "name": "Logging & Monitoring", "short": "Logging", "objectives": ["Identify the three main FortiGate log categories (Traffic, Event, and Security/UTM) and the common subtypes of each.", "Describe what each log type records, including local traffic, forward traffic, system events, security events, and one-arm sniffer traffic.", "Navigate the Log & Report section of the FortiGate GUI to view Forward Traffic, Local Traffic, System Events, and Security Events, and interpret the Summary and Logs views.", "Apply column-based filters to locate specific log entries, understanding that filtering only changes the display and never deletes logs.", "Configure FortiGate logging, including log storage location, global logging settings, and per-policy logging with Log Allowed Traffic."], "sections": ["Log Types and Categories", "Viewing Logs in the GUI", "Filtering Logs", "Configuring Logging and Storage"]}, {"id": 5, "name": "Firewall Authentication", "short": "Authentication", "objectives": ["Distinguish between local and remote firewall authentication and select the appropriate method for a given network deployment.", "Explain how firewall authentication identifies the actual user behind an IP address rather than treating traffic as anonymous.", "Configure a local user account and user groups on FortiGate, including guest accounts and expiration settings.", "Configure remote authentication with an LDAP server, including server port and bind type behavior.", "Apply a user group to a firewall policy to require authentication, then trigger, verify, and monitor the login."], "sections": ["Authentication Concepts and Methods", "Configuring Local Authentication", "Configuring Remote Authentication", "Firewall Policy Authentication and Lab"]}, {"id": 6, "name": "Exam Practice — Operator exam", "short": "Exam Practice", "objectives": ["An 84-question FortiGate 7.6 Operator practice-exam set", "Spans every course topic — Fabric, policies, HA, logging, SSL, routing…", "Correct answers with an explanation for each"], "sections": ["Security Fabric, FortiCloud & FortiCare", "FortiGuard, Threats & IPS", "Firewall Policies & Authentication", "Web Filtering & SSL Inspection", "High Availability (HA)", "Interfaces, Routing, VLANs, VDOMs & VPN", "Administration & Maintenance", "FortiSwitch & FortiLink"]}]; const QUESTIONS=[{"n":1,"ln":1,"lesson":1,"section":"FortiGate Platform & Features","topic":"FortiGate product overview","q":"How is a FortiGate appliance most accurately categorized within a network security architecture?","opts":["A next-generation firewall (NGFW) that combines firewalling with deep traffic inspection and threat protection","A purpose-built VPN concentrator that only terminates remote-access tunnels","An endpoint detection and response (EDR) agent installed on user workstations","A log-collection and SIEM appliance dedicated to storing and correlating events"],"a":0,"rat":"FortiGate is a next-generation firewall (NGFW), delivering firewalling plus full traffic visibility and integrated threat protection in one platform. A VPN concentrator, an EDR agent, and a SIEM each cover only one narrow function that FortiGate can incorporate but is not limited to.","src":"Original practice item","diff":"easy"},{"n":2,"ln":2,"lesson":1,"section":"FortiGate Platform & Features","topic":"FortiGate platform structure","q":"Within the layered FortiGate platform, which component supplies threat intelligence and centralized management services from above the security features?","opts":["FortiGuard Subscription Services","FortiOS, the base operating system","The Security Processing Units (SPUs) that accelerate traffic","The FortiClient endpoint agent"],"a":0,"rat":"FortiGuard Subscription Services sit on top of the stack and provide threat intelligence and centralized management. FortiOS is the operating system layer and SPUs are the acceleration hardware; neither delivers the subscription threat-intelligence feeds, and FortiClient is a separate endpoint product.","src":"Original practice item","diff":"medium"},{"n":3,"ln":3,"lesson":1,"section":"FortiGate Platform & Features","topic":"FortiGate models","q":"A cloud team is evaluating the virtual FortiGate-VM edition. What does this form factor provide compared with the hardware appliances?","opts":["Identical protection to the physical appliances, suitable for both public and private cloud deployments","A trimmed-down build that can only perform logging and monitoring","Management functions only, with no ability to inspect traffic","Coverage restricted to on-premises data centers alone"],"a":0,"rat":"FortiGate-VM delivers the same protection as the physical appliances and fits into public or private cloud environments. It is a full-featured firewall, not a logging-only, management-only, or on-prem-only build.","src":"Original practice item","diff":"medium"},{"n":4,"ln":4,"lesson":1,"section":"FortiGate Platform & Features","topic":"Advanced features - VDOMs","q":"A hosting provider must carve a single physical FortiGate into several independent virtual firewalls, each with separate policies, interfaces, routing tables, and administrator accounts. Which FortiGate capability delivers this?","opts":["SD-WAN link steering","Virtual Domains (VDOMs)","Automation stitches","Security Processing Units (SPUs)"],"a":1,"rat":"Virtual Domains (VDOMs) partition one FortiGate into multiple virtual firewalls, each with its own policies, interfaces, routing tables, and admins, which is ideal for multi-tenant service providers. SD-WAN steers WAN traffic, automation stitches trigger event-driven actions, and SPUs are acceleration chips, none of which provide tenant separation.","src":"Original practice item","diff":"medium"},{"n":5,"ln":5,"lesson":1,"section":"FortiGate Platform & Features","topic":"Advanced features - SD-WAN","q":"A retail chain runs multiple broadband and LTE internet links per site and wants to spread traffic across all of them and steer flows dynamically to cut costs without leasing dedicated MPLS circuits. Which FortiGate feature meets this goal?","opts":["Virtual Domains (VDOMs)","SD-WAN","Automation stitches","Web filtering"],"a":1,"rat":"SD-WAN uses several internet links efficiently, load-balances across the available connections, and routes dynamically to lower costs without expensive dedicated circuits. VDOMs partition the device, automation stitches react to events, and web filtering controls URL access, so none of them handle multi-link WAN steering.","src":"Original practice item","diff":"medium"},{"n":6,"ln":6,"lesson":1,"section":"FortiGate Platform & Features","topic":"VDOM default behavior","q":"Two VDOMs, TENANT-A and TENANT-B, are configured on the same FortiGate with no additional inter-VDOM setup. By default, how does traffic pass between them?","opts":["It cannot flow from one VDOM to the other unless inter-VDOM routes are explicitly configured","Both VDOMs automatically share a single common routing table","Traffic passes freely between the VDOMs with no extra configuration","The two VDOMs can only exchange traffic through the Security Fabric"],"a":0,"rat":"By default VDOMs are isolated, so traffic cannot move between TENANT-A and TENANT-B unless inter-VDOM links or routes are added. VDOMs do not share one routing table and are not open to each other by default, and Security Fabric membership is not required for inter-VDOM connectivity.","src":"Original practice item","diff":"medium"},{"n":7,"ln":7,"lesson":1,"section":"FortiGate Platform & Features","topic":"Automation stitches","q":"Which scenario is a genuine example of what a FortiGate automation stitch does?","opts":["Dividing the appliance into isolated per-tenant environments for a hosting provider","Choosing the best-performing WAN path for each application in real time","Automatically quarantining a compromised host, or calling an AWS Lambda function when a defined event is logged","Pushing the newest antivirus signatures out to managed endpoint agents"],"a":2,"rat":"An automation stitch links a trigger to an action, such as quarantining an infected host or invoking an AWS Lambda script when a specific event is logged. Tenant isolation is a VDOM function, per-application path selection is SD-WAN, and signature distribution is a FortiGuard/endpoint task.","src":"Original practice item","diff":"hard"},{"n":8,"ln":8,"lesson":1,"section":"FortiGate Platform & Features","topic":"FortiGuard Labs updates","q":"Through which mechanism does a FortiGate keep pace with the evolving threat landscape by receiving regular threat updates?","opts":["The Fortinet Security Fabric integration layer","FortiGuard Security Services, powered by FortiGuard Labs","Automation stitches","Virtual Domains (VDOMs)"],"a":1,"rat":"FortiGate receives its threat updates from FortiGuard Security Services, powered by FortiGuard Labs, Fortinet's threat-intelligence and research group. The Security Fabric ties products together, automation stitches trigger actions, and VDOMs partition the device, so none of those deliver the update feeds.","src":"Original practice item","diff":"easy"},{"n":9,"ln":9,"lesson":1,"section":"FortiGate Platform & Features","topic":"FortiGuard Labs features","q":"FortiGuard Labs delivers real-time threat intelligence across the Security Fabric grouped into three main areas. Which item below is one of those areas?","opts":["Software-defined WAN path selection","Trusted machine learning (ML) and artificial intelligence (AI) that block unknown threats sooner","Management of routing between VDOMs","Certificate-based authentication of administrators"],"a":1,"rat":"One of FortiGuard Labs' three pillars is trusted ML and AI that stop previously unknown threats faster, alongside real-time protection and threat hunting/outbreak alerts. SD-WAN path selection, inter-VDOM routing, and admin certificate authentication are unrelated FortiGate features.","src":"Original practice item","diff":"medium"},{"n":10,"ln":10,"lesson":1,"section":"FortiGate Platform & Features","topic":"Knowledge check - FortiGate facts","q":"Which of the following statements about FortiGate is NOT true?","opts":["It participates in the Fortinet Security Fabric","It receives security updates from FortiGuard Labs","It can only authenticate administrators against a remote server","It inspects both inbound and outbound traffic for threats"],"a":2,"rat":"The false statement is that FortiGate only supports remote authentication; it also supports local administrator accounts stored on the device itself. Security Fabric membership, FortiGuard updates, and bidirectional traffic inspection are all accurate.","src":"Original practice item","diff":"medium"},{"n":11,"ln":11,"lesson":1,"section":"Management & Access Methods","topic":"Methods to manage FortiGate","q":"Which management method is intended as the main way to perform everyday administration on a FortiGate using an ordinary web browser?","opts":["The graphical user interface (GUI) reached over HTTPS","The command line interface (CLI) reached over SSH","A directly attached console cable session","The CLI console embedded in the web interface"],"a":0,"rat":"The GUI, opened in any standard web browser over HTTPS, is the primary tool for most day-to-day tasks. The SSH CLI, console cable, and embedded CLI console are mainly used for advanced configuration and troubleshooting rather than routine administration.","src":"Original practice item","diff":"easy"},{"n":12,"ln":12,"lesson":1,"section":"Management & Access Methods","topic":"CLI access options","q":"There are three supported ways to reach the FortiGate CLI. Which option below is NOT one of them?","opts":["A direct console cable connection","HTTPS opened in a standard web browser","SSH across the network","The CLI console built into the GUI"],"a":1,"rat":"HTTPS in a web browser opens the GUI, not the CLI, so it is not a CLI access method. The three valid CLI paths are a console cable, an SSH session over the network, and the CLI console embedded in the web interface.","src":"Original practice item","diff":"medium"},{"n":13,"ln":13,"lesson":1,"section":"Management & Access Methods","topic":"Console cable access","q":"What sets a console cable apart from the other ways of reaching the FortiGate CLI?","opts":["It provides encrypted CLI access over the WAN","It is a direct physical connection that works even with no network available","It places a CLI panel inside the web-based GUI","It relies on HTTPS through a standard web browser"],"a":1,"rat":"A console cable is a direct connection that functions with no network at all, making it valuable when the device is unreachable over IP. SSH provides encrypted network access, the built-in console lives inside the GUI, and HTTPS is the GUI transport, none of which work without a network.","src":"Original practice item","diff":"medium"},{"n":14,"ln":14,"lesson":1,"section":"Management & Access Methods","topic":"Built-in GUI CLI console","q":"After signing in to the FortiGate web interface, how do you launch the CLI console that is built into the GUI?","opts":["Go to System > Advanced and turn on the console daemon","Click the CLI console icon in the upper-right corner to open a new console window","Right-click the dashboard and choose 'Open CLI'","Start an SSH session to TCP port 22 from inside the browser tab"],"a":1,"rat":"Once logged in to the GUI, clicking the CLI console icon in the upper-right corner opens a new console window for direct command entry. There is no console-daemon toggle under System > Advanced, no dashboard right-click option, and the browser does not initiate an SSH session for this feature.","src":"Original practice item","diff":"easy"},{"n":15,"ln":15,"lesson":1,"section":"First-Time Access & Factory Defaults","topic":"Password policy","q":"Current FortiOS releases require the administrator password set at first login to meet a complexity rule. What must that password satisfy?","opts":["A minimum of 8 characters that include at least one digit","A minimum of 10 characters with no character repeated","A minimum of 12 characters containing at least one uppercase letter, one lowercase letter, one number, and one special character","A minimum of 16 characters using only letters and digits"],"a":2,"rat":"The complex-password requirement is at least 12 characters with at least one uppercase letter, one lowercase letter, one number, and one special character. The other choices use the wrong minimum length or omit the four required character classes.","src":"Original practice item","diff":"hard"},{"n":16,"ln":16,"lesson":1,"section":"First-Time Access & Factory Defaults","topic":"Default management IP","q":"On a FortiGate at factory defaults, what is the default management IP address and which interface carries it?","opts":["192.168.1.99/24, on port1 for smaller models or on a dedicated MGMT interface on larger models","192.168.1.1/24, always on the WAN1 interface","192.168.0.1/24, on port1 across every hardware model","10.0.0.1/24, only on the dedicated MGMT interface"],"a":0,"rat":"The factory default management address is 192.168.1.99 with a /24 mask, assigned to port1 on smaller units and to a dedicated MGMT interface on larger units. The other options use incorrect addresses or misstate the interface placement.","src":"Original practice item","diff":"medium"},{"n":17,"ln":17,"lesson":1,"section":"First-Time Access & Factory Defaults","topic":"FortiGate VM management IP","q":"When a FortiGate runs as a virtual machine, what governs its management IP address?","opts":["It is permanently fixed at 192.168.1.99/24, exactly like hardware models","The FortiGuard subscription license entitlement","The network settings of the underlying virtual platform","The hardware defaults of the MGMT interface"],"a":2,"rat":"On a FortiGate-VM the management IP is determined by the virtual platform's network configuration, not a fixed hardware default. VMs have no built-in MGMT-port hardware default, and the FortiGuard license does not assign IP addressing.","src":"Original practice item","diff":"medium"},{"n":18,"ln":18,"lesson":1,"section":"First-Time Access & Factory Defaults","topic":"First login credentials","q":"When you open the GUI of a factory-default FortiGate for the very first time, which credentials do you use, and what happens right after you log in successfully?","opts":["Username admin with the password 'admin'; the device drops you straight onto the dashboard","Username root with a blank password; the device emails you a temporary password","Username admin with an empty (blank) password; the device then prompts you to set a new password","Username fortinet with the password 'fortinet'; the device forces a firmware upgrade first"],"a":2,"rat":"You sign in as admin with the password field left blank, and FortiGate immediately requires you to create a new password. There is no default 'admin' or 'fortinet' password, no root account with emailed credentials, and no forced firmware upgrade at first login.","src":"Original practice item","diff":"easy"},{"n":19,"ln":19,"lesson":1,"section":"First-Time Access & Factory Defaults","topic":"FortiGate VM management access","q":"By default, how is web-based administrative access provided on FortiGate hardware and FortiGate-VMs, and how does a VM usually obtain its management IP?","opts":["Web management is off by default and must be enabled from the console on every model","Web management is available only on the dedicated MGMT interface and never on port1","Web management is enabled on port1 by default, and a VM typically receives its IP automatically through DHCP","A VM has no default IP, so a static address must always be assigned before the first connection"],"a":2,"rat":"Administrative web access is enabled on port1 by default on FortiGate hardware and VMs alike, and a VM usually picks up its IP automatically via DHCP from the virtual environment. Web management is not disabled by default, is not limited to a MGMT-only interface, and a VM does not always require a manual static address.","src":"Original practice item","diff":"medium"},{"n":20,"ln":20,"lesson":1,"section":"First-Time Access & Factory Defaults","topic":"Factory default management IP","q":"Which IP address is the factory default management address of a FortiGate?","opts":["192.168.0.1","192.168.1.99","10.0.0.1","172.16.1.1"],"a":1,"rat":"192.168.1.99 is the FortiGate factory default management IP used to reach the GUI or CLI on first-time access. The other addresses are not the FortiGate default.","src":"Original practice item","diff":"easy"},{"n":21,"ln":21,"lesson":1,"section":"First-Time Access & Factory Defaults","topic":"Computer IP configuration","q":"An engineer patches both their laptop and a factory-default FortiGate into access ports on the same VLAN of a switch instead of cabling directly to port1. To open the default GUI at https://192.168.1.99, how should the laptop's IP be set?","opts":["Any address handed out automatically by the FortiGate's DHCP server on that VLAN","The identical address 192.168.1.99 with mask 255.255.255.255","An address in the same subnet, for example 192.168.1.100 with mask 255.255.255.0","An address inside 10.0.0.0/8 so it will not clash with the FortiGate"],"a":2,"rat":"The laptop needs an address in the same 192.168.1.0/24 subnet, such as 192.168.1.100 with a 255.255.255.0 mask, to reach 192.168.1.99. Using the same host address would collide, a /32 mask leaves no reachable peers, a different subnet cannot reach it directly, and the default port1 DHCP scope should not be relied on for management access here.","src":"Original practice item","diff":"medium"},{"n":22,"ln":22,"lesson":1,"section":"First-Time Access & Factory Defaults","topic":"CLI interface configuration","q":"From the console of a FortiGate-VM you set port1 to 192.168.1.99/24 and now need to permit GUI access. After entering 'config system interface' and 'edit port1', which command allows HTTPS management on the interface?","opts":["set admin-access https","set management https","set allowaccess https","set service https-server"],"a":2,"rat":"Within the interface context, 'set allowaccess https' enables HTTPS administrative access on port1, typically paired with 'set ip 192.168.1.99 255.255.255.0'. The other command forms are not valid FortiOS interface syntax for permitting management protocols.","src":"Original practice item","diff":"hard"},{"n":23,"ln":23,"lesson":1,"section":"The Setup Wizard","topic":"Register with FortiCare","q":"The first step of the Setup Wizard registers the FortiGate with FortiCare. Why does this step matter?","opts":["It unlocks full access to Fortinet Customer Service and Support and to FortiGuard services, confirming the device is licensed and tied into the security update network","It sets the administrator password and applies the password policy to all later logins","It automatically pulls down and installs the newest firmware patch on the device","It rewrites the running configuration into a format compatible with older FortiOS releases"],"a":0,"rat":"Registering with FortiCare grants full access to Fortinet support and FortiGuard services and verifies the device is licensed and connected to the update network. Setting passwords, installing firmware, and converting configurations are separate functions handled elsewhere.","src":"Original practice item","diff":"medium"},{"n":24,"ln":24,"lesson":1,"section":"The Setup Wizard","topic":"Setup Wizard - FortiConverter","q":"In the Setup Wizard, what does the Migrate Config with FortiConverter step accomplish?","opts":["It imports a configuration from another vendor's device by automatically mapping it into FortiOS format","It downloads and installs the latest FortiOS firmware patch on its own","It changes the FortiGate dashboard layout to match a different appliance","It backs up the current configuration to FortiCloud ahead of an upgrade"],"a":0,"rat":"FortiConverter migrates a configuration from another device and automatically maps it to the FortiOS format, which is helpful when replacing an existing firewall. It does not install firmware, restyle the dashboard, or perform a FortiCloud backup.","src":"Original practice item","diff":"medium"},{"n":25,"ln":25,"lesson":1,"section":"The Setup Wizard","topic":"Setup Wizard behavior","q":"Which statement correctly describes how the FortiGate Setup Wizard behaves when you do not finish every step?","opts":["Every step is mandatory and the wizard cannot be closed until all steps are done","Any step you skip is permanently deleted and can never be reopened","The wizard appears only once and never returns no matter which steps you skip","You may leave steps incomplete, but the wizard prompts you again at your next login, with the already-completed steps shown grayed out"],"a":3,"rat":"Completing every step is optional; the wizard reappears at the next login and displays the steps you already finished as grayed out. It is not strictly mandatory, skipped steps are not deleted, and it does not disappear permanently after one run.","src":"Original practice item","diff":"medium"},{"n":26,"ln":26,"lesson":1,"section":"The Setup Wizard","topic":"Setup Wizard - automatic patch upgrades","q":"What benefit does enabling automatic patch upgrades in the Setup Wizard provide?","opts":["It stops the FortiOS familiarization video from playing at future logins","It automatically migrates configurations from legacy firewalls into FortiOS format","It lets you choose a prebuilt dashboard matched to your monitoring priorities","FortiOS stays consistently up to date without any manual intervention"],"a":3,"rat":"Automatic patch upgrades keep FortiOS consistently current with no manual effort, replacing the need to apply patches by hand. Suppressing an intro video, migrating legacy configurations, and selecting a dashboard are unrelated to this setting.","src":"Original practice item","diff":"easy"},{"n":27,"ln":27,"lesson":1,"section":"Console & SSH CLI Access","topic":"Console port serial settings","q":"You launch a terminal emulator such as PuTTY to reach a FortiGate over its console port. Which serial parameters should you configure?","opts":["115200 baud, 8 data bits, even parity, 1 stop bit, hardware flow control","19200 baud, 7 data bits, odd parity, 2 stop bits, no flow control","9600 baud, 8 data bits, no parity, 1 stop bit, no flow control","9600 baud, 7 data bits, no parity, 2 stop bits, software flow control"],"a":2,"rat":"The FortiGate console uses 9600 baud, 8 data bits, no parity, 1 stop bit, and no flow control (commonly written 9600 8N1). The other combinations use the wrong baud rate, data-bit, parity, stop-bit, or flow-control values and will not connect properly.","src":"Original practice item","diff":"medium"},{"n":28,"ln":28,"lesson":1,"section":"Console & SSH CLI Access","topic":"Console port access","q":"A technician at Northwind Logistics is racking a new FortiGate-100F and needs guaranteed CLI access before any IP addressing exists. Which cable connects a laptop directly to the appliance's console port, and why is this the go-to method for an out-of-the-box setup?","opts":["A straight-through Ethernet patch cable running from the laptop NIC to a data port on the FortiGate","A crossover Ethernet cable joining the laptop to the FortiGate's dedicated management port","A rollover (console) cable from the laptop's serial or USB port to the FortiGate console port, because it works even when no network configuration is present","A USB-to-Ethernet dongle plugged into the FortiGate's HA heartbeat port"],"a":2,"rat":"A rollover (console) cable from the laptop's serial/USB port to the console port gives direct terminal access that is independent of any network or IP configuration, making it the most reliable path for first-time setup or recovery. Ethernet-based options all depend on working network settings that may not yet exist.","src":"Original practice item","diff":"easy"},{"n":29,"ln":29,"lesson":1,"section":"Console & SSH CLI Access","topic":"First-time CLI login","q":"An engineer powers on a factory-fresh FortiGate for the first time and reaches the console login prompt. What does she enter, and what happens immediately afterward?","opts":["She types admin with the password 'fortinet' and lands directly at the CLI prompt","She types root with an empty password and is asked to accept the license agreement","She types admin and uses the chassis serial number as the password","She types admin and leaves the password field empty, after which FortiOS immediately requires her to define a new password"],"a":3,"rat":"By default no password is set on the admin account, so the first login uses admin with a blank password; FortiOS then forces the administrator to create a new password before continuing. There is no factory 'fortinet' password and the serial number is not used for login.","src":"Original practice item","diff":"medium"},{"n":30,"ln":30,"lesson":1,"section":"Console & SSH CLI Access","topic":"SSH access method","q":"An administrator launches an SSH client to reach the FortiGate CLI over the network. Which TCP port does the client target, and on which interface is SSH admin access turned on out of the box?","opts":["TCP 23 on port1, and only on physical appliances","TCP 443 on any interface as soon as HTTPS admin access is switched on","TCP 22 on the mgmt interface only, and it is off by default on virtual machines","TCP 22 on port1, which is enabled by default on both hardware FortiGates and FortiGate VMs"],"a":3,"rat":"SSH uses TCP port 22, and FortiOS enables SSH administrative access on port1 by default on both appliances and VMs. Port 23 is Telnet and port 443 is HTTPS, so those choices name the wrong service.","src":"Original practice item","diff":"medium"},{"n":31,"ln":31,"lesson":1,"section":"Console & SSH CLI Access","topic":"SSH initial-access requirements","q":"A consultant wants to SSH into an untouched, factory-default FortiGate for the first time, but his workstation sits on a different subnet than the firewall. What condition must hold for that initial connection, and what must be done to reach the device from a remote network?","opts":["Any subnet is fine as long as SSH is enabled, and nothing further is required","The workstation must pull its address from FortiGate's DHCP, and remote access requires enabling Telnet","Initial SSH is impossible until a license is applied, so the console port must be used first","For the initial connection the workstation must share the same subnet as FortiGate, and reaching it from a remote network first requires configuring routing on FortiGate"],"a":3,"rat":"Out of the box FortiGate has no route to foreign networks, so initial SSH access requires the client to be on the same subnet; to connect from a remote network you must first add the necessary routing on FortiGate. Telnet is unrelated and no license is needed to use SSH.","src":"Original practice item","diff":"hard"},{"n":32,"ln":32,"lesson":1,"section":"Securing Administrative Access","topic":"Best practices - system time","q":"Right after the first login to a new FortiGate, which of the following is a recommended initial-setup best practice?","opts":["Turn off the GUI's built-in CLI console widget","Set or confirm the system clock, ideally by pointing it at an NTP source","Remove the default admin account before any other account exists","Move all management traffic off HTTPS and onto Telnet"],"a":1,"rat":"Accurate time underpins log correlation and security analysis, so configuring or verifying the system time (via NTP or manual entry) is a listed best practice. Deleting the sole admin account or switching to Telnet would harm manageability and security, not improve it.","src":"Original practice item","diff":"medium"},{"n":33,"ln":33,"lesson":1,"section":"Securing Administrative Access","topic":"Administrative access best practice","q":"Which action is a recognized best practice for hardening administrative access to a FortiGate?","opts":["Publish the management GUI to the public internet","Define trusted hosts for administrator accounts","Prefer Telnet over SSH for CLI sessions","Keep the factory default administrator password"],"a":1,"rat":"Configuring trusted hosts limits where administrators can log in from and is a core hardening step. Exposing the GUI to the internet, using cleartext Telnet, or keeping the default password all increase risk rather than reduce it.","src":"Original practice item","diff":"easy"},{"n":34,"ln":34,"lesson":1,"section":"Securing Administrative Access","topic":"Secure administrative protocols","q":"Best practice says to manage a FortiGate only over encrypted protocols. Which pairing satisfies that guidance?","opts":["HTTP and Telnet","HTTPS and SSH","HTTP and SSH","FTP and Telnet"],"a":1,"rat":"HTTPS and SSH are both encrypted, protecting administrative credentials and session data in transit. HTTP, Telnet, and FTP send data in cleartext, so any pairing that includes them is insecure.","src":"Original practice item","diff":"medium"},{"n":35,"ln":35,"lesson":1,"section":"Securing Administrative Access","topic":"Trusted hosts","q":"What is the security benefit of assigning trusted hosts to a FortiGate administrator account?","opts":["It caps how many administrators can be logged in at the same time","It requires a password change at the administrator's first login","It turns on two-factor authentication for every administrator automatically","It confines that administrator's logins to specific IP addresses or subnets"],"a":3,"rat":"Trusted hosts restrict where an administrator may authenticate from, so even stolen credentials are useless outside the approved IP addresses or networks. It does not manage session counts, force password changes, or enable two-factor authentication.","src":"Original practice item","diff":"medium"},{"n":36,"ln":36,"lesson":1,"section":"Securing Administrative Access","topic":"Two-factor authentication","q":"Among the initial-access best practices, which control strengthens login security by demanding a second proof of identity in addition to the password?","opts":["Defining trusted hosts","Renaming the device from its default hostname","Enabling two-factor authentication","Setting or verifying the system time"],"a":2,"rat":"Two-factor authentication layers a second verification step on top of the password, so a compromised password alone is not enough to log in. Trusted hosts, hostname changes, and time settings improve other aspects but do not add a second authentication factor.","src":"Original practice item","diff":"medium"},{"n":37,"ln":37,"lesson":1,"section":"Demo 1 · Connecting to the GUI","topic":"Demo 1 - dashboard widgets","q":"On the FortiGate Status dashboard, which widget shows the hostname, serial number, running firmware version, operation mode, and uptime together in one place?","opts":["System Information","Licenses","Virtual Machine","Administrators"],"a":0,"rat":"The System Information widget consolidates hostname, serial number, firmware version, operating mode, system time, and uptime. The Licenses widget covers subscription status, Virtual Machine covers vCPU/RAM allocation, and Administrators lists logged-in admins.","src":"Original practice item","diff":"easy"},{"n":38,"ln":38,"lesson":1,"section":"Demo 1 · Connecting to the GUI","topic":"Demo 1 - administrative access methods","q":"The dashboard's Administrators widget can show admins connected by Console, FortiExplorer, or HTTPS. When you are managing the FortiGate through its web GUI in a browser, which of these entries represents your session?","opts":["Console","FortiExplorer","SSH","HTTPS"],"a":3,"rat":"The web GUI is served over HTTPS, so a browser-based admin session appears as HTTPS in the Administrators widget. Console and FortiExplorer are different access channels, and SSH is a CLI method rather than a GUI session.","src":"Original practice item","diff":"medium"},{"n":39,"ln":39,"lesson":1,"section":"Demo 1 · Connecting to the GUI","topic":"Demo 1 - HTTPS certificate warning","q":"An administrator logs in to a freshly deployed FortiGate and the browser flags an 'Untrusted HTTPS server certificate'. What produces this warning?","opts":["The FortiGuard AntiVirus and IPS subscriptions have lapsed","The administrator mistyped the login password","FortiGate Cloud has not been activated yet","The FortiGate is presenting its built-in self-signed certificate for HTTPS management, which the browser has no reason to trust"],"a":3,"rat":"By default GUI access is secured with a self-signed certificate that is not issued by a trusted certificate authority, so browsers show an untrusted-certificate warning until a CA-signed certificate is imported. Expired FortiGuard licenses, wrong passwords, and cloud activation have nothing to do with the TLS certificate chain.","src":"Original practice item","diff":"hard"},{"n":40,"ln":40,"lesson":1,"section":"Demo 2 · VM Console / CLI Login","topic":"Demo 2 - console boot sequence","q":"Watching a FortiGate VM boot on the console, you see it load flatkc and rootfs.gz and then print 'System is starting...'. What device-identifying value does FortiOS display next, before the login prompt?","opts":["The appliance serial number","The MAC address of port1","The DHCP-assigned management IP address","The FortiCare registration key"],"a":0,"rat":"Immediately after 'System is starting...' the console prints the VM's serial number (for example FGVMEV...), identifying the unit before login. The MAC address, DHCP-learned IP, and FortiCare key are not shown at this point in the boot sequence.","src":"Original practice item","diff":"easy"},{"n":41,"ln":41,"lesson":1,"section":"Demo 2 · VM Console / CLI Login","topic":"Demo 2 - first-time console login","q":"You reach the console login prompt of a brand-new, factory-default FortiGate VM using the built-in administrator account. What credentials do you supply, and what does FortiOS insist on before it gives you the CLI prompt?","opts":["Username 'admin' with password 'admin', and no password change is needed","Username 'root' with the serial number as the password, after which you set the hostname","Username 'fortinet' with password 'fortinet', after which you accept the EULA","Username 'admin' with an empty password, after which you are forced to enter and confirm a new password before the CLI prompt appears"],"a":3,"rat":"The default admin account has no password, so you log in as admin with a blank password; FortiOS then requires you to set and confirm a new password before dropping to the CLI. There is no 'admin'/'admin' or 'fortinet'/'fortinet' factory credential.","src":"Original practice item","diff":"easy"},{"n":42,"ln":42,"lesson":1,"section":"Demo 2 · VM Console / CLI Login","topic":"Demo 2 - default interface administrative access","q":"On a factory-default FortiGate VM, 'show system interface' displays port1 with 'set mode dhcp'. Based on its 'set allowaccess' line, which administrative-access protocols are permitted on port1 by default?","opts":["HTTPS and SSH only","PING, HTTPS, SSH, SNMP, and FMG-Access","HTTP, Telnet, and PING","PING, HTTPS, SSH, and HTTP"],"a":3,"rat":"The default port1 configuration reads 'set allowaccess ping https ssh http', so those four protocols are allowed. SNMP, FMG-Access, and Telnet are not part of the default allowaccess set, and the list is broader than HTTPS/SSH alone.","src":"Original practice item","diff":"medium"},{"n":43,"ln":43,"lesson":1,"section":"Demo 2 · VM Console / CLI Login","topic":"Demo 2 - CLI verification commands","q":"From the FortiGate CLI you need to confirm the actual IP address that port1 obtained from DHCP, listed per interface at the device level. Which command reveals this (showing, for instance, port1 at 192.168.100.137)?","opts":["diagnose ip address list","show system interface","get router info routing-table all","diagnose ip route list"],"a":0,"rat":"'diagnose ip address list' prints the live IP currently bound to each interface, including the DHCP-assigned address on port1. 'show system interface' only displays the saved configuration (such as 'mode dhcp'), not the address actually leased, and the routing-table commands show routes rather than interface addresses.","src":"Original practice item","diff":"medium"},{"n":44,"ln":1,"lesson":2,"section":"System Settings & Administration","topic":"Default administrator account","q":"FortiGate ships with a built-in administrator account that attackers frequently probe. What is its name and privilege level?","opts":["An account called \"admin\" that holds full read/write configuration rights on the device","An account called \"root\" that is limited to read-only monitoring","An account called \"super-admin\" that must be enabled before it can be used","An account called \"audit-admin\" whose rights are restricted to viewing logs"],"a":0,"rat":"The factory default account is named admin and has full configuration privileges, which is exactly why it is a well-known target. FortiGate does not ship with root, super-admin, or audit-admin as the default administrator.","src":"Original practice item","diff":"easy"},{"n":45,"ln":2,"lesson":2,"section":"System Settings & Administration","topic":"Administrator account best practices","q":"Why is creating individual administrator accounts preferable to having everyone share the default admin login?","opts":["It automatically re-encrypts all admin passwords with a stronger hashing algorithm","It provides accountability by tying each configuration change to a specific user","It disables the default admin account as soon as a second account is created","It doubles the number of simultaneous GUI sessions the device permits"],"a":1,"rat":"Separate accounts make each administrator identifiable, so configuration changes can be traced to the person who made them, in addition to enabling role-based least privilege. They do not alter password hashing, auto-disable the default account, or change session limits.","src":"Original practice item","diff":"medium"},{"n":46,"ln":3,"lesson":2,"section":"System Settings & Administration","topic":"Administrator account settings","q":"When you add a new administrator account, FortiOS requires you to indicate where the account credentials will reside. Which two storage locations are offered?","opts":["In flash or in RAM","On the primary HA member or the secondary HA member","Locally on the FortiGate or remotely on an external server","In the global database or within a specific VDOM database"],"a":2,"rat":"An administrator account can be stored locally on the FortiGate or remotely, where authentication is delegated to an external server group. Flash/RAM, HA member selection, and global/VDOM database are not the credential-storage choice presented during account creation.","src":"Original practice item","diff":"medium"},{"n":47,"ln":4,"lesson":2,"section":"System Settings & Administration","topic":"Administrator account creation - GUI path","q":"Which FortiGate GUI menu path leads to the page where new administrator accounts are created?","opts":["System > Administrator > Admins Profiles","User & Authentication > User Definition","System > Administrator > Firmware & Registration","System > Administrator > Administrators"],"a":3,"rat":"Administrator accounts are created under System > Administrator > Administrators. Admin Profiles defines permission sets, Firmware & Registration handles licensing, and User Definition creates end-user (non-administrator) accounts.","src":"Original practice item","diff":"easy"},{"n":48,"ln":5,"lesson":2,"section":"System Settings & Administration","topic":"Administrator profiles - required assignment","q":"No matter what other options you enable on an administrator account, which setting is mandatory for every account?","opts":["An administrator profile","Two-factor authentication","A trusted-hosts restriction","A guest-account provisioning limit"],"a":0,"rat":"Every administrator account must be assigned an administrator profile because the profile defines the permissions that account will have. Two-factor authentication, trusted hosts, and guest provisioning are optional add-ons.","src":"Original practice item","diff":"medium"},{"n":49,"ln":6,"lesson":2,"section":"System Settings & Administration","topic":"Administrator profiles - access levels","q":"For each configuration area covered by an administrator profile, which set of access levels can you assign?","opts":["Read-write access or no access, and nothing in between","Read-only access, read-write access, or no access","Full access or restricted access only","Allow or deny only"],"a":1,"rat":"Each section in a profile can be set to None, Read (read-only), or Read/Write, giving three access levels per area. The other options omit the read-only tier that FortiOS provides.","src":"Original practice item","diff":"medium"},{"n":50,"ln":7,"lesson":2,"section":"System Settings & Administration","topic":"New Administrator - Type field","q":"On the New Administrator form, which Type selection sets the account to authenticate through a public key infrastructure (PKI) group?","opts":["REST API admin","SSO Admin","Use public key infrastructure (PKI) group","Restrict login to trusted hosts"],"a":2,"rat":"The 'Use public key infrastructure (PKI) group' Type binds the account to certificate-based PKI authentication. REST API admin and SSO Admin are separate account types, and 'Restrict login to trusted hosts' is a toggle rather than a Type value.","src":"Original practice item","diff":"hard"},{"n":51,"ln":8,"lesson":2,"section":"Networking Interfaces","topic":"FortiGate interface settings - administrative access","q":"Which FortiGate interface setting specifies the protocols permitted to manage the device through that interface, such as HTTPS, PING, and SSH?","opts":["Alias","IP address","DHCP server","Administrative access"],"a":3,"rat":"Administrative access defines the management protocols allowed on the interface, such as HTTPS, PING, and SSH. Alias is just a friendly label, IP address is the interface's reachable address, and a DHCP server hands out addresses to clients.","src":"Original practice item","diff":"medium"},{"n":52,"ln":9,"lesson":2,"section":"Networking Interfaces","topic":"VLAN tagging","q":"VLAN frames carry a VLAN ID tag so switches can tell which VLAN they belong to. Which tagging standard is identified as the most widely used?","opts":["802.1Q","802.1X","ISL","802.3ad"],"a":0,"rat":"IEEE 802.1Q is the dominant, vendor-neutral VLAN tagging standard. 802.1X is port-based network access control, ISL is Cisco's legacy proprietary encapsulation, and 802.3ad is link aggregation.","src":"Original practice item","diff":"medium"},{"n":53,"ln":10,"lesson":2,"section":"Networking Interfaces","topic":"VLANs in NAT mode - subinterfaces","q":"When a FortiGate operating in NAT mode uses VLANs, how are those VLANs represented in its configuration?","opts":["As a Layer 2 bridge inserted between two VLAN trunks","As subinterfaces bound to physical ports, each tied to a particular VLAN ID","As a virtual VLAN switch that bridges several physical ports together","As individual dedicated physical ports, one for each VLAN"],"a":1,"rat":"In NAT (Layer 3) mode, VLANs are created as subinterfaces on a physical port, each mapped to a specific VLAN ID, so one physical link can carry many tagged VLANs. A Layer 2 bridge describes transparent mode, not NAT-mode VLANs.","src":"Original practice item","diff":"medium"},{"n":54,"ln":11,"lesson":2,"section":"Networking Interfaces","topic":"VLANs in transparent mode - unsupported services","q":"A FortiGate running in transparent mode behaves as a Layer 2 bridge yet still enforces several security features on VLAN-tagged traffic. Which capability is NOT available in transparent mode?","opts":["Antivirus scanning","Web filtering","DHCP server","Intrusion prevention"],"a":2,"rat":"Transparent mode still applies antivirus, web filtering, and IPS to bridged traffic, but it does not provide DHCP server (or SSL VPN and full NAT) services. Those depend on the Layer 3 functionality that transparent mode does not offer.","src":"Original practice item","diff":"hard"},{"n":55,"ln":12,"lesson":2,"section":"Networking Interfaces","topic":"VLANs and FortiGate - operating modes","q":"A network engineer at Acme Corp is deciding how to deploy VLANs on a FortiGate. Which set correctly names the three ways a FortiGate can work with VLANs, depending on how the device is deployed?","opts":["NAT mode, proxy mode, and sniffer mode","Router mode, switch mode, and bridge mode","Transparent mode, HA mode, and SSL VPN mode","NAT mode, transparent mode, and a virtual VLAN switch on supported hardware"],"a":3,"rat":"FortiGate supports VLANs three ways: routed VLAN interfaces in NAT mode, tagged bridging in transparent mode, and a hardware-based virtual VLAN switch on supported models. Proxy/HA/SSL-VPN are separate features, not VLAN deployment methods.","src":"Original practice item","diff":"easy"},{"n":56,"ln":13,"lesson":2,"section":"Networking Interfaces","topic":"VLANs in NAT mode - Layer 3 routing","q":"A FortiGate is deployed in NAT mode with several VLAN sub-interfaces created on port2. How does it move traffic from one VLAN to another?","opts":["It behaves as a Layer 3 device and routes packets between the VLAN interfaces","It behaves as a Layer 2 bridge, forwarding frames without any routing decision","It behaves strictly as a managed Layer 2 switch","It drops all inter-VLAN traffic by default and is unable to route it"],"a":0,"rat":"In NAT mode each VLAN interface is a Layer 3 interface, so FortiGate routes between VLANs (and out to external networks). Layer 2 bridging without routing describes transparent mode instead.","src":"Original practice item","diff":"medium"},{"n":57,"ln":14,"lesson":2,"section":"Networking Interfaces","topic":"Virtual VLAN switch","q":"On a FortiGate model that supports it, what capability does configuring a virtual VLAN switch provide?","opts":["It routes between VLANs by wrapping each VLAN inside its own SSL VPN tunnel","It lets the built-in hardware ports behave as a managed Layer 2 switch, with each port assigned to a VLAN or set as a trunk","It permanently removes VLAN tags from every frame before any inspection takes place","It copies one DHCP scope automatically to every VLAN on the device"],"a":1,"rat":"A virtual VLAN switch turns the physical switch ports into a managed Layer 2 switch, letting you place ports in specific VLANs or make them trunks - handy for HA or extending VLANs across devices. It neither tunnels VLANs in SSL VPN nor strips tags.","src":"Original practice item","diff":"hard"},{"n":58,"ln":15,"lesson":2,"section":"Networking Interfaces","topic":"VLAN protocol selection","q":"802.1Q is the tagging protocol most administrators pick for VLANs. What is its maximum VLAN count, and what would push you to use 802.1ad instead?","opts":["Up to 1024 VLANs; use 802.1ad only when the FortiGate runs in transparent mode","Up to 256 VLANs; use 802.1ad only on IPv6-only segments","Up to 4094 VLANs; use 802.1ad when a larger design needs greater scalability","Up to 65535 VLANs; use 802.1ad to cut down the number of usable VLANs"],"a":2,"rat":"802.1Q supports up to 4094 VLANs, which covers most networks; 802.1ad (Q-in-Q) stacks tags for larger, more scalable designs. The other VLAN counts are incorrect.","src":"Original practice item","diff":"medium"},{"n":59,"ln":16,"lesson":2,"section":"Networking Interfaces","topic":"Creating a VLAN interface (GUI path)","q":"You want to add a new tagged VLAN sub-interface using the FortiGate web GUI. Which navigation path starts that task correctly?","opts":["System > Settings > Create New, then set Type to VLAN","Policy & Objects > Addresses > Create New, then choose VLAN","Network > SD-WAN > Create New, then choose Interface","Network > Interfaces > Create New, choose Interface, and set Type to VLAN"],"a":3,"rat":"VLAN sub-interfaces are created under Network > Interfaces with Create New, selecting Interface and setting the Type to VLAN. The System, Addresses, and SD-WAN paths do not create VLAN interfaces.","src":"Original practice item","diff":"easy"},{"n":60,"ln":17,"lesson":2,"section":"Networking Interfaces","topic":"VLAN ID and physical interface binding","q":"An administrator builds a VLAN sub-interface named HR-VLAN on the New Interface form. A VLAN interface must specify both a VLAN ID and the physical port it rides on. In the sample shown, which VLAN ID and parent interface pairing is used?","opts":["VLAN ID 100 bound to physical interface port7","VLAN ID 10 bound to physical interface port1","VLAN ID 254 bound to physical interface wan1","VLAN ID 24 bound to physical interface dmz"],"a":0,"rat":"The HR-VLAN example uses VLAN ID 100 on parent interface port7. A VLAN sub-interface always needs a VLAN ID plus the underlying physical interface it is associated with.","src":"Original practice item","diff":"medium"},{"n":61,"ln":18,"lesson":2,"section":"Networking Interfaces","topic":"Interface configuration - Alias field","q":"An administrator wants port5 to display the readable label LAN-HQ in lists and policies while its underlying system identifier port5 stays the same. Which field on the Edit Interface page is used for that label?","opts":["Name","Alias","Role","VRF ID"],"a":1,"rat":"The Alias field holds a friendly display label such as LAN-HQ without changing the interface's fixed system name (port5). Name is that fixed identifier, while Role and VRF ID control other behavior.","src":"Original practice item","diff":"easy"},{"n":62,"ln":19,"lesson":2,"section":"Networking Interfaces","topic":"Interface roles","q":"While editing port5 on a FortiGate, an administrator opens the Role drop-down. Which four choices does that list contain?","opts":["LAN, WAN, DMZ, Management","Internal, External, DMZ, Undefined","LAN, WAN, DMZ, Undefined","LAN, WAN, VLAN, Undefined"],"a":2,"rat":"The interface Role drop-down offers LAN, WAN, DMZ, and Undefined. Management, Internal/External, and VLAN are not selectable roles.","src":"Original practice item","diff":"medium"},{"n":63,"ln":20,"lesson":2,"section":"Networking Interfaces","topic":"Interface addressing modes","q":"In the Address section when editing port5, which list correctly names the addressing modes a FortiGate offers for the interface?","opts":["Manual, Static, DHCP, BOOTP, Sniffer","Automatic, IPAM, DHCP, PPPoE, Bridge","Manual, DHCP, PPPoE, LAN, DMZ","Manual, IPAM, DHCP, PPPoE, One-Arm Sniffer"],"a":3,"rat":"The Addressing mode selector provides Manual, IPAM, DHCP, PPPoE, and One-Arm Sniffer. Static/BOOTP/Bridge are not offered, and LAN/DMZ are interface roles rather than addressing modes.","src":"Original practice item","diff":"medium"},{"n":64,"ln":21,"lesson":2,"section":"Networking Interfaces","topic":"Auto-created address object","q":"An administrator sets port5 to Manual addressing with IP/Netmask 172.16.10.1/24 and leaves 'Create address object matching subnet' enabled. What value appears in the Subnet/Destination field of the automatically created 'port5 address' object?","opts":["172.16.10.0/24","172.16.10.1/24","172.16.10.1/32","0.0.0.0/0"],"a":0,"rat":"The auto-generated address object matches the subnet, so 172.16.10.1/24 yields the network 172.16.10.0/24, not the single host address. A /32 or 0.0.0.0/0 would not represent that interface subnet.","src":"Original practice item","diff":"hard"},{"n":65,"ln":22,"lesson":2,"section":"Networking Interfaces","topic":"Administrative access options","q":"When editing port5, which item is a valid selection in the Administrative Access (IPv4) section?","opts":["One-Arm Sniffer","FMG-Access","PPPoE","DMZ"],"a":1,"rat":"Administrative Access (IPv4) lists management protocols such as HTTPS, PING, SSH, SNMP, FTM, and FMG-Access. One-Arm Sniffer and PPPoE are addressing modes, and DMZ is an interface role.","src":"Original practice item","diff":"medium"},{"n":66,"ln":23,"lesson":2,"section":"Networking Interfaces","topic":"Administrative access selection","q":"After finishing the Administrative Access setup on port5, HTTPS was left on and two more protocols were added. Which three IPv4 management protocols end up enabled on the interface?","opts":["HTTPS, SSH, and SNMP","HTTPS, PING, and FMG-Access","HTTPS, SSH, and PING","HTTP, TELNET, and PING"],"a":2,"rat":"HTTPS was already enabled and PING and SSH were added, leaving HTTPS, SSH, and PING active. HTTP and TELNET are cleartext and would not be the secure choices enabled here.","src":"Original practice item","diff":"medium"},{"n":67,"ln":24,"lesson":2,"section":"Networking Interfaces","topic":"Interface list / secure administration","q":"On the Network > Interfaces list, port3 shows PING, HTTPS, SSH, HTTP, and TELNET enabled for administrative access, and the GUI highlights two of them in red as a warning. Which two are highlighted?","opts":["HTTPS and SSH","PING and HTTPS","SSH and SNMP","HTTP and TELNET"],"a":3,"rat":"HTTP and TELNET are unencrypted management protocols, so the interface list flags them in red as insecure. PING, HTTPS, and SSH are shown normally.","src":"Original practice item","diff":"medium"},{"n":68,"ln":25,"lesson":2,"section":"Networking Interfaces","topic":"Interface roles","q":"On the Local-FortiGate, an administrator edits port6, which is cabled to the ISP link. Which Role should be chosen from the drop-down for that interface?","opts":["WAN","LAN","DMZ","Undefined"],"a":0,"rat":"An interface facing the ISP/Internet is given the WAN role. LAN is for internal segments, DMZ for public-facing servers, and Undefined applies no role hint.","src":"Original practice item","diff":"easy"},{"n":69,"ln":26,"lesson":2,"section":"Networking Interfaces","topic":"Interface addressing modes","q":"An administrator needs to type the fixed IP/Netmask 172.16.20.1/30 directly onto port6. Which addressing mode allows entering that static address by hand?","opts":["DHCP","Manual","PPPoE","IPAM"],"a":1,"rat":"Manual addressing lets you enter a fixed IP/netmask such as 172.16.20.1/30 directly. DHCP and PPPoE learn addressing dynamically, and IPAM allocates from a managed pool rather than a hand-typed value.","src":"Original practice item","diff":"medium"},{"n":70,"ln":27,"lesson":2,"section":"Networking Interfaces","topic":"Interface configuration fields","q":"While editing port6, an administrator wants to record the note \"WAN port connected to ISP\" on the interface. Which field on the Edit Interface page holds that descriptive text?","opts":["Alias","Name","Comments","VRF ID"],"a":2,"rat":"Free-form descriptive text goes in the Comments box in the Miscellaneous section. Alias is a short display label, Name is the fixed physical identifier, and VRF ID selects a virtual routing instance.","src":"Original practice item","diff":"hard"},{"n":71,"ln":28,"lesson":2,"section":"Networking Interfaces","topic":"IP/Netmask and CIDR notation","q":"The WAN-ISP interface (port6) is set to 172.16.20.1/30. How does the interface list render that /30 prefix in dotted-decimal form in the IP/Netmask column?","opts":["172.16.20.1/255.255.255.248","172.16.20.1/255.255.255.240","172.16.20.1/255.255.255.0","172.16.20.1/255.255.255.252"],"a":3,"rat":"A /30 prefix equals the subnet mask 255.255.255.252 (two host addresses usable). The other masks correspond to /29, /28, and /24 respectively.","src":"Original practice item","diff":"medium"},{"n":72,"ln":29,"lesson":2,"section":"DHCP Server","topic":"Interface settings - DHCP server","q":"Among the settings available on a FortiGate interface, which one turns the interface into a service that hands out IP addresses automatically to hosts on the attached network?","opts":["DHCP server","Alias","IP address","Administrative access"],"a":0,"rat":"The DHCP server setting lets the interface dynamically assign IP addresses to hosts on its connected network. Alias is a label, IP address is the interface's own address, and Administrative access controls management protocols.","src":"Original practice item","diff":"easy"},{"n":73,"ln":30,"lesson":2,"section":"DHCP Server","topic":"DHCP Server - Default Gateway default","q":"When you enable the DHCP server on a FortiGate interface, what does the Default Gateway handed to clients default to?","opts":["The same value as the FortiGate's system DNS server","The same address as the interface's own IP address","The first usable IP in the configured address range","0.0.0.0 until an administrator enters one manually"],"a":1,"rat":"By default the DHCP server advertises the interface's own IP as the client Default Gateway, since that interface is the clients' next hop. It does not default to the DNS server, the first pool address, or 0.0.0.0.","src":"Original practice item","diff":"easy"},{"n":74,"ln":31,"lesson":2,"section":"DHCP Server","topic":"DHCP Server - DNS Server field options","q":"In a FortiGate interface's DHCP server settings, which three choices does the DNS Server field present?","opts":["Same as Interface
