[0,1]},{"n":182,"ln":50,"lesson":6,"section":"Web Filtering & SSL Inspection","topic":"Web & SSL","q":"What security concern does HTTPS introduce for a network defender?","opts":["It is incompatible with some older web browsers","It can carry malicious content hidden inside encryption","It noticeably increases end-to-end network latency","It frequently causes certificate errors during the handshake"],"a":1,"rat":"Because HTTPS encrypts the payload, malicious content can travel inside the encrypted channel and slip past inspection unless SSL inspection is applied. The other choices are not the core security risk of HTTPS.","src":"Original practice item","diff":"medium"},{"n":183,"ln":51,"lesson":6,"section":"Web Filtering & SSL Inspection","topic":"Web & SSL","q":"Which FortiGate inspection mode examines and forwards packets individually instead of waiting for the whole file or page to arrive?","opts":["Proxy-based inspection","Stateful inspection","Flow-based inspection","Application-level inspection"],"a":2,"rat":"Flow-based inspection evaluates traffic packet by packet as it passes through, without buffering the entire object, so it adds less latency than proxy-based inspection, which waits for the complete content.","src":"Original practice item","diff":"medium"},{"n":184,"ln":52,"lesson":6,"section":"Web Filtering & SSL Inspection","topic":"Web & SSL","q":"For a certificate to function as a signing CA (for example, the FortiGate CA used in deep inspection) without producing errors, which field settings must it carry?","opts":["issuer: C=US, O=Fortinet, CN=Verisign","basicConstraints: CA:TRUE together with keyUsage: keyCertSign","subjectAltName: DNS:*.example.com together with extendedKeyUsage: serverAuth","signatureAlgorithm: SHA256withRSA together with validityPeriod: 365 days"],"a":1,"rat":"A certificate can only sign other certificates when basicConstraints marks it CA:TRUE and keyUsage includes keyCertSign; without those flags a browser rejects it as a signing authority. The other combinations describe end-entity or cosmetic fields, not CA authority.","src":"Original practice item","diff":"hard"},{"n":185,"ln":53,"lesson":6,"section":"High Availability (HA)","topic":"HA","q":"When forming a FortiGate high availability (HA) cluster, which setting has to be identical on every member?","opts":["Group ID","Web filtering cache configuration","Device hostname","Management interface addressing"],"a":0,"rat":"All members must share the same HA Group ID (and group name) to form a cluster. Hostnames and management interface settings are deliberately unique per unit so each device stays individually reachable.","src":"Original practice item","diff":"medium"},{"n":186,"ln":54,"lesson":6,"section":"High Availability (HA)","topic":"HA","q":"Which of the following is NOT synchronized between members of a FortiGate HA cluster?","opts":["The HA override setting","The ARP table","IPsec tunnel security associations (SAs)","FortiGuard signature and rating definitions"],"a":0,"rat":"The HA override option is a per-unit setting and is intentionally not synchronized across the cluster. The ARP table, IPsec SAs (with session pickup enabled), and FortiGuard definitions are all kept in sync between members.","src":"Original practice item","diff":"medium"},{"n":187,"ln":55,"lesson":6,"section":"High Availability (HA)","topic":"HA","q":"How is session traffic handled in an active-active cluster versus an active-passive cluster?","opts":["Load is split in proportion to each unit's configured priority value.","Members negotiate on a per-session basis to decide who handles each flow.","Every member processes traffic while the primary distributes sessions to the secondaries.","Secondaries process outbound traffic while the primary handles all inbound traffic."],"a":2,"rat":"In active-active, all cluster members actively process traffic and the primary load-balances sessions out to the secondaries. In active-passive, only the primary forwards traffic while the others stand by.","src":"Original practice item","diff":"medium"},{"n":188,"ln":56,"lesson":6,"section":"High Availability (HA)","topic":"HA","q":"In the default FortiGate FGCP primary-election process, which factor is evaluated first?","opts":["The configured priority value","The unit's serial number","The HA uptime","The count of monitored interfaces that are UP"],"a":3,"rat":"By default FGCP compares candidates in this order: most monitored interfaces UP, then HA uptime, then priority, and finally serial number. So the number of monitored interfaces in the UP state is the first tiebreaker checked.","src":"Original practice item","diff":"hard"},{"n":189,"ln":57,"lesson":6,"section":"High Availability (HA)","topic":"HA","q":"What is the primary drawback of turning on the HA override option in a FortiGate cluster?","opts":["It causes a second failover when the original primary rejoins the cluster.","It stops any secondary unit from ever being promoted to primary.","It makes the cluster disregard HA uptime in every failover decision.","It mandates redundant heartbeat links before a failover can succeed."],"a":0,"rat":"With override enabled, the higher-priority unit takes back the primary role as soon as it returns, producing an extra failover and another brief traffic interruption. It does not block secondaries from being promoted or require redundant heartbeats.","src":"Original practice item","diff":"medium"},{"n":190,"ln":58,"lesson":6,"section":"High Availability (HA)","topic":"HA","q":"An administrator is building a two-member FortiGate HA cluster and wants to reduce the risk of a split-brain condition. Which design choice most directly helps avoid it?","opts":["Give each cluster member a unique HA group ID","Provision two or more dedicated heartbeat links between the members","Turn on FGSP alongside the default FGCP clustering","Add several monitored (link-monitor) interfaces when first building the cluster"],"a":1,"rat":"Configuring more than one dedicated heartbeat interface adds redundancy, so the loss of a single heartbeat link does not leave both units acting as primary (split-brain). Members must actually share the same group ID, so distinct IDs would break the cluster rather than protect it.","src":"Original practice item","diff":"medium"},{"n":191,"ln":59,"lesson":6,"section":"Interfaces, Routing, VLANs, VDOMs & VPN","topic":"Network & VPN","q":"A FortiGate is deployed in transparent mode to bridge two VLAN segments. Which restriction applies to this deployment?","opts":["VLANs can no longer be carried across more than one switch.","Each physical port is limited to carrying a single VLAN.","Antivirus and IPS scanning of transiting traffic is not possible.","Layer 3 services such as SSL VPN and DHCP server are not available."],"a":3,"rat":"A transparent-mode FortiGate acts as a Layer 2 bridge, so it still performs antivirus, IPS, and web filtering but cannot offer Layer 3 features like SSL VPN termination or a DHCP server. Traffic inspection remains fully supported, which rules out the antivirus/IPS option.","src":"Original practice item","diff":"medium"},{"n":192,"ln":60,"lesson":6,"section":"Interfaces, Routing, VLANs, VDOMs & VPN","topic":"Network & VPN","q":"(Choose two) When you build a DHCP server on a FortiGate interface, which two parameters are part of that configuration?","opts":["A firewall subnet address object","The pool of addresses to hand out","The gateway clients should use","A descriptive alias for the interface"],"a":1,"rat":"A FortiGate DHCP server is defined by the address range it leases and the default gateway it advertises (along with netmask and DNS). A firewall address object and an interface alias are unrelated to the DHCP scope itself.","src":"Original practice item","diff":"medium","multi":true,"correct":[1,2]},{"n":193,"ln":61,"lesson":6,"section":"Interfaces, Routing, VLANs, VDOMs & VPN","topic":"Network & VPN","q":"In a FortiGate static route entry, what is the meaning of the Destination field?","opts":["The network or host that the route is meant to reach","The FortiGate egress interface for the traffic","The address of the upstream DNS resolver","The address of the next-hop gateway"],"a":0,"rat":"The destination defines the target network or host the route applies to. The next-hop gateway and the outgoing interface are configured in separate fields, and DNS is unrelated to the route match.","src":"Original practice item","diff":"medium"},{"n":194,"ln":62,"lesson":6,"section":"Interfaces, Routing, VLANs, VDOMs & VPN","topic":"Network & VPN","q":"In an IPsec VPN, which protocol actually carries out authentication and encryption of the traffic payload?","opts":["Encapsulating Security Payload (ESP)","Transport Layer Security (TLS)","Secure Hash Algorithm (SHA)","Advanced Encryption Standard (AES)"],"a":0,"rat":"ESP is the IPsec protocol that provides both confidentiality (encryption) and authentication of the packet payload. SHA is only a hashing function and AES is only a cipher, while TLS is used by SSL VPN rather than IPsec.","src":"Original practice item","diff":"medium"},{"n":195,"ln":63,"lesson":6,"section":"Interfaces, Routing, VLANs, VDOMs & VPN","topic":"Network & VPN","q":"Why would an organization enable VDOMs on a single FortiGate appliance?","opts":["To manage FortiSwitch units that sit in separate broadcast domains directly from FortiGate","To fine-tune DNS name resolution on FortiGate virtual machines","To split one physical FortiGate into several isolated virtual firewalls, each with its own policy set","To bundle interfaces for link redundancy and greater aggregate throughput"],"a":2,"rat":"VDOMs carve a single FortiGate into multiple independent virtual firewalls, each with separate policies, interfaces, and routing tables. Link aggregation and DNS tuning are unrelated features.","src":"Original practice item","diff":"easy"},{"n":196,"ln":64,"lesson":6,"section":"Interfaces, Routing, VLANs, VDOMs & VPN","topic":"Network & VPN","q":"Which situation would keep a configured route from being installed in the FortiGate active routing table?","opts":["A preferred route to the same destination already exists","The wrong distance value was set on the default gateway address","The interface lacks any administrative-access protocols","The DHCP server tied to the route has been turned off"],"a":0,"rat":"A route stays out of the active table when a better route (lower administrative distance or a more specific prefix) already covers the same destination, or when its interface is down. Administrative-access settings and DHCP have no bearing on route installation.","src":"Original practice item","diff":"medium"},{"n":197,"ln":65,"lesson":6,"section":"Interfaces, Routing, VLANs, VDOMs & VPN","topic":"Network & VPN","q":"Which pair of capabilities does an IPsec VPN deliver?","opts":["Network segmentation and deep packet inspection","Data origin authentication and data integrity","Bandwidth optimization and antireplay protection","Data encryption and traffic load balancing"],"a":1,"rat":"IPsec provides data origin authentication and data integrity, along with confidentiality and antireplay protection. Load balancing and segmentation are handled by other FortiGate features, not by the IPsec protocol itself.","src":"Original practice item","diff":"medium"},{"n":198,"ln":66,"lesson":6,"section":"Interfaces, Routing, VLANs, VDOMs & VPN","topic":"Network & VPN","q":"You created an IPsec tunnel using the VPN wizard template, but you now need to change security settings the template does not expose. What must you do?","opts":["Convert the template-based tunnel into a custom tunnel","Select a different wizard template for the tunnel","Start over with the custom tunnel wizard option","Edit the underlying template definition directly"],"a":0,"rat":"Converting the template-created tunnel to a custom tunnel unlocks the full set of phase 1 and phase 2 security parameters for editing. Templates themselves are not editable, and switching templates would not preserve the existing tunnel.","src":"Original practice item","diff":"medium"},{"n":199,"ln":67,"lesson":6,"section":"Interfaces, Routing, VLANs, VDOMs & VPN","topic":"Network & VPN","q":"When a FortiGate runs in NAT mode, how are VLANs represented on its interfaces?","opts":["As physical ports only, each tagged with a distinct VLAN ID","As Layer 3 subinterfaces, so each VLAN can have its own routing and firewall policies","Only after the connected switch has trunk ports configured first","As a Layer 2 bridge that passes VLAN tags through untouched"],"a":1,"rat":"In NAT (Layer 3) mode, a VLAN becomes a subinterface with its own IP addressing, routing, and policies. Passing VLAN tags through as a Layer 2 bridge describes transparent mode instead.","src":"Original practice item","diff":"medium"},{"n":200,"ln":68,"lesson":6,"section":"Interfaces, Routing, VLANs, VDOMs & VPN","topic":"Network & VPN","q":"Which FortiGate feature is used to build encrypted links between a headquarters site and its branch offices across the public internet?","opts":["Virtual private networks","Security profile scanning","Log monitoring and reporting","Firewall authentication"],"a":0,"rat":"Site-to-site IPsec VPNs create the encrypted tunnels that securely connect headquarters to branch locations over the internet. Scanning, logging, and authentication address other needs and do not build the encrypted link.","src":"Original practice item","diff":"easy"},{"n":201,"ln":69,"lesson":6,"section":"Interfaces, Routing, VLANs, VDOMs & VPN","topic":"Network & VPN","q":"Which protocol negotiates and dynamically brings up the security associations for an IPsec VPN tunnel?","opts":["Point-to-Point Tunneling Protocol (PPTP)","Generic Routing Encapsulation (GRE)","Internet Key Exchange version 2 (IKEv2)","Layer 2 Tunneling Protocol (L2TP)"],"a":2,"rat":"IKE (IKEv2) performs the key exchange and dynamically negotiates the IPsec security associations that form the tunnel. PPTP, GRE, and L2TP are separate tunneling protocols and do not negotiate IPsec SAs.","src":"Original practice item","diff":"medium"},{"n":202,"ln":70,"lesson":6,"section":"Administration & Maintenance","topic":"Admin & Maint","q":"Why should you take regular backups of a FortiGate's system configuration?","opts":["It keeps the FortiGate running at peak throughput.","It lets you restore quickly and with little effort if hardware fails.","It stops administrators from making unexpected configuration edits.","It removes the chance of errors during a FortiOS upgrade."],"a":1,"rat":"A recent configuration backup allows fast restoration of settings onto replacement hardware after a failure, saving significant rebuild time. Backups do not affect throughput or prevent someone from changing the configuration.","src":"Original practice item","diff":"easy"},{"n":203,"ln":71,"lesson":6,"section":"Administration & Maintenance","topic":"Admin & Maint","q":"(Choose two) Which two outcomes are benefits of routinely maintaining your FortiGate firewalls?","opts":["Staying aligned with compliance and legal obligations.","Lowering the likelihood of a security breach.","Automatically receiving newer appliance hardware.","Cutting the cost of future firmware upgrades."],"a":0,"rat":"Regular maintenance keeps the deployment compliant with legal and regulatory requirements and reduces the risk of a breach by keeping protections current. It neither supplies new hardware nor inherently lowers upgrade costs.","src":"Original practice item","diff":"medium","multi":true,"correct":[0,1]},{"n":204,"ln":72,"lesson":6,"section":"Administration & Maintenance","topic":"Admin & Maint","q":"When moving a FortiGate to a newer firmware release, why should you follow Fortinet's recommended upgrade path?","opts":["It removes the need to back up the configuration first.","It unlocks brand-new major features immediately.","It preserves configuration compatibility and keeps the device stable.","It makes the upgrade complete more quickly."],"a":2,"rat":"Stepping through the recommended intermediate builds ensures the configuration is migrated correctly and the device remains stable across versions. Skipping the path risks broken settings, and it neither removes the need for backups nor guarantees speed.","src":"Original practice item","diff":"medium"},{"n":205,"ln":73,"lesson":6,"section":"Administration & Maintenance","topic":"Admin & Maint","q":"On a FortiGate, one administrator should be able only to view logs while another needs full read-write configuration rights. Which mechanism enforces these differing permission levels?","opts":["Enable two-factor authentication only on the full-access administrator.","Assign an administrator profile that sets the access level for each account.","Give each administrator a different trusted-host IP restriction.","Keep one account local and place the other in a remote authentication group."],"a":1,"rat":"Administrator profiles grant per-feature permissions (None, Read, or Read-Write), so one profile can allow read-only log access while another grants full configuration rights. Trusted hosts, 2FA, and account location control who can connect, not what an administrator is permitted to change.","src":"Original practice item","diff":"medium"},{"n":206,"ln":74,"lesson":6,"section":"Administration & Maintenance","topic":"Admin & Maint","q":"Which of the following is a recommended best practice for securing administrative access to a FortiGate?","opts":["Have all IT staff log in with one shared admin account","Use HTTPS rather than HTTP for GUI access","Create local administrator accounts","Permit administrative access only from internal network ranges"],"a":1,"rat":"Using encrypted management protocols such as HTTPS (and SSH in place of Telnet) keeps administrator credentials from traveling in cleartext. Shared accounts actually weaken accountability, and simply creating local accounts is not by itself a security control.","src":"Original practice item","diff":"easy"},{"n":207,"ln":75,"lesson":6,"section":"Administration & Maintenance","topic":"Admin & Maint","q":"(Choose two) Beyond CPU and memory utilization, which two additional metrics are worth monitoring on a FortiGate for performance and load?","opts":["The count of active VPN tunnels","The count of SSL sessions","The number of configured local users and groups","The number of days until licenses expire"],"a":0,"rat":"Active VPN tunnels and SSL sessions reflect real-time processing load and are useful performance indicators. Local-user counts and license expiry are inventory or lifecycle facts, not live performance measurements.","src":"Original practice item","diff":"medium","multi":true,"correct":[0,1]},{"n":208,"ln":76,"lesson":6,"section":"Administration & Maintenance","topic":"Admin & Maint","q":"What advantage comes from creating individual administrator accounts on a FortiGate instead of sharing one?","opts":["It improves accountability by tracing changes to a specific administrator.","The built-in admin account cannot use two-factor authentication.","New accounts can enforce password rules the default account cannot.","New accounts can select stronger encryption than the default admin account."],"a":0,"rat":"Separate named accounts create an audit trail, so each configuration change can be attributed to the administrator who made it. The other statements are not true of FortiGate accounts, since 2FA, password policy, and encryption apply regardless of which account is used.","src":"Original practice item","diff":"easy"},{"n":209,"ln":77,"lesson":6,"section":"Administration & Maintenance","topic":"Admin & Maint","q":"Which pair of protocols is appropriate for administrative access on a FortiGate interface?","opts":["Telnet and Simple Network Management Protocol (SNMP)","Simple Mail Transfer Protocol (SMTP) and Secure Sockets Layer (SSL)","Remote Desktop Protocol (RDP) and Hypertext Transfer Protocol (HTTP)","Hypertext Transfer Protocol Secure (HTTPS) and Secure Shell (SSH)"],"a":3,"rat":"HTTPS for the GUI and SSH for the CLI are the encrypted administrative-access options enabled in an interface's allowaccess list. Telnet, HTTP, and the other choices are either insecure or not used for FortiGate administration.","src":"Original practice item","diff":"easy"},{"n":210,"ln":78,"lesson":6,"section":"Administration & Maintenance","topic":"Admin & Maint","q":"(Choose two) What are two consequences if a FortiGate's FortiGuard/support license is allowed to lapse?","opts":["The GUI can no longer display system logs or build network reports","Loss of security-service updates and access to technical support","The appliance runs slower and becomes inherently more vulnerable","Interruption of protected services and possible compliance or legal exposure"],"a":1,"rat":"An expired license cuts off FortiGuard update feeds and vendor technical support and can interrupt licensed services while creating compliance gaps. Local logging still works, and the hardware's raw performance is not reduced simply because a license lapsed.","src":"Original practice item","diff":"hard","multi":true,"correct":[1,3]},{"n":211,"ln":79,"lesson":6,"section":"Administration & Maintenance","topic":"Admin & Maint","q":"Which of these passwords would satisfy the strong-password policy used in recent FortiOS releases?","opts":["FortinetSECURE2026","SecureNet#2026","Cloud26!","Summer2025!"],"a":1,"rat":"'SecureNet#2026' meets a strong policy by being at least 12 characters and mixing uppercase, lowercase, a digit, and a special character. The other choices each fall short, either lacking a special character or not reaching the required length.","src":"Original practice item","diff":"medium"},{"n":212,"ln":80,"lesson":6,"section":"FortiSwitch & FortiLink","topic":"FortiSwitch","q":"Which FortiSwitch details does a FortiLink discovery frame advertise to the FortiGate?","opts":["VLAN IDs and LLDP capability data","Firmware version and bridge priority values","Host name and the full MAC address table","Serial number and port information"],"a":3,"rat":"FortiLink discovery frames announce the FortiSwitch serial number and its ports so the FortiGate can identify and authorize the switch for management. VLAN, firmware, and MAC-table details are exchanged later, not in the discovery frame.","src":"Original practice item","diff":"medium"},{"n":213,"ln":81,"lesson":6,"section":"FortiSwitch & FortiLink","topic":"FortiSwitch","q":"In a standalone FortiGate managing dual-homed FortiSwitch access switches, what does an MCLAG accomplish?","opts":["It stops split-brain conditions from occurring.","It makes two FortiSwitch units appear to downstream devices as one logical switch.","It spreads CAPWAP tunnels across multiple VLANs.","It performs firmware upgrades on all FortiSwitch units at the same time."],"a":1,"rat":"MCLAG lets a pair of FortiSwitch units present themselves as a single logical switch, so a downstream device can connect to both for link and switch redundancy. Split-brain prevention and simultaneous firmware upgrades are not the purpose of MCLAG.","src":"Original practice item","diff":"hard"},{"n":214,"ln":82,"lesson":6,"section":"FortiSwitch & FortiLink","topic":"FortiSwitch","q":"Which protocol provides the authenticated, secured management channel between a FortiGate and a managed FortiSwitch?","opts":["FortiLink","LLDP","HTTPS","CAPWAP"],"a":3,"rat":"CAPWAP forms the DTLS-secured management tunnel through which the FortiGate authenticates and controls the FortiSwitch. FortiLink is the overall management feature that relies on that CAPWAP tunnel, while LLDP only assists with neighbor discovery.","src":"Original practice item","diff":"hard"},{"n":215,"ln":83,"lesson":6,"section":"FortiSwitch & FortiLink","topic":"FortiSwitch","q":"Why would an administrator enable the split-interface option on a FortiLink aggregate?","opts":["So the FortiLink aggregate interface can connect to more than one FortiSwitch","So heartbeat traffic is no longer needed in the FortiLink topology","So FortiSwitch units drop to standalone mode whenever the FortiGate is offline","So a single VLAN can be stretched across two FortiGate devices"],"a":0,"rat":"The FortiLink split interface splits the aggregate so its member links can terminate on two different FortiSwitch units, giving a redundant dual-homed connection. It does not disable heartbeats or change how the switches behave when the FortiGate is down.","src":"Original practice item","diff":"hard"},{"n":216,"ln":84,"lesson":6,"section":"FortiSwitch & FortiLink","topic":"FortiSwitch","q":"Which statement best captures the role FortiLink plays within the Fortinet Security Fabric?","opts":["It is a paid add-on protocol used only for managing remote FortiSwitch units.","It integrates FortiSwitch into the LAN whether or not a FortiGate is present.","It permits up to 500 FortiSwitch units to be joined to the Security Fabric.","It lets a FortiGate manage FortiSwitch units directly, extending centralized security to the switch layer."],"a":3,"rat":"FortiLink allows the FortiGate to manage FortiSwitch units directly, bringing the access switching layer under the same centralized Security Fabric policy and control. FortiLink specifically depends on a managing FortiGate and is not a separate paid remote-only protocol.","src":"Original practice item","diff":"medium"}];

function checkAnswer(){

}
function renderStudy(){
  S.mode="study";
  const shown=S.studyFilter==="all"?LESSONS:S.studyFilter==="missed"?LESSONS:LESSONS.filter(l=>l.id===S.studyFilter);
  app.innerHTML=`<div class="card hero fade" style="padding:30px 30px 26px; margin-bottom:22px">
      <div class="eyebrow">Study mode</div><h1 style="font-size:25px; margin-top:10px">Every question, answered</h1>
      <p class="lede" style="font-size:15px">All ${QUESTIONS.length} exam questions with the correct choice marked and an explanation. Questions you missed are flagged.</p></div>
    <div class="filters" id="filters">
      <button class="fchip ${S.studyFilter==="all"?"on":""}" data-f="all">All (${QUESTIONS.length})</button>
      ${NMISS?`<button class="fchip miss ${S.studyFilter==="missed"?"on":""}" data-f="missed">Missed (${NMISS})</button>`:``}
      ${LESSONS.map(L=>`<button class="fchip ${S.studyFilter===L.id?"on":""}" data-f="${L.id}">${esc(L.short)} (${QUESTIONS.filter(q=>q.lesson===L.id).length})</button>`).join("")}
    </div><div id="studyList"></div>
    <div class="actions" style="margin-top:24px"><button class="btn btn-primary" id="toQuiz">Take the quiz →</button><button class="btn btn-ghost" id="home2">Home</button></div>`;
  const onlyMiss=S.studyFilter==="missed";
  document.getElementById("studyList").innerHTML=shown.map(L=>{
    let items=QUESTIONS.filter(q=>q.lesson===L.id); if(onlyMiss) items=items.filter(q=>q.missed); if(!items.length) return "";
    return `<div class="lesson-banner l${L.id}"><span class="lb-tag">${esc(L.short)}</span><h2>${esc(L.name)}</h2></div>
      <details class="sgroup" open><summary><span class="caret">▶</span>${esc(L.name)}<span class="cnt">${items.length} question${items.length>1?"s":""}</span></summary>
      <div class="sbody">${items.map(q=>{ const corr=correctOf(q);
        return `<div class="sq l${q.lesson}"><div class="sqq"><span class="n">Q${q.ln}</span><span>${esc(q.q)}</span>${q.missed?`<span class="mb">missed</span>`:``}</div>
        <div class="sopts">${q.opts.map((o,i)=>`<div class="sopt ${corr.includes(i)?"ok":""}"><span class="sl">${LETTERS[i]}</span><span>${esc(o)}</span>${corr.includes(i)?'<span class="ck">✓</span>':""}</div>`).join("")}</div>
        <div class="srat">${esc(q.rat)}</div><div class="ssrc">${esc(q.src)} · ${esc(q.section)} · ${q.diff}${q.multi?` · select ${q.correct.length}`:``}</div></div>`; }).join("")}</div></details>`;
  }).join("")||`<p style="color:var(--muted)">No questions match this filter.</p>`;
  [...document.querySelectorAll("#filters .fchip")].forEach(c=>c.addEventListener("click",()=>{ const f=c.dataset.f; S.studyFilter=(f==="all"||f==="missed")?f:+f; renderStudy(); window.scrollTo({top:0,behavior:"smooth"}); }));
  document.getElementById("toQuiz").addEventListener("click",()=>beginQuiz("all"));
  document.getElementById("home2").addEventListener("click",renderStart);
  readout.innerHTML=`<span>Study · <b>${QUESTIONS.length}</b> Q</span>`;
}
document.addEventListener("keydown",e=>{ if(S.mode!=="quiz") return; const q=QUESTIONS[S.order[S.ptr]]; const n=q.opts.length; const k=e.key.toLowerCase(); let slot=-1;
  if(k.length===1&&k>="a"&&k<="e") slot="abcde".indexOf(k); else if(k>="1"&&k<="5") slot=+k-1;
  if(slot>=0&&slot<n&&!S.checked){ const opt=[...app.querySelectorAll(".opt")].find(o=>+o.dataset.slot===slot); if(opt) opt.click(); e.preventDefault(); return; }
  if(e.key==="Enter"){ if(!S.checked&&hasPick(q)) checkAnswer(); else if(S.checked) nextQ(); e.preventDefault(); } });
renderStart();
</script>
</body>
