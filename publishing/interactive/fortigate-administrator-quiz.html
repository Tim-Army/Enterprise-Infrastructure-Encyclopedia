 a stored copy afterward", "It scans each packet individually as it arrives and never buffers any part of the file", "It holds every packet in the buffer until scanning finishes and then releases the whole file"], "a": 0, "rat": "The flow-based packet flow slide states FortiGate buffers but also transmits simultaneously, and the antivirus engine starts scanning after the whole file is buffered.", "src": "Video · 6:15", "diff": "medium"}, {"n": 407, "ln": 16, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "Flow-based infected file", "q": "In flow-based mode the antivirus engine finds a virus. What happens to the file and to a second attempt to download it?", "opts": ["The whole file is dropped and a block page is shown on the first attempt; the second attempt is rescanned", "The session is reset immediately and the URL is added to the external block list for all later attempts", "The file is delivered intact and a log is generated; the second attempt is blocked by the proxy", "The last packet is withheld, truncating the file; the IPS engine caches the URL and blocks the retry"], "a": 3, "rat": "The notes state the last piece of the file is not sent so the file is truncated, and the IPS engine caches the URL of the infected file so a second attempt receives a block replacement message instead of being rescanned.", "src": "Video · 6:15", "diff": "hard"}, {"n": 408, "ln": 17, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "CPU usage", "q": "Which inspection mode consumes more CPU cycles when scanning files for viruses?", "opts": ["Flow-based mode", "Both modes consume the same CPU", "Proxy-based mode", "Neither; CPU use depends only on the number of signatures"], "a": 0, "rat": "The notes state that because the file is transmitted at the same time it is buffered, flow-based mode consumes more CPU cycles than proxy-based mode, though some operations can be offloaded to SPUs.", "src": "Video · 6:40", "diff": "medium"}, {"n": 409, "ln": 18, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "Proxy packet flow", "q": "In proxy-based inspection, what does the client receive when the antivirus engine finds a virus in a file?", "opts": ["None of the file; the proxy sends a replacement block message instead", "A TCP reset from FortiGate with no replacement message or log generated", "The full file, with a warning banner inserted at the top of the web page", "All packets except the last one, so the downloaded file arrives truncated"], "a": 0, "rat": "The proxy packet flow notes state that if the engine finds a virus, no packets are delivered to the end client and the proxy sends the replacement block message.", "src": "Video · 8:20", "diff": "medium"}, {"n": 410, "ln": 19, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "Client comforting", "q": "What does client comforting do in proxy-based inspection, and where is it configured in the CLI?", "opts": ["It disables scanning of oversized files to avoid session delays; configured under config firewall policy", "It sends a block page to the client before scanning starts; configured under config antivirus profile", "It offloads file buffering to the client to save memory; configured under config system settings", "It trickles data to the client during the scan to prevent timeouts; config firewall profile-protocol-options"], "a": 3, "rat": "The notes state client comforting for HTTP and FTP is configured in config firewall profile-protocol-options and lets the proxy slowly transmit data until it completes the buffer and finishes the scan, preventing a connection or session timeout.", "src": "Video · 8:45", "diff": "medium"}, {"n": 411, "ln": 20, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "Proxy-only features", "q": "Which antivirus capabilities are available only when the antivirus profile feature set is proxy-based?", "opts": ["The EMS threat feed and external malware block list", "MAPI and SSH inspection, CDR, and FortiNDR inspection", "HTTP, SMTP, POP3, IMAP, and FTP protocol inspection", "Grayware scanning, AI scanning, and outbreak prevention"], "a": 1, "rat": "The Proxy Inspection Mode Enabled slide lists MAPI and SSH protocol inspection, CDR, and FortiNDR inspection as additional support, marked available only in proxy-based inspection mode.", "src": "Video · 9:10", "diff": "easy"}, {"n": 412, "ln": 21, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "RAM requirement", "q": "An administrator plans to upgrade a FortiGate with 2 GB of RAM to FortiOS 7.4.4 or later. What must be considered?", "opts": ["Flow-based inspection is removed on models with 2 GB RAM or less", "The AI malware scan requires at least 4 GB RAM and is disabled", "Proxy-related features are no longer supported on 2 GB RAM models", "The EMS threat feed is disabled on models with 2 GB RAM or less"], "a": 2, "rat": "The slide states proxy inspection requires more than 2 GB RAM, and the notes state FortiOS 7.4.4 or later no longer supports proxy-related features on FortiGate models with 2 GB RAM or less.", "src": "Video · 9:35", "diff": "medium"}, {"n": 413, "ln": 22, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "FortiNDR", "q": "Which statement about using FortiNDR with antivirus profiles is correct?", "opts": ["It works only in proxy mode and gives a verdict based on similarity to malware features", "It works in both inspection modes and removes macros from Office documents", "It works only when the EMS threat feed is enabled in the antivirus profile", "It works in flow mode only and replaces the local antivirus signature database entirely"], "a": 0, "rat": "The notes state FortiNDR can be used with antivirus profiles in proxy inspection mode (flow mode is not supported) and issues a verdict based on how close the file features match those of malware.", "src": "Video · 9:10", "diff": "hard"}, {"n": 414, "ln": 23, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "Policy inspection mode", "q": "An administrator created a proxy-based antivirus profile but cannot select it in a firewall policy. What must be changed?", "opts": ["Change the SSL inspection profile to certificate-inspection", "Set the antivirus profile to Monitor", "Enable NTurbo on the policy", "Set the firewall policy Inspection Mode to Proxy-based"], "a": 3, "rat": "The notes state you must set the Inspection Mode to Proxy-based in the policy to be able to see proxy-based security profiles.", "src": "Video · 10:00", "diff": "easy"}, {"n": 415, "ln": 24, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "Flow profiles in proxy policy", "q": "Why can flow-based security profiles also be selected in a proxy-based firewall policy?", "opts": ["Proxy-based policies support only flow-based profiles for antivirus scanning", "Other features on the same policy may require the proxy even if antivirus does not", "Flow-based profiles are automatically converted to proxy-based profiles when applied", "Flow-based profiles are required so that NTurbo can accelerate the proxy traffic"], "a": 1, "rat": "The notes state you can view and select flow-based security profiles in a proxy-based policy because other security features configured on the same policy rule may require the proxy, even if antivirus does not.", "src": "Video · 10:00", "diff": "medium"}, {"n": 416, "ln": 25, "lesson": 8, "section": "Stream-Based Scanning", "topic": "Stream-based in flow mode", "q": "What benefit does stream-based antivirus scanning provide in flow-based inspection?", "opts": ["It avoids caching the entire file, improving memory usage", "It can decompress and scan password-protected archives", "It adds MAPI and SSH protocol inspection to flow policies", "It enables CDR on HTTP and SMTP traffic without a proxy"], "a": 0, "rat": "The slide states stream-based scanning in flow-based inspection eliminates the need to cache the entire file and improves memory usage, scanning HTML and JavaScript files with antivirus engine 7.0.", "src": "Video · 7:30", "diff": "easy"}, {"n": 417, "ln": 26, "lesson": 8, "section": "Stream-Based Scanning", "topic": "Stream-based exclusions", "q": "In flow-based inspection, enabling which of the following causes FortiGate to stop using stream-based scanning?", "opts": ["HTTP in the inspected protocols list", "Block action in the antivirus profile", "Grayware scan", "Flow-based feature set"], "a": 2, "rat": "The slide lists configurations that prevent stream-based scanning: ML-based detection, extreme antivirus database, grayware scan, mobile malware database, external block list, EMS threat feed, FortiGuard outbreak prevention, DLP, and file filter.", "src": "Video · 7:30", "diff": "medium"}, {"n": 418, "ln": 27, "lesson": 8, "section": "Stream-Based Scanning", "topic": "Proxy stream-based support", "q": "Which statement about stream-based scanning in proxy-based inspection is correct?", "opts": ["It is the default in proxy mode and supports all protocols, including HTTP POST uploads", "It is the default in proxy mode and covers HTTP(S), FTP(S), SCP/SFTP, except HTTP POST", "It must be enabled manually in proxy mode and supports only SMTP, POP3, and MAPI traffic", "It is available only in flow mode and scans HTML and JavaScript files, not binaries"], "a": 1, "rat": "The slide states stream-based scanning is the default scan mode in proxy mode and supports HTTP(S), FTP(S), and SCP/SFTP; the notes add it does not support HTTP POST.", "src": "Video · 10:25", "diff": "medium"}, {"n": 419, "ln": 28, "lesson": 8, "section": "Stream-Based Scanning", "topic": "Disabling stream-based", "q": "Which CLI setting in config antivirus profile disables stream-based scanning in proxy mode?", "opts": ["set use-extreme-db enable", "set scan-mode default", "set feature-set flow", "set scan-mode legacy"], "a": 3, "rat": "The CLI example shows set scan-mode {default | legacy}, and the callout states legacy settings disable stream-based scanning.", "src": "Video · 10:25", "diff": "medium"}, {"n": 420, "ln": 29, "lesson": 8, "section": "Protocol Options, Large and Compressed Files", "topic": "Protocol options scope", "q": "Which statement about protocol options profiles is correct?", "opts": ["They are used only by the antivirus profile and by no other security profile type", "They are available only for proxy-based policies, since flow policies use fixed ports", "Both flow-based and proxy-based policies use them, but port mapping works only in proxy mode", "They are available only for flow-based policies and define the NTurbo data path"], "a": 2, "rat": "The slide states protocol options are available for both proxy-based and flow-based firewall policies, and the callout notes port mapping works only in proxy-based inspection. The notes add that web filtering, DNS filtering, and DLP also use protocol options.", "src": "Video · 11:40", "diff": "medium"}, {"n": 421, "ln": 30, "lesson": 8, "section": "Protocol Options, Large and Compressed Files", "topic": "Oversize default", "q": "By default, what happens to files larger than the oversize limit?", "opts": ["They are blocked", "They are quarantined", "They are sent to FortiSandbox", "They bypass antivirus scanning"], "a": 3, "rat": "The Large Files slide states that by default, files bigger than the oversize limit are bypassed from scanning, and this can be changed with Block Oversized File/Email.", "src": "Video · 12:30", "diff": "easy"}, {"n": 422, "ln": 31, "lesson": 8, "section": "Protocol Options, Large and Compressed Files", "topic": "Oversize threshold", "q": "What is the default Block Oversized File/Email threshold and to what does the setting apply?", "opts": ["10 MB, applied per protocol; the maximum is 12 MB", "1 MB, applied to email only; the maximum is hardware dependent", "10 MB, applied to all protocols; the maximum value is hardware dependent", "50 MB, applied to HTTP only; the maximum is 100 MB"], "a": 2, "rat": "The slide shows Threshold (MB) set to 10 with callouts stating the default value is 10 MB, the maximum is hardware dependent, and the option applies to all protocols.", "src": "Video · 12:30", "diff": "medium"}, {"n": 423, "ln": 32, "lesson": 8, "section": "Protocol Options, Large and Compressed Files", "topic": "Oversize log", "q": "An administrator is not sure what oversize-limit value to set in the protocol options profile. What can the administrator do to determine an appropriate value?", "opts": ["Set the oversize-limit to the hardware maximum permanently so no file is skipped", "Enable client comforting and leave the oversize-limit at its factory default", "Disable the oversize option on every protocol so all files are passed unscanned", "Temporarily enable oversize-log to see how often large files occur, then adjust"], "a": 3, "rat": "The notes state that if you are not sure about the oversize-limit value, you can temporarily enable oversize-log to see if FortiGate is scanning large files frequently and then adjust the value accordingly.", "src": "Video · 12:30", "diff": "hard"}, {"n": 424, "ln": 33, "lesson": 8, "section": "Protocol Options, Large and Compressed Files", "topic": "Compressed archives", "q": "Which statement about how FortiGate scans compressed archives is correct?", "opts": ["Each file inside is scanned separately; password-protected archives cannot be unpacked", "Password-protected archives are decompressed using keys supplied by FortiGuard", "Archives are scanned as a single binary object without any decompression step", "Only the outermost archive layer is unpacked; nested archives are passed unscanned"], "a": 0, "rat": "The Compressed Files slide states archives are unpacked and files and archives within are scanned separately, and password-protected archives cannot be decompressed.", "src": "Video · 12:55", "diff": "easy"}, {"n": 425, "ln": 34, "lesson": 8, "section": "Protocol Options, Large and Compressed Files", "topic": "Nested archive depth", "q": "By default, how many layers deep will FortiGate decompress and scan a nested archive?", "opts": ["It is unlimited", "3", "100", "12"], "a": 3, "rat": "The notes state that by default FortiGate attempts to decompress and scan up to 12 layers deep, configurable up to the device maximum (usually 100), which is not recommended because it increases RAM usage.", "src": "Video · 13:20", "diff": "medium"}, {"n": 426, "ln": 35, "lesson": 8, "section": "Protocol Options, Large and Compressed Files", "topic": "Compressed file CLI", "q": "Which CLI setting under config firewall profile-protocol-options controls the nested archive limit for a protocol?", "opts": ["set uncompressed-oversize-limit", "set oversize-log", "set uncompressed-nest-limit", "set oversize-limit"], "a": 2, "rat": "The CLI on the Compressed Files slide highlights set uncompressed-nest-limit as the nested archive limit and set uncompressed-oversize-limit as the oversize limit specific to decompressed files.", "src": "Video · 12:55", "diff": "hard"}, {"n": 427, "ln": 36, "lesson": 8, "section": "Block Pages and Logging", "topic": "Block page contents", "q": "Which item is included on the antivirus block replacement page?", "opts": ["The firewall policy ID", "The FortiGate serial number", "A link to the FortiGuard Encyclopedia", "The antivirus signature database version"], "a": 2, "rat": "The notes list the block page contents as file name, virus name, website host and URL, username and group if authentication is enabled, and a link to the FortiGuard Encyclopedia.", "src": "Video · 11:15", "diff": "easy"}, {"n": 428, "ln": 37, "lesson": 8, "section": "Block Pages and Logging", "topic": "AntiVirus logs", "q": "Where in the GUI can you find details of antivirus detections when UTM logging is enabled on the firewall policy?", "opts": ["Policy & Objects > Firewall Policy > Details", "Log & Report > Security Events > AntiVirus", "System > FortiGuard > License Information", "Security Profiles > AntiVirus > Profile Logs"], "a": 1, "rat": "The notes state that with UTM logging enabled on a firewall policy, details are on the AntiVirus log page under Security Events; the screenshot shows Log & Report > Security Events.", "src": "Video · 13:45", "diff": "easy"}, {"n": 429, "ln": 38, "lesson": 8, "section": "Block Pages and Logging", "topic": "Forward traffic logs", "q": "How can an administrator see the security details of antivirus actions alongside the traffic that triggered them?", "opts": ["Open System > FortiGuard and view the License Information", "Open the Forward Traffic log entry and view its Security tab", "Open the protocol options profile and enable Log Oversized Files", "Run diagnose antivirus database-info from the CLI console"], "a": 1, "rat": "The Forward Traffic Logs slide shows a forward traffic log entry with a Security tab in Log Details, and the notes say you can find a summary of traffic on which FortiGate applied an antivirus action in the corresponding security details.", "src": "Video · 14:10", "diff": "medium"}, {"n": 430, "ln": 39, "lesson": 8, "section": "Troubleshooting Antivirus", "topic": "Force update", "q": "Which command forces FortiGate to check for new antivirus updates?", "opts": ["execute update-av", "diagnose autoupdate versions", "get system performance status", "diagnose antivirus database-info"], "a": 0, "rat": "The troubleshooting slide shows execute update-av to force FortiGate to check for new antivirus updates.", "src": "Video · 14:35", "diff": "easy"}, {"n": 431, "ln": 40, "lesson": 8, "section": "Troubleshooting Antivirus", "topic": "Update connectivity", "q": "FortiGate fails to download antivirus updates and there is another firewall between it and the internet. Which check should be made?", "opts": ["Make sure TCP port 8888 is open inbound to FortiGate", "Make sure ICMP echo is allowed to the FortiGuard servers", "Make sure TCP port 443 is open to and from FortiGate", "Make sure UDP port 53 is blocked to force DNS over TCP"], "a": 2, "rat": "The notes state that if another firewall sits between FortiGate and the internet, make sure TCP port 443 is open and traffic is allowed from and to FortiGate, and that FortiGate can resolve update.fortinet.net.", "src": "Video · 15:00", "diff": "medium"}, {"n": 432, "ln": 41, "lesson": 8, "section": "Troubleshooting Antivirus", "topic": "Update debug", "q": "Which command sequence runs the real-time update debug to isolate update-related issues?", "opts": ["diagnose debug application update -1, diagnose debug enable, execute update-av", "diagnose autoupdate versions, diagnose debug enable, diagnose debug disable", "get system performance status, diagnose debug enable, execute update-now", "diagnose antivirus test \"get scantime\", diagnose debug enable, execute update-av"], "a": 0, "rat": "The slide shows diagnose debug application update -1, diagnose debug enable, and execute update-av to run the real-time update debug.", "src": "Video · 14:35", "diff": "medium"}, {"n": 433, "ln": 42, "lesson": 8, "section": "Troubleshooting Antivirus", "topic": "Valid contract but no detection", "q": "FortiGate has a valid antivirus contract and an updated database, but encrypted HTTPS downloads are not being scanned. What should be verified?", "opts": ["That NTurbo acceleration is enabled on the policy", "That the external malware block list is enabled", "That the firewall policy uses deep SSL inspection", "That the oversize threshold is raised to 10 MB"], "a": 2, "rat": "The troubleshooting slide for valid contracts calls out that for encrypted protocols you must select deep inspection, along with checking the policy, protocol port mapping in proxy mode, and the applied antivirus profile.", "src": "Video · 15:25", "diff": "medium"}, {"n": 434, "ln": 43, "lesson": 8, "section": "Troubleshooting Antivirus", "topic": "Scan time command", "q": "Which command displays the scan times for infected files?", "opts": ["diagnose autoupdate versions", "get system performance status", "diagnose antivirus database-info", "diagnose antivirus test \"get scantime\""], "a": 3, "rat": "The notes state diagnose antivirus test \"get scantime\" displays scan times for infected files; database-info shows database details, performance status shows last-minute statistics, and autoupdate versions shows engine and signature versions.", "src": "Video · 15:50", "diff": "medium"}, {"n": 435, "ln": 44, "lesson": 8, "section": "Troubleshooting Antivirus", "topic": "Virus statistics", "q": "An administrator wants to see how many viruses FortiGate caught in the last minute. Which command provides this?", "opts": ["execute update-av", "get system performance status", "diagnose autoupdate versions", "diagnose antivirus database-info"], "a": 1, "rat": "The slide shows get system performance status returning Virus caught: 100 total in 1 minute, with the callout stating it displays virus statistics for the last one minute.", "src": "Video · 15:50", "diff": "easy"}, {"n": 436, "ln": 1, "lesson": 9, "section": "Inspection Modes and SSL", "topic": "HTTP filter trigger", "q": "For unencrypted HTTP traffic, at which point in the connection does FortiGate web filtering evaluate the request?", "opts": ["When the client sends the HTTP GET containing the URL", "When the client sends its DNS request for the site", "When the TCP SYN reaches FortiGate", "When the server returns its SYN/ACK"], "a": 0, "rat": "The sequence diagram shows DNS and the TCP three-way handshake passing untouched; the Web Filter acts on the HTTP GET, which carries the URL information used for web filtering.", "src": "Video · 2:05", "diff": "easy"}, {"n": 437, "ln": 2, "lesson": 9, "section": "Inspection Modes and SSL", "topic": "Domain overblocking", "q": "Filtering blogs by domain on a multi-author blog host blocks far more than intended. What is the suggested fix?", "opts": ["Rate the site by its server IP address instead of by its domain name", "Block on a more specific part of the URL, such as one blog's path", "Override the blog host's domain rating to the Unrated category locally", "Switch the web filter profile from proxy-based to flow-based inspection mode"], "a": 1, "rat": "The notes explain that each blog on a host like tumblr.com is separate content by different authors, so filtering by domain can block too much; be more specific and block based on parts of the URL, for example tumblr.com/hacking.", "src": "Video · 1:40", "diff": "medium"}, {"n": 438, "ln": 3, "lesson": 9, "section": "Inspection Modes and SSL", "topic": "SNI vs CN", "q": "With SSL certificate inspection, where does FortiGate obtain the FQDN to rate if the Client Hello contains no SNI extension?", "opts": ["From the HTTP Host header inside the decrypted payload", "From a reverse DNS lookup of the destination server IP", "From the CN field in the server certificate", "From the Server Hello Done message sent by the server"], "a": 2, "rat": "SSL certificate inspection uses the SNI in the Client Hello; if SNI is not present, FortiGate uses the CN field in the server certificate to obtain the FQDN.", "src": "Video · 2:30", "diff": "medium"}, {"n": 439, "ln": 4, "lesson": 9, "section": "Inspection Modes and SSL", "topic": "SNI-less misrating", "q": "A browser without SNI support connects to youtube.com, whose certificate CN is google.com. With SSL certificate inspection, what happens?", "opts": ["FortiGate falls back to full SSL inspection automatically", "FortiGate blocks the session because the CN and FQDN do not match", "FortiGate treats the session as google.com and applies the google.com category", "FortiGate rates the site as unrated and applies the unrated action"], "a": 2, "rat": "The notes explain that without SNI, FortiGate assumes, incorrectly, that you are connecting to google.com and uses the google.com category instead of the youtube.com category.", "src": "Video · 2:55", "diff": "hard"}, {"n": 440, "ln": 5, "lesson": 9, "section": "Inspection Modes and SSL", "topic": "Why certificate inspection suffices", "q": "Why does SSL certificate inspection work correctly with web filtering even though the traffic is not decrypted?", "opts": ["FortiGuard decrypts the traffic on FortiGate's behalf in the cloud", "Web filtering needs the hostname, not the full payload", "FortiGate caches decrypted pages from earlier proxy sessions", "The browser sends the full URL in clear text inside TLS"], "a": 1, "rat": "The notes state SSL certificate inspection works correctly with web filtering because the full payload does not need to be inspected; the FQDN comes from the SNI or certificate CN.", "src": "Video · 2:55", "diff": "medium"}, {"n": 441, "ln": 6, "lesson": 9, "section": "Inspection Modes and SSL", "topic": "Flow vs proxy", "q": "Which statement correctly contrasts proxy-based with flow-based web filtering inspection?", "opts": ["Proxy-based is the default mode and uses fewer resources, but it offers fewer category actions", "Both modes offer identical actions based on FortiGuard categorization and use the same resources", "Flow-based buffers the whole response before deciding an action, so it adds the most latency", "Proxy-based buffers and examines traffic as a whole, with more options but higher resource use"], "a": 3, "rat": "Flow-based is the default, needs fewer resources and scans faster, but has fewer features and category actions. Proxy-based buffers traffic and examines it as a whole: more thorough, more options, more resource intensive.", "src": "Video · 3:20", "diff": "medium"}, {"n": 442, "ln": 7, "lesson": 9, "section": "Inspection Modes and SSL", "topic": "Transparent proxy behavior", "q": "When proxy-based inspection blocks a web connection, what can the proxy do that also contributes to added latency?", "opts": ["Redirect the client to a FortiGuard portal for re-authentication before the retry", "Send the client a replacement message, after analyzing and possibly changing headers", "Reset the TCP handshake before the client's HTTP GET request is ever sent to the server", "Drop the packets silently without notifying the client, then close the session"], "a": 1, "rat": "The notes say the transparent proxy analyzes and may change headers such as HTTP host and URL; if a profile blocks the connection, the proxy can send a replacement message to the client. This adds latency.", "src": "Video · 3:45", "diff": "hard"}, {"n": 443, "ln": 8, "lesson": 9, "section": "Inspection Modes and SSL", "topic": "Policy requirements", "q": "What must a firewall policy include for web filtering of HTTPS traffic to take effect?", "opts": ["A web filter profile and an SSL inspection profile, such as certificate-inspection", "A web filter profile and an application control sensor for the HTTPS signature", "An SSL inspection profile set to Protecting SSL Server, with no web filter profile", "Only a web filter profile, because SSL inspection is optional for HTTPS traffic"], "a": 0, "rat": "The inspection-modes slide states the firewall policy must include an SSL inspection profile and a web filter profile; the notes give certificate-inspection as the example.", "src": "Video · 4:10", "diff": "easy"}, {"n": 444, "ln": 9, "lesson": 9, "section": "Inspection Modes and SSL", "topic": "Read-only profile", "q": "An administrator wants SSL certificate inspection on a policy without building a new profile. What can be selected?", "opts": ["The deep-inspection profile edited to certificate mode", "The no-inspection profile with SNI check enabled", "The custom-deep-inspection profile", "The read-only preconfigured certificate-inspection profile"], "a": 3, "rat": "FortiGate has a read-only preconfigured profile named certificate-inspection that can be selected in the firewall policy.", "src": "Video · 4:35", "diff": "easy"}, {"n": 445, "ln": 10, "lesson": 9, "section": "Inspection Modes and SSL", "topic": "Custom certificate profile", "q": "When creating a custom SSL certificate inspection profile in Security Profiles > SSL/SSH Inspection, which options are selected?", "opts": ["Multiple Clients Connecting to Multiple Servers and SSL Certificate Inspection", "Protecting SSL Server and Full SSL Inspection", "Multiple Clients Connecting to Multiple Servers and Full SSL Inspection", "Protecting SSL Server and SSL Certificate Inspection"], "a": 0, "rat": "The steps are: Create New, select Multiple Clients Connecting to Multiple Servers, click SSL Certificate Inspection, then choose the Server certificate SNI check action.", "src": "Video · 4:35", "diff": "medium"}, {"n": 446, "ln": 11, "lesson": 9, "section": "Inspection Modes and SSL", "topic": "HTTPS port mapping", "q": "In the Protocol Port Mapping of an SSL/SSH inspection profile, how do you inspect HTTPS on both 443 and 10443?", "opts": ["Enter both ports in the HTTPS field separated by a comma", "Create a second profile for port 10443", "Enable Inspect all ports; custom ports cannot be listed", "Add port 10443 in the firewall policy service instead"], "a": 0, "rat": "The callout on the HTTPS field (443,10443) says you can specify more than one port number, separated by a comma.", "src": "Video · 4:35", "diff": "easy"}, {"n": 447, "ln": 12, "lesson": 9, "section": "Inspection Modes and SSL", "topic": "SNI check setting", "q": "In an SSL/SSH inspection profile, Server certificate SNI check is set to Strict. What does FortiGate do when the SNI does not match the CN or SAN fields?", "opts": ["Always rates the URL based on the FQDN", "Allows the session and logs a warning", "Rates the URL using the CN domain instead of the SNI", "Closes the client connection"], "a": 3, "rat": "Enable uses the CN domain instead of the SNI on a mismatch; Strict closes the client connection; Disable always rates URLs on the FQDN. The callout notes this action applies only in proxy-based inspection.", "src": "Video · 5:00", "diff": "hard"}, {"n": 448, "ln": 13, "lesson": 9, "section": "Web Filter Profiles", "topic": "Rating error option", "q": "What typically causes the rating errors that the Web Filter rating option 'Allow websites when a rating error occurs' is meant to handle?", "opts": ["The SNI in the TLS Client Hello does not match the server certificate's common name", "The Web Filter cache TTL has expired before FortiGuard returned a new rating", "Services needing a FortiGuard license, such as FortiGuard filtering, activated without one", "The URL matches a Regular Expression entry in the static URL filter before the category lookup"], "a": 2, "rat": "The notes explain that if you activate services that require a FortiGuard license (such as FortiGuard filtering) but do not have a license, you get rating errors; this setting allows access to websites that return a rating error from the FortiGuard Web Filter service.", "src": "Video · 5:25", "diff": "medium"}, {"n": 449, "ln": 14, "lesson": 9, "section": "Web Filter Profiles", "topic": "Rate by domain and IP", "q": "With Rate URLs by domain and IP address enabled, how does FortiGate decide when FortiGuard returns different categories for the IP address and the domain?", "opts": ["It uses a rating weight, hard-coded in FortiOS, to pick the IP or domain result", "It always uses the domain category and discards the IP address rating", "It treats the mismatch as a rating error and blocks access to the site by default", "It always applies the stricter of the two actions configured for the categories"], "a": 0, "rat": "FortiGate sends the domain name and the IP address (except private IPs) to FortiGuard; if they return different categories, it uses the rating weight of the IP or domain, which is hard coded in FortiOS.", "src": "Video · 5:50", "diff": "hard"}, {"n": 450, "ln": 15, "lesson": 9, "section": "Web Filter Profiles", "topic": "Private IPs in rating", "q": "With Rate URLs by domain and IP address enabled, which addresses are NOT sent to FortiGuard for rating?", "opts": ["Public IPv4 addresses", "Addresses of HTTPS servers", "IP addresses returned by DNS", "Private IP addresses"], "a": 3, "rat": "The notes say FortiGate always sends the URL domain name and the IP address of the TCP/IP packet, except private IP addresses, to FortiGuard for rating.", "src": "Video · 5:50", "diff": "medium"}, {"n": 451, "ln": 16, "lesson": 9, "section": "Web Filter Profiles", "topic": "Proxy feature set", "q": "Which requirement applies to the proxy-based web filter feature set in FortiOS 7.6?", "opts": ["The FortiGate model must have more than 2 GB of RAM", "A FortiSandbox must be connected", "The profile must be applied to a flow-based firewall policy", "The Web Filter cache must be disabled"], "a": 0, "rat": "Proxy-based profiles are applied to proxy-based firewall policies and are supported only on models with more than 2 GB RAM; FortiOS no longer supports proxy-related features on models with 2 GB of RAM or less.", "src": "Video · 6:15", "diff": "medium"}, {"n": 452, "ln": 17, "lesson": 9, "section": "Web Filter Profiles", "topic": "Proxy-only option", "q": "Which web filter profile option is available only with the proxy-based feature set?", "opts": ["Enforce Safe Search", "FortiGuard Category Based Filter", "Log all search keywords", "Static URL Filter"], "a": 2, "rat": "The proxy-based profile screenshot highlights Log all search keywords with the callout Feature available only in proxy based; the other options also appear in the flow-based profile.", "src": "Video · 6:15", "diff": "medium"}, {"n": 453, "ln": 18, "lesson": 9, "section": "FortiGuard Category Filtering", "topic": "Category actions", "q": "Which set lists the actions available per category in the FortiGuard Category Based Filter?", "opts": ["Allow, Block, Reset, Monitor, Authenticate", "Allow, Block, Exempt, Monitor, Warning", "Allow, Deny, Quarantine, Warning, Authenticate", "Allow, Monitor, Block, Warning, Authenticate"], "a": 3, "rat": "The FortiGuard category filter offers Allow, Monitor, Block, Warning and Authenticate. Exempt belongs to the static URL filter, not the category filter.", "src": "Video · 6:40", "diff": "easy"}, {"n": 454, "ln": 19, "lesson": 9, "section": "FortiGuard Category Filtering", "topic": "FortiManager as FortiGuard", "q": "Category filtering needs a live connection to FortiGuard with an active contract. What alternative is offered?", "opts": ["Use FortiManager as a local FortiGuard server with downloaded databases", "Switch the web filter profile to proxy-based inspection mode instead", "Enable the Web Filter cache so that no FortiGuard connection is needed", "Configure local web rating overrides for every site that users are expected to visit"], "a": 0, "rat": "FortiManager can be used instead of FortiGuard: download the databases to FortiManager and configure FortiGate to validate categories against it.", "src": "Video · 7:05", "diff": "medium"}, {"n": 455, "ln": 20, "lesson": 9, "section": "FortiGuard Category Filtering", "topic": "Monitor action", "q": "What does the Monitor action do for a FortiGuard category?", "opts": ["Blocks access to sites in the category but logs each attempt", "Allows access to sites in the category and creates a security log", "Shows a warning page that users must accept before access is allowed", "Allows access to sites in the category without creating any log"], "a": 1, "rat": "Monitor allows access to the sites in the category and creates a security log for analysis purposes.", "src": "Video · 7:30", "diff": "easy"}, {"n": 456, "ln": 21, "lesson": 9, "section": "FortiGuard Category Filtering", "topic": "Warning action logs", "q": "A category is set to Warning. A user opens a site, sees the warning page, and clicks Proceed. What does the web filter log show?", "opts": ["A single passthrough entry, logged only after the user clicks Proceed", "A blocked entry for the first attempt, then a passthrough entry", "No entries at all, because the Warning action does not generate logs", "A single monitor entry recording that the warning page was shown"], "a": 1, "rat": "The first attempt is blocked and logged with action blocked; after Proceed, another log is generated with action passthrough and the message that the URL belongs to a category with warnings enabled.", "src": "Video · 7:55", "diff": "medium"}, {"n": 457, "ln": 22, "lesson": 9, "section": "FortiGuard Category Filtering", "topic": "Warning page content", "q": "By default, what information does the Warning replacement message give the user?", "opts": ["The URL and its corresponding category", "The administrator's contact details and a login form", "The policy ID and the name of the web filter profile", "The FortiGuard server IP that rated the site"], "a": 0, "rat": "The notes say the warning replacement message by default provides information about the URL and its category, and the user can click Proceed. The warning interval is customizable.", "src": "Video · 7:55", "diff": "easy"}, {"n": 458, "ln": 23, "lesson": 9, "section": "FortiGuard Category Filtering", "topic": "Authenticate setup", "q": "Which steps configure the Authenticate category action?", "opts": ["Define users and a group, set the action to Authenticate, and select a user group", "Enable FortiGuard anycast, set action to Authenticate, and enable safe search", "Set action to Authenticate and add an LDAP server to the SSL inspection profile", "Create a web rating override and set its category to Authenticate"], "a": 0, "rat": "To configure Authenticate: define users and a group, set the action to Authenticate, and select a user group allowed to authenticate. The interval is also customizable.", "src": "Video · 8:20", "diff": "medium"}, {"n": 459, "ln": 24, "lesson": 9, "section": "FortiGuard Category Filtering", "topic": "Authenticate interval", "q": "After a user successfully authenticates to reach a site in a category set to Authenticate, what happens for other websites in the same category?", "opts": ["Access is logged as Monitor for the rest of the day", "The user must authenticate again for each new website", "The user is not prompted again until the configured interval timer expires", "The category is permanently changed to Allow for that user"], "a": 2, "rat": "Users are not prompted to authenticate again for other websites in the same category until the timer expires.", "src": "Video · 8:20", "diff": "hard"}, {"n": 460, "ln": 25, "lesson": 9, "section": "FortiGuard Category Filtering", "topic": "Replacement messages", "q": "Where do you customize the pages that ask the user to proceed and to enter credentials for the Authenticate action?", "opts": ["User & Authentication > User Groups", "System > Replacement Messages", "Security Profiles > Web Filter", "System > FortiGuard"], "a": 1, "rat": "Like Warning, FortiGate displays a replacement message to proceed and a second one asking for credentials; these are customized in System > Replacement Messages.", "src": "Video · 8:45", "diff": "easy"}, {"n": 461, "ln": 26, "lesson": 9, "section": "FortiGuard Category Filtering", "topic": "Web rating override", "q": "What is the effect of creating a web rating override for a URL in Security Profiles > Web Rating Overrides?", "opts": ["It changes the action for that URL's category in all profiles", "It exempts the URL from all security inspection", "It changes the category assigned to the website, not the category action", "It submits the URL to FortiGuard for re-evaluation"], "a": 2, "rat": "A web rating override changes a website's category, not the category action; whether the action differs depends on the web filter profile settings.", "src": "Video · 9:10", "diff": "medium"}, {"n": 462, "ln": 27, "lesson": 9, "section": "Static URL Filter and Inspection Order", "topic": "URL filter evaluation", "q": "How are entries in a static URL filter evaluated?", "opts": ["From top to bottom against the configured URLs", "By most specific match regardless of order", "Regular expressions first, then wildcards, then simple entries", "Only the first entry with the Block action is considered"], "a": 0, "rat": "The slide states URLs are checked against configured URLs in the URL filter from top to bottom. There are three pattern types (Simple, Regular Expression, Wildcard) and four actions.", "src": "Video · 9:35", "diff": "easy"}, {"n": 463, "ln": 28, "lesson": 9, "section": "Static URL Filter and Inspection Order", "topic": "URL filter Exempt", "q": "In a static URL filter entry, how does the Exempt action differ from Allow?", "opts": ["Exempt applies only to wildcard URL patterns, while Allow applies only to simple and regex patterns", "Exempt creates a log entry for matching traffic, while Allow permits it without logging", "Exempt bypasses all further security inspection; Allow still passes traffic to later checks", "Exempt blocks the page and shows a replacement message, while Allow permits the page"], "a": 2, "rat": "Exempt lets traffic from trusted sources bypass all security inspections. Allow permits access but still passes traffic to FortiGuard web filter, content filter, web script filters and antivirus.", "src": "Video · 9:35", "diff": "medium"}, {"n": 464, "ln": 29, "lesson": 9, "section": "Static URL Filter and Inspection Order", "topic": "URL filter Monitor", "q": "A static URL filter entry uses the Monitor action. How is matching traffic handled?", "opts": ["It is allowed without any log entry, but is still subject to the other security inspections", "It is blocked, logged, and the user sees a replacement message", "It is allowed and bypasses all other security profile inspections", "It is allowed and logged, and still subject to other security inspections"], "a": 3, "rat": "Monitor allows the traffic while creating log entries; the traffic is still subject to all the other security profile inspections.", "src": "Video · 9:35", "diff": "medium"}, {"n": 465, "ln": 30, "lesson": 9, "section": "Static URL Filter and Inspection Order", "topic": "Inspection order", "q": "With several web filter features enabled, in what order does FortiGate inspect a URL?", "opts": ["Static URL filter, then advanced filters, then FortiGuard category filter", "FortiGuard category filter, then static URL filter, then advanced filters", "Static URL filter, then FortiGuard category filter, then advanced filters", "Advanced filters, then static URL filter, then FortiGuard category filter"], "a": 2, "rat": "The order is the local static URL filter, then FortiGuard category filtering, then advanced filters (such as safe search or removing ActiveX). If there is no match, FortiGate moves to the next check.", "src": "Video · 10:00", "diff": "easy"}, {"n": 466, "ln": 31, "lesson": 9, "section": "Static URL Filter and Inspection Order", "topic": "Static filter sources", "q": "Besides manual URL patterns, what can the static URL filter block?", "opts": ["Any site not in the FortiGuard cache", "Malicious URLs discovered by FortiSandbox", "Sites that fail the SNI check", "Sites rated by FortiManager only"], "a": 1, "rat": "The notes list static URL filtering as blocking or exempting web pages from specific sources, or blocking malicious URLs discovered by FortiSandbox; the profile also shows Block malicious URLs discovered by FortiSandbox.", "src": "Video · 1:40", "diff": "medium"}, {"n": 467, "ln": 32, "lesson": 9, "section": "Troubleshooting and Logs", "topic": "Debug rating flags", "q": "In diagnose debug rating output, what does the I flag on a FortiGuard server mean?", "opts": ["The server IP was returned from DNS", "The server failed", "The server is being timed", "The contract server was contacted"], "a": 3, "rat": "The notes define the flags: D (IP returned from DNS), I (contract server contacted), T (being timed), F (failed).", "src": "Video · 10:50", "diff": "hard"}, {"n": 468, "ln": 33, "lesson": 9, "section": "Troubleshooting and Logs", "topic": "Curr Lost", "q": "In diagnose debug rating output, what does the Curr Lost column indicate?", "opts": ["The number of rating requests sent to that FortiGuard server", "The total number of lost FortiGuard requests since the device last rebooted", "The server weight, which decreases with each successful packet", "The consecutive lost FortiGuard requests, reset to 0 when one succeeds"], "a": 3, "rat": "Curr Lost is the current number of consecutive lost FortiGuard requests and resets to 0 when one packet succeeds. Total Lost is the total, FortiGuard-requests counts requests sent, and Weight decreases with successful packets.", "src": "Video · 10:50", "diff": "hard"}, {"n": 469, "ln": 34, "lesson": 9, "section": "Troubleshooting and Logs", "topic": "Anycast and ports", "q": "FortiGuard rating requests fail because HTTPS port 443 is blocked upstream. Which CLI change allows FortiGate to use UDP ports 443, 53 or 8888?", "opts": ["set sni-server-cert-check strict in the SSL inspection profile", "set fortiguard-anycast disable under config system fortiguard", "Enable Override FortiGuard Servers in the GUI", "set protocol https under config system fortiguard"], "a": 1, "rat": "Changing the default HTTPS 443 communication requires disabling FortiGuard anycast on the CLI (config system fortiguard, set fortiguard-anycast disable), then setting protocol and port. The notes warn these ports are not guaranteed open in all networks.", "src": "Video · 11:40", "diff": "medium"}, {"n": 470, "ln": 35, "lesson": 9, "section": "Troubleshooting and Logs", "topic": "Web Filter cache", "q": "The number of FortiGuard rating requests is too high. Which setting reduces them, and what is its default TTL?", "opts": ["Web Filter cache in the web filter profile, 24 hours", "Email Filter cache in System > FortiGuard, 30 minutes", "Web Filter cache in System > FortiGuard, 60 minutes", "Rate URLs by domain and IP in the profile, 60 minutes"], "a": 2, "rat": "Enabling Web Filter cache keeps recent rating responses in memory so known URLs are not sent for rating; the default TTL is 60 minutes.", "src": "Video · 12:05", "diff": "easy"}, {"n": 471, "ln": 36, "lesson": 9, "section": "Troubleshooting and Logs", "topic": "Policy misconfiguration", "q": "FortiGuard is reachable but web filtering is not happening. Which check is NOT among the recommended verifications?", "opts": ["Confirm the SSL Inspection field uses at least a certificate-inspection profile", "Confirm the Email Filter cache TTL matches the Web Filter cache TTL", "Compare the policy inspection mode with the web filter profile feature set", "Confirm the correct web filter profile is applied to the firewall policy"], "a": 1, "rat": "The troubleshooting steps are: at least certificate-inspection for encrypted protocols, the correct web filter profile on the policy, and a matching inspection mode and feature set.", "src": "Video · 12:30", "diff": "easy"}, {"n": 472, "ln": 37, "lesson": 9, "section": "Troubleshooting and Logs", "topic": "Web filter log", "q": "Where are web filter logs viewed, and in what format is the downloaded raw log?", "opts": ["Log & Report > Forward Traffic > Web Filter; a comma-separated CSV spreadsheet file", "Security Profiles > Web Filter > Logs; a structured JSON export file", "System > FortiGuard > Web Filter Logs; a binary packet capture file", "Log & Report > Security Events > Web Filter; a plaintext syslog-format file"], "a": 3, "rat": "Web filter logs are under Log & Report > Security Events > Web Filter and show action, policy ID, profile, category and message. The download icon provides raw log data as a plaintext syslog-format file.", "src": "Video · 12:55", "diff": "easy"}, {"n": 473, "ln": 1, "lesson": 10, "section": "IPS Components and Sensors", "topic": "IPS components", "q": "Which set lists the three components that make up the FortiGate IPS?", "opts": ["IPS signature databases, URL rating servers, and the proxy engine", "Protocol decoders, the sandbox analyzer, and the antivirus engine", "IPS signature databases, protocol decoders, and the IPS engine", "The IPS engine, DLP dictionaries, and certificate inspection profiles"], "a": 2, "rat": "The IPS slide callout lists the components as IPS signature databases, protocol decoders, and the IPS engine.", "src": "Video · 1:15", "diff": "easy"}, {"n": 474, "ln": 2, "lesson": 10, "section": "IPS Components and Sensors", "topic": "Protocol decoders", "q": "A client sends malformed, invalid commands to an internal server in traffic that does not conform to the protocol specification. Which IPS component detects this error?", "opts": ["The botnet C&C database", "The application category filter", "The FortiGuard URL rating service", "The protocol decoders"], "a": 3, "rat": "The notes explain that protocol decoders parse each packet according to the protocol specification and detect the error when traffic sends malformed or invalid commands.", "src": "Video · 1:15", "diff": "medium"}, {"n": 475, "ln": 3, "lesson": 10, "section": "IPS Components and Sensors", "topic": "IPS engine scope", "q": "Besides IPS and protocol decoders, which function is the IPS engine also responsible for?", "opts": ["Flow-based antivirus protection", "SSL VPN tunnel negotiation", "Routing table lookups", "High availability heartbeat processing"], "a": 0, "rat": "The notes state the IPS engine is responsible for IPS and protocol decoders, plus application control, flow-based antivirus, web filtering, and email filtering.", "src": "Video · 1:15", "diff": "medium"}, {"n": 476, "ln": 4, "lesson": 10, "section": "IPS Components and Sensors", "topic": "Sensor GUI location", "q": "In the GUI, where do you create a new IPS sensor or view the predefined ones?", "opts": ["Policy & Objects > Intrusion Prevention", "Security Fabric > IPS Sensors", "Security Profiles > Intrusion Prevention", "System > FortiGuard > IPS Signature Updates"], "a": 2, "rat": "The List of IPS Signatures slide shows the Security Profiles > Intrusion Prevention path for creating sensors and viewing predefined ones.", "src": "Video · 2:30", "diff": "easy"}, {"n": 477, "ln": 5, "lesson": 10, "section": "IPS Components and Sensors", "topic": "Changing default action", "q": "In which situation is it reasonable to stop relying on a signature's default action?", "opts": ["The signature has a Critical severity rating in the database", "The vendor has released a patch for that vulnerability", "The signature targets servers rather than client endpoints", "The IPS sensor has packet logging left at Disabled"], "a": 1, "rat": "The notes say the default action is often correct, except when a vendor releases a security patch (continuing to scan wastes resources) or a custom application triggers a false positive.", "src": "Video · 2:30", "diff": "medium"}, {"n": 478, "ln": 6, "lesson": 10, "section": "IPS Components and Sensors", "topic": "False positive handling", "q": "A custom in-house application keeps triggering an IPS signature by mistake. What approach is recommended?", "opts": ["Delete the signature permanently from the active signature database", "Disable the whole IPS engine until the application is retired", "Change its action until FortiGuard modifies the signature", "Move the application traffic to a policy with web filtering only"], "a": 2, "rat": "The notes say you can change the action setting until you notify Fortinet so the FortiGuard team can modify the signature to avoid false positives.", "src": "Video · 2:30", "diff": "medium"}, {"n": 479, "ln": 7, "lesson": 10, "section": "IPS Components and Sensors", "topic": "Adding signatures", "q": "When you add a predefined signature to an IPS sensor by selecting it individually, which action does it get?", "opts": ["Always Block", "Always Monitor", "The sensor's last-used action", "Its default action"], "a": 3, "rat": "The notes say that after selecting a signature in the list, it is added to the sensor with its default action.", "src": "Video · 3:20", "diff": "easy"}, {"n": 480, "ln": 8, "lesson": 10, "section": "IPS Components and Sensors", "topic": "Filter-based signatures", "q": "What happens when you add signatures to an IPS sensor using filters?", "opts": ["FortiGate adds only the single newest signature that matches", "FortiGate creates one custom signature that combines the filters", "FortiGate adds the matches but forces their action to Monitor", "FortiGate adds all the signatures that match the filters"], "a": 3, "rat": "The notes say the second way to add signatures is using filters, and FortiGate adds all the signatures that match the filters.", "src": "Video · 3:20", "diff": "medium"}, {"n": 481, "ln": 9, "lesson": 10, "section": "IPS Components and Sensors", "topic": "rate-mode periodical", "q": "On the CLI, rate-mode is set to periodical for a rate-based signature. When does FortiGate trigger the action?", "opts": ["Every time the signature matches, regardless of any threshold", "Only after the client has been blocklisted for the Duration", "Once per day, when the daily threshold counter is reset", "When the threshold is reached within the configured Duration"], "a": 3, "rat": "The notes say that with rate-mode set to periodical, FortiGate triggers the action when the threshold is reached during the configured Duration time period.", "src": "Video · 4:10", "diff": "hard"}, {"n": 482, "ln": 10, "lesson": 10, "section": "IPS Components and Sensors", "topic": "Rate-based best practice", "q": "Which practice is recommended for rate-based signatures?", "opts": ["Apply them to every protocol for full coverage", "Apply them only to protocols you actually use", "Set Threshold to 0 so they trigger on any match", "Track By Any so statistics are kept per client"], "a": 1, "rat": "The notes say to apply rate-based signatures only to protocols you use, which saves system resources and can discourage a repeat attack.", "src": "Video · 4:10", "diff": "medium"}, {"n": 483, "ln": 11, "lesson": 10, "section": "IPS Components and Sensors", "topic": "Blocklisted client stats", "q": "While a client is temporarily blocklisted by a rate-based signature, what does FortiGate do with that client's statistics?", "opts": ["It does not track statistics for that client", "It keeps counting and extends the block time", "It resets the counters for all other clients", "It forwards the statistics to FortiGuard Labs"], "a": 0, "rat": "The notes state FortiGate does not track statistics for that client while it is temporarily blocklisted.", "src": "Video · 4:10", "diff": "hard"}, {"n": 484, "ln": 12, "lesson": 10, "section": "IPS Components and Sensors", "topic": "Sensor sequence", "q": "How are entries in an IPS sensor's IPS Signatures and Filters list processed, and where are new entries placed?", "opts": ["In sequence; new entries go to the top of the list", "All at once; new entries are sorted by severity", "In sequence; new entries go to the bottom of the list", "Randomly; new entries are sorted alphabetically"], "a": 2, "rat": "The callouts on the IPS Sensor Inspection Sequence slide say 'IPS signatures and filters are processed in sequence' and 'New entries are placed at the bottom of the list'.", "src": "Video · 5:00", "diff": "medium"}, {"n": 485, "ln": 13, "lesson": 10, "section": "IPS Components and Sensors", "topic": "Filter efficiency", "q": "Which IPS sensor design choice increases RAM usage?", "opts": ["Placing likely matches at the top of the list", "Adding an individual signature set to Monitor", "Very large signature groups in each filter", "Leaving packet logging at Disabled for filters"], "a": 2, "rat": "The notes say to avoid very large signature groups in each filter, which increase RAM use; too many filters increase evaluations and CPU usage.", "src": "Video · 5:00", "diff": "hard"}, {"n": 486, "ln": 14, "lesson": 10, "section": "IPS Components and Sensors", "topic": "False-positive outbreak", "q": "During a false-positive outbreak, what can you do so you can keep watching the signature in the IPS logs while you investigate?", "opts": ["Delete the filter that contains the signature and recreate it later", "Add the signature individually and set its action to Monitor", "Set the IPS engine to bypass mode with the diagnose ipsmonitor tool", "Move the triggered signature to the bottom of the list with Block set"], "a": 1, "rat": "The notes say that in a false-positive outbreak you can add the triggered signature as an individual signature and set the action to Monitor, allowing you to monitor events in IPS logs while investigating.", "src": "Video · 5:00", "diff": "medium"}, {"n": 487, "ln": 15, "lesson": 10, "section": "IPS Components and Sensors", "topic": "IP exemptions", "q": "Where can IPS IP exemptions be configured?", "opts": ["Only under signature filters in an IPS sensor", "Globally, under the config ips global settings", "In the IPS section of each firewall policy", "Only under individual signatures in an IPS sensor"], "a": 3, "rat": "The Configuring IP Exemptions slide states 'Only configurable under individual IPS signatures', and the notes add that each signature can have multiple exemptions.", "src": "Video · 5:25", "diff": "medium"}, {"n": 488, "ln": 16, "lesson": 10, "section": "IPS Components and Sensors", "topic": "Packet logging", "q": "What does enabling packet logging on an IPS signature do, and what is its cost?", "opts": ["Logs only the session summary; it has no measurable impact on resources", "Sends packets to FortiGuard for a verdict; it adds latency to every flow", "Mirrors packets to another port; it requires a dedicated mirror interface", "Copies packets for later analysis; it uses a lot of storage, memory, and CPU"], "a": 3, "rat": "The callout says packet logging 'Copies the packets for later analysis', and the notes say it consumes significant storage, memory, and processing resources.", "src": "Video · 5:50", "diff": "medium"}, {"n": 489, "ln": 17, "lesson": 10, "section": "IPS Components and Sensors", "topic": "Signature hold", "q": "With override-signature-hold-by-id enabled, what happens to a new FortiGuard IPS signature during the signature-hold-time?", "opts": ["It is disabled entirely until an administrator approves it", "It runs as Monitor and logs 'signature is on hold'", "Its action is forced to Block to protect against zero-days", "It is applied only to traffic from addresses in exemptions"], "a": 1, "rat": "The notes say that during the time defined by signature-hold-time, the action is set to Monitor to avoid false positives, with a log containing the message 'signature is on hold'.", "src": "Video · 5:50", "diff": "hard"}, {"n": 490, "ln": 18, "lesson": 10, "section": "Applying and Monitoring IPS", "topic": "SSL inspection for IPS", "q": "Why should an IPS-enabled firewall policy usually use the deep-inspection SSL profile?", "opts": ["Some vulnerabilities exist only in encrypted sessions, and the payload must be parsed", "Deep inspection is required before an IPS sensor can be selected in any policy", "Certificate inspection disables the IPS engine for any traffic that uses TLS", "Deep inspection lets the IPS engine skip protocol decoding for encrypted traffic"], "a": 0, "rat": "The notes say certain vulnerabilities apply only to encrypted connections and FortiGate can't identify the threat reliably if it can't parse the payload, so an SSL inspection profile, usually deep-inspection, is needed.", "src": "Video · 7:05", "diff": "medium"}, {"n": 491, "ln": 19, "lesson": 10, "section": "Applying and Monitoring IPS", "topic": "Default IPS logging", "q": "By default, what does FortiGate log for a firewall policy with IPS applied?", "opts": ["Nothing at all, until packet logging is enabled on each IPS signature", "Only the sessions that IPS dropped, never the ones it only monitored", "All security events, so traffic blocked or monitored by IPS is visible", "Every single session the policy processes, whether or not IPS acted on it"], "a": 2, "rat": "The notes state that by default FortiGate logs all security events, so you can see any traffic being blocked or monitored by IPS.", "src": "Video · 7:05", "diff": "medium"}, {"n": 492, "ln": 20, "lesson": 10, "section": "Applying and Monitoring IPS", "topic": "Finding false negatives", "q": "You suspect traffic that should be blocked is passing through an IPS-enabled policy. Which logging change helps identify these false negatives?", "opts": ["Set Log Allowed Traffic to Security Events", "Turn off Log Allowed Traffic on the policy", "Enable Decrypted Traffic Mirror on the policy", "Set Log Allowed Traffic to All Sessions"], "a": 3, "rat": "The notes say to change Log Allowed Traffic to All Sessions, which logs all traffic processed by the policy, not just blocked or monitored traffic, helping identify false negative events.", "src": "Video · 7:30", "diff": "medium"}, {"n": 493, "ln": 21, "lesson": 10, "section": "Applying and Monitoring IPS", "topic": "IPS log location", "q": "If security events logging is enabled on policies applying IPS, where are the IPS logs found?", "opts": ["Security Profiles > Intrusion Prevention, in the sensor list", "Dashboard > Network, in the top sources widget", "Log & Report > Security Events, under Intrusion Prevention", "System > FortiGuard, in the IPS definitions entry"], "a": 2, "rat": "The IPS Logging slide shows Log & Report > Security Events with the Intrusion Prevention widget, and the notes say you view the logs by clicking Intrusion Prevention.", "src": "Video · 8:45", "diff": "easy"}, {"n": 494, "ln": 22, "lesson": 10, "section": "Applying and Monitoring IPS", "topic": "Attack references", "q": "In the IPS Log Details pane, which fields are grouped as the attack references?", "opts": ["Attack Name, Attack ID, and Reference URL", "Threat Level, Threat Score, and Level", "Policy ID, Policy UUID, and the Policy Type", "Service, Profile, and Action result"], "a": 0, "rat": "The Log Details screenshot shows the 'Attack references' callout pointing to Attack Name, Attack ID, and Reference fields under the Intrusion Prevention section.", "src": "Video · 8:45", "diff": "hard"}, {"n": 495, "ln": 23, "lesson": 10, "section": "IPS Troubleshooting", "topic": "Fail open trigger", "q": "What condition triggers IPS fail open?", "opts": ["CPU usage stays above 90 percent for more than one full minute", "The IPS signature package fails to update from FortiGuard", "The FortiGate enters conserve mode because disk space is low", "The IPS socket buffer is full and new packets can't be queued"], "a": 3, "rat": "The IPS Fail Open slide states fail open is triggered when the IPS socket buffer is full and new packets can't be added for inspection.", "src": "Video · 10:25", "diff": "medium"}, {"n": 496, "ln": 24, "lesson": 10, "section": "IPS Troubleshooting", "topic": "Fail open default", "q": "What is the default fail-open setting, and what happens to new packets when the IPS buffer is full?", "opts": ["Enabled; the new packets bypass inspection", "Disabled; the new packets are dropped", "Disabled; the IPS engine restarts automatically", "Enabled; each session is reset with a TCP RST"], "a": 1, "rat": "The callouts read 'Disable - drop the new packet (default)' and 'Default disable and packets are dropped!'.", "src": "Video · 10:25", "diff": "medium"}, {"n": 497, "ln": 25, "lesson": 10, "section": "IPS Troubleshooting", "topic": "Fail open CLI", "q": "Under which CLI configuration branch is the fail-open option set?", "opts": ["config system global", "config ips global", "config ips sensor", "config firewall policy"], "a": 1, "rat": "The slide shows 'config ips global' followed by 'set fail-open <enable|disable>'.", "src": "Video · 10:25", "diff": "easy"}, {"n": 498, "ln": 26, "lesson": 10, "section": "IPS Troubleshooting", "topic": "Fail open log fields", "q": "A FortiGate fail open entry log reads logdesc=\"IPS session scan paused\" and msg=\"IPS session scan, enter fail open mode\". Which other field in that log shows what happened to the new packets?", "opts": ["level=\"critical\"", "action=\"drop\"", "subtype=\"system\"", "type=\"event\""], "a": 1, "rat": "The IPS fail open entry log on the slide highlights action=\"drop\", with the callout 'Default disable and packets are dropped!'.", "src": "Video · 10:25", "diff": "medium"}, {"n": 499, "ln": 27, "lesson": 10, "section": "IPS Troubleshooting", "topic": "Fail open tuning", "q": "An IPS sensor protects only Windows servers and fail-open events are frequent. Which tuning step does the guidance support?", "opts": ["Enable packet logging for every signature in the sensor", "Remove Linux signatures that the Windows servers don't need", "Add all operating systems to the sensor's filter for coverage", "Apply the same sensor to internal-to-internal policies as well"], "a": 1, "rat": "The slide says to create IPS profiles for the traffic type (a Windows-server sensor doesn't need Linux signatures) and to disable IPS on internal-to-internal policies.", "src": "Video · 10:25", "diff": "medium"}, {"n": 500, "ln": 28, "lesson": 10, "section": "IPS Troubleshooting", "topic": "ipsmonitor option 5", "q": "In diag test application ipsmonitor, how does option 5 differ from option 2?", "opts": ["Option 5 shuts the engine down completely; option 2 only pauses its inspection", "Option 5 restarts every IPS engine; option 2 displays IPS engine information", "Option 5 keeps the engine running but stops inspection; option 2 shuts it down", "Option 5 enables fail-open mode; option 2 resets the signature hold timer"], "a": 2, "rat": "The slide shows 2: Toggle IPS engine enable/disable status ('Shuts down IPS engine completely') and 5: Toggle bypass status ('IPS engine remains active, but does not inspect traffic').", "src": "Video · 9:10", "diff": "hard"}, {"n": 501, "ln": 29, "lesson": 10, "section": "IPS Troubleshooting", "topic": "Bypass still high CPU", "q": "CPU usage stays high even after you enable IPS bypass mode. What does this usually indicate?", "opts": ["Too many firewall policies with logging set to All Sessions on them", "An expired FortiGuard license blocking further signature downloads", "A normal condition while the engine rebuilds its signature database", "A problem in the IPS engine that should be reported to Fortinet support"], "a": 3, "rat": "The notes say that if CPU use remains high after enabling IPS bypass mode, it usually indicates a problem in the IPS engine, which you must report to Fortinet support.", "src": "Video · 9:10", "diff": "medium"}, {"n": 502, "ln": 30, "lesson": 10, "section": "IPS Troubleshooting", "topic": "Restarting IPS", "q": "Which ipsmonitor option is recommended for restarting IPS so that all IPS-related processes restart correctly?", "opts": ["Option 1", "Option 99", "Option 2", "Option 5"], "a": 1, "rat": "The slide lists 99: Restart all IPS engines and monitor, and the notes say using option 99 guarantees all IPS-related processes restart correctly.", "src": "Video · 9:35", "diff": "easy"}, {"n": 503, "ln": 31, "lesson": 10, "section": "Application Control Fundamentals", "topic": "Inspection mode", "q": "Application control is configured on a proxy-based firewall policy. Which inspection mode does it use?", "opts": ["Flow-based, because it relies on the IPS engine", "Proxy-based, matching the firewall policy's mode", "Flow-based for TCP and proxy-based for UDP", "Whichever mode the SSL inspection profile sets"], "a": 0, "rat": "The notes say application control can be configured in proxy-based and flow-based policies, but because it uses the IPS engine, inspection is always flow-based.", "src": "Video · 11:15", "diff": "medium"}, {"n": 504, "ln": 32, "lesson": 10, "section": "Application Control Fundamentals", "topic": "Identification method", "q": "How does application control identify an application?", "opts": ["It looks up the destination port number in the predefined services list", "It checks the destination IP address against the routing table entries", "It matches known patterns against the application's transmission patterns", "It relies on the source MAC address learned from the ARP table entries"], "a": 2, "rat": "The notes explain application control identifies applications by matching known patterns to the application transmission patterns, so identification is accurate only if the pattern is unique.", "src": "Video · 11:15", "diff": "medium"}, {"n": 505, "ln": 33, "lesson": 10, "section": "Application Control Fundamentals", "topic": "P2P suitability", "q": "Why is application control well suited to detecting P2P protocols?", "opts": ["It doesn't depend on built-in protocol states, and P2P uses port randomization", "P2P applications always use fixed, well-known ports that are easy to match", "P2P traffic is never encrypted, so payload inspection is always possible", "It blocks every session that a client opens to more than one destination"], "a": 0, "rat": "The notes say application control doesn't operate using built-in protocol states, so it is better suited for P2P protocols that use port randomization, pinholes, and changing encryption patterns.", "src": "Video · 11:40", "diff": "hard"}, {"n": 506, "ln": 34, "lesson": 10, "section": "Application Control Fundamentals", "topic": "P2P characteristics", "q": "Which characteristics describe a peer-to-peer download?", "opts": ["One client, many servers, and dynamic port numbers", "Many clients, one server, and fixed port numbers", "One client, one server, and mandatory encryption", "Many clients, many servers, and static port numbers"], "a": 0, "rat": "The Peer-to-Peer Architecture slide lists one client, many servers, dynamic port numbers, and optionally dynamic encryption.", "src": "Video · 12:30", "diff": "easy"}, {"n": 507, "ln": 35, "lesson": 10, "section": "Application Control Fundamentals", "topic": "P2P bandwidth", "q": "Why can even a single P2P peer on your network consume an unusually large amount of bandwidth?", "opts": ["It always negotiates a higher QoS priority than other sessions", "It retransmits every packet several times to guarantee delivery", "It downloads from many peers at once, combining their bandwidth", "It disables TCP window scaling on the FortiGate for its sessions"], "a": 2, "rat": "The notes explain that even if each peer has little bandwidth, together they offer more than many servers, so the requesting peer can consume much more bandwidth per second.", "src": "Video · 12:30", "diff": "medium"}, {"n": 508, "ln": 36, "lesson": 10, "section": "Application Control Fundamentals", "topic": "Signature hierarchy", "q": "Application control signatures are organized hierarchically. Which rule applies between a parent and a child signature?", "opts": ["The parent signature takes precedence over the child", "The child signature takes precedence over the parent", "The signature with the higher risk rating takes precedence", "The most recently downloaded signature takes precedence"], "a": 0, "rat": "The Hierarchical Structure slide states 'The parent signature takes precedence over the child signature'.", "src": "Video · 13:20", "diff": "medium"}, {"n": 509, "ln": 37, "lesson": 10, "section": "Application Control Fundamentals", "topic": "Sub-application inspection", "q": "To control a sub-application such as LinkedIn_Message or YouTube_Video.Play, which SSL inspection is required?", "opts": ["certificate-inspection", "No SSL inspection at all", "deep-inspection", "SSH deep-scan inspection"], "a": 2, "rat": "The slide's callouts show the parent apps (LinkedIn, YouTube) require certificate-inspection while the child signatures (LinkedIn_Message, YouTube_Video.Play) require deep-inspection.", "src": "Video · 13:20", "diff": "hard"}, {"n": 510, "ln": 38, "lesson": 10, "section": "Application Control Fundamentals", "topic": "Hierarchy benefit", "q": "What does the hierarchical signature structure let an administrator do?", "opts": ["Block Meta applications while still allowing Meta chat", "Allow all social media without any SSL inspection profile", "Merge every child signature into one category action only", "Skip signature updates for subapplications that  > Replacement Messages", "Log & Report > Security Events", "Policy & Objects > Virtual IPs"], "a": 1, "rat": "The HTTP Block Page slide callout says 'You can customize the replacement message in System > Replacement Messages'.", "src": "Video · 16:40", "diff": "easy"}, {"n": 520, "ln": 48, "lesson": 10, "section": "Application Control Profile Configuration", "topic": "Block page policy field", "q": "Many FortiGate devices with many policies protect different segments. Which item on the block page helps pinpoint the policy that blocked the page?", "opts": ["The category of the blocked application", "The UUID of the policy governing the traffic", "The name of the blocked application", "The URL of the specific index page that was blocked"], "a": 1, "rat": "The notes list the block page fields and say the last item, the UUID of the policy governing the traffic, helps identify which policy blocked the page even with many policies and devices.", "src": "Video · 16:40", "diff": "medium"}, {"n": 521, "ln": 49, "lesson": 10, "section": "Application Control Profile Configuration", "topic": "Scanning order", "q": "After the IPS engine identifies an application, in what order does the application control profile look for matches?", "opts": ["Categories first, then application and filter overrides", "Cloud signatures first, then native signatures, then categories", "Network Protocol Enforcement first, then categories only", "Application and filter overrides first, then categories"], "a": 3, "rat": "The Scanning Order slide lists 1. Application and filter overrides, 2. Categories.", "src": "Video · 17:30", "diff": "medium"}, {"n": 522, "ln": 50, "lesson": 10, "section": "Application Control Profile Configuration", "topic": "Override evaluation", "q": "How does the profile evaluate entries in Application and Filter Overrides?", "opts": ["From the bottom of the list up, newest entry first", "From the top of the list down, like firewall policies", "By risk rating, highest risk application first", "All entries at once, with Block always winning"], "a": 1, "rat": "The notes say the profile looks for a matching override starting at the top of the list, like firewall policies.", "src": "Video · 17:30", "diff": "medium"}, {"n": 523, "ln": 51, "lesson": 10, "section": "Application Control Profile Configuration", "topic": "App control vs web filter", "q": "An application control override allows an application, but a later web filtering scan would block it. What is the result?", "opts": ["The application is allowed, since overrides bypass web filtering", "Web filtering can still block it, using its own block message", "Web filtering is skipped for any application that has an override", "The application control block page is shown instead of web filter's"], "a": 1, "rat": "The notes say web filtering doesn't check the list of application control overrides, so even if an override allows an application, web filtering could still block it with its own block message.", "src": "Video · 17:55", "diff": "hard"}, {"n": 524, "ln": 52, "lesson": 10, "section": "Application Control Profile Configuration", "topic": "URL filter exempt", "q": "Can a static URL filter Exempt action bypass application control?", "opts": ["No, because application control runs before web filtering", "Yes, because Exempt skips all security checks on the policy", "Yes, but only when the profile uses deep-inspection mode", "No, because URL filtering is disabled when app control is on"], "a": 0, "rat": "The notes say static URL filtering's exempt action bypasses subsequent checks, but application control occurs before web filtering, so the web filtering exemption cannot bypass application control.", "src": "Video · 17:55", "diff": "hard"}, {"n": 525, "ln": 53, "lesson": 10, "section": "Application Control Profile Configuration", "topic": "Override priority scenario", "q": "An Excessive-Bandwidth filter override set to Block is moved above an application override that sets Dailymotion to Monitor. What happens to Dailymotion traffic?", "opts": ["It is blocked, because the higher filter override matches it first", "It is monitored, because application overrides always beat filters", "It is allowed, because the Video/Audio category action is ignored", "It is quarantined, because two conflicting overrides now match it"], "a": 0, "rat": "In Scenario 2 the notes say Dailymotion falls under excessive bandwidth and is blocked even though it is set to Monitor; the priority order of overrides takes precedence.", "src": "Video · 18:45", "diff": "hard"}, {"n": 526, "ln": 54, "lesson": 10, "section": "Applying and Monitoring Application Control", "topic": "Applying the profile", "q": "An application control profile has been created. What must be done for FortiGate to start scanning application traffic?", "opts": ["Set the profile as the global default in System > Settings", "Assign the profile to the interface that receives the traffic", "Apply the profile to a firewall policy that the traffic matches", "Download a new application signature package from FortiGuard"], "a": 2, "rat": "The slide states 'You must apply the application control profile on a firewall policy to scan the passing traffic'.", "src": "Video · 19:10", "diff": "easy"}, {"n": 527, "ln": 55, "lesson": 10, "section": "Applying and Monitoring Application Control", "topic": "Logging requirement", "q": "Which firewall policy setting causes application control events to be logged?", "opts": ["Log Allowed Traffic turned off, with only violations logged", "Decrypted Traffic Mirror enabled toward a logging interface", "Packet logging enabled on each application category filter", "Log Allowed Traffic set to Security Events or All Sessions"], "a": 3, "rat": "The slide says to enable logging for security events or all sessions to log application control events, with the Log Allowed Traffic setting highlighted.", "src": "Video · 19:10", "diff": "medium"}, {"n": 528, "ln": 56, "lesson": 10, "section": "Applyi
