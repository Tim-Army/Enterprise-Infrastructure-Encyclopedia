 "opts": ["A second VNet", "An Azure DNS zone", "User-defined routes", "A public IP on each VM"], "a": 2, "rat": "The Routing - Azure Example slide says VM traffic always goes through the SDN virtual router first, and to inspect traffic with a FortiGate VM you must create UDRs.", "src": "Video · 27:30", "diff": "easy"}, {"n": 903, "ln": 83, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "UDR example", "q": "In an Azure VNet, the FortiGate-VM has private IP 10.0.1.4 and public IP 13.12.1.6, and the SDN router uses 10.0.3.1 in subnet 3 (10.0.3.0/24). What next hop should subnet 3's UDR for 0.0.0.0/0 use so FortiGate inspects the traffic?", "opts": ["10.0.1.4, the FortiGate private IP", "10.0.3.1, the subnet 3 SDN gateway", "13.12.1.6, the FortiGate public IP", "10.0.2.1, the subnet 2 SDN gateway"], "a": 0, "rat": "The diagram's UDR route table reads: from 10.0.3.0/24 to 0.0.0.0/0, forward to 10.0.1.4, which is the FortiGate-VM.", "src": "Video · 27:30", "diff": "medium"}, {"n": 904, "ln": 84, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "VM public IP", "q": "In Azure, what happens when a VM has its own public IP address assigned?", "opts": ["It must still send all internet traffic through the FortiGate VM", "It can receive inbound traffic but cannot initiate outbound", "It loses connectivity to other subnets in the same VNet", "It reaches the internet directly, and clients can reach its services"], "a": 3, "rat": "The slide says you can associate a public IP address with a VM so it can access the internet directly and give public access to its installed services; the diagram shows direct access for the subnet 2 VM.", "src": "Video · 27:30", "diff": "medium"}, {"n": 905, "ln": 85, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Single-interface FortiGate", "q": "An Azure FortiGate VM (10.0.1.4) uses port1 for both incoming and outgoing traffic. Which port1-to-port1 policy lets subnet 3 (10.0.3.0/24) reach the internet?", "opts": ["Source 0.0.0.0/0, destination 10.0.3.0/24", "Source 10.0.3.0/24, destination 0.0.0.0/0", "Source 10.0.1.4/32, destination 10.0.3.0/24", "Source 10.0.3.0/24, destination 10.0.1.4/32"], "a": 1, "rat": "The notes say FortiGate can use a single interface for incoming and outgoing traffic, with a policy from port1 to port1, source 10.0.3.0/24 and destination 0.0.0.0/0. They add that this design is not commonly used.", "src": "Video · 27:30", "diff": "hard"}, {"n": 906, "ln": 86, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Secure by default", "q": "A Standard SKU public IP is secure by default. What does that mean for inbound traffic?", "opts": ["It is allowed until an NSG blocks it", "It requires a global tier address", "It is allowed only on TCP port 443", "NSGs must be configured to allow it"], "a": 3, "rat": "The notes say a standard public IP is secure by default and requires the configuration of network security groups to allow inbound traffic.", "src": "Video · 28:45", "diff": "medium"}, {"n": 907, "ln": 87, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "SKU matching", "q": "What requirement applies when a public IP address is used with an Azure load balancer?", "opts": ["It must be a dynamic, Basic SKU address", "Its SKU must match the load balancer SKU", "It must be assigned to each backend VM", "It must be in a different region than it"], "a": 1, "rat": "The notes state that a public IP SKU must match the load balancer SKU it is used with.", "src": "Video · 28:45", "diff": "medium"}, {"n": 908, "ln": 88, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Connecting VNets", "q": "What are the two main ways Azure offers to connect VNets to each other?", "opts": ["NAT gateways and public IPs", "NSGs and UDRs", "Availability zones and regions", "VNet peering and VPN gateways"], "a": 3, "rat": "The Connecting VNets slide states Azure offers two main ways to achieve connectivity between VNets: VNet peering and VPN gateways. FortiGate VMs can also be used.", "src": "Video · 30:50", "diff": "easy"}, {"n": 909, "ln": 89, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Choosing connectivity", "q": "Which factors guide the choice of a VNet connectivity method?", "opts": ["FortiGate license model, firmware, and VDOM count", "Required security level, scale, and geographic distribution", "VM operating system, disk type, and image version", "Number of NSG rules, UDRs, and public IP SKUs"], "a": 1, "rat": "The notes say the choice of connectivity method depends on your specific requirements, such as the level of security, scale, and geographic distribution you need.", "src": "Video · 30:50", "diff": "medium"}, {"n": 910, "ln": 90, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "NSG scope", "q": "At which levels can an Azure network security group be applied?", "opts": ["Only on PaaS services outside the VNet", "At the NIC level or the subnet level", "Only at the region level for all VNets", "At the VNet level or the region level"], "a": 1, "rat": "The NSGs slide states NSGs can be applied either at the NIC level or at the subnet level.", "src": "Video · 32:30", "diff": "easy"}, {"n": 911, "ln": 91, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "NSG capabilities", "q": "What inspection capability do Azure NSGs provide?", "opts": ["SSL deep inspection of all flows", "IPS signatures and antivirus scans", "Full layer 7 application control", "Basic filtering at layer 4 only"], "a": 3, "rat": "The NSGs slide states NSGs have very basic capabilities: layer 4 only.", "src": "Video · 32:30", "diff": "easy"}, {"n": 912, "ln": 92, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "NSG limitations", "q": "For which resources do Azure NSGs not work?", "opts": ["VMs that are deployed in an availability zone", "Resources not connected to a VNet, such as PaaS services", "NICs that have a Standard SKU public IP address associated", "Subnets that contain more than one virtual machine"], "a": 1, "rat": "The slide says NSGs work only if a resource is connected to a VNet and do not work for other resources like PaaS services.", "src": "Video · 32:30", "diff": "medium"}, {"n": 913, "ln": 93, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "NSG statefulness", "q": "Why do you not need to create bidirectional NSG rules for a permitted flow?", "opts": ["NSGs are stateful, so return traffic is allowed", "Azure system routes allow all return traffic", "UDRs automatically mirror each rule in reverse", "NSGs only filter traffic in the inbound direction"], "a": 0, "rat": "The notes say NSGs are stateful, and no bidirectional policies are needed.", "src": "Video · 32:55", "diff": "medium"}, {"n": 914, "ln": 94, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "NSG troubleshooting", "q": "When troubleshooting connectivity to a FortiGate VM in Azure, why should NSGs be checked?", "opts": ["NSGs silently rewrite UDRs whenever a public IP is attached", "A misconfigured NSG may block wanted traffic or allow unwanted traffic", "NSGs disable the SDN virtual router for subnets they protect", "NSGs replace FortiGate policies once the VM is deployed in a VNet"], "a": 1, "rat": "The notes say misconfigured NSGs may block or allow unwanted traffic, so keep this in mind when troubleshooting network issues; the slide says to keep them in mind when configuring and troubleshooting.", "src": "Video · 32:55", "diff": "medium"}, {"n": 915, "ln": 1, "lesson": 16, "section": "Remote work challenges and SASE architecture", "topic": "Direct internet access risk", "q": "When remote users at a coffee shop browse the internet directly without any corporate service in the path, what is the main problem?", "opts": ["Users get implicit access to all private apps", "No security policy is enforced on that traffic", "Traffic must hairpin through the office network", "Users are locked into MPLS circuits at the site"], "a": 1, "rat": "The work-from-anywhere slide labels direct internet access as having no security enforcement, so direct internet access is not secure.", "src": "Video · 0:50", "diff": "easy"}, {"n": 916, "ln": 2, "lesson": 16, "section": "Remote work challenges and SASE architecture", "topic": "Routing challenge", "q": "Branch and factory sites that rely on traditional routing for remote connectivity face which challenge?", "opts": ["Users must connect back to the office network first", "No security enforcement on any outbound session", "Poor visibility into data stored in SaaS applications", "Lack of application steering and lock-in to MPLS"], "a": 3, "rat": "The diagram shows the Routing path described as lack of application steering and MPLS lock-in.", "src": "Video · 0:50", "diff": "medium"}, {"n": 917, "ln": 3, "lesson": 16, "section": "Remote work challenges and SASE architecture", "topic": "SaaS visibility blind spot", "q": "Why do corporate infrastructures and data centers create a blind spot when securing data in SaaS applications?", "opts": ["They cannot see the SaaS traffic that remote users reach directly", "They only inspect SaaS traffic that originates from branch office sites", "They block all SaaS traffic that is not tunneled over MPLS links", "They decrypt SaaS traffic but cannot log the resulting sessions"], "a": 0, "rat": "The speaker notes explain that corporate infrastructures and data centers lack visibility into remotely accessed SaaS traffic, creating a blind spot.", "src": "Video · 0:50", "diff": "medium"}, {"n": 918, "ln": 4, "lesson": 16, "section": "Remote work challenges and SASE architecture", "topic": "VPN security risk", "q": "Besides degrading performance, what security risk do traditional remote-access VPNs introduce?", "opts": ["They block multifactor authentication", "They expose user passwords in clear text on the internet", "They disable endpoint antivirus while the tunnel is up", "Broad network access lets malware get in and spread"], "a": 3, "rat": "The notes state VPNs pose security risks by granting broad network access, allowing malware to infiltrate and spread across systems.", "src": "Video · 0:50", "diff": "medium"}, {"n": 919, "ln": 5, "lesson": 16, "section": "Remote work challenges and SASE architecture", "topic": "VPN performance issue", "q": "What performance problem results from sending all remote user traffic through a VPN to reach the internet and SaaS apps?", "opts": ["The VPN concentrator drops all UDP-based sessions", "The end-user experience degrades", "DNS lookups fail for any domain outside the office", "SaaS providers throttle traffic from VPN gateways"], "a": 1, "rat": "The notes list performance issues: routing all user traffic through a VPN to access the internet and SaaS can degrade performance for the end user.", "src": "Video · 0:50", "diff": "easy"}, {"n": 920, "ln": 6, "lesson": 16, "section": "Remote work challenges and SASE architecture", "topic": "Latency reduction", "q": "How does a SASE architecture reduce latency for off-net endpoints?", "opts": ["Endpoints tunnel to the headquarters firewall over a dedicated MPLS circuit", "Endpoints bypass all inspection for any application that is marked as latency-sensitive", "Endpoints connect to the nearest point of presence of the cloud security service", "Endpoints cache all web content locally so that fewer requests are sent"], "a": 2, "rat": "The SASE objectives in the notes include reducing latency by having off-net endpoints connect to the closest POP offered by a cloud-delivered security service.", "src": "Video · 2:05", "diff": "easy"}, {"n": 921, "ln": 7, "lesson": 16, "section": "Remote work challenges and SASE architecture", "topic": "Congestion reduction", "q": "Which SASE design goal reduces congestion and avoids a single point that all traffic must flow through?", "opts": ["Requiring every endpoint and SaaS access", "topic": "DLP role", "q": "In the CASB use case, what is DLP used for?", "opts": ["Stopping sensitive data from leaking to untrusted networks or people", "Isolating risky websites by rendering them in a remote container", "Choosing the best WAN link for each SaaS application in real time", "Speeding up SaaS sessions by caching large files at the nearest POP"], "a": 0, "rat": "The slide states FortiSASE uses DLP to keep sensitive data safe from leaking to untrusted networks or people.", "src": "Video · 29:10", "diff": "easy"}];
const LETTERS = ["A","B","C","D"];
const lessonById = id => LESSONS.find(l=>l.id===id);

const root = document.documentElement;
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const t=root.getAttribute("data-theme");
  const dark = t==="dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
});

let S = { mode:"start", scope:"all", shuffleQ:true, shuffleOpts:true, count:0, order:[], optMap:{}, ptr:0, picked:null, checked:false, answers:{}, studyFilter:"all" };
const app = document.getElementById("app");
const readout = document.getElementById("readout");
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function scopeIdx(scope){ return QUESTIONS.map((q,i)=>i).filter(i => scope==="all" || QUESTIONS[i].lesson===scope); }
// Questions per test: 0 means all. Smaller counts draw a fresh random subset each run.
const COUNT_CHOICES=[10,20,25,50,75,100,150,200,250,500].filter(n=>n<QUESTIONS.length);
function testSize(pool){ return S.count>0 ? Math.min(S.count,pool) : pool; }
function startAllLabel(){ const n=testSize(QUESTIONS.length); return n===QUESTIONS.length ? `Take the full exam (${n}) →` : `Take a ${n}-question exam →`; }

function renderStart(){
  S.mode="start";
  const diffs={easy:0,medium:0,hard:0}; QUESTIONS.forEach(q=>diffs[q.diff]++);
  app.innerHTML = `
  <div class="card hero fade">
    <div class="eyebrow">Self-Check</div>
    <h1>FortiGate 7.6 Administrator (NSE 4) Study Quiz</h1>
    <p class="lede">${QUESTIONS.length} multiple-choice questions across ${LESSONS.length} FortiGate 7.6 Administrator lessons, pulled straight from the Fortinet FortiGate 7.6 Administrator training videos. Drill any single lesson, or take the full exam.</p>
    <div class="pillrow">
      <span class="pill"><b>${QUESTIONS.length}</b> questions</span>
      <span class="pill"><b>${LESSONS.length}</b> lessons</span>
      <span class="pill"><b>${diffs.easy}</b> easy · <b>${diffs.medium}</b> medium · <b>${diffs.hard}</b> hard</span>
      <span class="pill">4 options each</span>
    </div>
    <div class="lessons">
      ${LESSONS.map(L=>{
        const c=QUESTIONS.filter(q=>q.lesson===L.id).length;
        return `<div class="lesson-card l${L.id}">
          <div class="lnum">Lesson ${L.id}</div>
          <h3>${esc(L.name)}</h3>
          <div class="lc-count">${c} questions · ${L.sections.length} sections</div>
          <ul>${L.objectives.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>
          <div class="lc-btn"><button data-scope="${L.id}">Quiz this lesson →</button></div>
        </div>`;
      }).join("")}
    </div>
    <div class="toggles">
      <label class="tog"><input type="checkbox" id="tqo" ${S.shuffleQ?"checked":""}><span class="sw"></span>Shuffle question order</label>
      <label class="tog"><input type="checkbox" id="too" ${S.shuffleOpts?"checked":""}><span class="sw"></span>Shuffle answer choices</label>
      <label class="cnt">Questions per test
        <select id="tqc">
          <option value="0" ${S.count===0?"selected":""}>All</option>
          ${COUNT_CHOICES.map(n=>`<option value="${n}" ${S.count===n?"selected":""}>${n}</option>`).join("")}
        </select>
      </label>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="startAll">${startAllLabel()}</button>
      <button class="btn btn-ghost" id="startStudy">Study mode — read all answers</button>
    </div>
  </div>`;
  document.getElementById("tqo").addEventListener("change",e=>S.shuffleQ=e.target.checked);
  document.getElementById("too").addEventListener("change",e=>S.shuffleOpts=e.target.checked);
  document.getElementById("tqc").addEventListener("change",e=>{ S.count=+e.target.value; document.getElementById("startAll").textContent=startAllLabel(); });
  document.getElementById("startAll").addEventListener("click", ()=>beginQuiz("all"));
  document.getElementById("startStudy").addEventListener("click", ()=>renderStudy());
  [...document.querySelectorAll(".lesson-card button")].forEach(b=>b.addEventListener("click",()=>beginQuiz(+b.dataset.scope)));
  readout.innerHTML="";
}

function beginQuiz(scope){
  S.scope=scope;
  const pool=scopeIdx(scope);
  const n=testSize(pool.length);
  // A partial test samples randomly; with question shuffle off, the sample keeps lesson order.
  const picked = n<pool.length ? shuffle(pool).slice(0,n) : pool;
  S.order = S.shuffleQ ? shuffle(picked) : picked.slice().sort((a,b)=>a-b);
  S.optMap={};
  S.order.forEach(i=>{ const q=QUESTIONS[i]; const slots=q.opts.map((_,k)=>k); S.optMap[q.n]=S.shuffleOpts?shuffle(slots):slots; });
  S.ptr=0; S.answers={}; S.picked=null; S.checked=false; S.mode="quiz";
  renderQuiz();
}

function renderQuiz(){
  const q=QUESTIONS[S.order[S.ptr]]; const L=lessonById(q.lesson); const map=S.optMap[q.n]; const answered=S.answers[q.n];
  S.checked=!!answered; S.picked=answered?map.indexOf(answered.pickOrig):null;
  app.innerHTML=`
  <div class="card fade">
    <div class="qhead">
      <div class="eyebrow"><span class="lt l${q.lesson}">L${q.lesson} ${esc(L.short)}</span> · ${esc(q.section)}</div>
      <div class="diff ${q.diff}">${q.diff}</div>
    </div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">
      ${map.map((orig,slot)=>`<button class="opt" data-slot="${slot}" data-orig="${orig}"><span class="lz">${LETTERS[slot]}</span><span class="otext">${esc(q.opts[orig])}</span><span class="fmark" aria-hidden="true"></span></button>`).join("")}
    </div>
    <div class="feedback" id="fb"></div>
    <div class="qfoot"><div class="progress"><i style="width:${(S.ptr/S.order.length)*100}%"></i></div><div class="foot-btns" id="footBtns"></div></div>
  </div>
  <div class="hint">Keys: <kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>D</kbd> or <kbd>1</kbd>–<kbd>4</kbd> to choose · <kbd>Enter</kbd> to ${answered?"continue":"check"}</div>`;
  const optEls=[...app.querySelectorAll(".opt")];
  optEls.forEach(el=>el.addEventListener("click",()=>{ if(S.checked) return; S.picked=+el.dataset.slot; optEls.forEach(o=>o.classList.toggle("sel",o===el)); updateFootBtns(); }));
  if(answered) revealAnswer(q,map);
  updateReadout(); updateFootBtns();
}
function updateFootBtns(){
  const fb=document.getElementById("footBtns"); if(!fb) return;
  const last=S.ptr===S.order.length-1;
  if(S.checked){ fb.innerHTML=`<button class="btn btn-primary btn-sm" id="nextBtn">${last?"See results":"Next"} →</button>`; document.getElementById("nextBtn").addEventListener("click", nextQ); }
  else { fb.innerHTML=`<button class="btn btn-ghost btn-sm" id="skipBtn">Skip</button><button class="btn btn-primary btn-sm" id="checkBtn" ${S.picked===null?"disabled":""}>Check answer</button>`;
    document.getElementById("skipBtn").addEventListener("click",()=>{recordSkip();nextQ();}); const cb=document.getElementById("checkBtn"); if(cb) cb.addEventListener("click", checkAnswer); }
}
function checkAnswer(){ if(S.picked===null||S.checked) return; const q=QUESTIONS[S.order[S.ptr]]; const map=S.optMap[q.n]; const pickOrig=map[S.picked]; S.answers[q.n]={correct:pickOrig===q.a, pickOrig}; S.checked=true; revealAnswer(q,map); updateReadout(); updateFootBtns(); }
function recordSkip(){ const q=QUESTIONS[S.order[S.ptr]]; if(!S.answers[q.n]) S.answers[q.n]={correct:false,pickOrig:null,skipped:true}; }
function revealAnswer(q,map){
  const optEls=[...app.querySelectorAll(".opt")]; const ans=S.answers[q.n];
  optEls.forEach(el=>{ el.disabled=true; el.classList.remove("sel"); const orig=+el.dataset.orig; const fm=el.querySelector(".fmark");
    if(orig===q.a){el.classList.add("correct"); fm.textContent="✓";} else if(ans&&orig===ans.pickOrig){el.classList.add("wrong"); fm.textContent="✗";} });
  const good=ans&&ans.correct; const fb=document.getElementById("fb"); const verdict=ans&&ans.skipped?"Skipped":(good?"Correct":"Not quite");
  fb.innerHTML=`<div class="fb-in ${good?"ok":"no"}"><div class="fb-verdict">${good?"✓":"✗"} ${verdict}${good?"":" — answer "+LETTERS[map.indexOf(q.a)]}</div><div class="fb-rat">${esc(q.rat)}</div><div class="fb-src"><span class="tag">Source</span> ${esc(q.src)} · <span>${esc(q.topic)}</span></div></div>`;
  requestAnimationFrame(()=>fb.classList.add("show"));
}
function nextQ(){ if(S.ptr===S.order.length-1){renderEnd();return;} S.ptr++; S.picked=null; S.checked=false; renderQuiz(); }
function updateReadout(){ const done=Object.keys(S.answers).length; const correct=Object.values(S.answers).filter(a=>a.correct).length; readout.innerHTML=`<span class="rd-sec">Question <b>${S.ptr+1}</b>/${S.order.length}</span><span>Score <b>${correct}</b>/${done}</span>`; }

function renderEnd(){
  S.mode="end";
  const scoped=S.order.map(i=>QUESTIONS[i]); const total=scoped.length;
  const correct=scoped.filter(q=>S.answers[q.n]&&S.answers[q.n].correct).length; const pct=Math.round(correct/total*100);
  const circ=2*Math.PI*66; const dash=circ*(pct/100); const col=pct>=80?"var(--ok)":pct>=60?"var(--accent)":"var(--bad)";
  const verdict=pct>=90?"Outstanding":pct>=80?"Strong pass":pct>=60?"Getting there":"Keep studying";
  const partial=total<scopeIdx(S.scope).length;
  const scopeLabel=(S.scope==="all"?(partial?`${total}-question exam`:"Full exam"):("Lesson "+S.scope+" · "+lessonById(S.scope).short))+(partial&&S.scope!=="all"?` (${total} questions)`:"");
  const lessonsInScope=S.scope==="all"?LESSONS:[lessonById(S.scope)];
  let tallyHtml="";
  lessonsInScope.forEach(L=>{
    const rows=L.sections.map(s=>{ const items=scoped.filter(q=>q.lesson===L.id&&q.section===s); if(!items.length) return "";
      const c=items.filter(q=>S.answers[q.n]&&S.answers[q.n].correct).length; const p=Math.round(c/items.length*100);
      const bc=p>=80?"var(--ok)":p>=50?"var(--accent)":"var(--bad)";
      return `<div class="trow"><span class="tn">${esc(s)}</span><span class="tv">${c}/${items.length}</span><span class="tbar"><i style="width:${p}%; background:${bc}"></i></span></div>`; }).join("");
    if(rows) tallyHtml+=`<div class="lesson-head">Lesson ${L.id} · ${esc(L.name)}</div>${rows}`;
  });
  const missed=scoped.filter(q=>!(S.answers[q.n]&&S.answers[q.n].correct));
  app.innerHTML=`
  <div class="card fade">
    <div class="score-wrap"><div class="eyebrow">${esc(scopeLabel)} · complete</div>
      <div class="score-ring"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="66" fill="none" stroke="var(--surface-3)" stroke-width="11"></circle><circle cx="75" cy="75" r="66" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${dash} ${circ}"></circle></svg><div class="pct"><div><b>${pct}%</b><small>${correct}/${total}</small></div></div></div>
      <div class="verdict-line">${verdict}</div><div class="score-sub">You answered ${correct} of ${total} correctly.</div></div>
    <div class="tally"><h3>By section</h3>${tallyHtml}</div>
    ${missed.length?`<div class="review"><h3>Review — ${missed.length} to revisit</h3>${missed.map(q=>{ const ans=S.answers[q.n];
      const yours=ans&&ans.pickOrig!=null?`<div class="ml"><span class="k no">Your pick</span><span>${esc(q.opts[ans.pickOrig])}</span></div>`:`<div class="ml"><span class="k no">Skipped</span><span>no answer given</span></div>`;
      return `<div class="miss"><div class="mq">${esc(q.q)}</div><div class="ml"><span class="k ok">Correct</span><span>${esc(q.opts[q.a])}</span></div>${yours}<div class="msrc">${esc(q.rat)}<br>Source: ${esc(q.src)}</div></div>`; }).join("")}</div>`:`<div class="review"><h3>Perfect run</h3><p style="color:var(--muted)">Every question correct — nothing to review.</p></div>`}
    <div class="end-actions"><button class="btn btn-primary" id="again">Retake</button><button class="btn btn-ghost" id="toStudy">Study mode</button><button class="btn btn-ghost" id="home">Home</button></div>
    <div style="height:26px"></div>
  </div>`;
  document.getElementById("again").addEventListener("click",()=>beginQuiz(S.scope));
  document.getElementById("toStudy").addEventListener("click",()=>renderStudy());
  document.getElementById("home").addEventListener("click", renderStart);
  readout.innerHTML=`<span>Final <b>${pct}%</b></span>`; window.scrollTo({top:0,behavior:"smooth"});
}

function renderStudy(){
  S.mode="study";
  const shown=S.studyFilter==="all"?LESSONS:LESSONS.filter(l=>l.id===S.studyFilter);
  app.innerHTML=`
    <div class="card hero fade" style="padding:30px 30px 26px; margin-bottom:22px">
      <div class="eyebrow">Study mode</div><h1 style="font-size:26px; margin-top:10px">Every question, answered</h1>
      <p class="lede" style="font-size:15px">All ${QUESTIONS.length} questions with the correct choice marked, the reasoning, and the exact source it came from.</p>
    </div>
    <div class="filters" id="filters">
      <button class="fchip ${S.studyFilter==="all"?"on":""}" data-f="all">All lessons (${QUESTIONS.length})</button>
      ${LESSONS.map(L=>`<button class="fchip ${S.studyFilter===L.id?"on":""}" data-f="${L.id}">L${L.id} · ${esc(L.short)} (${QUESTIONS.filter(q=>q.lesson===L.id).length})</button>`).join("")}
    </div>
    <div id="studyList"></div>
    <div class="actions" style="margin-top:24px"><button class="btn btn-primary" id="toQuiz">Take the full exam →</button><button class="btn btn-ghost" id="home2">Home</button></div>`;
  document.getElementById("studyList").innerHTML=shown.map(L=>{
    const secBlocks=L.sections.map(s=>{ const items=QUESTIONS.filter(q=>q.lesson===L.id&&q.section===s); if(!items.length) return "";
      return `<details class="sgroup" open><summary><span class="caret">▶</span>${esc(s)}<span class="cnt">${items.length} question${items.length>1?"s":""}</span></summary>
        <div class="sbody">${items.map(q=>`<div class="sq l${q.lesson}"><div class="sqq"><span class="n">${q.ln}</span><span>${esc(q.q)}</span></div>
          <div class="sopts">${q.opts.map((o,i)=>`<div class="sopt ${i===q.a?"ok":""}"><span class="sl">${LETTERS[i]}</span><span>${esc(o)}</span>${i===q.a?'<span class="ck">✓</span>':""}</div>`).join("")}</div>
          <div class="srat">${esc(q.rat)}</div><div class="ssrc">Source: ${esc(q.src)} · ${esc(q.topic)} · ${q.diff}</div></div>`).join("")}</div></details>`;
    }).join("");
    return `<div class="lesson-banner l${L.id}"><span class="lb-tag">Lesson ${L.id}</span><h2>${esc(L.name)}</h2></div>${secBlocks}`;
  }).join("");
  [...document.querySelectorAll("#filters .fchip")].forEach(c=>c.addEventListener("click",()=>{ S.studyFilter=c.dataset.f==="all"?"all":+c.dataset.f; renderStudy(); window.scrollTo({top:0,behavior:"smooth"}); }));
  document.getElementById("toQuiz").addEventListener("click",()=>beginQuiz("all"));
  document.getElementById("home2").addEventListener("click", renderStart);
  readout.innerHTML=`<span>Study · <b>${QUESTIONS.length}</b> Q</span>`;
}

document.addEventListener("keydown",e=>{
  if(S.mode!=="quiz") return;
  const k=e.key.toLowerCase(); const q=QUESTIONS[S.order[S.ptr]]; const n=S.optMap[q.n].length; let slot=-1;
  if(["a","b","c","d"].includes(k)) slot="abcd".indexOf(k); else if(["1","2","3","4"].includes(k)) slot=+k-1;
  if(slot>=0&&slot<n&&!S.checked){ S.picked=slot; [...app.querySelectorAll(".opt")].forEach(o=>o.classList.toggle("sel",+o.dataset.slot===slot)); updateFootBtns(); e.preventDefault(); return; }
  if(e.key==="Enter"){ if(!S.checked&&S.picked!==null) checkAnswer(); else if(S.checked) nextQ(); e.preventDefault(); }
});
renderStart();
</script>
