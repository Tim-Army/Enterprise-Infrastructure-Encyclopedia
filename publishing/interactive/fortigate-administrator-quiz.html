es cannot be matched in firewall policies without a user group", "IP-based policies cannot apply security profiles to the traffic", "The firewall cannot determine who is actually using the device it is granting access to"], "a": 3, "rat": "The notes state that verifying only source IP and device is inadequate and a security risk because the firewall cannot determine who is using the device.", "src": "Video · 0:25", "diff": "easy"}, {"n": 191, "ln": 2, "lesson": 5, "section": "Authentication Fundamentals and Local Users", "topic": "Methods of firewall authentication", "q": "Which set correctly lists the FortiGate methods of firewall authentication?", "opts": ["Server-based password, IP-based, and device-type authentication", "Local password, certificate-only, and MAC address-based device authentication", "Two-factor, captive portal, and SNMP community authentication", "Local password, server-based (remote) password, and two-factor authentication"], "a": 3, "rat": "The methods slide lists local password authentication, server-based (remote) password authentication, and two-factor authentication.", "src": "Video · 0:50", "diff": "easy"}, {"n": 192, "ln": 3, "lesson": 5, "section": "Authentication Fundamentals and Local Users", "topic": "Remote server types", "q": "With server-based password authentication, the password can be stored on several kinds of remote server. Which one is NOT listed as an option?", "opts": ["RADIUS server", "TACACS+ server", "SNMP server", "POP3 server"], "a": 2, "rat": "The slide lists POP3, RADIUS, LDAP, and TACACS+ as servers that store the password; SNMP is not among them.", "src": "Video · 0:50", "diff": "medium"}, {"n": 193, "ln": 4, "lesson": 5, "section": "Authentication Fundamentals and Local Users", "topic": "Two-factor prerequisite", "q": "What is required before two-factor authentication can be enabled for a user?", "opts": ["The FortiGate must be registered with FortiAuthenticator as its validation server", "The user must first be added to an FSSO group that is used in an identity-based firewall policy", "A captive portal must be enabled on the ingress interface that the user connects through", "A local or server-based password method must already be configured for the user"], "a": 3, "rat": "The notes say two-factor authentication is enabled on top of an existing method and cannot be enabled without first configuring one of the other methods.", "src": "Video · 0:50", "diff": "medium"}, {"n": 194, "ln": 5, "lesson": 5, "section": "Authentication Fundamentals and Local Users", "topic": "Creating a local user", "q": "Where are local user accounts created, and which user type do you select for local password authentication?", "opts": ["User & Authentication > User Groups, selecting Firewall as the type", "Policy & Objects > Addresses, selecting User as the type", "System > Administrators, selecting Local as the type", "User & Authentication > User Definition, selecting Local User"], "a": 3, "rat": "The notes say local accounts are created on the User Definition page, where a wizard guides you and you select Local User as the user type.", "src": "Video · 1:15", "diff": "medium"}, {"n": 195, "ln": 6, "lesson": 5, "section": "Authentication Fundamentals and Local Users", "topic": "Making a user authenticate", "q": "After creating a local user account, what must you do for that user to be required to authenticate?", "opts": ["Add the user's email and SMS contact details so the account can be notified", "Enable the account on the Dashboard Firewall Users monitor page", "Enable two-factor authentication and assign a FortiToken to the account", "Add the user, or a group containing the user, to a firewall policy"], "a": 3, "rat": "The notes explain that after creating the user you add the user, or a preconfigured group containing the user, to a firewall policy in order to authenticate.", "src": "Video · 1:15", "diff": "easy"}, {"n": 196, "ln": 7, "lesson": 5, "section": "Remote Authentication: LDAP", "topic": "Who evaluates remote credentials", "q": "When FortiGate uses a remote authentication server, which device evaluates the user's credentials?", "opts": ["FortiGate, using a cached copy of the server's user database", "The remote authentication server", "The user's endpoint, using a locally stored certificate", "FortiGate and the server jointly, each validating half of the password"], "a": 1, "rat": "The notes stress that it is the remote authentication server, not FortiGate, that evaluates the user credentials; FortiGate forwards the credentials and acts on the reply.", "src": "Video · 1:40", "diff": "easy"}, {"n": 197, "ln": 8, "lesson": 5, "section": "Remote Authentication: LDAP", "topic": "Adding a server to a group", "q": "An administrator adds a remote authentication server to a user group instead of creating individual accounts. What is the result?", "opts": ["Users must be imported one at a time before they can authenticate", "All users on that server become members of the group", "Only the administrator account used for binding becomes a member", "Only users already defined locally on FortiGate become members"], "a": 1, "rat": "The server-based slide states that when you add the authentication server to a user group, all users in that server become members of the group.", "src": "Video · 1:40", "diff": "easy"}, {"n": 198, "ln": 9, "lesson": 5, "section": "Remote Authentication: LDAP", "topic": "Option 1 remote user accounts", "q": "When you create a remote RADIUS user account on FortiGate (option 1), which requirement applies, and why is this option typically used?", "opts": ["Account must belong to an FSSO group; typically used for passive single sign-on authentication", "Username must be an LDAP distinguished name; typically used to browse the directory tree", "Password must be stored locally on FortiGate; typically used to avoid querying the RADIUS server", "Username must match a RADIUS server account; typically used to add two-factor authentication"], "a": 3, "rat": "The notes for option 1 state that the username must match an existing account on the RADIUS server, and that this is usually done when you want to add two-factor authentication to remote users.", "src": "Video · 2:05", "diff": "hard"}, {"n": 199, "ln": 10, "lesson": 5, "section": "Remote Authentication: LDAP", "topic": "LDAP group control", "q": "When an LDAP server is added to a FortiGate user group, what additional access control is possible?", "opts": ["Restricting access to users returning a specific RADIUS VSA group attribute", "Restricting access to specific LDAP groups defined on the LDAP server", "Restricting access based on the LDAP server's port number and bind type", "Restricting access to users who also have a local password stored on FortiGate"], "a": 1, "rat": "The notes explain that with an LDAP server as the remote server you can control access to specific LDAP groups as defined on the LDAP server.", "src": "Video · 2:30", "diff": "medium"}, {"n": 200, "ln": 11, "lesson": 5, "section": "Remote Authentication: LDAP", "topic": "LDAP on port 389 security", "q": "Why is LDAPS highly recommended over LDAP on port 389?", "opts": ["LDAP on port 389 sends the password in clear text", "LDAP on port 389 does not support the binding operation", "LDAP on port 389 cannot return a user's group membership", "LDAP on port 389 only works with the anonymous bind type"], "a": 0, "rat": "The notes state that LDAP on port 389 is not secure because it sends the password in clear text, so LDAPS is highly recommended.", "src": "Video · 3:20", "diff": "easy"}, {"n": 201, "ln": 12, "lesson": 5, "section": "Remote Authentication: LDAP", "topic": "LDAP binding", "q": "In LDAP, what is binding?", "opts": ["The TLS encryption handshake that upgrades an LDAP session to LDAPS", "The operation that adds a new user entry to the directory tree", "The process of replicating the directory tree between LDAP servers", "The operation in which the LDAP server authenticates the user"], "a": 3, "rat": "The LDAP overview slide says binding is the operation in which the LDAP server authenticates the user; if successful, it grants access based on the user's permissions.", "src": "Video · 3:20", "diff": "medium"}, {"n": 202, "ln": 13, "lesson": 5, "section": "Remote Authentication: LDAP", "topic": "LDAP roles", "q": "In an LDAP authentication exchange, which roles do FortiGate and the directory server play?", "opts": ["FortiGate is the NAS and the server is the RADIUS client", "FortiGate is the Directory System Agent (DSA) and the server is the LDAP client", "FortiGate is the LDAP client and the server is the Directory System Agent (DSA)", "FortiGate is the validation server and the server is the OTP generator"], "a": 2, "rat": "The LDAP overview diagram labels FortiGate as the LDAP Client and the directory server as the Directory System Agent (DSA).", "src": "Video · 3:20", "diff": "medium"}, {"n": 203, "ln": 14, "lesson": 5, "section": "Remote Authentication: LDAP", "topic": "Distinguished name", "q": "When FortiGate requests LDAP authentication, what does the distinguished name (DN) specify?", "opts": ["The CA certificate used to verify the LDAP server", "The attribute that uniquely identifies each user, such as uid", "The part of the directory hierarchy where the user account records are found", "The credentials of an administrator account authorized to query the directory"], "a": 2, "rat": "The notes define the DN as the part of the hierarchy where the user account record can be found, for example ou=people,dc=abc,dc=com.", "src": "Video · 3:45", "diff": "medium"}, {"n": 204, "ln": 15, "lesson": 5, "section": "Remote Authentication: LDAP", "topic": "CN vs UID", "q": "Although the LDAP user account identifier is often called the common name (CN), which identifier is appropriate to use on a computer network, and why?", "opts": ["OU, because the organizational unit identifies the department the user belongs to", "DN, because it is always unique across the directory", "UID, because it is the user ID the person provides when logging in", "DC, because it identifies the user's domain"], "a": 2, "rat": "The notes say the identifier is not necessarily CN; on a computer network it is appropriate to use UID, the person's user ID, because that is what they provide when they log in.", "src": "Video · 3:45", "diff": "hard"}, {"n": 205, "ln": 16, "lesson": 5, "section": "Remote Authentication: LDAP", "topic": "Regular bind type", "q": "When the LDAP server object uses the Regular bind type, what must be supplied in the Username and Password fields?", "opts": ["The credentials of the first end user who will authenticate through the policy", "The RADIUS shared secret that is configured for FortiGate on the directory server", "No credentials at all, because the Regular bind type performs an anonymous bind", "Credentials of a user authorized to run LDAP queries, such as an LDAP admin"], "a": 3, "rat": "The slide callout labels these fields 'Credentials for an LDAP administrator', and the notes describe them as a user authorized to perform LDAP queries.", "src": "Video · 5:00", "diff": "medium"}, {"n": 206, "ln": 17, "lesson": 5, "section": "Remote Authentication: LDAP", "topic": "Secure LDAP connection", "q": "To secure the connection between FortiGate and a remote LDAP server, what do you configure?", "opts": ["Enable Secure Connection, choose LDAPS or STARTTLS, and include the CA certificate that verifies the server", "Enable Test Connectivity, set the Bind Type to Simple, and import the LDAP server's private key", "Change the Bind Type to Anonymous, set the server port to 636, and clear the administrator credentials", "Enable the Exchange server option, enter a shared secret, and set the Common Name Identifier to cn"], "a": 0, "rat": "The notes say to enable Secure Connection and include the protocol (LDAPS or STARTTLS) as well as the CA certificate that verifies the server certificate.", "src": "Video · 5:00", "diff": "hard"}, {"n": 207, "ln": 18, "lesson": 5, "section": "Remote Authentication: LDAP", "topic": "Test Connectivity vs credentials", "q": "An LDAP server object shows Connection status Successful after clicking Test Connectivity. What has actually been verified?", "opts": ["Only that FortiGate can reach the LDAP server; user credentials are not tested", "That the LDAP administrator account has write access to the directory", "That the connection to the server is encrypted with LDAPS on TCP port 636 by default", "That every user in the configured DN can authenticate successfully"], "a": 0, "rat": "The notes state Test Connectivity only tests whether the connection to the LDAP server is successful; to test a user's credentials, use Test User Credentials or the CLI.", "src": "Video · 5:00", "diff": "medium"}, {"n": 208, "ln": 19, "lesson": 5, "section": "Remote Authentication: RADIUS and CLI Testing", "topic": "RADIUS request", "q": "When a user authenticates through FortiGate against RADIUS, which packet does FortiGate send to the RADIUS server?", "opts": ["ACCESS-CHALLENGE", "BIND-REQUEST", "ACCESS-ACCEPT", "ACCESS-REQUEST"], "a": 3, "rat": "The notes say the client (FortiGate) sends an ACCESS-REQUEST packet to the RADIUS server.", "src": "Video · 6:15", "diff": "easy"}, {"n": 209, "ln": 20, "lesson": 5, "section": "Remote Authentication: RADIUS and CLI Testing", "topic": "Access-Challenge", "q": "What does an ACCESS-CHALLENGE reply from a RADIUS server indicate?", "opts": ["The server accepts the request because the user's credentials are correct", "The server rejects the request because the user's credentials are wrong", "The server requests secondary information, such as a token, typically for two-factor authentication", "The server reports that the shared secret configured on FortiGate does not match"], "a": 2, "rat": "The notes define ACCESS-CHALLENGE as the server requesting a secondary password ID, token, or certificate, typically when two-factor authentication is used.", "src": "Video · 6:15", "diff": "medium"}, {"n": 210, "ln": 21, "lesson": 5, "section": "Remote Authentication: RADIUS and CLI Testing", "topic": "RADIUS server settings", "q": "When configuring a RADIUS server in User & Authentication > RADIUS Servers, which value must match the one configured on the RADIUS server itself?", "opts": ["The object name", "The authentication method", "The secret", "The NAS IP"], "a": 2, "rat": "The RADIUS configuration slide callout says the RADIUS server's secret must match.", "src": "Video · 7:05", "diff": "easy"}, {"n": 211, "ln": 22, "lesson": 5, "section": "Remote Authentication: RADIUS and CLI Testing", "topic": "Include in every user group", "q": "What is the effect of enabling Include in every user group on a RADIUS server object?", "opts": ["RADIUS group memberships are ignored and all authenticated users receive full access", "The server and all users who can authenticate against it are added to every FortiGate user group", "Every local FortiGate user account is copied to the RADIUS server during synchronization", "The RADIUS server is used only for administrator logins and not for firewall users"], "a": 1, "rat": "The notes say this option adds the RADIUS server and all users who can authenticate against it to every user group created on FortiGate, so it should be enabled only in very specific scenarios.", "src": "Video · 7:05", "diff": "hard"}, {"n": 212, "ln": 23, "lesson": 5, "section": "Remote Authentication: RADIUS and CLI Testing", "topic": "CLI test for LDAP", "q": "Which CLI command tests whether a user can authenticate against an LDAP server object named External_Server?", "opts": ["execute ldap-test External_Server <username> <password>", "diagnose test authserver ldap External_Server <username> <password>", "diagnose debug authd ldap External_Server <username>", "diagnose test authserver radius External_Server <username> <password>"], "a": 1, "rat": "The CLI slide shows the syntax diagnose test authserver ldap <server_name> <username> <password> with External_Server as the example.", "src": "Video · 7:55", "diff": "medium"}, {"n": 213, "ln": 24, "lesson": 5, "section": "Remote Authentication: RADIUS and CLI Testing", "topic": "CLI test for RADIUS", "q": "Compared with the LDAP test, which additional argument does diagnose test authserver radius require?", "opts": ["The RADIUS server's UDP authentication port", "The authentication scheme, such as pap", "The distinguished name of the user", "The FortiToken serial number"], "a": 1, "rat": "The RADIUS syntax is diagnose test authserver radius <server_name> <scheme> <user> <password>, with pap as the scheme in the example.", "src": "Video · 7:55", "diff": "hard"}, {"n": 214, "ln": 25, "lesson": 5, "section": "Remote Authentication: RADIUS and CLI Testing", "topic": "RADIUS group membership", "q": "In the output of a RADIUS authentication test, where does the reported group membership (for example, remote-RADIUS-admins) come from?", "opts": ["The Common Name Identifier on the RADIUS server object", "The FortiGate user group that references the RADIUS server as a member", "The distinguished name configured on FortiGate", "Vendor-specific attributes (VSAs) configured on the RADIUS server"], "a": 3, "rat": "The slide callout and the knowledge check both state that RADIUS group memberships are provided by vendor-specific attributes configured on the RADIUS server.", "src": "Video · 7:55", "diff": "medium"}, {"n": 215, "ln": 26, "lesson": 5, "section": "Two-Factor Authentication and FortiTokens", "topic": "Two-factor factors", "q": "Two-factor authentication requires two independent methods of identifying a user. Which pair does it combine?", "opts": ["Something you know (a password) and a second thing you know (a PIN or security question)", "Something you know (password or PIN) and something you have (token or certificate)", "Your username (who you claim to be) and your group membership on the LDAP server", "Your source IP address (where you are) and your device type (what endpoint you use)"], "a": 1, "rat": "The two-factor slide lists something you know (password or PIN) and something you have (token or certificate).", "src": "Video · 9:10", "diff": "easy"}, {"n": 216, "ln": 27, "lesson": 5, "section": "Two-Factor Authentication and FortiTokens", "topic": "Two-factor limitation", "q": "With which FortiGate feature can two-factor authentication NOT be used?", "opts": ["Firewall policies with user groups", "Explicit proxies", "Local user accounts", "Administrator accounts"], "a": 1, "rat": "The notes state you can use two-factor authentication with both user and administrator accounts, but not with explicit proxies.", "src": "Video · 9:35", "diff": "hard"}, {"n": 217, "ln": 28, "lesson": 5, "section": "Two-Factor Authentication and FortiTokens", "topic": "FortiToken code generation", "q": "How does a FortiToken 200 or FortiToken Mobile generate its code by default?", "opts": ["A six-digit code each time the user presses a button, based on a counter", "A six-digit code every 60 seconds based on a unique seed and GMT time", "An eight-digit code every 30 seconds based on the user's static password", "A four-digit code every 5 minutes, sent from FortiGate by SMS or email"], "a": 1, "rat": "The slide states FortiToken 200 or FortiToken Mobile generates a six-digit code every 60 seconds based on a unique seed and GMT time.", "src": "Video · 10:00", "diff": "medium"}, {"n": 218, "ln": 29, "lesson": 5, "section": "Two-Factor Authentication and FortiTokens", "topic": "FortiToken Mobile Push", "q": "What does FortiToken mobile push add to two-factor authentication?", "opts": ["Users approve the request in the FortiToken app without entering a code", "The token code is pushed to the user by email instead of generated on the device", "The token generates longer OTP codes that remain valid for several minutes", "Users no longer need a static password because the push replaces the first factor"], "a": 0, "rat": "The slide says FortiToken mobile push supports two-factor authentication without requiring the user to enter a code; the notes say users accept the request from the app.", "src": "Video · 10:00", "diff": "medium"}, {"n": 219, "ln": 30, "lesson": 5, "section": "Two-Factor Authentication and FortiTokens", "topic": "OTP algorithm inputs", "q": "The FortiToken algorithm that generates an OTP uses which two inputs?", "opts": ["A fixed, randomly generated seed and the time from an accurate clock", "The token serial number and the IP address of the validating FortiGate", "The user's static password and the serial number of the validating FortiGate", "A counter that increments on each use and the user's personal PIN code"], "a": 0, "rat": "The notes say the algorithm consists of a seed (a unique, randomly generated number that does not change over time) and the time from an accurate internal clock.", "src": "Video · 10:25", "diff": "medium"}, {"n": 220, "ln": 31, "lesson": 5, "section": "Two-Factor Authentication and FortiTokens", "topic": "Validation order", "q": "When a user submits a static password plus a FortiToken OTP, how does FortiGate as the validation server process them?", "opts": ["It validates only the OTP, because a static password is optional when a FortiToken is assigned", "It validates the OTP first by querying the token over the network, then validates the static password", "It validates the static password first, then regenerates the passcode from the seed and time and compares it", "It forwards both the static password and the OTP to FortiGuard, which validates them and replies"], "a": 2, "rat": "The notes describe the validation server receiving the credentials, validating the static password, and then validating the passcode by regenerating it with the seed and synchronized system time and comparing it.", "src": "Video · 10:50", "diff": "hard"}, {"n": 221, "ln": 32, "lesson": 5, "section": "Two-Factor Authentication and FortiTokens", "topic": "Time synchronization", "q": "Why is it crucial to configure correct date and time, preferably using NTP, on a FortiGate that validates FortiTokens?", "opts": ["Token and validation server need synchronized clocks to generate the same OTP", "Authentication timeouts are calculated only from time learned through NTP", "LDAP binding fails if FortiGate time differs from the directory server's clock", "RADIUS shared secrets expire and rotate based on the FortiGate system clock"], "a": 0, "rat": "The notes state both the token and validation server must use the same seed and have synchronized system clocks, so configure date and time correctly or link to an NTP server (recommended).", "src": "Video · 10:50", "diff": "medium"}, {"n": 222, "ln": 33, "lesson": 5, "section": "Two-Factor Authentication and FortiTokens", "topic": "Free FortiToken Mobile", "q": "How many free FortiToken Mobile activations does each FortiGate (and FortiGate VM) include?", "opts": ["One", "Ten", "Five", "Two"], "a": 3, "rat": "The slide callout and notes state each FortiGate provides two free FortiToken Mobile activations; additional tokens must be purchased.", "src": "Video · 11:40", "diff": "easy"}, {"n": 223, "ln": 34, "lesson": 5, "section": "Two-Factor Authentication and FortiTokens", "topic": "Tokens across multiple FortiGates", "q": "You want users to use the same FortiToken to authenticate on several FortiGate devices. What must you do?", "opts": ["Use a central validation server, such as FortiAuthenticator, to register and assign the tokens", "Register the same FortiToken serial number separately on each FortiGate device", "Export the token seed from one FortiGate and import it on each of the other FortiGates", "Enable Include in every user group on each FortiGate so the token is shared automatically"], "a": 0, "rat": "The notes say you cannot register the same FortiToken on more than one FortiGate; to use it on multiple devices you must use a central validation server such n protocols", "They are redirected to the captive portal configured on the egress interface", "They are allowed but logged as unauthenticated traffic in the forward traffic log", "They are allowed only when the destination address is on an internal network"], "a": 0, "rat": "The slide states all other services are not allowed until the user has authenticated successfully through one of the listed protocols.", "src": "Video · 13:45", "diff": "medium"}, {"n": 230, "ln": 41, "lesson": 5, "section": "Active and Passive Authentication in Firewall Policies", "topic": "Passive and services", "q": "How does passive authentication differ from active authentication regarding the services a firewall policy must allow?", "opts": ["It requires the ALL service so that DNS and login traffic can both pass", "It does not require any specific services to be allowed in the policy", "It requires HTTPS to be allowed so that users can reach the captive portal", "It requires Telnet or FTP to be allowed so users are prompted to log in"], "a": 1, "rat": "The notes say passive authentication determines user identity behind the scenes and does not require any specific services to be allowed within the policy.", "src": "Video · 14:10", "diff": "medium"}, {"n": 231, "ln": 42, "lesson": 5, "section": "Active and Passive Authentication in Firewall Policies", "topic": "DNS before authentication", "q": "A policy with authentication allows only the HTTP service, and users cannot resolve hostnames to reach the login prompt. What is the fix?", "opts": ["Explicitly add the DNS service to the policy, because HTTP does not include DNS", "Move the policy below an open policy that has no authentication enabled", "Enable Include in every user group on the remote authentication server object", "Change the authentication timeout type from idle-timeout to new-session on the CLI"], "a": 0, "rat": "The slide says DNS traffic can be allowed before authentication but must be explicitly listed as a service; the notes add that HTTP is TCP 80 and does not include DNS (UDP 53).", "src": "Video · 14:35", "diff": "hard"}, {"n": 232, "ln": 43, "lesson": 5, "section": "Active and Passive Authentication in Firewall Policies", "topic": "DNS after failed authentication", "q": "Why is DNS also allowed when a user's authentication attempt is unsuccessful?", "opts": ["So FSSO can identify the user passively", "So the RADIUS server can send an Access-Challenge", "So users can resolve hostnames and try to authenticate again", "So FortiGate can log each failed attempt to a remote syslog server"], "a": 2, "rat": "The notes explain DNS is also allowed if authentication is unsuccessful because users need to be able to try to authenticate again.", "src": "Video · 14:35", "diff": "medium"}, {"n": 233, "ln": 44, "lesson": 5, "section": "Active and Passive Authentication in Firewall Policies", "topic": "Mixing policies", "q": "Policies 17 and 18 have user groups in the source, and policy 19 below them is an open policy from LOCAL_SUBNET with no authentication. What is the effect of the open policy at the end of the list?", "opts": ["It prevents policies 17 and 18 from ever matching traffic from LOCAL_SUBNET", "It automatically sets auth-on-demand to always for every policy in the list", "It forces all users who match policy 19 to authenticate through the captive portal", "Users may get passive or no-prompt access, so authentication on 17 and 18 is not always forced"], "a": 3, "rat": "The Mixing Policies slide says enabling authentication in policies does not always mean users must actively authenticate; an open policy at the end can allow passive or no-prompt authentication.", "src": "Video · 15:50", "diff": "hard"}, {"n": 234, "ln": 45, "lesson": 5, "section": "Active and Passive Authentication in Firewall Policies", "topic": "Forcing active authentication", "q": "An open fall-through policy at the bottom of the list lets some users through without a login prompt. Which set of options can you use , "opts": ["On the CLI under config user setting; the default is always", "On the CLI under config user setting; the default is implicitly", "In the GUI on each firewall policy; the default is implicitly", "In the GUI under User & Authentication > Authentication Settings; the default is always"], "a": 1, "rat": "The slide shows config user setting / set auth-on-demand <always|implicitly> as a CLI-only option, and the notes identify implicitly as the default.", "src": "Video · 17:05", "diff": "medium"}, {"n": 237, "ln": 48, "lesson": 5, "section": "Active and Passive Authentication in Firewall Policies", "topic": "auth-on-demand always", "q": "What behavior does set auth-on-demand always produce?", "opts": ["It prompts on active-authentication policies even with a fall-through policy; traffic waits for login", "It never triggers authentication when a fall-through policy exists below the active policy", "It forces passive authentication for all users and disables active authentication prompts", "It enables a captive portal on every interface that has a firewall policy with authentication"], "a": 0, "rat": "The notes say always triggers an authentication prompt for policies with active authentication regardless of a fall-through policy, and traffic is not allowed until authentication is successful; implicitly does not trigger it when a fall-through policy exists.", "src": "Video · 17:05", "diff": "hard"}, {"n": 238, "ln": 49, "lesson": 5, "section": "Active and Passive Authentication in Firewall Policies", "topic": "Policy order with auth-on-demand", "q": "When enforcing authentication with the auth-on-demand option, how must passive and active authentication policies be ordered?", "opts": ["Order does not matter because authentication is enabled at the interface level", "Passive authentication policies must be placed above active authentication policies", "Both must be merged into a single policy", "Active authentication policies must be placed above passive authentication policies"], "a": 1, "rat": "The Active Authentication Behavior slide states that with option 2 you must place passive authentication policies on top of active authentication policies.", "src": "Video · 17:05", "diff": "medium"}, {"n": 239, "ln": 50, "lesson": 5, "section": "Active and Passive Authentication in Firewall Policies", "topic": "Captive portal", "q": "You want every device connecting through a specific interface to authenticate before accessing any resource. What is the recommended approach and where is it configured?", "opts": ["A captive portal on the ingress interface, set in Network > Interfaces with Security mode", "A captive portal on the egress interface, set in Policy & Objects > Firewall Policy", "auth-on-demand set to implicitly, set on the CLI under config user setting", "The interface added to an FSSO user group, set in User & Authentication > User Groups"], "a": 0, "rat": "The captive portal slide shows Network > Interfaces > Edit Interface with Security mode set to Captive Portal; authentication happens at the interface level on the ingress interface.", "src": "Video · 17:55", "diff": "medium"}, {"n": 240, "ln": 51, "lesson": 5, "section": "Active and Passive Authentication in Firewall Policies", "topic": "Captive portal exemptions", "q": "With a captive portal enabled on an interface, when can traffic pass without valid authentication?", "opts": ["When the user belongs to any local user group", "When it uses HTTPS", "Only when it matches a configured exemption", "When the authentication timeout has not yet expired for another user"], "a": 2, "rat": "The slide states that with a captive portal, traffic is not allowed without valid authentication unless it matches an exemption (exempt sources or destinations/services).", "src": "Video · 17:55", "diff": "medium"}, {"n": 241, "ln": 52, "lesson": 5, "section": "Authentication Timeouts and User Monitoring", "topic": "Default auth timeout", "q": "What are the default firewall authentication e user's activity"], "a": 2, "rat": "The slide says with new session, authentication expires if no new session is created in that amount of time; the notes add this applies even if traffic is being generated on existing channels.", "src": "Video · 18:20", "diff": "hard"}, {"n": 244, "ln": 55, "lesson": 5, "section": "Authentication Timeouts and User Monitoring", "topic": "Monitoring authenticated users", "q": "Where do you monitor users who authenticated through firewall policies and deauthenticate them?", "opts": ["Policy & Objects > Firewall Policy > Policy Lookup", "Dashboard > Assets & Identities > Firewall Users", "Log & Report > System Events > User Activity", "User & Authentication > User Definition > Edit User"], "a": 1, "rat": "The Monitoring Users slide shows Dashboard > Assets & Identities > Firewall Users, which also has a Deauthenticate button to terminate authenticated sessions.", "src": "Video · 19:10", "diff": "easy"}, {"n": 245, "ln": 56, "lesson": 5, "section": "Authentication Timeouts and User Monitoring", "topic": "Admins not in Firewall Users", "q": "Why do administrators logged in to FortiGate not appear on the Firewall Users monitor?", "opts": ["Administrator sessions are exempt from firewall authentication timeouts", "They log in directly on FortiGate, not through firewall policies", "Administrators are shown only on the FSSO logons view of the monitor", "Administrator sessions are hidden unless two-factor authentication is enabled"], "a": 1, "rat": "The notes state the page does not include administrators because they are not authenticating through firewall policies that allow traffic; they log in directly on FortiGate.", "src": "Video · 19:10", "diff": "medium"}, {"n": 246, "ln": 1, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "FSSO user identification", "q": "Which set of user details does FSSO software identify so that FortiGate can apply identity-based access?", "opts": ["User ID, MAC address, and password hash" ix and terminal servers where multiple users share the same IP address.", "src": "Video · 1:15", "diff": "medium"}, {"n": 250, "ln": 5, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "TS agent dependency", "q": "What must a terminal server (TS) agent work with to get its login events to FortiGate?", "opts": ["A DC agent on every domain controller", "A direct TCP 8000 session to FortiGate", "A Windows AD collector agent or FortiAuthenticator", "FortiGate agentless polling on TCP 445"], "a": 2, "rat": "The notes state TS agents require the Windows AD collector agent or FortiAuthenticator to collect and send the login events to FortiGate.", "src": "Video · 1:15", "diff": "medium"}, {"n": 251, "ln": 6, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "Agentless use case", "q": "For which environment is agentless polling mode intended?", "opts": ["Novell networks using eDirectory", "Large multi-domain forests with many domain controllers", "Citrix farms where users share one IP", "Simple networks with a minimal number of users"], "a": 3, "rat": "The notes state that agentless mode does not require a collector agent and is intended for simple networks with a minimal number of users.", "src": "Video · 1:15", "diff": "easy"}, {"n": 252, "ln": 7, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "eDirectory agent", "q": "How does the FSSO eDirectory agent obtain user sign-on information?", "opts": ["Through WMI or NetAPI queries", "By reading SMB event logs on TCP 445", "Through a dcagent.dll on each server", "Through the Novell API or an LDAP setting"], "a": 3, "rat": "The slide lists 'Uses Novell API or LDAP setting' for eDirectory, and the notes say the agent obtains information using either the Novell API or LDAP.", "src": "Video · 1:40", "diff": "easy"}, {"n": 253, "ln": 8, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "DC agent file", "q": "In DC agent mode, what is installed on each Windows domain controller, and where?", "opts": ["fsae.exe in the Program Files\\Fortinet\\FSAE folder", "dcagent.msi in the Windows\\Temp directory", "dcagent.dll in the Windows\\system32 directory", "collector.dll in system32\\drivers"], "a": 2, "rat": "The DC Agent Mode slide states it requires one DC agent (dcagent.dll) installed on each Windows DC in the Windows\\system32 directory.", "src": "Video · 2:05", "diff": "medium"}, {"n": 254, "ln": 9, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "DC agent responsibilities", "q": "In DC agent mode, which task is handled by the DC agent rather than the collector agent?", "opts": ["Group verification", "Handling DNS lookups (by default)", "Workstation checks", "Updating login records on FortiGate"], "a": 1, "rat": "The slide lists the DC agent as responsible for monitoring login events and handling DNS lookups (by default); group verification, workstation checks, and FortiGate updates belong to the collector agent.", "src": "Video · 2:05", "diff": "hard"}, {"n": 255, "ln": 10, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "Double DNS resolution", "q": "Double DNS resolution is causing problems in a DC agent deployment. Which fix addresses it?", "opts": ["Disable the DNS client service on the collector agent host", "Set donot_resolve to 1 in the DC agent registry key", "Switch the collector agent to NetAPI polling", "Set the IP address change interval to 0"], "a": 1, "rat": "The notes say you may configure a registry key on the DC hosting the DC agent so it does not resolve DNS: donot_resolve = (DWORD) 1 at HKLM/Software/Fortinet/FSAE/dcagent.", "src": "Video · 2:05", "diff": "hard"}, {"n": 256, "ln": 11, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "DC agent port", "q": "By default, how does the DC agent send login events to the collector agent?", "opts": ["TCP port 8000", "UDP port 8002", "TCP port 445", "UDP port 8003"], "a": 1, "rat": ff": "easy"}, {"n": 260, "ln": 15, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "Event logging requirement", "q": "In collector agent-based polling, which method does NOT require event logging to be enabled on the DCs?", "opts": ["NetAPI", "WinSecLog", "Every polling method requires it", "WMI"], "a": 0, "rat": "The slide states 'Event logging must be enabled on the DCs (except in NetAPI)'.", "src": "Video · 4:10", "diff": "medium"}, {"n": 261, "ln": 16, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "Polling mode drawback", "q": "Which drawback applies to collector agent-based polling mode?", "opts": ["It requires a reboot of every domain controller after install", "It generates traffic even when there are no logins", "It requires a DC agent installed on each domain controller", "It cannot be made redundant with a second collector"], "a": 1, "rat": "The notes say polling also generates unnecessary traffic when there have been no login events; the comparison table shows polling needs no DC agent or reboot and does support redundancy.", "src": "Video · 4:10", "diff": "medium"}, {"n": 262, "ln": 17, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "Polling method ranking", "q": "What is the order of collector agent polling methods from most to least recommended?", "opts": ["WMI, WinSecLog, NetAPI", "NetAPI, WMI, WinSecLog", "WinSecLog, NetAPI, WMI", "NetAPI, WinSecLog, WMI"], "a": 0, "rat": "The Polling Mode Options slide is labeled 'Most recommended --> Least recommended' with WMI, WinSecLog, and NetAPI from left to right.", "src": "Video · 4:35", "diff": "medium"}, {"n": 263, "ln": 18, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "WMI method", "q": "Which statement describes the WMI polling method?", "opts": ["The collector parses every security event on the DC", "It polls the NetSessionEnum function in RAM", "The DC returns the requested login events", "It needs no event logging enabled on the DC"], "a": 2, "rat": "The slide says with WMI the DC returns all requested login events and reads selected event logs; the notes add the collector need not search the security event logs itself.", "src": "Video · 4:35", "diff": "medium"}, {"n": 264, "ln": 19, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "NetAPI missed logins", "q": "Why can the NetAPI polling method miss login events on a heavily loaded DC?", "opts": ["Security event logs roll over before they can be read", "Sessions can be created and purged from RAM before a poll", "WMI queries time out under heavy load", "SMB fallback ports are blocked by default"], "a": 1, "rat": "The notes explain NetAPI polls temporary sessions in RAM via NetSessionEnum; under heavy load sessions can be created and purged from RAM before the agent polls.", "src": "Video · 5:00", "diff": "medium"}, {"n": 265, "ln": 20, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "WinSecLog requirement", "q": "What does the WinSecLog polling method require on the domain controller?", "opts": ["A DC agent installed in Windows\\system32", "A collector agent installed on every DC", "Audit success of specific event IDs in the security log", "The NetSessionEnum function to be enabled"], "a": 2, "rat": "The notes state WinSecLog requires that the audit success of specific event IDs is recorded in the Windows security logs.", "src": "Video · 5:00", "diff": "hard"}, {"n": 266, "ln": 21, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "Agentless polling option", "q": "Which polling option is supported in agentless polling mode?", "opts": ["WMI only", "WinSecLog only", "NetAPI only", "WMI, WinSecLog, and NetAPI"], "a": 1, "rat": "The Agentless Polling Mode slide states 'Support for polling option WinSecLog only'; FortiGate uses SMB to read the event viewer logs.", "src": "Video · 6:15", "diff": "medium"}, {"n": 267, "ln": 22, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "Agentless event IDs", "q": "Agentless polling works like WinSecLog but with a limited set of event IDs. Which ones?", "opts": ["4776 and 4625", "4624 and 4634", "4768 and 4769", "4672 and 4648"], "a": 2, "rat": "The notes state agentless polling operates similarly to WinSecLog but with only two event IDs: 4768 and 4769.", "src": "Video · 6:15", "diff": "hard"}, {"n": 268, "ln": 23, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "Agentless limitation", "q": "Which feature is not available in agentless polling mode?", "opts": ["Reading DC event logs over SMB", "Retrieving user group membership", "Polling multiple domain controllers", "Workstation verification"], "a": 3, "rat": "The slide states FortiGate doesn't poll workstations, so workstation verification is not available in agentless polling mode.", "src": "Video · 6:15", "diff": "medium"}, {"n": 269, "ln": 24, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "Agentless resources", "q": "Which FSSO mode requires more FortiGate system resources (CPU and RAM)?", "opts": ["Collector agent-based polling mode", "Agentless polling mode", "DC agent mode", "Terminal server agent mode"], "a": 1, "rat": "The knowledge check marks 'Agentless polling mode' as the correct answer; the agentless slide also lists 'More CPU and RAM required by FortiGate'.", "src": "Video · 29:35", "diff": "easy"}, {"n": 270, "ln": 25, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "Comparing modes", "q": "Which statement about DC agent mode, compared with polling mode, is correct?", "opts": ["Its scalability is lower than that of polling mode", "Installation is per DC and requires a reboot", "It does not support redundancy", "It might miss logins, as NetAPI can"], "a": 1, "rat": "The Comparing Modes table shows DC agent mode installation as complex, one per DC, requiring a reboot, with higher scalability, redundancy, and capturing all logins.", "src": "Video · 7:30", "diff": "medium"}, {"n": 271, "ln": 26, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "Polling redundancy", "q": "In polling mode, what happens when you add a second collector agent for redundancy?", "opts": ["The DCs push one log copy to both collectors", "Both collector agents query every DC individually", "The collectors split the DCs between them", "Only the primary collector queries the DCs"], "a": 1, "rat": "The notes state that with a second collector in polling mode both collector agents need to query every DC individually, while in DC agent mode the DC agent collects once and sends a copy to all collectors.", "src": "Video · 7:30", "diff": "hard"}, {"n": 272, "ln": 27, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "Collector placement", "q": "Where can the collector agent be installed?", "opts": ["Only on a domain controller in each monitored domain", "On any Windows computer on the network", "Only on the FortiGate itself", "Only on a FortiAuthenticator"], "a": 1, "rat": "The notes state you do not have to install a collector agent on the DC; you can install it on any Windows computer on the network.", "src": "Video · 7:30", "diff": "easy"}, {"n": 273, "ln": 28, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "DNS requirement", "q": "Why must the DNS server be able to resolve all workstation names in an AD FSSO deployment?", "opts": ["DC agents register users in DNS at login", "FortiGate matches traffic by host name", "WMI queries require reverse DNS records", "Login events carry workstation names, not IP addresses"], "a": 3, "rat": "The Additional FSSO AD Requirements slide states Microsoft login events contain workstation names but not IP addresses, and the collector uses DNS to resolve the name to an IP.", "src": "Video · 8:20", "diff": "medium"}, {"n": 274, "ln": 29, "lesson": 6, "section": "FSSO Concepts and Deployment Modes", "topic": "Workstation polling ports", "q": "Which ports must be open between collector agents (or FortiGate) and all hosts for workstation polling?", "opts": ["TCP 8000 (default) and TCP 8001 (SSL)", "UDP 8002 (default) and UDP 8003 (SSL)", "TCP 135 (default) and UDP 137 (backup)", "TCP 445 (default) and TCP 139 (as backup)"], "a": 3, "rat": "The slide states TCP ports 445 (default) and 139 (backup) must be open between collector agents or FortiGate and all hosts.", "src": "Video · 8:20", "diff": "medium"}, {"n": 275, "ln": 30, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Agentless connector", "q": "Where do you configure FortiGate as the collector for agentless polling?", "opts": ["External Connectors > RADIUS Single Sign-On Agent (RSSO)", "External Connectors > FSSO Agent on Windows AD", "User & Authentication > LDAP Servers", "External Connectors > Poll Active Directory Server"], "a": 3, "rat": "The agentless configuration slide shows Security Fabric > External Connectors, and the notes say to select Poll Active Directory Server and configure each DC's IP and AD admin credentials.", "src": "Video · 9:35", "diff": "easy"}, {"n": 276, "ln": 31, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Agentless group lookup", "q": "In agentless polling, what must you add to the Poll Active Directory Server configuration so FortiGate can retrieve user groups?", "opts": ["An LDAP server", "A RADIUS server", "A DC agent password", "A collector agent IP address"], "a": 0, "rat": "The notes state FortiGate uses LDAP to query AD for user group information, so you must add the LDAP server to the Poll Active Directory Server configuration.", "src": "Video · 9:35", "diff": "medium"}, {"n": 277, "ln": 32, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Local group source", "q": "On the FSSO Agent on Windows AD connector, you set the user group source to Local. What must be true of the collector agent?", "opts": ["It must be in Standard access mode", "It must be in Advanced access mode", "It must have NTLM disabled", "It must run on a domain controller host"], "a": 1, "rat": "The notes state that if FortiGate is set to Local, the collector agent must be set to Advanced mode, otherwise it does not recognize the group filter from FortiGate and passes down no user logins.", "src": "Video · 10:00", "diff": "hard"}, {"n": 278, "ln": 33, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Collector Agent group source", "q": "With the connector's user group source set to Collector Agent, where are group filters created?", "opts": ["On the collector agent", "On FortiGate, using an LDAP server", "On each domain controller", "On the DC agent in system32"], "a": 0, "rat": "The notes state that in Collector Agent mode you create group filters on the collector agent (which can still use Advanced mode for nested groups).", "src": "Video · 10:00", "diff": "medium"}, {"n": 279, "ln": 34, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Agent version matching", "q": "Which version-matching rule applies when installing FSSO agents?", "opts": ["FSSO must match the exact FortiGate firmware", "The DC agent version must match the collector agent", "The collector must be older than the DC agent", "The TS agent must match the FortiGate build"], "a": 1, "rat": "The notes say you do not need to match FSSO to the exact FortiGate firmware (grab the latest collector for your major release), but you do need to match the DC agent version to the collector agent version.", "src": "Video · 10:50", "diff": "medium"}, {"n": 280, "ln": 35, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "TS agent installer", "q": "Which installer provides the agent for Citrix and terminal servers?", "opts": ["FSSO_Setup_edirectory", "DCAgent_Setup", "FSSO_Setup", "TSAgent_Setup"], "a": 3, "rat": "The installation slide lists the TS Agent installer as TSAgent_Setup; DCAgent_Setup is the DC agent and FSSO_Setup / FSSO_Setup_edirectory are collector agents.", "src": "Video · 10:50", "diff": "easy"}, {"n": 281, "ln": 36, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Installer account format", "q": "During collector agent installation, in what format must the service account user name be entered?", "opts": ["UserName@DomainName", "CN=UserName,DC=Domain", "DomainName\\UserName", "DomainName/UserName"], "a": 2, "rat": "The Collector Agent Installation Process slide states to enter the user name in the format DomainName\\UserName.", "src": "Video · 11:40", "diff": "easy"}, {"n": 282, "ln": 37, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Install access mode", "q": "What is the default AD access mode when installing the collector agent, and which mode is best practice for new setups?", "opts": ["Advanced by default; Standard is best practice", "Standard by default; Standard is best practice", "Advanced by default; Advanced is best practice", "Standard by default; Advanced is best practice"], "a": 3, "rat": "The notes state that although the default is Standard mode, for new FSSO setups it is always best practice to install in Advanced mode.", "src": "Video · 11:40", "diff": "medium"}, {"n": 283, "ln": 38, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "DC agent from wizard", "q": "You plan to use DC agent mode. What should you select before exiting the collector agent install wizard?", "opts": ["Serve NTLM authentication requests", "Launch DC Agent Install Wizard", "Advanced access method", "Monitor user logon events"], "a": 1, "rat": "The notes state that for DC agent mode you make sure Launch DC Agent Install Wizard is selected, which automatically starts the DC agent installation.", "src": "Video · 11:40", "diff": "medium"}, {"n": 284, "ln": 39, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "DC agent reboot", "q": "After installing the DC agent on a domain controller, what must happen before it starts gathering login events?", "opts": ["The domain controller must be rebooted", "FortiGate must be rebooted", "The DC must be added to the ignore list", "The collector agent must be reinstalled"], "a": 0, "rat": "The notes state installing the DC agent requires a reboot of the DC before it starts gathering login events; the wizard finally requests a system reboot.", "src": "Video · 12:55", "diff": "easy"}, {"n": 285, "ln": 40, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Wizard working mode", "q": "In the DC agent installation wizard, what happens if you choose Polling Mode as the working mode?", "opts": ["The DC agent is not installed", "The DC agent is installed in polling mode", "Agentless polling is enabled on FortiGate", "The DC agent polls the collector instead"], "a": 0, "rat": "Step 5 of the DC Agent Installation Process slide reads: DC Agent Mode installs the DC agent on the selected DC; Polling Mode means the DC agent will not be installed.", "src": "Video · 12:30", "diff": "medium"}, {"n": 286, "ln": 41, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Authenticated connection", "q": "Which collector agent option enables password authentication between FortiGate and the collector agent?", "opts": ["Require authenticated connection from FortiGate", "Support NTLM authentication", "Monitor user logon events and send them", "Enable SSL on the FortiGate SSL port 8001"], "a": 0, "rat": "The configuration slide callout 'Enable authentication between FortiGate and collector agent' points to 'Require authenticated connection from FortiGate' with a password field.", "src": "Video · 13:45", "diff": "medium"}, {"n": 287, "ln": 42, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Standard access mode", "q": "Which statement about Standard AD access mode is correct?", "opts": ["User names use CN=User,OU=Name,DC=Domain", "Nested groups are not supported", "FortiGate can act as the LDAP client for filters", "Policies can match individual AD users"], "a": 1, "rat": "The AD Access Mode slide lists for Standard mode: Windows convention Domain\\groups, policy authentication applies to AD groups only (no individual users), and nested groups are not supported.", "src": "Video · 18:45", "diff": "medium"}, {"n": 288, "ln": 43, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Advanced access mode", "q": "Which capability is available in Advanced AD access mode but not in Standard?", "opts": ["Group names use the Domain\\groups format", "Group filters can be set on the collector agent", "Firewall policies can match AD users, groups, and OUs", "FSSO group objects can include AD groups"], "a": 2, "rat": "The slide states in Advanced mode firewall policy authentication can apply to AD users, groups, and OUs and supports nested groups; Standard applies to AD groups only.", "src": "Video · 18:45", "diff": "medium"}, {"n": 289, "ln": 44, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Where to filter", "q": "Why is it recommended to create group filters on the collector agent rather than on FortiGate?", "opts": ["FortiGate cannot act as an LDAP client for FSSO filters", "Filters defined on FortiGate disable nested group support", "The collector keeps collecting if FortiGate LDAP fails", "Collector-side filters remove the need for DNS resolution"], "a": 2, "rat": "The notes explain that if the collector's LDAP fails FSSO won't work regardless, but if FortiGate LDAP fails while the collector's LDAP runs, the collector still collects logs; therefore filters should be created on the collector agent.", "src": "Video · 18:45", "diff": "hard"}, {"n": 290, "ln": 45, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Changing access mode", "q": "On the collector agent, which Common Tasks button opens the setting for the AD access mode?", "opts": ["Set Directory Access Information", "Select Domains To Monitor", "Sync Configuration With Other Agents", "Set Group Filters"], "a": 0, "rat": "The AD Access Mode slide highlights Set Directory Access Information, which opens a dialog with the AD access mode drop-down (Standard or Advanced).", "src": "Video · 18:45", "diff": "medium"}, {"n": 291, "ln": 46, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "FSSO group object path", "q": "Where on FortiGate do you create an FSSO user group object?", "opts": ["User & Authentication > User Groups", "Security Fabric > External Connectors", "Policy & Objects > Addresses", "System > Authentication Settings"], "a": 0, "rat": "The slide shows User & Authentication > User Groups > Create new > Fortinet Single Sign-On (FSSO).", "src": "Video · 20:25", "diff": "easy"}, {"n": 292, "ln": 47, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Group object members", "q": "When you create an FSSO group object on FortiGate with the collector in Standard mode, what can you select as members?", "opts": ["Any mix of users, groups, and OUs", "Only individual AD users", "Only AD groups", "Only organizational units"], "a": 2, "rat": "The notes state that in Standard mode you can select only AD groups as members, while Advanced mode allows any combination of users, groups, and OUs.", "src": "Video · 20:25", "diff": "medium"}, {"n": 293, "ln": 48, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Child-domain groups", "q": "Local or universal groups that contain universal groups from child domains are supported under what condition?", "opts": ["Only in Standard access mode", "Only with NetAPI polling mode", "Only with agentless polling", "Only with Global Catalog"], "a": 3, "rat": "The AD Group Support slide lists 'Local or universal groups that contain universal groups from child domains (only with Global Catalog)'.", "src": "Video · 22:55", "diff": "hard"}, {"n": 294, "ln": 49, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Non-member passive", "q": "With only passive FSSO authentication, what happens to a user who is not in any FSSO group?", "opts": ["They are prompted to log in", "Their traffic is always dropped", "They become part of SSO_Guest_Users", "They are added to the collector's ignore list"], "a": 2, "rat": "The slide states that for passive FSSO authentication a user not in an FSSO group is part of SSO_Guest_Users; the notes add this group exists in all FortiGate configurations.", "src": "Video · 22:55", "diff": "medium"}, {"n": 295, "ln": 50, "lesson": 6, "section": "Installing and Configuring FSSO", "topic": "Non-member passive and active", "q": "When both passive and active authentication are enabled for specific traffic, what happens to a user who is not in any FSSO group?", "opts": ["The user joins SSO_Guest_Users", "The user is prompted to log in", "The collector re-polls the DC for the user", "The traffic bypasses the policy"], "a": 1, "rat": "The slide states that for passive and active FSSO authentication the user is prompted to log in; the notes say SSO_Guest_Users cannot be used in that case.", "src": "Video · 23:20", "diff": "medium"}, {"n": 296, "ln": 51, "lesson": 6, "section": "Collector Agent Filters, Timers and Advanced Settings", "topic": "Group filter binding", "q": "To what are FortiGate group filters on the collector agent tied?", "opts": ["The connector name on FortiGate", "The FortiGate management IP", "The FortiGate hostname", "The FortiGate serial number"], "a": 3, "rat": "The Group Filter slide states filters are tied to the FortiGate serial number, and the dialog has a FortiGate Serial Number field.", "src": "Video · 14:35", "diff": "medium"}, {"n": 297, "ln": 52, "lesson": 6, "section": "Collector Agent Filters, Timers and Advanced Settings", "topic": "Default filter", "q": "What is the purpose of the default group filter on the collector agent?", "opts": ["It blocks all logins until specific filters exist", "It applies to any FortiGate without its own filter", "It forwards every group to every FortiGate", "It is used only for agentless polling"], "a": 1, "rat": "The notes say the filter list is initially empty, and at a minimum you should create a default filter that applies to any FortiGate device that does not have a specific filter defined.", "src": "Video · 14:35", "diff": "medium"}, {"n": 298, "ln": 53, "lesson": 6, "section": "Collector Agent Filters, Timers and Advanced Settings", "topic": "Access mode change", "q": "What must you do after changing the collector's AD access mode between Standard and Advanced?", "opts": ["Reinstall every DC agent", "Reboot all domain controllers", "Re-register the FortiGate serial", "Recreate the group filters"], "a": 3, "rat": "The notes state that if you change the AD access mode from Standard to Advanced or vice versa, you must recreate the filters because they vary by mode.", "src": "Video · 14:35", "diff": "hard"}, {"n": 299, "ln": 54, "lesson": 6, "section": "Collector Agent Filters, Timers and Advanced Settings", "topic": "Group filter role", "q": "What do FortiGate group filters on the collector agent control?", "opts": ["Which firewall policies the FSSO user can match on FortiGate", "Which DCs the collector agent polls", "Which users the DC agent ignores", "Whose login information is sent to that FortiGate"], "a": 3, "rat": "The Group Filter slide states FortiGate group filters control which user's login information is sent to that FortiGate device.", "src": "Video · 14:35", "diff": "easy"}, {"n": 300, "ln": 55, "lesson": 6, "section": "Collector Agent Filters, Timers and Advanced Settings", "topic": "Service accounts", "q": "Why is it good practice to add network service accounts to the collector's Ignore User List?", "opts": ["They cannot be resolved by DNS", "They exceed the collector's license", "They overwrite user login events", "They require active authentication"], "a": 2, "rat": "The notes state service accounts tend to overwrite user login events and create arantee at least 64 Kbps bandwidth for each domain controller.", "src": "Video · 24:35", "diff": "easy"}, {"n": 311, "ln": 66, "lesson": 6, "section": "Logging, Monitoring and Troubleshooting", "topic": "Workstation verify zero", "q": "Why should the workstation verify interval never be set to 0?", "opts": ["The collector stops receiving events from DC agents", "Stale entries go only when a new event overwrites them", "DNS lookups for workstations stop working", "FortiGate drops all FSSO users at once"], "a": 1, "rat": "The notes explain setting it to 0 prevents the collector from deleting stale entries, so they can be removed only by a new event overwriting them; this is dangerous when FSSO and non-FSSO users share a DHCP pool.", "src": "Video · 24:35", "diff": "hard"}, {"n": 312, "ln": 67, "lesson": 6, "section": "Logging, Monitoring and Troubleshooting", "topic": "Guest group with active auth", "q": "You use active authentication as a backup to FSSO. How should SSO_Guest_User be handled?", "opts": ["Do not add it to any policy", "Add it to every FSSO policy", "Map it to the default filter", "Use it as the active auth group"], "a": 0, "rat": "The notes state that if you use active authentication as a backup, ensure you do not add SSO_Guest_User to any policies; SSO_Guest_User and active authentication are mutually exclusive.", "src": "Video · 25:00", "diff": "medium"}, {"n": 313, "ln": 68, "lesson": 6, "section": "Logging, Monitoring and Troubleshooting", "topic": "FortiGate FSSO logs", "q": "Where on FortiGate do you view FSSO logon and logoff log entries?", "opts": ["Log & Report > Forward Traffic", "Dashboard > Assets & Identities", "Log & Report > System Events > User Events", "Log & Report > Security Events > IPS"], "a": 2, "rat": "The FSSO Log Messages slide shows FSSO-logon and FSSO-logoff entries under Log & Report > System Events > User Events.", "src": "Video · 25:50", "diff": "easy"}, {"n": 314, "ln": 69, "lesson": 6, "section": "Logging, Monitoring and ctor for administrator logins", "To sign firmware images uploaded by administrators", "To authenticate HA heartbeat packets between members", "To encrypt configuration backups stored on FortiGate"], "a": 0, "rat": "Under Authentication the slide lists user authentication for network access, for VPN connections, and as second-factor authentication for the FortiGate administrator.", "src": "Video · 1:40", "diff": "medium"}, {"n": 329, "ln": 5, "lesson": 7, "section": "Certificate Fundamentals and Trust", "topic": "CA certificate possession", "q": "How does FortiGate determine whether it holds the CA certificate that corresponds to a certificate it is checking?", "opts": ["It reads the certificate's Issuer field", "It reads the value in the certificate's Subject field", "It looks up the certificate's serial number on a CRL", "It compares the Valid From and Valid To dates"], "a": 0, "rat": "The 'How Does FortiGate Trust Certificates?' slide says FortiGate uses the Issuer value to determine whether it possesses the corresponding CA certificate.", "src": "Video · 2:30", "diff": "medium"}, {"n": 330, "ln": 6, "lesson": 7, "section": "Certificate Fundamentals and Trust", "topic": "Revocation check", "q": "During a revocation check, FortiGate downloads the relevant CRL. Which certificate value does it look for on that list?", "opts": ["Subject Alternative Name", "Serial number", "Public key thumbprint", "Signature hash algorithm"], "a": 1, "rat": "The notes explain FortiGate checks whether the serial number of the certificate is listed on the CRL; if listed, it has been revoked.", "src": "Video · 2:30", "diff": "medium"}, {"n": 331, "ln": 7, "lesson": 7, "section": "Certificate Fundamentals and Trust", "topic": "Validity dates", "q": "While checking a certificate, FortiGate finds that today's date is later than the Valid To value. What is the result?", "opts": ["The certificate is rendered invalid", "FortiGate trusts it but adds a log entry", "FortiGate requests a renewed ce  revoked certificates on FortiGate up to date?", "opts": ["Online updating through HTTP, LDAP, or SCEP", "Manual import of a CRL file each week", "Automatic FortiGuard push of all public CRLs", "OCSP stapling relayed from client browsers"], "a": 0, "rat": "The notes say the recommended method is to load CRLs through HTTP, LDAP, or SCEP; file import is the alternative.", "src": "Video · 22:55", "diff": "medium"}, {"n": 387, "ln": 63, "lesson": 7, "section": "Importing Certificates and the Certificate Store", "topic": "CRL section visibility", "q": "An administrator opens System > Certificates but sees no CRL section. What explains this?", "opts": ["No CRL has been loaded yet", "The CRL feature needs a license", "CRLs are listed only in the CLI", "The section is under Remote CA"], "a": 0, "rat": "The notes state the CRL section on the Certificates menu is visible only after you have loaded at least one CRL.", "src": "Video · 22:55", "diff": "easy"}, {"n": 388, "ln": 64, "lesson": 7, "section": "Importing Certificates and the Certificate Store", "topic": "CRL display requirement", "q": "A CRL has been loaded on FortiGate, but it is not displayed in the certificate store. What else is required for it to appear?", "opts": ["The CRL must be renamed to match its issuer", "The CRL must be loaded through SCEP only", "The corresponding CA certificate must be imported", "A firewall policy must reference the CRL"], "a": 2, "rat": "The notes on the FortiGate Certificate Store slide say FortiGate displays CRLs only if the corresponding CA certificate is imported into the certificate store.", "src": "Video · 23:45", "diff": "hard"}, {"n": 389, "ln": 65, "lesson": 7, "section": "Importing Certificates and the Certificate Store", "topic": "Pending CSR", "q": "Where and how does FortiGate show a certificate signing request that is waiting for the CA's signed certificate?", "opts": ["In Remote CA Certificate with status Valid", "In Local CA Certificate with status Expired", "In Local Certificate with status Pending", "In the CRL section with status Pending"], "a": 2, "rat": "The notes state FortiGate shows CSRs in the Local Certificate section with the status Pending; the screenshot shows FortiGate_ACME as Pending.", "src": "Video · 23:45", "diff": "medium"}, {"n": 390, "ln": 66, "lesson": 7, "section": "Importing Certificates and the Certificate Store", "topic": "Source column", "q": "In the FortiGate certificate store, what does a Source value of User indicate?", "opts": ["The certificate identifies an end user", "The certificate was issued to a VPN user", "The certificate is always present on the device", "An administrator user imported the certificate"], "a": 3, "rat": "The notes say the Source column shows Factory for certificates always present or User for certificates imported by an administrator user.", "src": "Video · 23:45", "diff": "medium"}, {"n": 391, "ln": 67, "lesson": 7, "section": "Importing Certificates and the Certificate Store", "topic": "Signing CA section", "q": "In System > Certificates, in which section does a company signing CA certificate used for deep inspection appear?", "opts": ["Remote CA Certificate", "Local CA Certificate", "Local Certificate", "CRL"], "a": 1, "rat": "The certificate store screenshot labels the Local CA Certificate section 'Deep inspection signing CAs certificates' and lists ACME-SSL-Cert there; Remote CA Certificate holds imported CA certificates that are not signing CAs.", "src": "Video · 23:45", "diff": "hard"}, {"n": 392, "ln": 1, "lesson": 8, "section": "Antivirus Techniques and Detection", "topic": "Scan order", "q": "When the antivirus scan, grayware scan, and AI scan are all enabled, in what order does FortiGate apply them?", "opts": ["AI scan, then antivirus scan, then grayware scan", "Antivirus scan, then grayware scan, then AI scan", "Grayware scan, then antivirus scan, then AI scan", "Antivirus scan, then AI scan, then grayware scan"], "a": 1, "rat": "The Antivirus Techniques slide shows the order of scan as 1 Antivirus Scan, 2 Grayware Scan, 3 AI Scan, and the notes confirm this order when all features are enabled.", "src": "Video · 0:50", "diff": "easy"}, {"n": 393, "ln": 2, "lesson": 8, "section": "Antivirus Techniques and Detection", "topic": "AI scan purpose", "q": "What does the AI-based scan engine add to regular antivirus scanning?", "opts": ["Detection of unsolicited programs installed without the user's consent", "Sanitizing of Office and PDF documents by removing active content", "Detection of zero-day malware in Windows portable executable (PE) files", "Matching of file hashes received from FortiClient EMS"], "a": 2, "rat": "The notes state the AI scan integrates with regular antivirus scanning to detect zero-day malware in Windows PE files, which have no existing signature.", "src": "Video · 0:25", "diff": "medium"}, {"n": 394, "ln": 3, "lesson": 8, "section": "Antivirus Techniques and Detection", "topic": "AI detection name", "q": "A file is flagged by the FortiGate AI scanner. Which virus name identifies the detection?", "opts": ["AI/ML.ZeroDay.Suspect", "W32/AI.Pallas.Suspicious", "EICAR_TEST_FILE", "W32/Grayware.Generic"], "a": 1, "rat": "The notes state files detected by the AI scanner are identified with the W32/AI.Pallas.Suspicious virus signature.", "src": "Video · 0:50", "diff": "medium"}, {"n": 395, "ln": 4, "lesson": 8, "section": "Antivirus Techniques and Detection", "topic": "Grayware", "q": "What does the grayware scan detect?", "opts": ["Unsolicited programs installed without the user's knowledge or consent", "Active content such as macros and JavaScript embedded in Office documents", "Files whose hashes appear in an external malware block list or threat feed", "New, unknown malware variants that have no existing antivirus signature yet"], "a": 0, "rat": "The notes define grayware as unsolicited programs installed without the user's knowledge or consent, often detectable with a simple FortiGuard grayware signature.", "src": "Video · 0:25", "diff": "easy"}, {"n": 396, "ln": 5, "lesson": 8, "section": "Antivirus Techniques and Detection", "topic": "EMS threat feed source", "q": "Where does the EMS threat feed that FortiGate uses for antivirus protection get its data?", "opts": ["FortiGuard Labs outbreak prevention servers, which publish global file hashes", "A plaintext file of hashes that the administrator hosts on an external web server", "FortiSandbox verdicts on files that FortiGate submitted for dynamic analysis", "FortiClient EMS, which collects malware hashes detected by FortiClients"], "a": 3, "rat": "The notes state FortiGate receives malware feeds from FortiClient EMS, which itself gathers detected malware hashes from FortiClients.", "src": "Video · 2:05", "diff": "medium"}, {"n": 397, "ln": 6, "lesson": 8, "section": "Antivirus Techniques and Detection", "topic": "Hash checking order", "q": "An antivirus profile has the EMS threat feed, external malware block list, and FortiGuard outbreak prevention database enabled. In what order are file hashes checked?", "opts": ["Antivirus local database, EMS threat feed, external malware block list, FortiGuard outbreak prevention database", "EMS threat feed, antivirus local database, FortiGuard outbreak prevention database, external malware block list", "FortiGuard outbreak prevention database, antivirus local database, EMS threat feed, external malware block list", "External malware block list, EMS threat feed, FortiGuard outbreak prevention database, antivirus local database"], "a": 0, "rat": "The notes give the checking order as antivirus local database, EMS threat feed, external malware blocklist, and FortiGuard outbreak prevention database.", "src": "Video · 2:30", "diff": "hard"}, {"n": 398, "ln": 7, "lesson": 8, "section": "Antivirus Techniques and Detection", "topic": "Duplicate hash reporting", "q": "The EMS threat feed and the external malware block list both contain the same hash and both are set to block. How is the detection reported?", "opts": ["As an external block list infection", "As an EMS infection", "As two separate infections, one for each source", "As a FortiGuard outbreak prevention infection"], "a": 1, "rat": "The notes state that if the EMS threat feed and external malware blocklist contain the same hash value, the EMS infection is reported if both are blocked.", "src": "Video · 2:55", "diff": "hard"}, {"n": 399, "ln": 8, "lesson": 8, "section": "Antivirus Techniques and Detection", "topic": "CDR", "q": "What does content disarm and reconstruction (CDR) do when a client downloads a Microsoft Office or PDF file?", "opts": ["Strips active content such as macros and JavaScript, then sends the disarmed file", "Blocks the file outright if its hash matches an entry in the external malware block list", "Decompresses the file and scans each nested archive layer separately for embedded threats", "Submits the file to FortiSandbox and holds it until a sandbox verdict is returned"], "a": 0, "rat": "The notes state CDR sanitizes Office and PDF files by removing active content such as hyperlinks, embedded media, JavaScript, and macros, and sends the disarmed file to the client.", "src": "Video · 3:45", "diff": "easy"}, {"n": 400, "ln": 9, "lesson": 8, "section": "Antivirus Techniques and Detection", "topic": "CDR protocol and mode support", "q": "Which statement about CDR support is correct?", "opts": ["It is supported only on FTP and CIFS in flow-based inspection", "It is supported on HTTP only and requires the EMS threat feed", "It is supported on all protocols in both flow-based and proxy-based inspection", "It is supported on HTTP, SMTP, POP3, and IMAP, and it does not support flow-based inspection"], "a": 3, "rat": "The notes state CDR is supported on HTTP, SMTP, POP3, and IMAP and does not support flow-based inspection modes; the slide notes it is available with proxy-based feature sets.", "src": "Video · 3:45", "diff": "medium"}, {"n": 401, "ln": 10, "lesson": 8, "section": "Antivirus Techniques and Detection", "topic": "ML detection default", "q": "Which statement about the machine learning (AI) malware detection setting is correct?", "opts": ["It is enabled by default but analyzes only Office and PDF documents sent over HTTP", "It is enabled by default per VDOM, using an AI package downloaded through FortiGuard", "It is disabled by default and must be enabled globally from the CLI on each device", "It runs only on FortiNDR appliances and is not part of the FortiGate antivirus engine"], "a": 1, "rat": "The notes state the antivirus engine AI package is downloaded through FortiGuard on devices with an active antivirus subscription and the ML detection setting is enabled by default at a per-VDOM level.", "src": "Video · 4:10", "diff": "hard"}, {"n": 402, "ln": 11, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "Default inspection mode", "q": "What is the default inspection mode for antivirus on a FortiGate firewall policy?", "opts": ["Stream-based", "Flow-based", "Proxy-based", "Deep inspection"], "a": 1, "rat": "The Inspection Modes slide labels flow-based inspection as the default inspection mode, with the file scanned on a flow basis; proxy-based inspection provides additional options.", "src": "Video · 5:00", "diff": "easy"}, {"n": 403, "ln": 12, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "Proxy connections", "q": "How does proxy-based inspection handle the TCP session between a client and a server?", "opts": ["FortiGate forwards the single three-way handshake end to end and scans on a flow basis", "FortiGate opens one extra connection per scanned file inside the original client session", "FortiGate terminates the client connection and opens its own connection to the server", "FortiGate lets the handshake complete end to end and then injects a proxy connection"], "a": 2, "rat": "The proxy-based diagram shows separate SYN, SYN-ACK, ACK exchanges between client and FortiGate and between FortiGate and server, labeled two TCP connections.", "src": "Video · 5:00", "diff": "medium"}, {"n": 404, "ln": 13, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "Choosing a mode", "q": "Security is the top priority for a deployment. Which inspection configuration is more appropriate?", "opts": ["Proxy-based inspection with client comforting enabled", "Flow-based inspection with NTurbo enabled", "Flow-based inspection with pattern matching offloaded to CP9", "Proxy-based inspection with client comforting disabled"], "a": 3, "rat": "The notes state that if security is your priority, proxy-based inspection with client comforting disabled is more appropriate; if performance is the priority, flow-based is more appropriate.", "src": "Video · 5:00", "diff": "medium"}, {"n": 405, "ln": 14, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "NTurbo", "q": "Which statement about NTurbo acceleration of antivirus processing is correct?", "opts": ["It redirects traffic from the IPS engine to the WAD proxy daemon for faster buffering", "It offloads proxy-based antivirus scanning to the CP8 or CP9 content processors", "It builds a data path through the IPS engine and does not apply to proxy-based inspection", "It accelerates both flow-based and proxy-based inspection equally on supported models"], "a": 2, "rat": "The notes state NTurbo creates a special data path from the ingress interface to the IPS engine and from the IPS engine to the egress interface, and this acceleration does not apply to proxy-based inspection.", "src": "Video · 5:25", "diff": "hard"}, {"n": 406, "ln": 15, "lesson": 8, "section": "Inspection Modes and Packet Flow", "topic": "Flow-based packet flow", "q": "In flow-based inspection mode, how does FortiGate handle packets of a file being downloaded?", "opts": ["It buffers the packets while also transmitting them, and scans once the whole file is buffered", "It forwards all packets, including the last one, and then scans
