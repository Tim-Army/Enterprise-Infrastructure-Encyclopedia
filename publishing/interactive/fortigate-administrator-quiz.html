ng and Management", "topic": "Member CLI access", "q": "From the primary's CLI, which command opens a CLI session on another cluster member?", "opts": ["config system ha-member <member_id>", "diagnose sys ha manage <serial_number>", "execute ha connect <member_id> <password>", "execute ha manage <member_id> <admin_username>"], "a": 3, "rat": "The Switching to the CLI of Another Member slide shows execute ha manage <member_id> <admin_username>.", "src": "Video · 18:45", "diff": "medium"}, {"n": 779, "ln": 62, "lesson": 13, "section": "Monitoring and Management", "topic": "Finding member IDs", "q": "How do you find a member's ID before connecting to its CLI with execute ha manage?", "opts": ["Read the HA cluster index in the GUI faceplate", "Run diagnose sys ha checksum show on the primary", "Type a question mark after execute ha manage", "Use the serial number printed on the unit's label"], "a": 2, "rat": "The slide says to list the ID of each member, use a question mark; the output shows <0> Subsidiary unit FGVM...650.", "src": "Video · 18:45", "diff": "easy"}, {"n": 780, "ln": 63, "lesson": 13, "section": "Monitoring and Management", "topic": "Leaving a member's CLI", "q": "You are connected to a secondary's CLI through execute ha manage. How do you return to the primary's CLI prompt?", "opts": ["Press Ctrl+C three times", "Enter the exit command", "Run execute ha manage 0", "Run execute reboot on it"], "a": 1, "rat": "The notes say: type exit to close the connection to the secondary member and return to the primary member's CLI prompt.", "src": "Video · 19:10", "diff": "easy"}, {"n": 781, "ln": 64, "lesson": 13, "section": "Monitoring and Management", "topic": "Reserved HA management interface", "q": "Which set of traits describes a reserved HA management interface?", "opts": ["In-band, using any user-traffic interface, with a shared routing table", "Out-of-band, up to four dedicated interfaces, separate routing table", "In-band, heartbeat ports only, separate routing table", "Out-of-band, one interface only, shared routing table"], "a": 1, "rat": "The Connect to Any Member Directly slide lists reserved HA management interface: out-of-band, up to four dedicated interfaces, local-in and some local-out traffic, separate routing table.", "src": "Video · 20:25", "diff": "medium"}, {"n": 782, "ln": 65, "lesson": 13, "section": "Monitoring and Management", "topic": "Separate routing table", "q": "Why don't routes for a reserved HA management interface show in the FortiGate routing table?", "opts": ["They are removed whenever the member's HA uptime is reset to zero", "They only show up after you run diagnose sys ha checksum recalculate on it", "They are copied to the primary and hidden on the secondary members", "They sit in a separate routing table that isolates management traffic"], "a": 3, "rat": "The notes say routing information for a reserved HA management interface is placed in a separate routing table, so its routes are not in the FortiGate routing table, which segments data and management traffic.", "src": "Video · 20:50", "diff": "medium"}, {"n": 783, "ln": 66, "lesson": 13, "section": "Monitoring and Management", "topic": "In-band management config", "q": "Which setting configures an in-band HA management address on a user-traffic interface?", "opts": ["set ha-mgmt-status enable under config system ha", "set gateway under config ha-mgmt-interfaces", "set management-ip under config system interface", "set hbdev under config system ha"], "a": 2, "rat": "The in-band example is config system interface, edit \"port1\", set management-ip 10.0.10.1 255.0.0.0; ha-mgmt-status and ha-mgmt-interfaces belong to the reserved option.", "src": "Video · 20:25", "diff": "hard"}, {"n": 784, "ln": 67, "lesson": 13, "section": "Monitoring and Management", "topic": "Management config sync", "q": "Is the management interface configuration (reserved or in-band) copied to the other members?", "opts": ["Only the reserved option is synchronized", "Only the in-band option is synchronized", "No; it is applied on each member separately", "Yes; both are copied by incremental sync"], "a": 2, "rat": "Both examples are labeled Configuration example (not synchronized), and the notes say for both options the configuration on a member is not synchronized.", "src": "Video · 20:50", "diff": "medium"}, {"n": 785, "ln": 1, "lesson": 14, "section": "General Diagnosis", "topic": "Baseline", "q": "When comparing current activity to a performance baseline graph, what indicates that an abnormal event is happening?", "opts": ["The current-behavior line leaves the normal range around the baseline", "The current-behavior line crosses the baseline average line", "The baseline average line rises above the previous period's value", "The normal range narrows until it matches the current-behavior line"], "a": 0, "rat": "The notes explain that the blue line is the baseline (the averages), the thick black line is current behavior, and when the current behavior leaves the normal range an abnormal event is happening. Crossing the average while staying inside the range is still normal.", "src": "Video · 0:25", "diff": "easy"}, {"n": 786, "ln": 2, "lesson": 14, "section": "General Diagnosis", "topic": "Logical diagrams", "q": "What does a logical network diagram show, as opposed to a physical diagram?", "opts": ["How cables, ports, and devices are connected between buildings and cabinets", "Layer 1 and layer 2 relationships between switches and patch panels", "Only the physical location of each FortiGate in the data center", "Relationships, usually at OSI layer 3, between VLANs, IP subnets, and routers"], "a": 3, "rat": "The slide says logical diagrams include subnets, routers, and logical devices and show relationships at layer 3; the notes add they can show application protocols such as HTTP or DHCP. Physical diagrams show cables, ports, and devices at layers 1 and 2.", "src": "Video · 1:15", "diff": "easy"}, {"n": 787, "ln": 3, "lesson": 14, "section": "General Diagnosis", "topic": "System status", "q": "Which CLI command displays general-purpose information such as the model, serial number, firmware version, host name, FortiGuard license status, and system time?", "opts": ["diagnose sys top", "diagnose hardware sysinfo conserve", "get system performance status", "get system status"], "a": 3, "rat": "The notes state that get system status provides mostly general-purpose information: model, serial number, firmware version, host name, FortiGuard license status, system time, and FortiGuard database versions.", "src": "Video · 2:30", "diff": "easy"}, {"n": 788, "ln": 4, "lesson": 14, "section": "General Diagnosis", "topic": "Ping source address", "q": "When you run execute ping from the FortiGate CLI without changing the ping options, which source IP address is used by default?", "opts": ["The IP address of the management interface", "The IP address of the interface with the lowest index", "The IP address of the outgoing interface", "The loopback address of the root VDOM"], "a": 2, "rat": "The notes say that because of NAT and routing you might need to specify a different ping source IP address, and that the default address is the IP of the outgoing interface.", "src": "Video · 2:55", "diff": "medium"}, {"n": 789, "ln": 5, "lesson": 14, "section": "General Diagnosis", "topic": "Testing the path", "q": "To test connectivity along the path through FortiGate, not only from FortiGate itself, what should you also do?", "opts": ["Also run ping and tracert/traceroute from the endpoint computer", "Run execute ping only from the FortiGate CLI with adaptive-ping enabled", "Run execute traceroute from the FortiGate with the df-bit set", "Use get system status to confirm the routing table"], "a": 0, "rat": "The notes say execute ping and execute traceroute test from FortiGate, but to test the path through FortiGate you should also use ping and tracert or traceroute from the Windows, Linux, or macOS endpoint, not only from the FortiGate CLI.", "src": "Video · 2:55", "diff": "medium"}, {"n": 790, "ln": 6, "lesson": 14, "section": "Packet Sniffer and Packet Capture", "topic": "Sniffer syntax", "q": "What is the correct argument order for the FortiGate packet sniffer command?", "opts": ["diagnose sniffer packet <interface> <filter> <verbose> <count> <tsformat>", "diagnose sniffer packet <filter> <interface> <count> <verbose> <tsformat>", "diagnose sniffer packet <interface> <verbose> <filter> <tsformat> <count>", "diagnose sniffer packet <tsformat> <interface> <filter> <verbose> <count>"], "a": 0, "rat": "The slide shows the syntax #diagnose sniffer packet <interface> <filter> <verbose> <count> <tsformat>, where count stops the capture after that many packets and tsformat changes the timestamp format.", "src": "Video · 3:45", "diff": "medium"}, {"n": 791, "ln": 7, "lesson": 14, "section": "Packet Sniffer and Packet Capture", "topic": "Sniffer verbosity", "q": "Which diagnose sniffer packet verbosity level prints the header and data from the Ethernet header of packets along with the interface name?", "opts": ["3", "6", "4", "5"], "a": 1, "rat": "The notes list six verbosity levels: 3 prints header and Ethernet data without interface names, 4 prints headers with interface name, 5 prints IP data with interface name, and 6 prints header and Ethernet data with interface name.", "src": "Video · 3:45", "diff": "medium"}, {"n": 792, "ln": 8, "lesson": 14, "section": "Packet Sniffer and Packet Capture", "topic": "Default timestamp", "q": "If you do not specify a timestamp option in the sniffer command, how is the time of each packet displayed?", "opts": ["As seconds elapsed since the sniffer started", "As absolute UTC date and time for every packet", "As the local system date and time of FortiGate", "No timestamp is displayed at all for any packet"], "a": 0, "rat": "The notes state that if you do not specify an option for the timestamp, the output shows the time in seconds since it started running; you can prepend the system time to correlate packets with other recorded events.", "src": "Video · 4:10", "diff": "medium"}, {"n": 793, "ln": 9, "lesson": 14, "section": "Packet Sniffer and Packet Capture", "topic": "Capturing all interfaces", "q": "How do you make the CLI packet sniffer capture matching packets on all interfaces, and how do you stop it?", "opts": ["Leave the interface argument empty; stop it with Ctrl+Z", "Use the keyword any as the interface name; stop it with Ctrl+C", "Use the keyword all as the interface name; stop it with diagnose debug disable", "Use the keyword any as the filter; stop it with diagnose sniffer stop"], "a": 1, "rat": "The example shows diagnose sniffer packet any ... with the callout 'any to capture all interfaces', and the notes say to stop the sniffer by pressing Ctrl+C.", "src": "Video · 4:10", "diff": "easy"}, {"n": 794, "ln": 10, "lesson": 14, "section": "Packet Sniffer and Packet Capture", "topic": "Dropped by kernel", "q": "A sniffer session ends with a nonzero count for 'packets dropped by kernel'. What is the correct response?", "opts": ["Run the capture again with a more specific (stricter) filter", "Increase the verbosity level so that the dropped packets are decoded", "Change the timestamp format to absolute UTC time", "Replace the interface name with the keyword any"], "a": 0, "rat": "The callout explains this counter is the number of packets matching the filter that could not be captured by the sniffer, so you must use a more specific filter; the notes say to capture the traffic again using a stricter filter.", "src": "Video · 4:10", "diff": "medium"}, {"n": 795, "ln": 11, "lesson": 14, "section": "Packet Sniffer and Packet Capture", "topic": "GUI packet capture", "q": "Where is the GUI packet capture tool located, and in which format can its output be exported after the capture is stopped?", "opts": ["Log & Report > Forward Traffic; CSV file", "Dashboard > Network; TXT file", "Network > Diagnostics > Packet Capture; pcap file", "Network > Diagnostics > Debug Flow; pcap file"], "a": 2, "rat": "The slide shows Network > Diagnostics > Packet Capture, and the notes state that after you stop the packet capture you can export the output as a pcap file.", "src": "Video · 4:35", "diff": "easy"}, {"n": 796, "ln": 12, "lesson": 14, "section": "Debug Flow", "topic": "Purpose of debug flow", "q": "FortiGate is dropping packets and you need to know why. Which tool shows the reason?", "opts": ["The packet sniffer at verbosity level 6", "Debug flow", "diagnose sys top sorted by CPU", "get system status"], "a": 1, "rat": "The notes ask whether a sniffer can identify why packets are dropped and answer that you should use the debug (packet) flow; the slide says debug flow shows what the CPU is doing step by step and, if a packet is dropped, it shows the reason.", "src": "Video · 5:00", "diff": "easy"}, {"n": 797, "ln": 13, "lesson": 14, "section": "Debug Flow", "topic": "Debug flow steps", "q": "What is the correct order of steps for running a debug flow from the FortiGate CLI?", "opts": ["Define a filter, enable debug output, start the trace, stop the trace", "Enable debug output, start the trace, define a filter, stop the trace", "Start the trace, define a filter, enable debug output, stop the trace", "Define a filter, start the trace, stop the trace, enable debug output"], "a": 0, "rat": "The slide lists: 1. define a filter (diagnose debug flow filter), 2. enable debug output (diagnose debug enable), 3. start the trace (diagnose debug flow trace start), 4. stop the trace (diagnose debug flow trace stop).", "src": "Video · 5:00", "diff": "medium"}, {"n": 798, "ln": 14, "lesson": 14, "section": "Debug Flow", "topic": "New session allocation", "q": "In debug flow output for a TCP connection, when does FortiGate show the message 'allocate a new session'?", "opts": ["When the SYN/ACK reply packet is received", "When the SYN packet of the three-way handshake is received", "When the final ACK of the handshake is received", "When the matching firewall policy is logged"], "a": 1, "rat": "The SYN example shows 'allocate a new session' for the first packet of the handshake, while the SYN/ACK example shows 'Find an existing session ... reply direction'.", "src": "Video · 5:25", "diff": "easy"}, {"n": 799, "ln": 15, "lesson": 14, "section": "Debug Flow", "topic": "Route lookup line", "q": "In debug flow output, what does the 'find a route' message (func=vf_ip_route_input_common) tell you?", "opts": ["The ID of the firewall policy that allowed the packet", "The next-hop IP address and the outgoing interface", "The source NAT address and port that will be applied", "The session ID allocated for the new connection"], "a": 1, "rat": "The callout on the SYN example says the find-a-route line means a matching route was found and shows the next-hop IP address and outgoing interface (for example gw-192.168.1.1 via wan1).", "src": "Video · 5:25", "diff": "medium"}, {"n": 800, "ln": 16, "lesson": 14, "section": "Debug Flow", "topic": "Debug flow content", "q": "Which information is displayed in the output of a debug flow?", "opts": ["The matching security profile and the traffic log entry", "The FortiGuard license status and firmware version", "The CPU and memory usage of each process", "The incoming interface and the matching firewall policy"], "a": 3, "rat": "The debug flow example shows the packet received 'from internal' (incoming interface) and 'Allowed by Policy-1: SNAT' (matching firewall policy).", "src": "Video · 5:25", "diff": "easy"}, {"n": 801, "ln": 17, "lesson": 14, "section": "Debug Flow", "topic": "Reply-direction NAT", "q": "In the debug flow for the SYN/ACK reply of a source-NATed connection, which operation is shown translating the address back to the original client?", "opts": ["SNAT, within a newly allocated session", "DNAT, within a newly allocated session", "No NAT; the reply is forwarded with the public address unchanged", "DNAT, within an existing session found in the reply direction"], "a": 3, "rat": "The SYN/ACK example shows 'Find an existing session ... reply direction' followed by 'DNAT 192.168.1.102:5128->10.0.1.111:5128', and the notes say it shows how destination NAT is applied.", "src": "Video · 5:50", "diff": "hard"}, {"n": 802, "ln": 18, "lesson": 14, "section": "Debug Flow", "topic": "Hardware offload notice", "q": "The GUI Debug Flow tool warns that you may not see all packets for traffic handled by a firewall policy. What must you do to see all packets?", "opts": ["Enable fail-open under config ips global", "Set the sniffer verbosity to level 6", "Set auto-asic-offload to disable on that policy", "Set av-failopen to pass under config system global"], "a": 2, "rat": "The notice on the Debug Flow page says NPU hardware acceleration must be disabled on the respective firewall policy to see all packets; to do so, set auto-asic-offload to disable in the CLI.", "src": "Video · 6:40", "diff": "hard"}, {"n": 803, "ln": 19, "lesson": 14, "section": "Debug Flow", "topic": "Debug flow GUI filters", "q": "In the GUI Debug Flow tool, which filter type lets you specify source IP address, source port, destination IP address, destination port, and protocol separately?", "opts": ["Basic", "Extended", "Custom", "Advanced"], "a": 3, "rat": "The notes say Basic filters on criteria such as host address, port number, and protocol name, while Advanced filters by source IP, source port, destination IP, destination port, and protocol.", "src": "Video · 6:40", "diff": "medium"}, {"n": 804, "ln": 20, "lesson": 14, "section": "Debug Flow", "topic": "Debug flow GUI output", "q": "After you click Stop Debug Flow in the GUI, what can you do with the resulting packet trace output?", "opts": ["Save and download it as a CSV file", "Export it only as a pcap file", "Replay it to re-run the same trace", "Nothing; the output is discarded once the trace stops"], "a": 0, "rat": "The notes state that when you stop the debug flow, FortiGate displays a packet trace output that you can download and save as a CSV file, and you can filter it by time, message, or function. The pcap export belongs to the packet capture tool.", "src": "Video · 7:05", "diff": "medium"}, {"n": 805, "ln": 21, "lesson": 14, "section": "Life of a Packet", "topic": "Source NAT stage", "q": "In the life of a packet for initial session packets, when is source NAT performed?", "opts": ["In the first kernel stage, together with destination NAT and routing", "Before the IP integrity header check, in the ingress stage", "After WAN optimization, just before the packet leaves the network interface", "In the egress kernel stage, with forwarding, after UTM/NGFW inspection"], "a": 3, "rat": "The diagram shows the first kernel block starting with destination NAT and routing/RPF check, followed by UTM/NGFW inspection, then a later kernel block with 1. Forwarding and 2. Source NAT, before IPsec VPN encryption, traffic shaping, and WAN optimization.", "src": "Video · 7:30", "diff": "hard"}, {"n": 806, "ln": 22, "lesson": 14, "section": "Life of a Packet", "topic": "Content processor", "q": "Which tasks does the content processor (CP) offload from the FortiGate CPU?", "opts": ["Routing lookups, RPF checks, and SD-WAN selection", "User authentication, device identification, and SSL VPN", "IPS pattern matching, SSL/TLS inspection, and IPsec crypto", "Traffic shaping, WAN optimization, and session helpers"], "a": 2, "rat": "The notes say the CP functions like a coprocessor for the CPU, offloading tasks such as pattern matching for flow-based UTM inspection with the IPS engine, SSL/TLS decryption and encryption for deep SSL inspection, and IPsec encryption and decryption.", "src": "Video · 7:30", "diff": "medium"}, {"n": 807, "ln": 23, "lesson": 14, "section": "Life of a Packet", "topic": "Virtual FortiGate", "q": "How does packet processing on a virtual FortiGate differ from a hardware FortiGate?", "opts": ["Same flow, but the CPU does all processing without NP/CP offload", "It skips the kernel stages and inspects only in UTM/NGFW", "It performs source NAT before the routing and RPF check", "It cannot perform IPsec VPN decryption on incoming packets"], "a": 0, "rat": "The notes state that packet processing for virtual FortiGate devices is identical, the only difference being that the CPU handles all processes instead of offloading some of them to NPs and CPs.", "src": "Video · 7:30", "diff": "medium"}, {"n": 808, "ln": 24, "lesson": 14, "section": "Life of a Packet", "topic": "Mandatory stages", "q": "In the life-of-a-packet diagram, which ingress step is marked as mandatory rather than optional/configurable?", "opts": ["Access control list (ACL)", "Host protection engine (HPE)", "IPsec VPN decryption", "IP integrity header checking"], "a": 3, "rat": "The legend colors mandatory steps blue and optional/configurable steps yellow; in the ingress block, IP integrity header checking is blue while ACL, HPE, and IPsec VPN decryption are yellow.", "src": "Video · 7:30", "diff": "hard"}, {"n": 809, "ln": 25, "lesson": 14, "section": "CPU and Memory Troubleshooting", "topic": "Slowness approach", "q": "When troubleshooting slowness that may be caused by high resource usage, which approach to features is advised?", "opts": ["Enable all security features at once to reach a steady baseline", "Disable all logging before checking CPU usage", "Identify the last feature you enabled, and enable features one at a time", "Reboot FortiGate before running any resource commands"], "a": 2, "rat": "The Slowness slide asks 'What was the last feature you enabled?' with the guidance 'Enable one at a time'; the notes say you troubleshoot faster if you know which change corresponds with when the problem began.", "src": "Video · 8:45", "diff": "easy"}, {"n": 810, "ln": 26, "lesson": 14, "section": "CPU and Memory Troubleshooting", "topic": "diagnose sys top sorting", "q": "While diagnose sys top is running, which key combination sorts the process list by highest memory (RAM) usage?", "opts": ["Shift+P", "Shift+R", "Shift+M", "Ctrl+C"], "a": 2, "rat": "The slide callout and notes state: sort by CPU with Shift+P and sort by RAM with Shift+M.", "src": "Video · 9:10", "diff": "easy"}, {"n": 811, "ln": 27, "lesson": 14, "section": "CPU and Memory Troubleshooting", "topic": "Process roles", "q": "In diagnose sys top output, which process handles FortiGuard and FortiManager connections?", "opts": ["forticron", "scanunitd", "fgfmd", "miglogd"], "a": 2, "rat": "The notes list common processes: ipsengine and scanunitd for inspection, fgfmd for FortiGuard and FortiManager connections, forticron for scheduling, and management processes such as newcli, miglogd, cmdb, sshd, and httpsd.", "src": "Video · 9:10", "diff": "medium"}, {"n": 812, "ln": 28, "lesson": 14, "section": "CPU and Memory Troubleshooting", "topic": "CPU usage commands", "q": "Which pair of CLI commands shows how high FortiGate CPU usage is and which processes are responsible?", "opts": ["get system status and diagnose hardware sysinfo conserve", "get system performance status and diagnose sys top", "diagnose debug flow trace start and diagnose debug enable", "diagnose sniffer packet any and get system status"], "a": 1, "rat": "Under 'How high is the CPU usage? Why?' the Slowness slide lists get system performance status and diagnose sys top; the next slide shows diagnose sys top listing processes with their CPU and memory usage.", "src": "Video · 8:45", "diff": "easy"}, {"n": 813, "ln": 29, "lesson": 14, "section": "Memory Conserve Mode", "topic": "Conserve thresholds", "q": "Using the default memory thresholds, at what percentage of total RAM does FortiGate enter memory conserve mode, and below what percentage does it exit?", "opts": ["Enters at 95%, exits below 88%", "Enters at 82%, exits below 88%", "Enters at 88%, exits below 82%", "Enters at 88%, exits below 95%"], "a": 2, "rat": "The table shows the red threshold (enter conserve mode) defaults to 88%, the green threshold (exit conserve mode) to 82%, and the extreme threshold (new sessions dropped) to 95% of total RAM, configured under config system global.", "src": "Video · 9:35", "diff": "medium"}, {"n": 814, "ln": 30, "lesson": 14, "section": "Memory Conserve Mode", "topic": "Extreme threshold", "q": "Memory usage has exceeded the extreme threshold. What happens to new sessions that require inspection?", "opts": ["They pass without inspection if av-failopen is set to pass", "They pass without IPS scanning if IPS fail-open is enabled", "They are queued until memory drops below the red threshold", "They are always dropped, regardless of the fail-open configuration"], "a": 3, "rat": "The slide says that if memory usage exceeds the extreme threshold, all new sessions that require inspection (flow-based or proxy-based) are blocked, and the notes add that new sessions are always dropped regardless of the FortiGate configuration.", "src": "Video · 11:15", "diff": "hard"}, {"n": 815, "ln": 31, "lesson": 14, "section": "Memory Conserve Mode", "topic": "IPS fail-open", "q": "With the default config ips global fail-open setting, what happens to new sessions that require flow-based IPS inspection while FortiGate is in conserve mode?", "opts": ["They are passed without IPS scanning", "They are dropped", "They are passed only if NTurbo acceleration applies", "They are queued until FortiGate exits conserve mode"], "a": 1, "rat": "The slide shows fail-open disable is the default and that packets are dropped for new incoming sessions; enable would let packets be transmitted without IPS scanning.", "src": "Video · 10:25", "diff": "hard"}, {"n": 816, "ln": 32, "lesson": 14, "section": "Memory Conserve Mode", "topic": "NTurbo and fail-open", "q": "IPS fail-open is enabled and is triggered. What happens to new sessions that would typically be accelerated with NTurbo?", "opts": ["They are dropped, even though fail-open is enabled", "They pass without IPS inspection like other sessions", "They are offloaded to the NP and inspected in hardware", "They pass and are inspected by the content processor instead"], "a": 0, "rat": "The notes state that NTurbo doesn't support the fail-open setting; if fail open is triggered, new sessions that would typically be accelerated with NTurbo are dropped even if fail-open is enabled.", "src": "Video · 10:25", "diff": "hard"}, {"n": 817, "ln": 33, "lesson": 14, "section": "Memory Conserve Mode", "topic": "Quarantine during conserve mode", "q": "Besides blocking configuration changes, which other behavior applies while FortiGate is in memory conserve mode?", "opts": ["FortiGate denies all administrative logins", "FortiGate skips quarantine actions, including FortiSandbox analysis", "FortiGate disables all interfaces except the management port", "FortiGate forces all traffic through proxy-based inspection"], "a": 1, "rat": "The slide lists that during conserve mode system configuration cannot be changed and FortiGate skips quarantine actions (including FortiSandbox analysis).", "src": "Video · 10:25", "diff": "medium"}, {"n": 818, "ln": 34, "lesson": 14, "section": "Memory Conserve Mode", "topic": "av-failopen one-shot", "q": "Which av-failopen value lets proxy-inspected traffic pass uninspected during conserve mode but keeps bypassing the antivirus proxy even after FortiGate leaves conserve mode?", "opts": ["pass", "off", "idledrop", "one-shot"], "a": 3, "rat": "The slide explains one-shot is similar to pass in that traffic is not inspected, but it keeps bypassing the antivirus proxy even after leaving conserve mode until the setting is changed or the device is restarted. pass is the default and resumes scanning; off does not pass new content-scanned sessions.", "src": "Video · 11:15", "diff": "hard"}, {"n": 819, "ln": 35, "lesson": 14, "section": "Memory Conserve Mode", "topic": "Conserve mode diagnostics", "q": "Which command identifies whether a FortiGate is currently in memory conserve mode and shows memory used alongside the red, green, and extreme thresholds?", "opts": ["get system performance status", "diagnose sys top-mem", "diagnose sys top", "diagnose hardware deviceinfo disk"], "a": 1, "rat": "The notes state that diagnose hardware sysinfo conserve is used to identify if a FortiGate is currently in memory conserve mode; its output shows memory conserve mode on/off, total RAM, memory used, and the threshold values.", "src": "Video · 12:05", "diff": "medium"}, {"n": 820, "ln": 36, "lesson": 14, "section": "Memory Conserve Mode", "topic": "av-failopen scope", "q": "Besides proxy-based inspection, to which other inspection does the config system global av-failopen setting apply during conserve mode?", "opts": ["Flow-based IPS signature inspection", "SSL/TLS deep inspection offloaded to the CP", "Flow-based antivirus inspection", "Explicit web proxy authentication"], "a": 2, "rat": "The slide states that the av-failopen setting also applies to flow-based antivirus inspection. Flow-based IPS behavior is controlled separately by fail-open under config ips global.", "src": "Video · 11:40", "diff": "medium"}, {"n": 821, "ln": 1, "lesson": 15, "section": "Cloud Threats and Fortinet Cloud Solutions", "topic": "Public cloud threats", "q": "Which of the following is categorized as a public cloud threat rather than a public cloud challenge?", "opts": ["Insecure interfaces and APIs", "Meeting regulatory compliance", "Deciding who owns security", "Picking a cloud architecture"], "a": 0, "rat": "The threats list includes insecure interfaces and APIs; responsibility, architecture choice, and compliance are listed as challenges.", "src": "Video · 0:25", "diff": "easy"}, {"n": 822, "ln": 2, "lesson": 15, "section": "Cloud Threats and Fortinet Cloud Solutions", "topic": "Public cloud challenges", "q": "Which item appears among the public cloud challenges rather than among the threats?", "opts": ["Malware reaching cloud workloads", "Exfiltration of sensitive data", "Unauthorized access to resources", "Choosing a cloud architecture"], "a": 3, "rat": "Challenges are: who is responsible for security, which cloud architecture to implement, and achieving regulatory compliance. The other options are threats.", "src": "Video · 0:25", "diff": "easy"}, {"n": 823, "ln": 3, "lesson": 15, "section": "Cloud Threats and Fortinet Cloud Solutions", "topic": "Survey results", "q": "In the Cybersecurity Insiders survey sponsored by Fortinet, what did more than 51% of security professionals rate as the top public cloud threat?", "opts": ["Exfiltration of sensitive data", "Insecure interfaces and APIs", "Malware in cloud workloads", "Misconfiguration of the cloud"], "a": 3, "rat": "The speaker notes say more than 51% deemed misconfigurations of the public cloud the number one threat; the others were also commonly reported but not first.", "src": "Video · 0:25", "diff": "medium"}, {"n": 824, "ln": 4, "lesson": 15, "section": "Cloud Threats and Fortinet Cloud Solutions", "topic": "SaaS coverage", "q": "For an organization whose initiative is consuming SaaS applications, which Fortinet cloud security solution category applies?", "opts": ["Secure connectivity and visibility", "Secure connectivity only", "Visibility and control only", "Application security only"], "a": 2, "rat": "On the 'What Does Securing the Cloud Mean?' slide only the Visibility and Control bar spans the SaaS column, and the notes state that for SaaS Fortinet can provide only visibility and control.", "src": "Video · 1:15", "diff": "medium"}, {"n": 825, "ln": 5, "lesson": 15, "section": "Cloud Threats and Fortinet Cloud Solutions", "topic": "SaaS limitations", "q": "Why can Fortinet not offer its secure connectivity solution for a SaaS service such as a hosted file-sharing box?", "opts": ["Secure connectivity is sold only for hardware FortiGates", "FortiGate VMs cannot run in any public cloud provider", "SaaS vendors forbid any third-party security product use", "No IPsec tunnel or WAF can be built toward a SaaS service"], "a": 3, "rat": "The notes explain that you cannot create an IPsec tunnel or web application firewall (WAF) to a drop box (SaaS).", "src": "Video · 1:15", "diff": "medium"}, {"n": 826, "ln": 6, "lesson": 15, "section": "Cloud Threats and Fortinet Cloud Solutions", "topic": "IaaS", "q": "The Fortinet secure connectivity solution belongs to which cloud service category?", "opts": ["Infrastructure as a Service", "Security as a Service offerings", "Desktop as a Service offerings", "Software as a Service offerings"], "a": 0, "rat": "The notes state that the secure connectivity solution belongs to the Infrastructure-as-a-Service (IaaS) category.", "src": "Video · 1:15", "diff": "easy"}, {"n": 827, "ln": 7, "lesson": 15, "section": "Cloud Threats and Fortinet Cloud Solutions", "topic": "Application security scope", "q": "Which customer initiative is covered by the application security solution but not by the secure connectivity solution?", "opts": ["Building cloud-native applications", "Data center transformation to the cloud", "Migrating apps to the cloud", "Consuming SaaS applications"], "a": 0, "rat": "Application Security spans the migrating/data-center column and the cloud-native column; Secure Connectivity covers only the migrating/data-center column; neither Application Security nor Secure Connectivity covers SaaS.", "src": "Video · 1:15", "diff": "hard"}, {"n": 828, "ln": 8, "lesson": 15, "section": "Cloud Threats and Fortinet Cloud Solutions", "topic": "Products by initiative", "q": "In Fortinet's mapping of cloud initiatives to products, which product is mapped to the 'Consuming SaaS applications' initiative?", "opts": ["FortiMail", "FortiAnalyzer", "FortiClient", "FortiManager"], "a": 0, "rat": "The SaaS column lists FortiCASB, FortiMail, FortiAppSec Cloud, FortiCNP, and FortiDevSec. FortiAnalyzer, FortiClient, and FortiManager appear only under migrating/data center transformation.", "src": "Video · 1:15", "diff": "hard"}, {"n": 829, "ln": 9, "lesson": 15, "section": "Cloud Threats and Fortinet Cloud Solutions", "topic": "Positioning", "q": "How does Fortinet position its cloud security solution relative to the security that cloud vendors already provide?", "opts": ["As a passive monitor with no enforcement ability", "As a full replacement for vendor security services", "As an extra layer on top of native vendor controls", "As a tool limited to private on-premises clouds"], "a": 2, "rat": "The notes say the Fortinet cloud security solution is not a replacement for existing cloud vendor security but an added layer that provides greater control, visibility, and optimized protection.", "src": "Video · 2:05", "diff": "easy"}, {"n": 830, "ln": 10, "lesson": 15, "section": "Cloud Threats and Fortinet Cloud Solutions", "topic": "Shared responsibility", "q": "In Fortinet's cloud security responsibility model, which party secures the public cloud infrastructure services (security, storage, network, compute)?", "opts": ["The customer's own team", "Fortinet, via FortiGate VM", "The customer's internet ISP", "The cloud provider"], "a": 3, "rat": "The diagram labels the infrastructure services with 'Cloud provider secures the infrastructure', while the customer builds and manages security in the cloud.", "src": "Video · 2:30", "diff": "easy"}, {"n": 831, "ln": 11, "lesson": 15, "section": "Cloud Threats and Fortinet Cloud Solutions", "topic": "Security layers", "q": "Which three layers make up the Fortinet stack that the customer builds and manages in the cloud?", "opts": ["Visibility, compliance, and cost optimization services", "Compute, storage, network, and security services supplied by the provider", "Detection, incident response, and disaster recovery", "Management and automation, broad protection, and native integration"], "a": 3, "rat": "The diagram shows Management & Automation, Broad Protection, and Native Integration next to 'Customer builds and manages security in the cloud'; compute, storage, and network belong to the provider layer.", "src": "Video · 2:30", "diff": "medium"}, {"n": 832, "ln": 12, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "Licensing options", "q": "Which licensing options are available for FortiGate VM in the cloud?", "opts": ["Hardware bundle licensing", "BYOL, PAYG, or FortiFlex", "PAYG only, via marketplace", "BYOL only, via partners"], "a": 1, "rat": "The FortiGate VM in the Cloud slide states it is available with BYOL, PAYG, or FortiFlex licensing.", "src": "Video · 3:20", "diff": "easy"}, {"n": 833, "ln": 13, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "IPsec topologies", "q": "Which IPsec topologies does FortiGate support that are not available in AWS native services?", "opts": ["Full mesh and partial mesh", "A single static tunnel only", "Policy-based tunnels only, no routes", "Unencrypted GRE tunnels only"], "a": 0, "rat": "The notes give the example that FortiGate supports additional IPsec topologies, such as full mesh and partial mesh, which are not available in AWS native services.", "src": "Video · 3:20", "diff": "medium"}, {"n": 834, "ln": 14, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "FortiFlex", "q": "How is resource consumption measured when FortiGate VM is licensed through FortiFlex?", "opts": ["With a count of protected users per subscription", "With a one-time perpetual fee per virtual machine", "With a point-based system managed in the FortiCloud portal", "With hourly vCPU rates billed by the cloud provider"], "a": 2, "rat": "The notes state FortiFlex is managed through the FortiCloud portal and resource consumption is calculated using a point-based system.", "src": "Video · 3:20", "diff": "medium"}, {"n": 835, "ln": 15, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "SD-WAN", "q": "Which capability does FortiGate VM add that AWS does not natively provide?", "opts": ["SD-WAN", "Route tables", "Availability zones", "Elastic IP addresses"], "a": 0, "rat": "The notes say FortiGate enables SD-WAN, a feature AWS does not natively provide. Route tables, EIPs, and AZs are native AWS constructs covered elsewhere.", "src": "Video · 3:20", "diff": "easy"}, {"n": 836, "ln": 16, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "Marketplace plans", "q": "When you click Create on the FortiGate NGFW marketplace listing, which of these deployment plans is offered?", "opts": ["Active-Active load balanced with ELB/ILB", "Active-Passive HA using VRRP only", "Three-node FGCP cluster across regions", "Active-Active cluster with FGSP sync"], "a": 0, "rat": "The plan list shows Single VM, Active-Passive HA with Fabric Connector Failover, Active-Active Loadbalanced with ELB/ILB, and Active-Passive HA with ELB/ILB.", "src": "Video · 3:45", "diff": "hard"}, {"n": 837, "ln": 17, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "PAYG billing", "q": "How is a PAYG (on-demand) FortiGate VM charged?", "opts": ["With daily points drawn from a prepaid pool", "By the hour on a monthly basis, according to running time", "With a one-time prepaid fee that has no term limit", "Through a prepaid 1-, 3-, or 5-year subscription bought from partners"], "a": 1, "rat": "The Licensing Models slide says PAYG charges are based on running time, charged by the hour on a monthly base, and paid through the cloud provider subscription.", "src": "Video · 4:10", "diff": "easy"}, {"n": 838, "ln": 18, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "PAYG total cost", "q": "In Azure, what makes up the total cost of a PAYG FortiGate VM?", "opts": ["A Fortinet license fee plus a separate support contract", "The hourly subscription rate plus Azure infrastructure costs", "Only Azure compute charges, since the license is free", "Only the hourly subscription rate shown on the listing"], "a": 1, "rat": "The callout states the total cost of PAYG includes the subscription hourly rate plus the Azure infrastructure costs; the listing notes prices are in addition to Azure compute, storage, and network charges.", "src": "Video · 4:10", "diff": "medium"}, {"n": 839, "ln": 19, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "PAYG suitability", "q": "For which kind of instance is the PAYG model the better fit?", "opts": ["Ones with steady, predictable workloads running around the clock", "Ones running continuously for several years", "Ones that run intermittently or have a short lifetime", "Ones needing long-term static on-premises use"], "a": 2, "rat": "The slide says PAYG is better suited for instances with variable usage, and the notes say it is more cost-effective for instances not running all the time or with a short lifetime.", "src": "Video · 4:10", "diff": "easy"}, {"n": 840, "ln": 20, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "PAYG rates", "q": "What determines the hourly rate of a PAYG FortiGate VM?", "opts": ["The count of protected endpoints", "The number of firewall policies", "The volume of inspected traffic", "The instance type and size"], "a": 3, "rat": "The slide states that PAYG rates are based on the instance type and size; the listing shows prices rising from 1 vCPU to 32 vCPU.", "src": "Video · 4:10", "diff": "medium"}, {"n": 841, "ln": 21, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "BYOL acquisition", "q": "How is a FortiGate VM BYOL license obtained?", "opts": ["From the hourly marketplace plan", "Automatically on first boot", "Through Fortinet partners", "Through the Azure monthly bill"], "a": 2, "rat": "The Licensing Models (Contd) slide states that for BYOL the license is acquired through partners.", "src": "Video · 5:00", "diff": "easy"}, {"n": 842, "ln": 22, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "BYOL timing", "q": "At what point must a BYOL license be applied to a cloud FortiGate VM?", "opts": ["Never; BYOL needs no license file", "During service configuration", "Only when upgrading the firmware", "After the 30-day evaluation ends"], "a": 1, "rat": "The slide says the BYOL license must be added during the configuration of the service.", "src": "Video · 5:00", "diff": "medium"}, {"n": 843, "ln": 23, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "Flex-VM", "q": "Which BYOL license version is described as best for hybrid or multi-cloud usage?", "opts": ["Term license (FG-VM-S)", "PAYG on-demand plan", "Perpetual license (FG-VM)", "Flex-VM Enterprise"], "a": 3, "rat": "In the BYOL table, Flex-VM Enterprise (daily, prepaid plus PAYG, term limit) is labeled 'Best for hybrid/multi-cloud usage'.", "src": "Video · 5:00", "diff": "easy"}, {"n": 844, "ln": 24, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "Term license", "q": "What are the billing characteristics of the BYOL term license (FG-VM-S)?", "opts": ["One-time prepaid fee with no term limit at all", "Prepaid for 1, 3, or 5 years with a term limit", "Hourly billing through the cloud subscription", "Daily billing combining prepaid and PAYG"], "a": 1, "rat": "The table shows the term license (FG-VM-S) as 1/3/5 Yr, prepaid, with a term limit, best for steady predictable usage.", "src": "Video · 5:00", "diff": "medium"}, {"n": 845, "ln": 25, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "BYOL costs", "q": "With a BYOL FortiGate VM in Azure, what does the customer pay Microsoft for?", "opts": ["Only FortiGuard security service bundles", "Nothing, since Fortinet covers the resources", "Compute, storage, and network traffic used", "The FortiGate license and Fortinet support"], "a": 2, "rat": "The notes say with BYOL the customer pays Microsoft Azure for compute, storage, and network traffic, and pays Fortinet for the license and support.", "src": "Video · 5:00", "diff": "medium"}, {"n": 846, "ln": 26, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "Marketplace deployment", "q": "What is the simplest method to deploy a new FortiGate VM in AWS or Azure?", "opts": ["Write custom templates from scratch", "Clone an on-premises hardware unit", "Use the cloud marketplace", "Upload a disk image by hand"], "a": 2, "rat": "The Available Deployment Options slide and notes state the simplest method for new deployments, in both AWS and Azure, is through the Cloud Marketplace.", "src": "Video · 5:25", "diff": "easy"}, {"n": 847, "ln": 27, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "Review + create", "q": "What is the purpose of the final Review + create step in the Azure FortiGate NGFW deployment wizard?", "opts": ["It uploads the BYOL license file to the FortiGate after boot", "It selects the plan or VM size from the list of marketplace offers", "It confirms all required fields are filled in and valid before deploying", "It assigns the public IP address and builds the NSG rules"], "a": 2, "rat": "The slide says the last step, Review + create, ensures all required fields are included and valid; selecting the plan happens earlier when you click Create.", "src": "Video · 5:25", "diff": "easy"}, {"n": 848, "ln": 28, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "East-West inspection", "q": "Which FortiGate use case stops an attacker from moving from one compromised VM to another inside the cloud?", "opts": ["Remote access VPN for cloud users", "North-South internet traffic inspection", "Site-to-site VPN from on-premises", "Internal East-West traffic inspection"], "a": 3, "rat": "The Use Cases slide lists Internal Traffic Inspection (East-West), which stops an attacker moving from one compromised VM to another.", "src": "Video · 6:15", "diff": "easy"}, {"n": 849, "ln": 29, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "North-South inspection", "q": "What does North-South content inspection protect against in a public cloud deployment?", "opts": ["Lateral movement between two compromised VMs in the same subnet", "Data leakage through a misconfigured cloud storage bucket", "Attackers on the internet targeting a web application hosted in AWS", "Unknown zero-day files that require sandbox detonation"], "a": 2, "rat": "The slide says North-South (internet) traffic inspection stops attackers targeting a web application hosted in AWS; East-West handles VM-to-VM movement and sandboxing handles unknown threats.", "src": "Video · 6:15", "diff": "medium"}, {"n": 850, "ln": 30, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "Automation integration", "q": "FortiGate VM APIs can integrate with which AWS service's threat intelligence feeds for automated incident response?", "opts": ["AWS Transit Gateway", "AWS GuardDuty", "AWS Internet Gateway", "Amazon EC2 Auto Scaling"], "a": 1, "rat": "The notes say FortiGate VM has APIs for automation and orchestration and can be integrated with AWS GuardDuty threat intelligence feeds for automated incident response.", "src": "Video · 6:15", "diff": "medium"}, {"n": 851, "ln": 31, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "Cloud components", "q": "Which Azure component is the equivalent of an Amazon VPC?", "opts": ["Azure DNS", "Azure NAT Gateway", "Azure VM", "Azure VNet"], "a": 3, "rat": "The notes on Public Cloud Components describe Azure VNet as securely connecting Azure resources to each other, like Amazon VPC.", "src": "Video · 7:05", "diff": "easy"}, {"n": 852, "ln": 32, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "Azure NAT Gateway", "q": "What is the purpose of an Azure NAT Gateway?", "opts": ["To connect two VNets located in different Azure regions together", "To route traffic between subnets of a single VNet", "To let instances in a private subnet reach the internet", "To give inbound public access to a single VM"], "a": 2, "rat": "The notes describe Azure NAT Gateway as a managed NAT service that lets all instances in a private subnet connect to the internet.", "src": "Video · 7:30", "diff": "medium"}, {"n": 853, "ln": 33, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "Single FortiGate topology", "q": "In a simple single-FortiGate cloud deployment with external, internal, and protected subnets, which FortiGate port connects to the external subnet that is reachable through the public IP address?", "opts": ["mgmt", "port2", "port1", "port3"], "a": 2, "rat": "The diagram shows Internet to Public IP address to port1 in the External subnet; port2 is in the Internal subnet.", "src": "Video · 7:55", "diff": "easy"}, {"n": 854, "ln": 34, "lesson": 15, "section": "FortiGate VM Licensing, Deployment, and Use Cases", "topic": "Single FortiGate topology", "q": "In a simple single-FortiGate cloud deployment where port1 is in an external subnet and port2 is in an internal subnet, where does the workload VM reside and how is its internet traffic handled?", "opts": ["In the internal subnet, bypassing FortiGate via the cloud router", "In the external subnet, reaching the internet directly by public IP", "In the protected subnet, sending traffic only through a NAT gateway", "In the protected subnet, with its internet traffic inspected by FortiGate"], "a": 3, "rat": "The notes say the VM resides in the protected subnet and the internet traffic coming from the VM is inspected through FortiGate.", "src": "Video · 7:55", "diff": "medium"}, {"n": 855, "ln": 35, "lesson": 15, "section": "AWS Core Networking Components", "topic": "AWS regions", "q": "Which AWS cost or capability consideration applies to regions?", "opts": ["Inter-region data transfer is charged, and regions differ in features", "Regions share a single VPC that spans every geography by default", "Each region holds exactly one AZ and is billed at one flat rate", "Inter-region transfer is free, and all regions offer identical features"], "a": 0, "rat": "The notes say there is a charge for data transfers between regions, and not all regions have the same features, functions, and offers.", "src": "Video · 8:45", "diff": "medium"}, {"n": 856, "ln": 36, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Multi-AZ FortiGate", "q": "Because a single FortiGate cannot sit between AWS availability zones, what can be placed between AZs instead?", "opts": ["A NAT gateway", "A VPC peering link", "A load balancer", "An intrinsic router"], "a": 2, "rat": "The notes state you cannot have one FortiGate sitting between AZs; instead, you can have a load balancer between AZs.", "src": "Video · 9:10", "diff": "medium"}, {"n": 857, "ln": 37, "lesson": 15, "section": "AWS Core Networking Components", "topic": "AZ naming", "q": "How is an AWS availability zone identified?", "opts": ["Country name plus a city, e.g. us-virginia", "VPC CIDR plus zone index, e.g. 10.0.0.0-1", "Region code plus a letter, for example us-east-1a", "A numeric ID only, for example 123"], "a": 2, "rat": "The notes say an AZ is represented by a region code followed by a letter identifier, for example us-east-1a.", "src": "Video · 9:10", "diff": "easy"}, {"n": 858, "ln": 38, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Unicast HA", "q": "The new FortiGate unicast HA solution deploys into a single AZ. What is the recommended practice?", "opts": ["Move both units to another region", "Spread it across two AZs", "Replace HA with one larger VM", "Keep both units in the same AZ"], "a": 1, "rat": "The notes say the new unicast HA solution deploys into a single AZ; therefore, the best practice is to break them up and deploy them into two AZs.", "src": "Video · 9:10", "diff": "hard"}, {"n": 859, "ln": 39, "lesson": 15, "section": "AWS Core Networking Components", "topic": "VPC scope", "q": "What is the scope of an Amazon VPC?", "opts": ["It is bound to one subnet and one EC2 instance", "It spans several regions under one CIDR block for global reach", "It is defined in one region and spans every AZ in it", "It is defined in one AZ and cannot span other AZs"], "a": 2, "rat": "The Amazon VPC slide says a VPC is defined within a region and spans all AZs within the region in which it is defined; the notes add it belongs to a region but not to any AZ.", "src": "Video · 10:00", "diff": "easy"}, {"n": 860, "ln": 40, "lesson": 15, "section": "AWS Core Networking Components", "topic": "VPC CIDR", "q": "How must subnets created in an Amazon VPC be addressed?", "opts": ["With any range, since subnets are independent", "Only with public, internet-routable addresses", "With overlapping ranges in each AZ", "Within the CIDR block defined for that VPC"], "a": 3, "rat": "The notes state all subnets should be in the same CIDR block that is defined for the VPC, for example 10.0.0.0/16; the slide says the base CIDR is defined at the VPC.", "src": "Video · 10:00", "diff": "medium"}, {"n": 861, "ln": 41, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Subnet scope", "q": "How far can a single AWS subnet extend?", "opts": ["Several VPCs in the account", "Multiple AWS regions at once", "One specific AZ only", "All AZs in the region"], "a": 2, "rat": "The Subnets slide states that a subnet is contained to one specific AZ.", "src": "Video · 10:50", "diff": "easy"}, {"n": 862, "ln": 42, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Public subnet", "q": "In AWS terminology, what makes a subnet a public subnet?", "opts": ["Every host in it has a public IPv4 address", "It spans every AZ of the VPC", "It uses a non-RFC1918 CIDR block", "It is connected to an internet gateway"], "a": 3, "rat": "The slide defines a public subnet as an internet gateway connected subnet, and notes that this does not mean public addressing within the subnet.", "src": "Video · 10:50", "diff": "medium"}, {"n": 863, "ln": 43, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Reserved addresses", "q": "Which mapping of the first three reserved addresses in an AWS subnet is correct?", "opts": [".1 internet gateway, .2 NAT gateway, .3 AWS DNS", ".1 intrinsic router, .2 internet gateway, .3 AWS DNS", ".1 intrinsic router, .2 AWS DNS, .3 reserved for future use", ".1 AWS DNS, .2 intrinsic router, .3 internet gateway"], "a": 2, "rat": "The slide lists reserved IP addresses: first (X.X.X.1) intrinsic router, second (X.X.X.2) AWS DNS, third (X.X.X.3) reserved for future use.", "src": "Video · 10:50", "diff": "medium"}, {"n": 864, "ln": 44, "lesson": 15, "section": "AWS Core Networking Components", "topic": "FortiGate addressing", "q": "Which address in an AWS subnet must a FortiGate interface use?", "opts": ["The fourth usable address", "The first usable address", "The second usable address", "The last usable address"], "a": 0, "rat": "The notes say the first three usable IP addresses are reserved, so if you deploy a FortiGate you must use the fourth usable IP address, which DHCP handles by default.", "src": "Video · 10:50", "diff": "medium"}, {"n": 865, "ln": 45, "lesson": 15, "section": "AWS Core Networking Components", "topic": "FortiGate in subnets", "q": "When a FortiGate protects an AWS VPC with one interface in the private subnet and one in the public subnet, how is internet traffic from the private subnet steered?", "opts": ["Each EC2 instance must be given a static default route to the FortiGate public IP", "A route table for the private subnet sends it through FortiGate and then to the public subnet", "The intrinsic router automatically detects FortiGate and forwards all traffic to it", "The internet gateway is attached directly to the private subnet behind FortiGate"], "a": 1, "rat": "The notes explain that after connecting both interfaces, you define a routing table for the private subnet to route internet traffic through the FortiGate device and then to the public subnet.", "src": "Video · 10:50", "diff": "hard"}, {"n": 866, "ln": 46, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Intrinsic router", "q": "Where does the AWS intrinsic router reside?", "opts": ["At the VPC level, connecting subnets in all AZs", "At the region level, shared by all VPCs", "Inside a single AZ, serving only that zone", "On a dedicated EC2 router instance that you manage"], "a": 0, "rat": "The slide says all subnets are connected to an intrinsic router that resides at the VPC level (in all AZs), and no user-managed physical router is involved.", "src": "Video · 12:55", "diff": "medium"}, {"n": 867, "ln": 47, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Intrinsic router", "q": "How does the AWS intrinsic router actually move packets?", "opts": ["As a physical router you manage and patch in each AWS data center", "As a service on hypervisors across AWS, not as a device traffic relays through", "As a function of the internet gateway that inspects every packet", "As a pair of EC2 router appliances deployed in every availability zone"], "a": 1, "rat": "The notes state an intrinsic router doesn't relay traffic; it is a service that runs on hypervisors throughout the AWS infrastructure, so the user does not manage any physical router.", "src": "Video · 12:55", "diff": "hard"}, {"n": 868, "ln": 48, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Internet gateway", "q": "What must an AWS instance have to communicate over the internet through an internet gateway?", "opts": ["A security group with no rules", "A route to the intrinsic router", "A NAT gateway in its own subnet", "A public IP or an EIP"], "a": 3, "rat": "The Internet Gateway slide states that to enable communication over the internet, an instance must have a public address or an elastic IP (EIP) assigned to it.", "src": "Video · 13:20", "diff": "easy"}, {"n": 869, "ln": 49, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Internet gateway", "q": "What must you do to make an AWS subnet public?", "opts": ["Create an internet gateway and add it to the subnet's routing table", "Assign a public, internet-routable CIDR block to the subnet when creating the VPC", "Move the subnet into a separate AZ that faces the internet", "Disable the source/destination check on every instance"], "a": 0, "rat": "The notes say if you want to make the subnet public, you first must create an internet gateway and then attach it to the appropriate subnet routing table. It is a paid-for service.", "src": "Video · 13:20", "diff": "medium"}, {"n": 870, "ln": 50, "lesson": 15, "section": "AWS Core Networking Components", "topic": "ENI attributes", "q": "Which attributes move with an AWS ENI when it is detached from one instance and attached to another?", "opts": ["Instance type, AMI, root volume, and key pair", "Region, AZ, and VPC CIDR block", "IP address, MAC address, and security group", "Route table, IGW, and NAT gateway"], "a": 2, "rat": "The EC2 Components slide says ENI attributes (IP/MAC/security group) follow the ENI when it is attached to or detached from an instance, and traffic is redirected to the new instance.", "src": "Video · 14:10", "diff": "easy"}, {"n": 871, "ln": 51, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Primary ENI", "q": "What restriction applies to the primary network interface of an EC2 instance?", "opts": ["It cannot have a private IPv4 address", "It cannot belong to a security group", "It cannot be detached", "It cannot be used for internet traffic"], "a": 2, "rat": "The slide states each instance has a default primary network interface with a private IPv4 address from the VPC range, and you cannot detach a primary network interface from an instance.", "src": "Video · 14:10", "diff": "medium"}, {"n": 872, "ln": 52, "lesson": 15, "section": "AWS Core Networking Components", "topic": "ENI mobility", "q": "An administrator wants to move an ENI to an instance in a different availability zone. What happens?", "opts": ["It works after the IP address is changed", "The move is not possible", "It works if the security group is removed", "It works only for the primary interface"], "a": 1, "rat": "The slide says an ENI cannot move between AZs, and the notes add that once an ENI is created inside the AZ, it cannot be moved outside the AZ.", "src": "Video · 14:10", "diff": "medium"}, {"n": 873, "ln": 53, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Source/destination check", "q": "Why must the source/destination check be turned off on a FortiGate's private interface in AWS?", "opts": ["So the intrinsic router assigns it the first subnet address", "So the interface can be moved to another availability zone", "So it can pass traffic whose addresses differ from its own interface IP", "So the elastic IP can be remapped to the interface faster"], "a": 2, "rat": "The slide explains that the check is set by the ENI, that disabling it allows source and destination IPs different from the interface's assigned IP, and that this is required on the private FortiGate interface when routing traffic to other networks.", "src": "Video · 14:10", "diff": "hard"}, {"n": 874, "ln": 54, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Source/destination check", "q": "What is the default state of the source/destination check on an AWS network interface?", "opts": ["Enabled only on secondary ENIs", "Disabled", "Enabled", "Not configurable per interface"], "a": 2, "rat": "The notes say that in AWS, the source/destination check feature is enabled by default; the screenshot shows it being changed per network interface.", "src": "Video · 14:10", "diff": "easy"}, {"n": 875, "ln": 55, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Elastic IP", "q": "Which statement about an AWS elastic IP (EIP) address is correct?", "opts": ["It is a dynamic private IPv4 that changes each time the instance reboots", "It is a static public IPv4 that is locked to the first instance it uses", "It is a public IPv6 that can be used only inside a single subnet", "It is a static public IPv4 that can be remapped to mask an instance failure"], "a": 3, "rat": "The Elastic IP Addresses slide says an EIP is a static public IPv4 address that can be used to mask the failure of an instance by rapidly remapping it to another instance in the VPC.", "src": "Video · 14:35", "diff": "medium"}, {"n": 876, "ln": 56, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Elastic IP", "q": "What is the advantage of associating an EIP with an ENI rather than directly with an instance?", "opts": ["The EIP becomes usable in every AWS region at the same time automatically", "All ENI attributes can move to another instance in a single step", "The instance no longer needs a route to the internet gateway", "The ENI can then be moved freely between availability zones"], "a": 1, "rat": "The slide says associating an EIP with an ENI instead of directly with the instance allows all attributes of the ENI to move from one instance to another in a single step.", "src": "Video · 14:35", "diff": "medium"}, {"n": 877, "ln": 57, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Route tables", "q": "In an AWS VPC, the public subnet uses a custom route table and the private subnet uses the main route table. Which route appears only in the custom route table?", "opts": ["10.10.0.0/16 with target local", "0.0.0.0/0 with target local", "0.0.0.0/0 with target igw-id", "10.10.0.0/16 with target igw-id"], "a": 2, "rat": "In the Implicit Router and Internet Gateway diagram, both tables hold 10.10.0.0/16 to local, but only the custom route table (public subnet) adds 0.0.0.0/0 to igw-id.", "src": "Video · 15:00", "diff": "hard"}, {"n": 878, "ln": 58, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Route tables", "q": "By default, which routing table is an AWS subnet associated with?", "opts": ["The main routing table", "A custom table per subnet", "No table until one is made", "The internet gateway table"], "a": 0, "rat": "The Routing Tables slide states that by default, subnets are associated with the main routing table, and you can create more tables and explicitly associate them.", "src": "Video · 15:50", "diff": "easy"}, {"n": 879, "ln": 59, "lesson": 15, "section": "AWS Core Networking Components", "topic": "Route gateways", "q": "How is the gateway of a route in an AWS routing table specified?", "opts": ["By choosing the MAC address of the destination host", "By referencing an object such as an ENI rather than an IP", "By selecting the AZ that hosts the next-hop device", "By entering the IP address of the next-hop router in the subnet"], "a": 1, "rat": "The slide says a gateway is not defined by an IP address; instead it uses the ENI object. The notes add a route can use an ENI, internet gateway, NAT gateway, and so on.", "src": "Video · 15:50", "diff": "medium"}, {"n": 880, "ln": 60, "lesson": 15, "section": "AWS Core Networking Components", "topic": "EC2 default gateway", "q": "What do EC2 instances use as their default gateway?", "opts": ["The intrinsic router, which then redirects to the route table's gateway", "The FortiGate private interface, configured statically in the OS", "The internet gateway, which then redirects to the intrinsic router", "The AWS DNS address, which resolves the next-hop target"], "a": 0, "rat": "The slide states EC2 instances always use the intrinsic router as the default gateway but are then redirected to each gateway defined in the routing table.", "src": "Video · 15:50", "diff": "medium"}, {"n": 881, "ln": 61, "lesson": 15, "section": "AWS VPC Traffic Flows", "topic": "Within a subnet", "q": "When two EC2 instances in the same AWS subnet communicate, how does the source instance's operating system appear to reach its peer?", "opts": ["It ARPs for the peer's MAC address and sends the frames straight to it", "It looks up the peer's address with AWS DNS and uses the elastic IP", "It forwards every packet to the internet gateway for local hairpinning", "It sends all packets to the FortiGate private interface for inspection"], "a": 0, "rat": "The Scenario 1 notes say the OS of an EC2 instance sends an ARP request to learn the MAC address of the other instance, then sends packets to that MAC at layer 2 and IP at layer 3; AWS creates a routing table allowing direct traffic.", "src": "Video · 16:40", "diff": "medium"}, {"n": 882, "ln": 62, "lesson": 15, "section": "AWS VPC Traffic Flows", "topic": "Between subnets", "q": "When an EC2 instance in a DMZ subnet sends to an instance in a private subnet of the same VPC, what happens after the packet leaves the source ENI?", "opts": ["A hypervisor routing service finds the destination's hypervisor and delivers the packet to that ENI", "The packet is broadcast to every ENI in the VPC until the correct host answers with ARP", "The packet is relayed hop by hop through a physical router appliance at the edge of the VPC", "The packet is hairpinned through the internet gateway and sent back into the private subnet"], "a": 0, "rat": "The Scenario 2 notes say the intrinsic router is not a router traffic relays through; it is a service on hypervisors that routes L3 destinations as soon as they leave the ENI, locates the destination VM's hypervisor, forwards the packet, and delivers it to the destination ENI.", "src": "Video · 17:30", "diff": "hard"}, {"n": 883, "ln": 63, "lesson": 15, "section": "AWS VPC Traffic Flows", "topic": "To the internet", "q": "Which set of requirements must be met for an EC2 instance to send traffic to the internet?", "opts": ["An IGW tied to the VPC, a route table on the subnet, and a public or elastic IP on the ENI", "An intrinsic router per subnet, a static OS route, and source/destination check on", "A NAT gateway in each AZ, a VPC peering link, and a security group with no rules", "A transit gateway, a dedicated AZ for the instance, and a private IP on the ENI"], "a": 0, "rat": "Scenario 3 lists: internet gateway associated with VPC, route table associated with subnet, and public or elastic IP associated with the ENI of the EC2 instance.", "src": "Video · 18:45", "diff": "medium"}, {"n": 884, "ln": 64, "lesson": 15, "section": "AWS VPC Traffic Flows", "topic": "Outbound NAT", "q": "When an EC2 instance with an elastic IP sends traffic to the internet, what address translation is applied as the traffic leaves AWS?", "opts": ["Source NAT to an address taken from a shared pool", "Destination NAT to the remote server's public IP", "Source NAT to the elastic or public IP of the ENI", "No translation; the private IP is routed publicly"], "a": 2, "rat": "The Scenario 3 diagram labels the outbound step 'Elastic or public IP SNAT': the packet is source-NATed to the public IP associated with the instance's ENI.", "src": "Video · 18:45", "diff": "medium"}, {"n": 885, "ln": 65, "lesson": 15, "section": "AWS VPC Traffic Flows", "topic": "Reply traffic", "q": "An EC2 instance's ENI has private IP 10.10.1.4 and an associated public IP. When an internet host replies to the public IP, what happens before delivery?", "opts": ["It is delivered unchanged to the public IP", "Source NAT rewrites it to 10.10.1.1", "It is dropped unless a NAT gateway exists", "Destination NAT translates it to 10.10.1.4"], "a": 3, "rat": "The Scenario 3 notes say the reply to the public IP gets DNAT to the 10.10.1.4 address of the ENI and is then transferred to the EC2 instance ENI.", "src": "Video · 19:35", "diff": "medium"}, {"n": 886, "ln": 66, "lesson": 15, "section": "AWS VPC Traffic Flows", "topic": "Inbound configuration", "q": "When configuring AWS to handle inbound internet traffic to an EC2 instance, which step comes third?", "opts": ["Configure and attach an internet gateway service to the VPC", "Associate the instance's ENI with a public IP address", "Create or edit a route table with a default route toward the gateway", "Associate the route table with the subnet where the instance's ENI is connected"], "a": 3, "rat": "The Scenario 4 notes list: 1 configure and attach an IGW to the VPC; 2 create or edit a route table with a default route toward the IGW; 3 associate the route table with the subnet where the EC2 ENI is connected; 4 associate the ENI with a public IP.", "src": "Video · 20:25", "diff": "hard"}, {"n": 887, "ln": 67, "lesson": 15, "section": "AWS VPC Traffic Flows", "topic": "Internet access component", "q": "For instances with public IP addresses to reach the internet, which VPC component must be attached to the VPC and used as the default route target?", "opts": ["Transit gateway", "Internet gateway", "VPC peering link", "Intrinsic router"], "a": 1, "rat": "The knowledge check marks Internet gateway as correct (Transit gateway is the wrong choice), and the Scenario 4 steps attach an internet gateway to the VPC and point the default route at it.", "src": "Video · 34:10", "diff": "easy"}, {"n": 888, "ln": 68, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Global services", "q": "Which Azure services do not require a particular region?", "opts": ["Azure NSG, Azure UDR, and Azure Route Server", "Azure AD, Azure Traffic Manager, and Azure DNS", "Azure Public IP, Azure Load Balancer, and VMs", "Azure Virtual Machines, Azure VNet, and Azure NAT Gateway"], "a": 1, "rat": "The Azure Regions notes list global Azure services that do not require a particular region: Azure AD, Azure Traffic Manager, or Azure DNS.", "src": "Video · 22:55", "diff": "medium"}, {"n": 889, "ln": 69, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Feature availability", "q": "What does feature availability mean when selecting an Azure region?", "opts": ["Features become available only after a VNet is peered with another region's VNet", "Some services or VM features, such as certain VM sizes or storage types, exist only in certain regions", "Every Azure service and VM size is offered in all regions at the same time and price", "Region features depend only on the number of availability zones you deploy into"], "a": 1, "rat": "The notes define feature availability: some services or VM features are available only in certain regions, such as specific VM sizes or storage types.", "src": "Video · 22:55", "diff": "medium"}, {"n": 890, "ln": 70, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Region pairs", "q": "What is the benefit of Azure separating related regions across a geography?", "opts": ["Both regions are guaranteed to offer exactly the same VM sizes", "A single subnet can stretch across both regions", "One disaster or outage is less likely to hit both regions at once", "Data transfers between the two regions are always free"], "a": 2, "rat": "The Azure Regions notes say separation across a geography should reduce the likelihood of natural disasters, civil unrest, power outages, or physical network outages affecting both regions at once.", "src": "Video · 24:10", "diff": "medium"}, {"n": 891, "ln": 71, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Availability zones", "q": "What is the minimum number of separate availability zones in every enabled Azure region?", "opts": ["Two", "Four", "Three", "Seven"], "a": 2, "rat": "The Azure Availability Zones slide states that for resiliency, there are a minimum of three separate zones in all enabled regions.", "src": "Video · 25:00", "diff": "easy"}, {"n": 892, "ln": 72, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Availability zones", "q": "What does each Azure availability zone consist of?", "opts": ["One rack of servers that shares a regional power, cooling, and network plant", "One or more datacenters with independent power, cooling, and networking", "A pair of regions joined by a dedicated low-latency link", "A logical group of VMs that share a single physical host"], "a": 1, "rat": "The slide says each zone is made up of one or more datacenters equipped with independent power, cooling, and networking.", "src": "Video · 24:35", "diff": "easy"}, {"n": 893, "ln": 73, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Availability zones", "q": "What level of failure are Azure availability zones designed to protect against?", "opts": ["Datacenter-level failures", "Global platform outages", "Single-disk failures only", "Application coding errors"], "a": 0, "rat": "The slide states availability zones help protect against failures at the datacenter level, and their separation protects applications and data from zone-level failures.", "src": "Video · 25:00", "diff": "easy"}, {"n": 894, "ln": 74, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "VNet behavior", "q": "By default, how do Azure VNets relate to one another?", "opts": ["They are fully isolated", "They share one address space per account", "They are peered automatically in a region", "They route to each other through the SDN"], "a": 0, "rat": "The Azure VNet slide lists that VNets are completely isolated from each other by default.", "src": "Video · 25:25", "diff": "easy"}, {"n": 895, "ln": 75, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "VNet requirements", "q": "What must every Azure VNet be configured with?", "opts": ["At least one public IP address", "At least one NSG on each subnet", "At least one VPN gateway", "At least one IP address space"], "a": 3, "rat": "The Azure VNet slide states a VNet must be configured with at least one IP address space; the notes add it can have multiple address spaces.", "src": "Video · 25:25", "diff": "medium"}, {"n": 896, "ln": 76, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "VNet routing", "q": "How do VMs in different subnets of the same Azure VNet communicate by default?", "opts": ["They need VNet peering between subnets", "They can route to each other directly", "They cannot talk until an NSG allows it", "They need a UDR toward a FortiGate"], "a": 1, "rat": "The Azure VNet slide states VMs in different subnets within a VNet can route to each other directly, and system routes are created by default.", "src": "Video · 25:25", "diff": "medium"}, {"n": 897, "ln": 77, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Public IP mapping", "q": "How is the public IP address of an Azure VM represented?", "opts": ["As a NAT entry in the Azure Fabric that maps to the VM", "As a static route on the FortiGate default gateway", "As a secondary alias address added to the VM's private interface", "As a second NIC configured inside the guest OS"], "a": 0, "rat": "The VNet notes state the public IP address of a VM is represented as a NAT entry in the Azure Fabric, which is mapped to the VM.", "src": "Video · 25:50", "diff": "hard"}, {"n": 898, "ln": 78, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Route priority", "q": "If several Azure routes share exactly the same prefix, in which order are they preferred?", "opts": ["UDR, then BGP routes, then system routes", "System routes, then BGP routes, then UDR", "BGP routes, then UDR, then system routes", "UDR, then system routes, then BGP routes"], "a": 0, "rat": "The Routing slide states that if more than one route has the same prefix, Azure uses the priorities in order: 1 UDR, 2 BGP routes, 3 system routes.", "src": "Video · 26:40", "diff": "medium"}, {"n": 899, "ln": 79, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Longest match", "q": "An Azure route table has a 10.0.3.0/24 system route and a 10.0.0.0/16 BGP route. Which is used for traffic to 10.0.3.25?", "opts": ["The /16 BGP route, since BGP beats system routes", "Both routes, load-balanced across equal costs", "Neither; a UDR must be added before routing", "The /24 system route, since it is more specific"], "a": 3, "rat": "The slide says the most specific route always wins regardless of route type: a 10.0.3.0/24 system route would take precedence over the 10.0.0.0/16 BGP route.", "src": "Video · 26:40", "diff": "hard"}, {"n": 900, "ln": 80, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Override options", "q": "Which options can override the system routes that Azure creates?", "opts": ["VNet peering and NAT gateways", "UDRs and BGP routes", "NSG rules and public IP SKUs", "Availability zones and regions"], "a": 1, "rat": "The Routing slide states you can implement either or both of the following to override system routes: user-defined routes (UDR) and BGP routes.", "src": "Video · 26:40", "diff": "easy"}, {"n": 901, "ln": 81, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Azure Route Server", "q": "What does Azure Route Server simplify?", "opts": ["Dynamic routing between NVAs such as FortiGate VM and the VNet, using BGP with the Azure SDN", "Name resolution for VMs, using Azure DNS zones linked to every VNet in the tenant", "Static routing between VNets in different regions, using UDRs written by the administrator", "Address assignment for VMs, using DHCP reservations tied to each NIC in the VNet"], "a": 0, "rat": "The notes say Azure Route Server simplifies dynamic routing between network virtual appliances (FortiGate VM) and your VNet, allowing them to exchange BGP routing information directly with the Azure SDN.", "src": "Video · 26:40", "diff": "medium"}, {"n": 902, "ln": 82, "lesson": 15, "section": "Azure Core Components and Routing", "topic": "Azure traffic path", "q": "What must you create so that traffic from Azure VMs is inspected by a FortiGate VM?",
