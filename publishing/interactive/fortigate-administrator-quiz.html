hen authenticate the peers", "Perform the DH exchange, authenticate peers, then negotiate the IKE SA", "Negotiate the IPsec SA, authenticate peers, then perform DH"], "a": 0, "rat": "The Phase 1 How it Works slide numbers the steps 1 Authenticate peers, 2 Negotiate one bidirectional SA (IKE SA), 3 DH exchange for secret keys.", "src": "Video · 11:40", "diff": "hard"}, {"n": 560, "ln": 31, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Diffie-Hellman", "q": "Why can't an attacker who captures the public keys in a Diffie-Hellman exchange derive the secret key?", "opts": ["The secret key is sent separately over the Authentication Header", "The administrator delivers the secret key to both peers out of band", "The public keys are protected inside ESP before they are transmitted", "DH combines the public key with a nonce to generate the shared private key"], "a": 3, "rat": "The notes explain DH uses the public key plus a mathematical factor called a nonce to generate a common private key, so a listener cannot determine the secret.", "src": "Video · 11:40", "diff": "hard"}, {"n": 561, "ln": 32, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Local gateway", "q": "When the Local gateway toggle is enabled in phase 1, which options become available?", "opts": ["On Idle, On Demand, and Disabled", "Primary IP, Secondary IP, and Specify", "Enable, Disable, and Forced", "Static IP address, Dialup user, and Dynamic DNS"], "a": 1, "rat": "The Phase 1 Network slide shows the Local gateway toggle expanding to Primary IP, Secondary IP, and Specify.", "src": "Video · 12:55", "diff": "medium"}, {"n": 562, "ln": 33, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Mode config role", "q": "With Mode Config enabled and Remote gateway set to Dialup User, which role does FortiGate take?", "opts": ["XAuth client with credentials", "IKE mode config server", "DHCP relay agent for clients", "IKE mode config client"], "a": 1, "rat": "The notes say FortiGate acts as an IKE mode config client with Static IP or Dynamic DNS, and as an IKE mode config server with Dialup User.", "src": "Video · 12:55", "diff": "medium"}, {"n": 563, "ln": 34, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Device creation", "q": "Why would you disable Device creation on a dial-up server?", "opts": ["To permit point-to-multipoint links between hub and spokes", "To increase performance when there are many dial-up clients", "To add routes for each dial-up client automatically", "To aggregate several IPsec tunnels into a single interface"], "a": 1, "rat": "The notes say Device creation makes FortiOS create an interface for every dial-up client, and to increase performance you disable it on dial-up servers with many clients.", "src": "Video · 14:10", "diff": "medium"}, {"n": 564, "ln": 35, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Aggregate member", "q": "What does the Aggregate member setting allow?", "opts": ["Creating a separate interface for every dial-up client", "Combining multiple IPsec tunnels into one interface", "Sending DPD probes only when the tunnel traffic is idle", "Bonding several physical WAN ports into an LACP link"], "a": 1, "rat": "The notes describe Aggregate member as letting you aggregate multiple IPsec tunnels into a single interface.", "src": "Video · 14:10", "diff": "medium"}, {"n": 565, "ln": 36, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Dialup user use", "q": "When should the remote gateway be set to Dialup User?", "opts": ["When the remote peer's IP address is unknown", "When both peers must be able to start the tunnel", "When the remote peer has a fixed static IP address", "When the remote peer uses an FQDN that resolves"], "a": 0, "rat": "The notes say to use Dialup User when the remote peer IP address is unknown, as with branch offices and mobile clients that use dynamic IPs without DDNS.", "src": "Video · 15:00", "diff": "medium"}, {"n": 566, "ln": 37, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Dial-up clients", "q": "Which devices can act as dial-up clients toward a FortiGate dial-up server?", "opts": ["Only third-party VPN gateways", "Only FortiClient users on mobile devices", "Only the HQ FortiGate dial-up server", "FortiClient users and a remote-office FortiGate"], "a": 3, "rat": "The diagram labels remote users with FortiClient as dial-up client and a remote office with FortiGate as dial-up client.", "src": "Video · 15:00", "diff": "easy"}, {"n": 567, "ln": 38, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Static/DDNS initiator", "q": "When both peers set the remote gateway to Static IP address or Dynamic DNS, which peer can initiate the tunnel?", "opts": ["Only the FortiGate located at headquarters", "Either peer", "Neither peer, until a dial-up client connects", "Only the peer that has the lower IP address"], "a": 1, "rat": "The slide says the address of the remote peer is known, the local peer can be initiator or responder, and the tunnel can be initiated by either peer.", "src": "Video · 15:50", "diff": "easy"}, {"n": 568, "ln": 39, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Dialup on both peers", "q": "What is the result if both peers have their remote gateway set to Dialup user?", "opts": ["FortiGate falls back to Static IP mode", "Either peer can start the tunnel", "The higher IP becomes the dial-up server", "The tunnel won't work"], "a": 3, "rat": "The notes state that a tunnel in which both peers have the remote gateway set to Dialup user won't work.", "src": "Video · 16:15", "diff": "medium"}, {"n": 569, "ln": 40, "lesson": 11, "section": "Phase 1 Configuration", "topic": "IKE Mode Config", "q": "What does IKE Mode Config do?", "opts": ["It adds a username and password check on top of the phase 1 peer authentication", "It detects whether NAT devices exist along the path to the peer", "Like DHCP, it automatically configures VPN clients' virtual network settings", "It sends probes to detect a dead tunnel between the two peers"], "a": 2, "rat": "The IKE Mode Config slide says it works like DHCP, automatically configuring VPN clients' virtual network settings.", "src": "Video · 17:05", "diff": "easy"}, {"n": 570, "ln": 41, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Mode Config display", "q": "When are the IKE Mode Config fields such as client IP range and DNS displayed in the GUI?", "opts": ["Only when NAT traversal is set to Forced", "Only when Remote Gateway is set to Dialup User", "Only when IKE Version 2 has been selected", "Only when Remote Gateway is set to Static IP address"], "a": 1, "rat": "The callout states IKE mode config settings are only displayed if Remote Gateway is set to Dialup User.", "src": "Video · 17:05", "diff": "medium"}, {"n": 571, "ln": 42, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Mode Config defaults", "q": "Where must Mode Config be enabled, and what are the defaults?", "opts": ["On both peers, and both FortiClient and FortiGate enable it by default out of the box", "Only on FortiClient, because FortiGate enables it automatically", "On both peers; FortiClient enables it by default, FortiGate must be set manually", "Only on FortiGate, because FortiClient does not support Mode Config"], "a": 2, "rat": "The slide says you must enable Mode Config on both peers; the notes add it is enabled by default on FortiClient but must be manually enabled on FortiGate.", "src": "Video · 17:05", "diff": "medium"}, {"n": 572, "ln": 43, "lesson": 11, "section": "Phase 1 Configuration", "topic": "ESP and NAT", "q": "Why can't ESP support NAT on its own?", "opts": ["It has no port numbers", "It always runs over TCP", "It always uses UDP port 500", "It has no integrity check"], "a": 0, "rat": "The NAT-T slide states ESP can't support NAT because it has no port numbers.", "src": "Video · 17:55", "diff": "easy"}, {"n": 573, "ln": 44, "lesson": 11, "section": "Phase 1 Configuration", "topic": "NAT-T Forced", "q": "What happens when NAT traversal is set to Forced?", "opts": ["ESP and IKE always use UDP 4500, even when no NAT device is present", "ESP and IKE always use UDP 500, even when NAT devices are present", "NAT-T is turned off and ESP is sent natively as IP protocol 50", "NAT is detected first, and UDP 4500 is used only if NAT is found"], "a": 0, "rat": "The slide says with Forced, ESP and IKE always use UDP port 4500 even when there are no NAT devices; Enable detects NAT first.", "src": "Video · 17:55", "diff": "medium"}, {"n": 574, "ln": 45, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Keepalive frequency", "q": "With NAT-T enabled, what does the Keepalive frequency value set?", "opts": ["The lifetime of the IKE SA in seconds before it renegotiates", "The maximum number of NAT devices permitted on the path", "The number of DPD retries before a tunnel is declared dead", "How many seconds elapse between successive keepalive probes"], "a": 3, "rat": "The notes say Keepalive Frequency is the interval (in seconds) at which FortiGate sends keepalive probes to keep the connection active across NAT routers.", "src": "Video · 17:55", "diff": "medium"}, {"n": 575, "ln": 46, "lesson": 11, "section": "Phase 1 Configuration", "topic": "DPD On Demand", "q": "In which DPD mode are probes sent only when there is no inbound traffic?", "opts": ["On Idle", "On Demand", "Forced mode", "Disabled"], "a": 1, "rat": "The DPD slide defines On Demand as sending probes when there is no inbound traffic; On Idle sends them when there is no traffic at all.", "src": "Video · 19:10", "diff": "medium"}, {"n": 576, "ln": 47, "lesson": 11, "section": "Phase 1 Configuration", "topic": "DPD Disabled", "q": "What does FortiGate do when DPD is set to Disabled?", "opts": ["It replies to DPD probes but never sends any", "It sends probes only when the tunnel is idle", "It neither sends nor replies to DPD probes", "It sends probes only when inbound traffic stops"], "a": 0, "rat": "The slide says Disabled means only reply to DPD probes, don't send probes, so FortiGate cannot detect a dead tunnel.", "src": "Video · 19:10", "diff": "medium"}, {"n": 577, "ln": 48, "lesson": 11, "section": "Phase 1 Configuration", "topic": "DPD On Idle caution", "q": "Why should On Idle DPD be avoided when FortiGate has many tunnels?", "opts": ["On Idle mode is supported only on IKEv2 tunnels", "On Idle mode automatically disables NAT traversal", "The DPD overhead can become very resource intensive", "On Idle mode is unable to detect a dead tunnel at all"], "a": 2, "rat": "The notes say to avoid On Idle with many tunnels because the overhead introduced by DPD can be very resource intensive, and that On Demand scales better.", "src": "Video · 19:10", "diff": "hard"}, {"n": 578, "ln": 49, "lesson": 11, "section": "Phase 1 Configuration", "topic": "DPD use case", "q": "In which kind of deployment is dead peer detection described as especially useful?", "opts": ["Redundant VPNs with multiple available paths", "Remote access VPNs that use SSL instead of IPsec", "Transport mode VPNs between two client hosts", "Single-tunnel deployments with no backup link"], "a": 0, "rat": "The DPD slide says it is useful in redundant VPNs, where multiple paths are available.", "src": "Video · 19:10", "diff": "easy"}, {"n": 579, "ln": 50, "lesson": 11, "section": "Phase 1 Configuration", "topic": "IKEv2 GUI change", "q": "What changes in the phase 1 Authentication section when IKE Version 2 is selected?", "opts": ["Accepted peer ID becomes required", "The Aggressive and Main mode options disappear", "The Pre-shared key field is removed", "XAuth becomes a mandatory setting"], "a": 1, "rat": "The notes say that when selecting version 2, aggressive and main modes disappear because they don't apply to IKEv2.", "src": "Video · 20:25", "diff": "medium"}, {"n": 580, "ln": 51, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Signature method", "q": "With the Signature authentication method, which certificates must the local peer have installed?", "opts": ["Its own certificate and the CA certificate that issued the remote peer's", "Only a pre-shared key, because no certificates are exchanged", "Only the remote peer's certificate together with its private key", "Only its own private key, since the CA certificate is optional"], "a": 0, "rat": "The notes say the digital signature is validated by the CA certificate on the other peer, so the local peer needs both its own certificate and the CA certificate that issued the remote peer certificate.", "src": "Video · 20:25", "diff": "hard"}, {"n": 581, "ln": 52, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Aggressive vs main", "q": "How does aggressive mode compare with main mode?", "opts": ["Slower (nine packets) and less secure", "Faster (three packets) but less secure", "Faster (three packets) and more secure", "Slower (six packets) but more secure"], "a": 1, "rat": "The Modes slide lists aggressive as not as secure as main mode with faster negotiation (three packets), and main as more secure with six packets.", "src": "Video · 21:15", "diff": "medium"}, {"n": 582, "ln": 53, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Aggressive mode peer ID", "q": "Why is aggressive mode required when FortiGate needs a peer ID check for dial-up tunnels?", "opts": ["Main mode cannot use pre-shared keys, so aggressive mode is the only choice", "Aggressive mode supports IKEv2 traffic selector narrowing for dial-up use", "Aggressive mode encrypts the peer ID inside ESP before it is transmitted to the remote peer", "The peer ID is sent in the first packet, so the correct dial-up tunnel can be matched"], "a": 3, "rat": "The notes say peer ID is sent in the first packet in aggressive mode, letting FortiGate match the remote peer with the correct dial-up tunnel; in main mode it is sent in the last packet.", "src": "Video · 21:15", "diff": "hard"}, {"n": 583, "ln": 54, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Main mode use", "q": "When both peers know each other's IP address or FQDN, which mode is suggested and why?", "opts": ["Aggressive mode, because peer IDs are mandatory", "Main mode, for its more secure negotiation", "Main mode, because it exchanges only three packets", "Aggressive mode, because it needs fewer packets"], "a": 1, "rat": "The notes say when both peers know each other's IP or FQDN you may want main mode for its more secure negotiation, identifying the peer by IP address.", "src": "Video · 21:15", "diff": "medium"}, {"n": 584, "ln": 55, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Phase 1 DH", "q": "Which statement about Diffie-Hellman groups in the phase 1 proposal is accurate?", "opts": ["Only a single DH group may be selected in any phase 1 proposal", "DH is optional in phase 1 and is disabled by default on new tunnels", "DH is negotiated in phase 2 only, so phase 1 has no DH setting", "DH is mandatory in phase 1, and at least one group must be selected"], "a": 3, "rat": "The notes say the use of DH in phase 1 is mandatory and can't be disabled, and you must select at least one DH group.", "src": "Video · 22:05", "diff": "medium"}, {"n": 585, "ln": 56, "lesson": 11, "section": "Phase 1 Configuration", "topic": "DH group trade-off", "q": "What is the trade-off of choosing a higher DH group number in phase 1?", "opts": ["No security change at all, only a shorter key lifetime", "Faster negotiation, but noticeably weaker security", "More secure negotiation, but longer compute time", "More secure and also noticeably faster negotiation"], "a": 2, "rat": "The notes say the higher the DH group number, the more secure the phase 1 negotiation, but it also results in a longer compute time.", "src": "Video · 22:05", "diff": "medium"}, {"n": 586, "ln": 57, "lesson": 11, "section": "Phase 1 Configuration", "topic": "Phase 1 key lifetime", "q": "What does the Key lifetime value in the phase 1 proposal define?", " es the phase 2 with the highest DH group", "It checks which quick mode selector matches the traffic", "It rotates through all phase 2s in round-robin", "It picks the phase 2 with the strongest encryption"], "a": 1, "rat": "The notes say FortiGate selects which phase 2 to use by checking which phase 2 selector (or quick mode selector) matches the traffic.", "src": "Video · 24:10", "diff": "medium"}, {"n": 594, "ln": 65, "lesson": 11, "section": "Phase 2 Configuration", "topic": "Selector mismatch", "q": "What happens to traffic that does not match any phase 2 selector?", "opts": ["It follows the default route", "It is dropped", "It uses the first selector", "It is sent unencrypted"], "a": 1, "rat": "The Phase 2 Selectors slide states: if traffic does not match a selector, it is dropped.", "src": "Video · 25:00", "diff": "easy"}, {"n": 595, "ln": 66, "lesson": 11, "section": "Phase 2 Configuration", "topic": "Point-to-point selectors", "q": "In a point-to-point VPN, how must the phase 2 selectors on the two FortiGate devices relate?", "opts": ["Selectors must differ so that traffic is not looped back", "The source on one FortiGate is the destination on the other", "Only one FortiGate needs selectors; the other uses any", "Both FortiGate devices must use identical source subnets"], "a": 1, "rat": "The slide says in point-to-point VPNs selectors must match: the source on one FortiGate is the destination setting on the other.", "src": "Video · 25:00", "diff": "medium"}, {"n": 596, "ln": 67, "lesson": 11, "section": "Phase 2 Configuration", "topic": "Selector parameters", "q": "Which parameters can be used to define a phase 2 selector?", "opts": ["Local and remote address, protocol number, and local and remote port", "User group, firewall schedule, and the service object for the policy", "Diffie-Hellman group, key lifetime, and the dead peer detection mode", "Peer ID, XAuth user group, and the IKE version used in phase 1"], "a": 0, "rat": "The slide lists selecting by Local Address and Remote Address, Protocol number, and Local Port and Remote Port.", "src": "Video · 25:00", "diff": "medium"}, {"n": 597, "ln": 68, "lesson": 11, "section": "Phase 2 Configuration", "topic": "Selectors vs policies", "q": "If you don't want to filter traffic with phase 2 selectors, what approach is suggested?", "opts": ["Delete every phase 2 selector so that all of the traffic is then encrypted automatically", "One selector with local and remote set to any subnet, filtering with firewall policies", "Create one selector per host so that each flow is matched individually", "Disable phase 2 completely and let the IKE SA carry the user traffic"], "a": 1, "rat": "The notes say if you don't want phase 2 selector filtering, create one selector with local and remote addresses set to any subnet and use firewall policies to control traffic.", "src": "Video · 25:00", "diff": "hard"}, {"n": 598, "ln": 69, "lesson": 11, "section": "Phase 2 Configuration", "topic": "Replay detection", "q": "Why is replay detection not included in the proposals presented to the peer?", "opts": ["It is a local setting", "It replaces Perfect Forward Secrecy", "It is supported only in IKEv2", "It must already match on both peers"], "a": 0, "rat": "The slide marks replay detection as a local setting, and the notes say it is therefore not included in the proposals presented during phase 2 negotiation.", "src": "Video · 26:15", "diff": "medium"}, {"n": 599, "ln": 70, "lesson": 11, "section": "Phase 2 Configuration", "topic": "Proposal impact", "q": "Besides determining the encryption algorithms, what does the phase 2 proposal impact?", "opts": ["The order of the firewall policy list", "Static route distance and route priority", "The DPD retry count and retry interval", "Performance and hardware offloading"], "a": 3, "rat": "The Phase 2 Proposal slide says the proposal impacts performance and hardware offloading.", "src": "Video · 26:15", "diff": "medium"}, {"n": 600, "ln": 71, "lesson": 11, "section": "Phase 2 Configuration", "topic": "Key lifetime Both", "q": "What does setting the phase 2 key lifetime to Both mean?", "opts": ["The SA expires on the time threshold, and volume is only logged", "The SA expires on the volume threshold, and time is only logged", "The SA expires when either the time or the volume threshold is reached", "The SA expires only once both thresholds have been reached together"], "a": 2, "rat": "The slide lists Both (whichever expires first); the notes say FortiGate tracks duration and traffic, and when any threshold is reached the SA expires.", "src": "Video · 27:30", "diff": "medium"}, {"n": 601, "ln": 72, "lesson": 11, "section": "Phase 2 Configuration", "topic": "Lifetime mismatch", "q": "The two peers have different phase 2 key lifetime thresholds. What happens?", "opts": ["The tunnel comes up, and the peers agree on the highest value offered", "The tunnel fails to come up with an error that no SA proposal was chosen", "The tunnel comes up, but it renegotiates its SAs every sixty seconds", "The tunnel still comes up, and the peers agree on the lowest value offered"], "a": 3, "rat": "The slide says key lifetime thresholds do not have to match for the tunnel to come up, and the notes say peers agree on the lowest threshold value offered.", "src": "Video · 27:30", "diff": "hard"}, {"n": 602, "ln": 73, "lesson": 11, "section": "Phase 2 Configuration", "topic": "Auto-negotiate", "q": "What is a benefit of enabling Auto-negotiate on phase 2?", "opts": ["The tunnel is brought up and kept up with no interesting traffic", "The tunnel comes up only when interesting traffic arrives", "The tunnel negotiates without needing any firewall policy", "The tunnel skips phase 1 and negotiates phase 2 directly"], "a": 0, "rat": "The notes say another benefit of Auto-negotiate is that the tunnel comes up and stays up automatically, even when there is no interesting traffic.", "src": "Video · 27:55", "diff": "medium"}, {"n": 603, "ln": 74, "lesso icit proxy, and transparent mode only"], "a": 2, "rat": "The slide lists route-based benefits: simpler operation and configuration, redundancy, and support for L2TP-over-IPsec, GRE-over-IPsec, and dynamic routing protocols.", "src": "Video · 30:25", "diff": "medium"}, {"n": 610, "ln": 81, "lesson": 11, "section": "Routing, Firewall Policies, and Redundancy", "topic": "add-route distance", "q": "With add-route enabled on a dial-up phase 1, what distance do the automatically added routes use by default?", "opts": ["15", "5", "0", "10"], "a": 0, "rat": "The Routes for IPsec VPNs slide says with add-route enabled (default) the default route distance is 15.", "src": "Video · 31:40", "diff": "medium"}, {"n": 611, "ln": 82, "lesson": 11, "section": "Routing, Firewall Policies, and Redundancy", "topic": "add-route destination", "q": "With add-route enabled on a dial-up phase 1, what is the destination of the automatically added static route?", "opts": ["The public IP address that the dial-up client used for phase 1", "The local network presented by the dial-up client during phase 2", "The subnet configured on the FortiGate's own physical WAN port", "The whole private address space, using a default route entry"], "a": 1, "rat": "The slide says static routes are added after phase 2 is up, and the destination is the local network presented by the dial-up client during phase 2 negotiation.", "src": "Video · 31:40", "diff": "hard"}, {"n": 612, "ln": 83, "lesson": 11, "section": "Routing, Firewall Policies, and Redundancy", "topic": "add-route disabled", "q": "When is it useful to disable add-route on a dial-up phase 1?", "opts": ["When hardware offloading is turned off", "When a dynamic routing protocol is in use", "When the tunnel has only a single phase 2", "When the remote peer has a static public IP"], "a": 1, "rat": "The slide says add-route disabled is useful when a dynamic routing protocol is used, which takes care of routing updates.", "src": "Video · 31:40", "diff": "me ual interface name", "q": "In firewall policies for an IPsec VPN, what name does the tunnel's virtual interface have?", "opts": ["The phase 2 selector name", "The remote gateway IP address", "The phase 1 name", "The physical WAN port name"], "a": 2, "rat": "The callout on the policy screenshots says Virtual interface matches phase 1 name (ToRemote).", "src": "Video · 32:05", "diff": "easy"}, {"n": 617, "ln": 88, "lesson": 11, "section": "Routing, Firewall Policies, and Redundancy", "topic": "Partial redundancy", "q": "What characterizes a partially redundant VPN?", "opts": ["Each peer has two tunnels that terminate on the same physical port", "Both peers have two connections, so both peers are fully fault tolerant", "Only one peer has two connections, so the other peer is not fault tolerant", "Neither peer has a backup link, but DPD reroutes traffic between them"], "a": 2, "rat": "The slide says partially redundant means one peer has two connections; the notes add the other peer terminates both VPNs on the same port, so the spoke is not fault tolerant.", "src": "Video · 32:55", "diff": "medium"}, {"n": 618, "ln": 89, "lesson": 11, "section": "Routing, Firewall Policies, and Redundancy", "topic": "Redundant VPN DPD", "q": "When configuring redundant VPNs, what is recommended for each phase 1?", "opts": ["Enable DPD on both ends", "Disable DPD on the backup", "Use the same phase 1 for both", "Set NAT-T to Forced on both"], "a": 0, "rat": "The Redundant VPN Configuration slide says add one phase 1 configuration for each tunnel and enable DPD on both ends.", "src": "Video · 33:45", "diff": "medium"}, {"n": 619, "ln": 90, "lesson": 11, "section": "Routing, Firewall Policies, and Redundancy", "topic": "Primary route selection", "q": "With static routes in a redundant VPN, how is the primary tunnel preferred over the backup?", "opts": ["Give the primary routes a higher distance value", "Put the primary tunnel first in the policy list", "Give the primary routes a lower distance or priority", "Assign the backup routes a blackhole interface"], "a": 2, "rat": "The slide says use distance or priority to select primary routes over backup; the diagram shows Distance=5 for primary and 10 for backup.", "src": "Video · 33:45", "diff": "easy"}, {"n": 620, "ln": 91, "lesson": 11, "section": "Monitoring and Troubleshooting", "topic": "IPsec monitor location", "q": "Where is the IPsec monitor widget found in the GUI?", "opts": ["Network > Interfaces > IPsec", "Log & Report > Events > VPN", "Dashboard > Network > IPsec", "VPN > IPsec Tunnels > Monitor"], "a": 2, "rat": "The IPsec Monitor Widget slide shows the path Dashboard > Network > IPsec.", "src": "Video · 34:35", "diff": "easy"}, {"n": 621, "ln": 92, "lesson": 11, "section": "Monitoring and Troubleshooting", "topic": "VPN up status", "q": "When does the IPsec monitor show a VPN as up?", "opts": ["When at least one of its phase 2 selectors is up", "As soon as the phase 1 configuration has been saved", "Whenever the incoming data counter is above zero", "Only when every one of its phase 2 selectors is up"], "a": 0, "rat": "The notes say ToRemote is up because at least one of its phase 2 selectors is up, and if all phase 2 selectors are down the VPN status is down.", "src": "Video · 34:35", "diff": "medium"}, {"n": 622, "ln": 93, "lesson": 11, "section": "Monitoring and Troubleshooting", "topic": "Bring Down options", "q": "Which Bring Down options does the IPsec monitor offer for a tunnel?", "opts": ["Entire Tunnel, a specific phase 2 selector, or All Phase 2 Selectors", "Disable Policy, Delete Route, or Remove the IPsec Interface", "Phase 1 only, Phase 2 only, or Reset Statistics for the selected tunnel", "Flush SAs, Clear Gateway, or Reboot the FortiGate device"], "a": 0, "rat": "The right-click menu shows Bring Down > Entire Tunnel, Phase 2 Selector: ToRemote, and All Phase 2 Selectors.", "src": "Video · 34:35", "diff": "medium"}, {"n": 623, "ln": 94, "lesson": 11, "section": "Monitoring and Troubleshooting", "topic": "Route appearance", "q": "When do IPsec routes appear in the routing table for each remote gateway type?", "opts": ["Static IP/DDNS after phase 2 comes up; Dialup user after phase 1 comes up", "Static IP/DDNS after phase 1 comes up; Dialup user after phase 2 comes up", "Both types only once the phase 2 selectors have all come up together", "Both types as soon as the phase 1 configuration is saved on FortiGate"], "a": 1, "rat": "The Monitor IPsec Routes slide says routes appear after phase 1 comes up for static IP or dynamic DNS, and after phase 2 comes up for dial-up user.", "src": "Video · 35:50", "diff": "hard"}, {"n": 624, "ln": 95, "lesson": 11, "section": "Monitoring and Troubleshooting", "topic": "Automatic phase 1", "q": "Why does phase 1 negotiation start automatically on a static IP tunnel?", "opts": ["DPD forces a new phase 1 negotiation once every minute", "The add-route setting triggers phase 1 negotiation at boot", "Autokey Keep Alive is always enabled on every phase 2 selector", "Automatic negotiation is enabled on phase 1 by default"], "a": 3, "rat": "The notes say phase 1 negotiation is started automatically because automatic negotiation is enabled on phase 1 by default.", "src": "Video · 35:50", "diff": "medium"}, {"n": 625, "ln": 96, "lesson": 11, "section": "Monitoring and Troubleshooting", "topic": "Tunnel details command", "q": "Which command shows traffic counters, negotiated quick mode selectors, and negotiated encryption for active tunnels?", "opts": ["get vpn ipsec tunnel details", "diagnose vpn tunnel up", "diagnose vpn tunnel flush", "diagnose vpn ike gateway clear"], "a": 0, "rat": "The IPsec Tunnel Details slide runs get vpn ipsec tunnel details; the notes say its output shows traffic counters, negotiated quick mode selectors, and negotiated encryption, authentication, and keys.", "src": "Video · 37:05", "diff": "medium"}, {"n": 626, "ln": 97, "lesson": 11, "section": "Monitoring and Troubleshooting", "topic": "NPU acceleration field", "q": "In the tunnel details output, what does the npu_acceleration line with encryption(outbound) and decryption(inbound) indicate?", "opts": ["The tunnel has failed over to its backup interface on the NPU", "The tunnel is using software encryption only, in both directions", "Only phase 1 traffic is being offloaded to the NP processor", "Hardware acceleration is handling both directions of the tunnel"], "a": 3, "rat": "The slide labels the npu_acceleration: encryption(outbound) decryption(inbound) line as Hardware acceleration.", "src": "Video · 37:05", "diff": "medium"}, {"n": 627, "ln": 98, "lesson": 11, "section": "Monitoring and Troubleshooting", "topic": "Gateway clear scope", "q": "What happens if diagnose vpn ike gateway clear is run without a phase 1 name?", "opts": ["The command fails and asks for a name", "All phase 1s in all VDOMs are cleared", "Only the most recent phase 1 is cleared", "Only phase 2 SAs in the root VDOM clear"], "a": 1, "rat": "The notes warn the command has a global effect: running it without specifying the phase 1 name results in all phase 1s of all VDOMs being cleared.", "src": "Video · 37:30", "diff": "hard"}, {"n": 628, "ln": 99, "lesson": 11, "section": "Monitoring and Troubleshooting", "topic": "Gateway direction", "q": "In diagnose vpn ike gateway list output, what does the direction field indicate?", "opts": ["Whether NAT traversal is enabled or disabled for it", "Whether traffic is inbound or outbound on the WAN port", "Whether this gateway is the initiator or the responder", "Whether the tunnel uses tunnel mode or transport mode"], "a": 2, "rat": "The callout next to direction: initiator asks: Is this gateway an initiator or responder?", "src": "Video · 37:30", "diff": "easy"}, {"n": 629, "ln": 100, "lesson": 11, "section": "Monitoring and Troubleshooting", "topic": "No SA proposal chosen", "q": "The IKE debug shows 'no SA proposal chosen'. What is the common cause?", "opts": ["A route that is missing or points to the wrong device", "NAT being enabled on the VPN firewall policy", "An ISP issue that is causing DPD packets to be lost", "An IPsec configuration mismatch between the peers"], "a": 3, "rat": "The Common IPsec Problems table lists 'Error: no SA proposal chosen' with the cause IPsec configuration mismatch and the solution to verify phase 1 and phase 2 configurations.", "src": "Video · 37:55", "diff": "medium"}, {"n": 630, "ln": 101, "lesson": 11, "section": "Monitoring and Troubleshooting", "topic": "Unstable tunnel", "q": "A tunnel is unstable and DPD packets are being lost. What is the likely cause and remedy?", "opts": ["A proposal mismatch; verify the phase 1 and phase 2 settings on both peers", "A policy issue; disable NAT on the VPN firewall policy for the tunnel", "A selector issue; verify that the quick mode selectors are configured correctly", "An ISP issue; check the internet connection or enable NAT-Traversal"], "a": 3, "rat": "The table lists Tunnel is unstable / DPD packet lost / ISP issue, with solutions Check internet connection and Enable NAT-Traversal.", "src": "Video · 37:55", "diff": "medium"}, {"n": 631, "ln": 102, "lesson": 11, "section": "Monitoring and Troubleshooting", "topic": "NAT on VPN policy", "q": "A tunnel is up but traffic doesn't pass, and NAT turns out to be the cause. What is the listed fix?", "opts": ["Add a second phase 2 selector for NAT", "Set NAT traversal to Forced on phase 1", "Enable NAT on the VPN firewall policy", "Disable NAT on the VPN firewall policy"], "a": 3, "rat": "The table lists NAT is enabled as a cause for tunnel up but traffic not passing, with the solution Disable NAT on the VPN firewall policy.", "src": "Video · 37:55", "diff": "medium"}, {"n": 632, "ln": 103, "lesson": 11, "section": "Monitoring and Troubleshooting", "topic": "Debug tool choice", "q": "A tunnel is up but traffic isn't passing through it. Which tool is suggested for investigating?", "opts": ["The IKE real-time debug", "The debug eered over low-cost fast internet links more than high-cost slow private links.", "src": "Video · 0:50", "diff": "medium"}, {"n": 636, "ln": 4, "lesson": 12, "section": "SD-WAN Concepts and Use Cases", "topic": "MPLS role", "q": "In a hybrid WAN, how are private links such as MPLS typically used?", "opts": ["For critical traffic only, or as failover links", "For bulk web browsing from all users", "Only for FortiGuard update downloads", "Only to run bandwidth speed tests"], "a": 0, "rat": "The notes state private links such as MPLS are often used to steer critical traffic only, or as failover links for high availability.", "src": "Video · 0:50", "diff": "easy"}, {"n": 637, "ln": 5, "lesson": 12, "section": "SD-WAN Concepts and Use Cases", "topic": "Congestion", "q": "During WAN congestion, which FortiGate capability lets SD-WAN favor sensitive and critical applications?", "opts": ["Link aggregation", "Session helpers", "Traffic shaping", "Central NAT"], "a": 2, "rat": "The notes say that during congestion you can leverage traffic shaping to prioritize sensitive and critical applications.", "src": "Video · 0:50", "diff": "easy"}, {"n": 638, "ln": 6, "lesson": 12, "section": "SD-WAN Concepts and Use Cases", "topic": "DIA routing", "q": "What routing approach does a typical direct internet access (DIA) SD-WAN design use?", "opts": ["Static default routes", "OSPF between all branch sites", "RIP toward each internet provider", "Policy routes with no default route"], "a": 0, "rat": "The DIA slide lists static default routing under typical operation.", "src": "Video · 2:05", "diff": "easy"}, {"n": 639, "ln": 7, "lesson": 12, "section": "SD-WAN Concepts and Use Cases", "topic": "DIA BGP", "q": "When might BGP be run between the ISP and the FortiGate in a DIA deployment?", "opts": ["When the site has only a single internet link", "When the FortiGate has no default route at all", "When the site must advertise a public IP prefix", "When traffic shaping is turned off on the links"], "a": 2, "rat": "The notes say BGP is used in some cases, especially if the site must advertise a public IP prefix.", "src": "Video · 2:05", "diff": "medium"}, {"n": 640, "ln": 8, "lesson": 12, "section": "SD-WAN Concepts and Use Cases", "topic": "Link speeds", "q": "How can a FortiGate set the upstream and downstream speed of each DIA link automatically?", "opts": ["It polls the ISP router for line speed over SNMP", "It runs speed tests against FortiGuard", "It copies the negotiated Ethernet speed of each port", "It derives the speed from ping latency to the gateway"], "a": 1, "rat": "The notes say FortiGate can use the SD-WAN bandwidth monitoring service to run speed tests against FortiGuard and adjust link speeds from the results.", "src": "Video · 2:05", "diff": "medium"}, {"n": 641, "ln": 9, "lesson": 12, "section": "SD-WAN Concepts and Use Cases", "topic": "DIA example", "q": "A site has two internet links and steers critical cloud applications over the best-performing one. In a typical DIA design, which traffic goes on the low-cost link?", "opts": ["Critical cloud applications", "Site-to-site corporate traffic", "Web surfing", "Hub-to-spoke routing updates"], "a": 2, "rat": "The example uses the best-performing link for critical applications and the low-cost link for web surfing.", "src": "Video · 2:05", "diff": "easy"}, {"n": 642, "ln": 10, "lesson": 12, "section": "SD-WAN Concepts and Use Cases", "topic": "Overlay term", "q": "In SD-WAN terminology, what is an overlay link?", "opts": ["A physical ISP circuit", "A VLAN subinterface", "A tunnel", "An aggregated LAG link"], "a": 2, "rat": "The site-to-site slide defines overlay as tunnels and underlay as physical links; the member table lists VLAN and LAG as underlay.", "src": "Video · 2:55", "diff": "easy"}, {"n": 643, "ln": 11, "lesson": 12, "section": "SD-WAN Concepts and Use Cases", "topic": "Site-to-site design", "q": "What is the typical design for steering site-to-site corporate traffic with SD-WAN?", "opts": ["Hub-and-spoke with dynamic IPsec overlays and dynamic routing", "Full mesh of static GRE tunnels with only static routes", "Direct internet access with no tunnels between sites", "Single MPLS underlay with policy routes and no overlays"], "a": 0, "rat": "The site-to-site slide lists hub-and-spoke topologies, dynamic IPsec tunnels for overlay, and dynamic routing.", "src": "Video · 2:55", "diff": "medium"}, {"n": 644, "ln": 12, "lesson": 12, "section": "SD-WAN Concepts and Use Cases", "topic": "Hub speed test", "q": "What does the hub FortiGate do with speed tests it runs against the spokes?", "opts": ["Picks which spoke will take over as the backup hub", "Applies the result as the tunnel upstream speed for shaping", "Calculates the IPsec phase 2 key lifetime per tunnel", "Assigns each tunnel to an SD-WAN zone automatically"], "a": 1, "rat": "The notes say the hub can run speed tests against spokes to find tunnel upstream speed, then apply it as the upstream speed for traffic shaping.", "src": "Video · 2:55", "diff": "hard"}, {"n": 645, "ln": 13, "lesson": 12, "section": "SD-WAN Concepts and Use Cases", "topic": "RIA purpose", "q": "Which is a reason to send branch internet traffic across overlays to the hub (remote internet access)?", "opts": ["To centralize inspection on the hub", "To skip all inspection on the hub", "To bypass the hub's firewall policies", "To remove the need for overlay links"], "a": 0, "rat": "The RIA slide lists centralizing inspection on the hub, improving performance if DIA is poor, and providing internet access if DIA is unavailable.", "src": "Video · 3:45", "diff": "easy"}, {"n": 646, "ln": 14, "lesson": 12, "section": "SD-WAN Concepts and Use Cases", "topic": "RIA inspection", "q": "In a typical remote internet access design, how is inspection split between sites?", "opts": ["Spokes inspect lightly; the hub inspects thoroughly", "Spokes inspect thoroughly; the hub does no inspection", "Every site does full inspection of the sa ", "topic": "Default zone", "q": "If you add a new SD-WAN member without assigning a user-defined zone, where does FortiGate place it?", "opts": ["In a new zone named after the interface", "In no zone until a zone is created", "In the underlay zone automatically", "In the predefined virtual-wan-link zone"], "a": 3, "rat": "The notes say FortiGate creates the virtual-wan-link zone by default and places any new member there if you do not assign it to a user-defined zone.", "src": "Video · 7:30", "diff": "easy"}, {"n": 651, "ln": 19, "lesson": 12, "section": "Members, Zones, and Performance SLAs", "topic": "Zones GUI", "q": "Where in the GUI do you view and create SD-WAN zones and their members?", "opts": ["System > Interfaces > Zone Settings", "Policy & Objects > Addresses > Zones", "Network > Static Routes > SD-WAN", "Network > SD-WAN > SD-WAN Zones"], "a": 3, "rat": "The members and zones slide shows the Network > SD-WAN > SD-WAN Zones page.", "src": "Video · 7:30", "diff": "easy"}, {"n": 652, "ln": 20, "lesson": 12, "section": "Members, Zones, and Performance SLAs", "topic": "Underlay traits", "q": "Which pair of characteristics describes underlay links?", "opts": ["Restricted routing and no added security", "Flexible routing and enhanced security", "Flexible routing and no added security", "Restricted routing and enhanced security"], "a": 0, "rat": "The underlay and overlay slide lists restricted routing and no added security for underlay, and flexible routing and enhanced security for overlay.", "src": "Video · 10:00", "diff": "medium"}, {"n": 653, "ln": 21, "lesson": 12, "section": "Members, Zones, and Performance SLAs", "topic": "Overlay types", "q": "Which of these is supported as an overlay SD-WAN member?", "opts": ["VLAN", "LAG interface", "GRE tunnel", "FortiExtender"], "a": 2, "rat": "The supported members table lists IPsec (including ADVPN), GRE, and IP-in-IP as overlay; VLAN, LAG, and FortiExtender are underlay.", "src": "Video · 10:00", "diff": "easy"}, ontain at least two members", "It can hold only overlay tunnel interfaces", "It is removed once a user-defined zone exists", "It cannot be deleted"], "a": 3, "rat": "The SD-WAN Zones slide lists the default zone virtual-wan-link with the note that it can't be deleted.", "src": "Video · 11:15", "diff": "easy"}, {"n": 658, "ln": 26, "lesson": 12, "section": "Members, Zones, and Performance SLAs", "topic": "Zone policies", "q": "What is a benefit of applying firewall policies to SD-WAN zones?", "opts": ["Firewall policies are no longer needed for overlay traffic", "Each member gets its own copy of every security profile", "NAT is automatically disabled for all zone members", "Less administrative overhead and a cleaner configuration"], "a": 3, "rat": "The slide lists performing different actions on multiple members, reducing administrative overhead, and cleaner configuration.", "src": "Video · 11:15", "diff": "easy"}, {"n": 659, "ln": 27, "lesson": 12, "section": "Members, Zones, and Performance SLAs", "topic": "Zone example", "q": "A branch FortiGate has an overlay zone toward HQ and an underlay zone toward the public cloud. How are the underlay zone's firewall policies typically configured?", "opts": ["Basic filtering and inspection, with NAT disabled", "Strict filtering and inspection, with NAT enabled", "No filtering at all, with NAT enabled", "Basic filtering only, with NAT disabled"], "a": 1, "rat": "The diagram labels the underlay zone with firewall policies using strict filtering and inspection and NAT enabled; the overlay zone uses basic filtering and NAT disabled.", "src": "Video · 11:40", "diff": "medium"}, {"n": 660, "ln": 28, "lesson": 12, "section": "Members, Zones, and Performance SLAs", "topic": "Alive/dead", "q": "Which health monitoring method can determine whether a member is alive or dead?", "opts": ["Passive monitoring only", "Active monitoring only", "Both active and passive equally", "Neither; the routing table decides"], "a": 1, "rat": "The notes er traffic.", "src": "Video · 5:25", "diff": "medium"}, {"n": 669, "ln": 37, "lesson": 12, "section": "SD-WAN Rules and Rule Lookup", "topic": "Preferred members", "q": "What are preferred members in an SD-WAN rule?", "opts": ["Members that carry the highest traffic volume right now", "Best alive members in the zone per the strategy", "Members manually pinned so they ignore SLA results", "Members that belong to the virtual-wan-link zone"], "a": 1, "rat": "The notes define preferred members as the best alive members in a zone based on the strategy in use.", "src": "Video · 5:25", "diff": "medium"}, {"n": 670, "ln": 38, "lesson": 12, "section": "SD-WAN Rules and Rule Lookup", "topic": "Selected member", "q": "In the rules list, the Corp rule shows T_INET and T_MPLS with a checkmark next to T_MPLS. What does the checkmark mean?", "opts": ["T_MPLS is the member currently selected", "T_MPLS has failed its SLA target", "T_MPLS is excluded from the rule", "T_MPLS is waiting for health probes"], "a": 0, "rat": "The callout labels the checkmark as Selected member; the notes say T_MPLS is the selected member using latency criteria.", "src": "Video · 5:50", "diff": "medium"}, {"n": 671, "ln": 39, "lesson": 12, "section": "SD-WAN Rules and Rule Lookup", "topic": "Evaluation order", "q": "How does FortiGate evaluate user-defined SD-WAN rules?", "opts": ["Top to bottom; the first match applies", "Bottom to top; the last match applies", "The most specific match wins anywhere", "All matching rules are merged together"], "a": 0, "rat": "The SD-WAN Rules (Contd) slide says rules are evaluated in descending order and the first match applies.", "src": "Video · 6:40", "diff": "easy"}, {"n": 672, "ln": 40, "lesson": 12, "section": "SD-WAN Rules and Rule Lookup", "topic": "Rules vs policy", "q": "A packet matches an SD-WAN rule. What else must be in place for the traffic to pass?", "opts": ["A firewall policy that allows the traffic", "A policy route pointing to the same member", "A secon eration modes can a FortiGate HA cluster run in?", "opts": ["Transparent and NAT/route", "Unicast and multicast heartbeat", "Active-active and active-passive", "Load-balancing and failover-only"], "a": 2, "rat": "The notes say there are two HA operation modes available: active-active and active-passive.", "src": "Video · 0:25", "diff": "easy"}, {"n": 720, "ln": 3, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Active-passive traffic", "q": "How is traffic handled in an active-passive FortiGate cluster under normal conditions?", "opts": ["Every member processes traffic and the primary shares out sessions", "Secondaries process traffic while the primary only monitors them", "The primary handles all traffic; secondaries wait on standby", "Each member handles traffic for its own subset of VLANs"], "a": 2, "rat": "The Active-Passive HA slide shows callouts: only the primary processes traffic and all secondary devices are on standby.", "src": "Video · 1:15", "diff": "easy"}, {"n": 721, "ln": 4, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Secondary failure (A-P)", "q": "In active-passive mode, how does the primary react when one of the secondary FortiGate devices fails?", "opts": ["It triggers a failover so that another member becomes the new primary", "It shuts down the heartbeat links until an administrator intervenes", "It permanently removes the failed unit's configuration from the cluster", "It drops the unit from its available list and waits for it to return"], "a": 3, "rat": "The notes explain that if a secondary fails, the primary updates its list of available secondaries and starts monitoring for the failed secondary to come online again.", "src": "Video · 1:15", "diff": "medium"}, {"n": 722, "ln": 5, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "HA failover definition", "q": "What event does FortiGate documentation refer to as an HA failover?", "opts": ["A secondary a odel and firmware but have different license levels. What does the cluster do?", "opts": ["It runs with the lowest-level license of all members", "It applies the highest-level license available", "It applies each member's own license separately", "It applies the primary's license to all members"], "a": 0, "rat": "The HA Requirements slide lists licensing as a must-match item, with the sub-point that if licenses differ, the cluster uses the lowest-level license.", "src": "Video · 2:30", "diff": "medium"}, {"n": 726, "ln": 9, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Membership requirements", "q": "Which item is NOT on the list of attributes that all HA cluster members must share?", "opts": ["Hard drive configuration", "Firmware version", "Host name", "Operating mode (management VDOM)"], "a": 2, "rat": "The HA Requirements slide lists model, firmware version, licensing, hard drive configuration and operating mode (management VDOM). Host name is not required to match (it is even listed elsewhere as not synchronized).", "src": "Video · 2:30", "diff": "medium"}, {"n": 727, "ln": 10, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "DHCP and PPPoE interfaces", "q": "What is the recommended handling of DHCP or PPPoE interfaces while a cluster is first being set up?", "opts": ["Leave them dynamic so each member obtains its own separate address", "Make them static for setup, then revert after the cluster forms", "Use them as heartbeat interfaces until the initial setup is finished", "Delete them entirely and re-create them after the cluster has formed"], "a": 1, "rat": "Best practice on the HA Requirements slide is to initially switch DHCP and PPPoE interfaces to static configuration; the notes add this prevents incorrect address assignment and you can revert after the cluster forms.", "src": "Video · 2:30", "diff": "medium"}, {"n": 728, "ln": 11, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Heartbeat priority", "q": "An HA configuration contains set hbdev \"port3\" 10 \"port4\" 20. Which heartbeat interface does the cluster prefer?", "opts": ["port4, since its priority value of 20 is the higher one", "port3, since a lower value means a higher preference", "port3, since it appears first in the heartbeat list", "Neither; both links share heartbeat traffic equally"], "a": 0, "rat": "The notes for the HA Requirements slide explain that port3 has priority 10 and port4 priority 20, making port4 the preferred interface.", "src": "Video · 2:30", "diff": "hard"}, {"n": 729, "ln": 12, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Setup parameters", "q": "Which set of settings must be identical on every FortiGate that will join the same cluster?", "opts": ["Group ID and name, HA password, and heartbeat interface settings", "Management IP addresses and the default gateway routes for each unit", "Serial numbers and the FortiGuard subscription contracts", "Host names, HA device priorities and HA override settings"], "a": 0, "rat": "Under Setup, the HA Requirements slide lists the same HA group ID, group name, password and heartbeat interface settings.", "src": "Video · 2:30", "diff": "easy"}, {"n": 730, "ln": 13, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Redundant heartbeats", "q": "Why is it a best practice to configure at least two heartbeat interfaces?", "opts": ["If one heartbeat link fails, the cluster moves on to the next one", "It doubles the bandwidth available for session synchronization", "FGCP needs one heartbeat interface for each member in the cluster", "Each heartbeat link carries a different category of HA messages"], "a": 0, "rat": "The notes say two heartbeat interfaces give redundancy: if one heartbeat link fails, the cluster uses the next one according to priority and position in the list.", "src": "Video · 2:30", "diff": "easy"}, {"n": 731, "ln": 14, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Election order, override disabled", "q": "With HA override disabled, in what order are the primary election criteria compared?", "opts": ["Priority, connected monitored ports, HA uptime, serial number", "HA uptime, priority, connected monitored ports, serial number", "Connected monitored ports, HA uptime, priority, serial number", "Connected monitored ports, priority, HA uptime, serial number"], "a": 2, "rat": "The Override Disabled flowchart goes: connected monitored ports, then HA uptime, then priority, then serial number.", "src": "Video · 3:45", "diff": "hard"}, {"n": 732, "ln": 15, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Default override", "q": "What is the default state of the HA override setting on FortiGate?", "opts": ["Enabled", "Disabled", "Enabled only in active-active mode", "Enabled once monitored ports are set"], "a": 1, "rat": "The election slide states: Override disabled (default).", "src": "Video · 3:45", "diff": "easy"}, {"n": 733, "ln": 16, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Forcing failover, override disabled", "q": "Override is disabled. Which command lets you force a failover?", "opts": ["diagnose sys ha checksum recalculate", "diagnose sys ha reset-uptime", "execute ha manage 0 admin", "diagnose sys ha dump-by vcluster"], "a": 1, "rat": "Under Force a failover, the Override Disabled slide shows the command diagnose sys ha reset-uptime.", "src": "Video · 3:45", "diff": "medium"}, {"n": 734, "ln": 17, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "reset-uptime scope", "q": "What does running diagnose sys ha reset-uptime actually reset?", "opts": ["Both the HA uptime and the system uptime counters", "The system uptime, which forces the unit to reboot", "Only the HA uptime; system uptime is unchanged", "The reset_cnt value stored for every cluster member"], "a": 2, "rat": "The notes stress that diagnose sys ha reset-uptime resets the HA uptime and not the system uptime.", "src": "Video · 3:45", "diff": "medium"}, {"n": 735, "ln": 18, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Reading dump-by vcluster", "q": "diagnose sys ha dump-by vcluster shows FGVMxx92 uptime/reset_cnt=7814/0 and FGVMxx93 uptime/reset_cnt=0/1. What can you conclude?", "opts": ["Unit 93 has had its HA uptime reset 7,814 times so far", "Unit 92's HA uptime is 7,814 seconds higher than unit 93's", "Unit 92's HA uptime has been reset exactly one time", "Unit 93's HA uptime is 7,814 seconds higher than 92's"], "a": 1, "rat": "Callouts show the uptime difference is in seconds, 0 marks the device with the lowest HA uptime, and reset_cnt is the number of HA uptime resets. The notes say the device ending in 92 has an HA uptime 7814 seconds higher.", "src": "Video · 4:35", "diff": "hard"}, {"n": 736, "ln": 19, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "HA uptime reset triggers", "q": "Besides the reset-uptime command, which events reset a member's HA uptime to 0?", "opts": ["An administrator making a configuration change on a secondary", "An incremental configuration sync arriving over the heartbeat", "A monitored interface failing or the member rebooting", "The member receiving a gratuitous ARP from the new primary"], "a": 2, "rat": "The notes state that if a monitoring interface fails or a member reboots, the HA uptime for that member is reset to 0.", "src": "Video · 4:35", "diff": "medium"}, {"n": 737, "ln": 20, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Election with override enabled", "q": "With HA override enabled, which criterion is compared right after the number of connected monitored ports?", "opts": ["HA uptime", "Serial number", "Device priority", "System uptime"], "a": 2, "rat": "The Override Enabled flowchart goes: connected monitored ports, then priority, then HA uptime, then serial number.", "src": "Video · 5:00", "diff": "medium"}, {"n": 738, "ln": 21, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Failover with override enabled", "q": "Override is enabled. What is the easiest way to trigger a failover?", "opts": ["Unplug every heartbeat cable between the cluster members", "Run diagnose sys ha reset-uptime on whichever unit is currently primary", "Adjust HA priorities, raising a secondary's or lowering the primary's", "Reboot each secondary so its HA uptime returns to zero"], "a": 2, "rat": "The slide says Force a failover: change the HA priority; the notes explain you can increase a secondary's priority or decrease the primary's.", "src": "Video · 5:00", "diff": "medium"}, {"n": 739, "ln": 22, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Override and priority sync", "q": "Are the HA override setting and device priority synchronized across cluster members?", "opts": ["Yes; both values are copied from the primary automatically", "Only priority is synced; override stays local to each member", "Only override is synced; priority stays local to each member", "No; enable override and set priority on each member"], "a": 3, "rat": "The notes for the Override Enabled slide say the override setting and device priority values are not synchronized; you must manually enable override and adjust priority on each member.", "src": "Video · 5:00", "diff": "medium"}, {"n": 740, "ln": 23, "lesson": 13, "section": "HA Operation Modes and Primary Election", "topic": "Override behavior", "q": "With override enabled, what happens when a higher-priority former primary becomes available again after an outage?", "opts": ["It rejoins as a secondary and stays that way until the next manual failover", "It stays out of the cluster until an administrator re-adds it", "It splits the traffic evenly with the unit that replaced it", "It reclaims the primary role from the unit that temporarily replaced it"], "a": 3, "rat": "The notes explain that with override enabled, when the primary becomes available again it takes its primary role back from the secondary that temporarily replaced it.", "src": "Video · 5:00", "diff": "medium"}, {"n": 741, "ln": 24, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "Synchronized operation data", "q": "Which item does the primary FortiGate synchronize to the other cluster members as operation-related data?", "opts": ["FortiGuard web filtering cache", "IPsec tunnel SAs", "The HA device priority value", "The FortiGate host name"], "a": 1, "rat": "The Primary FortiGate Tasks slide lists configuration, FIB entries, DHCP leases, ARP table, FortiGuard definitions, IPsec tunnel SAs and sessions. Host name, HA priority and caches are not synchronized.", "src": "Video · 6:15", "diff": "medium"}, {"n": 742, "ln": 25, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "Session synchronization", "q": "Under what condition are sessions synchronized from the primary to the secondary members?", "opts": ["Only for sessions that terminate on the FortiGate itself", "Always, because sessions sync automatically with the config", "Only when the cluster is running in active-active mode", "When session synchronization has been explicitly turned on"], "a": 3, "rat": "The slide lists Sessions (must be enabled); the notes say you can optionally configure the primary to synchronize qualifying sessions.", "src": "Video · 6:15", "diff": "medium"}, {"n": 743, "ln": 26, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "Active-active-only primary task", "q": "Which task does the primary FortiGate perform only when the cluster runs in active-active mode?", "opts": ["Broadcasting hello packets to discover members", "Synchronizing FIB entries to the secondaries", "Distributing sessions to the secondary members", "Synchronizing DHCP leases to the secondaries"], "a": 2, "rat": "The Primary FortiGate Tasks slide lists, under In active-active mode only: distributes sessions to secondary members.", "src": "Video · 6:15", "diff": "easy"}, {"n": 744, "ln": 27, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "Hello packets", "q": "Why do both primary and secondary FortiGate devices broadcast hello packets?", "opts": ["To copy session tables to the secondaries", "To discover and monitor the other members", "To tell switches which vMAC is now active", "To carry incremental configuration changes"], "a": 1, "rat": "Both task slides start with: Broadcasts hello packets for member discovery and monitoring.", "src": "Video · 7:05", "diff": "easy"}, {"n": 745, "ln": 28, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "Where to make changes", "q": "In a synchronized cluster, where is it recommended to make configuration changes, and why?", "opts": ["On the primary, so changes are not lost if members have sync problems", "On any member, because every change always reaches all members", "On the lowest-priority member, so changes propagate up the cluster", "On a secondary, so that the primary's CPU stays free for traffic"], "a": 0, "rat": "The notes say changes on any member of an in-sync cluster propagate, but it is recommended to make changes on the primary to prevent loss of changes if there are synchronization issues.", "src": "Video · 7:05", "diff": "medium"}, {"n": 746, "ln": 29, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "Electing a new primary", "q": "When the primary FortiGate fails, which devices determine the new primary?", "opts": ["The secondary devices, which elect one among themselves", "The failed primary, which names its successor beforehand", "The administrator, who must promote a unit by hand", "The upstream switch, based on the first gratuitous ARP"], "a": 0, "rat": "The Secondary FortiGate Tasks slide states: monitors the health of the primary; if the primary fails, the secondary devices elect a new primary.", "src": "Video · 7:05", "diff": "easy"}, {"n": 747, "ln": 30, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "Secondary role in active-active", "q": "What do secondary FortiGate devices do with traffic in an active-active cluster?", "opts": ["Stay idle and only take traffic after a failover event", "Process whatever traffic the primary distributes to them", "Only synchronize configuration and never handle traffic", "Process only the sessions they initiated on their own"], "a": 1, "rat": "The slide says in active-active mode only, secondaries process traffic distributed by the primary; the notes add they don't wait passively.", "src": "Video · 7:05", "diff": "easy"}, {"n": 748, "ln": 31, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "Complete synchronization", "q": "A new secondary joins the cluster. What does the primary do to synchronize the configuration?", "opts": ["Always uploads its full configuration whatever the checksums show", "Downloads the new member's configuration and merges it into its own running configuration", "Sends only the changes it has made since its own last reboot", "Compares configuration checksums and sends its full configuration if they differ"], "a": 3, "rat": "The HA Complete Configuration Synchronization slide shows: 1. new secondary added; 2. the primary compares its configuration checksum against the new secondary's and, if different, sends its configuration.", "src": "Video · 7:30", "diff": "medium"}, {"n": 749, "ln": 32, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "Incremental synchronization", "q": "After the initial sync, an administrator creates a new firewall address object on a cluster member. What is sent to the other members?", "opts": ["Only that object, over the heartbeat link", "Just a checksum, so others can request the config", "Nothing until the next scheduled full resync", "The full configuration file, to each secondary"], "a": 0, "rat": "The notes for the incremental sync slide say the change is sent to all other members over the HA heartbeat link; for a new firewall address object the primary sends only the new object, not the complete configuration.", "src": "Video · 7:55", "diff": "medium"}, {"n": 750, "ln": 33, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "Incremental sync direction", "q": "In which direction does incremental configuration synchronization work?", "opts": ["Only from secondaries toward the primary, which then stores them", "Only from the primary toward the secondaries, never in the reverse direction", "Changes made on either the primary or a secondary reach the other members", "Only between secondaries, with the primary excluded from the sync"], "a": 2, "rat": "The incremental sync slide shows both callouts: primary configuration changed and synced to the secondary, and secondary configuration changed and synced to the primary.", "src": "Video · 7:55", "diff": "medium"}, {"n": 751, "ln": 34, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "Not synchronized items", "q": "Which of these is NOT synchronized between cluster members?", "opts": ["FIB entries", "IPsec tunnel SAs", "GUI dashboard widgets", "Firewall address objects"], "a": 2, "rat": "The What Is Not Synchronized slide lists GUI dashboard widgets. FIB entries and IPsec SAs are synced operation data, and firewall address objects are part of the synced configuration.", "src": "Video · 8:45", "diff": "easy"}, {"n": 752, "ln": 35, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "License exception", "q": "Licenses are generally not synchronized. Which license type is the exception?", "opts": ["FortiToken licenses (serial numbers)", "FortiCloud account activation license", "FortiGuard subscription licenses", "FortiClient endpoint licensing"], "a": 0, "rat": "The slide lists FortiGuard, FortiCloud activation and FortiClient licensing as not synchronized; the notes say all licenses except FortiToken licenses (serial numbers) are not synchronized.", "src": "Video · 8:45", "diff": "hard"}, {"n": 753, "ln": 36, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "Ping server priority", "q": "Is the ha-priority value set for a ping server or dead gateway detection synchronized to other members?", "opts": ["Yes; it is copied along with all routing settings", "Only when the cluster runs in active-active mode", "Only once HA override is enabled on every member", "No; the value stays local to each individual member"], "a": 3, "rat": "Ping server HA priorities, meaning the ha-priority setting for a ping server or dead gateway detection configuration, appear on the What Is Not Synchronized slide.", "src": "Video · 8:45", "diff": "medium"}, {"n": 754, "ln": 37, "lesson": 13, "section": "HA Cluster Synchronization", "topic": "Cache data", "q": "Which data is left out of cluster synchronization?", "opts": ["The ARP table built up by the primary unit", "Web filter, email filter and web caches", "DHCP leases handed out by the primary unit", "FortiGuard definitions held by the primary"], "a": 1, "rat": "Cache (FortiGuard Web Filtering and email filter, web cache) is on the not-synchronized list, while ARP table, DHCP leases and FortiGuard definitions are synchronized by the primary.", "src": "Video · 8:45", "diff": "medium"}, {"n": 755, "ln": 38, "lesson": 13, "section": "HA Failover", "topic": "Device failover", "q": "What condition triggers a device failover?", "opts": ["The link on one or more monitored interfaces goes down", "FortiOS finds extended filesystem errors on an SSD", "Primary memory use passes the configured threshold", "The secondaries stop receiving hello packets from the primary"], "a": 3, "rat": "The Failover Protection slide defines device failover as the secondary devices no longer receiving hello packets from the primary.", "src": "Video · 10:25", "diff": "easy"}, {"n": 756, "ln": 39, "lesson": 13, "section": "HA Failover", "topic": "Remote link failover", " t emails", "The Throughput column on the System > HA page", "The output of diagnose sys ha checksum cluster", "The reset_cnt field of diagnose sys ha dump-by"], "a": 0, "rat": "The Failover Protection slide says to identify the failover protection type by looking at event logs, SNMP traps and alert emails, which record failover events.", "src": "Video · 10:25", "diff": "medium"}, {"n": 760, "ln": 43, "lesson": 13, "section": "HA Failover", "topic": "Session pickup limits", "q": "Session pickup is enabled. Which sessions still cannot be handed off to the new primary after a failover?", "opts": ["TCP sessions passing through the cluster toward internal servers", "Sessions between internal clients and hosts on the internet", "Sessions whose FIB entries were synchronized before the failover", "Sessions ending on the FortiGate, such as SSL VPN or proxy sessions"], "a": 3, "rat": "The notes say sessions that terminate at the FortiGate itself, such as SSL VPN and proxy sessions, cannot be handed off and must be restarted on the new primary.", "src": "Video · 10:25", "diff": "hard"}, {"n": 761, "ln": 44, "lesson": 13, "section": "HA Failover", "topic": "Virtual MAC assignment", "q": "Which statement about virtual MAC addresses in a FortiGate cluster is correct?", "opts": ["Heartbeat interfaces do not get virtual MACs", "Virtual MAC addresses are given only to the heartbeat interfaces", "The reserved HA management interface takes on a virtual MAC", "Each member uses its own virtual MACs, which change at failover"], "a": 0, "rat": "The Virtual MAC slide says each interface on the primary gets a virtual MAC, but HA heartbeat interfaces are not assigned one; the new primary adopts the same vMACs.", "src": "Video · 11:40", "diff": "medium"}, {"n": 762, "ln": 45, "lesson": 13, "section": "HA Failover", "topic": "Gratuitous ARP", "q": "After a failover, how does the network learn that the virtual MACs are now reached through a different FortiGate?", "opts": ["The former primary sends a MAC withdrawal message", "The new primary broadcasts gratuitous ARP packets", "Switches flush their tables when the heartbeat stops", "The secondaries send DHCP releases for each address"], "a": 1, "rat": "The slide callout states that after failover, gratuitous ARP informs the network that the virtual MAC is now reachable through a different FortiGate; the notes say the new primary broadcasts it.", "src": "Video · 11:40", "diff": "easy"}, {"n": 763, "ln": 46, "lesson": 13, "section": "HA Failover", "topic": "Reserved management MAC", "q": "What MAC address does a reserved HA management interface use?", "opts": ["Its original MAC address", "The cluster's virtual MAC for that port", "A random MAC generated at each failover", "The heartbeat interface's virtual MAC"], "a": 0, "rat": "The notes for the Virtual MAC slide say the MAC of a reserved HA management interface is not changed to a virtual MAC; it keeps its original MAC address.", "src": "Video · 11:40", "diff": "medium"}, {"n": 764, "ln": 47, "lesson": 13, "section": "Monitoring and Management", "topic": "GUI HA page", "q": "In the GUI, where do you view the table listing each member's sync status, priority, role, uptime and sessions?", "opts": ["Network > Interfaces", "System > HA", "Log & Report > System Events", "Policy & Objects > Firewall Policy"], "a": 1, "rat": "The Checking the HA Status on the GUI slide labels the member table System > HA, with Status, Priority, Hostname, Serial No., Role, System Uptime, Sessions and Throughput columns.", "src": "Video · 12:55", "diff": "easy"}, {"n": 765, "ln": 48, "lesson": 13, "section": "Monitoring and Management", "topic": "Removing a member", "q": "What operation mode does a FortiGate get when you remove it from the cluster on the HA page?", "opts": ["Standalone", "Transparent mode", "Factory default with config erased", "Active-passive secondary"], "a": 0, "rat": "The notes say that when you remove a device from HA, its operation mode is set to standalone.", "src": "Video · 12:55", "diff": "medium"}, {"n": 766, "ln": 49, "lesson": 13, "section": "Monitoring and Management", "topic": "Extra HA columns", "q": "On the HA page, how can you also show each member's checksum, CPU and memory usage?", "opts": ["Add more columns from the column selection menu", "Open the Edit dialog and turn on detailed statistics", "Click Pin interface faceplate on the toolbar", "Add the HA Status widget to the HA page itself"], "a": 0, "rat": "The slide shows a Select Columns menu with the callout More columns available (Checksum, CPU, RAM and others); the notes mention enabling more columns such as checksum, CPU and memory.", "src": "Video · 12:55", "diff": "medium"}, {"n": 767, "ln": 50, "lesson": 13, "section": "Monitoring and Management", "topic": "HA Status widget", "q": "Where does the HA Status widget, which summarizes mode, group, primary and secondary, appear?", "opts": ["In the System > Settings page", "In the Log & Report > Events page", "In the Network > Interfaces list", "On the Dashboard"], "a": 3, "rat": "The slide shows Dashboard > Status with the HA Status widget (Mode Active-Passive, Group, Primary, Secondary, Uptime, State Changed); the notes say you can add it on the Dashboard page.", "src": "Video · 12:55", "diff": "easy"}, {"n": 768, "ln": 51, "lesson": 13, "section": "Monitoring and Management", "topic": "HA status CLI command", "q": "Which CLI command shows HA health, mode, cluster uptime, configuration sync status and per-member usage statistics?", "opts": ["diagnose sys ha checksum show", "get system ha status", "diagnose sys ha dump-by vcluster", "execute ha manage ?"], "a": 1, "rat": "The Checking the HA Status on the CLI slide runs get system ha status and highlights cluster status, election results, configuration sync status and performance stats.", "src": "Video · 13:20", "diff": "easy"}, {"n": 769, "ln": 52, "lesson": 13, "section": "Monitoring and Management", "topic": "Sessions field", "q": "In the System Usage stats of get system ha status, what does each member's sessions value count?", "opts": ["All sessions the member handles, not just ones distributed in active-active", "Only the sessions synchronized to it through session pickup on failover", "Only management sessions that connect to that member's own interfaces directly", "Only the sessions handed to that member by the primary's load balancing"], "a": 0, "rat": "The notes say the sessions field accounts for any sessions the member handles, not only the sessions distributed when the HA mode is active-active.", "src": "Video · 13:20", "diff": "hard"}, {"n": 770, "ln": 53, "lesson": 13, "section": "Monitoring and Management", "topic": "Configuration Status section", "q": "Which part of the get system ha status output tells you whether each member's configuration is in sync?", "opts": ["Primary selected using, which shows the latest election result and reason", "HA Health Status, the first line of the command's output", "Configuration Status, listing in-sync state and a checksum per member", "System Usage stats, which shows sessions, CPU and memory"], "a": 2, "rat": "The slide's Configuration sync status callout points at Configuration Status, where each serial shows in-sync and a chksum dump.", "src": "Video · 13:20", "diff": "medium"}, {"n": 771, "ln": 54, "lesson": 13, "section": "Monitoring and Management", "topic": "Status interface sections", "q": "The get system ha status output lists HBDEV, MONDEV and PINGSVR stats. Which protection types do these interfaces provide, in that order?", "opts": ["Device failover, link failover and remote link failover", "Link failover, device failover and memory-based failover", "Device failover, SSD failover and link failover", "Remote link failover, link failover and device failover"], "a": 0, "rat": "The notes for the CLI (Contd) slide say the heartbeat, monitored and remote link interfaces enable device failover, link failover and remote link failover protection, respectively.", "src": "Video · 14:10", "diff": "hard"}, {"n": 772, "ln": 55, "lesson": 13, "section": "Monitoring and Management", "topic": "Monitored interface", "q": "In get system ha status, HBDEV stats lists port7 and port2, MONDEV stats lists port1, and PINGSVR shows server 8.8.8.8. What role does port1 play?", "opts": ["It is the heartbeat link used to exchange hello packets", "It is the reserved HA management interface of each unit", "It is the only interface given a virtual MAC address", "It is a monitored interface that supports link failover"], "a": 3, "rat": "In the output, MONDEV stats (monitored interfaces) lists port1 while HBDEV (heartbeat) lists port7/port2. The notes say monitored interfaces enable link failover protection.", "src": "Video · 14:10", "diff": "hard"}, {"n": 773, "ln": 56, "lesson": 13, "section": "Monitoring and Management", "topic": "Cluster checksum command", "q": "Which command shows the configuration checksums of all cluster members in one output?", "opts": ["diagnose sys ha checksum show", "diagnose sys ha checksum recalculate", "diagnose sys ha checksum cluster", "get system ha status | grep chksum"], "a": 2, "rat": "The Checking the Configuration Synchronization slide shows diagnose sys ha checksum cluster under Display the checksum for all members; checksum show displays only the member's own checksum.", "src": "Video · 16:15", "diff": "medium"}, {"n": 774, "ln": 57, "lesson": 13, "section": "Monitoring and Management", "topic": "Interpreting checksums", "q": "When do checksum outputs show the cluster configuration is in sync?", "opts": ["When only the global hash matches on each member", "When every hash value is identical across the members", "When is_manage_primary()=1 appears on each member", "When each member's checksum differs from the debug zone"], "a": 1, "rat": "The slide callout says the configuration is in sync only when all of the hash values match on every member.", "src": "Video · 16:15", "diff": "medium"}, {"n": 775, "ln": 58, "lesson": 13, "section": "Monitoring and Management", "topic": "Checksum troubleshooting", "q": "diagnose sys ha checksum cluster shows only the checksum of the unit you ran it on. What is a suitable workaround?", "opts": ["Run diagnose sys ha reset-uptime and repeat the command", "Enable session pickup so checksums are exchanged again", "Remove the secondaries and add them back to the cluster", "Log in to each member and run diagnose sys ha checksum show"], "a": 3, "rat": "The notes say the cluster command polls each member over the heartbeat interface and may not show other members if HA or heartbeat communication has issues; the alternative is to connect to each member and run checksum show.", "src": "Video · 16:15", "diff": "hard"}, {"n": 776, "ln": 59, "lesson": 13, "section": "Monitoring and Management", "topic": "Recalculate checksums", "q": "Members appear to be in sync, but their checksums differ. Which command should you try?", "opts": ["diagnose sys ha checksum cluster", "diagnose sys ha reset-uptime", "execute ha synchronize start", "diagnose sys ha checksum recalculate"], "a": 3, "rat": "The slide says if checksums don't match, try diagnose sys ha checksum recalculate; the notes add that sometimes the configuration is in sync even though checksums differ.", "src": "Video · 16:40", "diff": "medium"}, {"n": 777, "ln": 60, "lesson": 13, "section": "Monitoring and Management", "topic": "Checksum categories", "q": "In checksum output, what does the root hash cover?", "opts": ["Global settings such as FortiGuard options", "The global config plus every VDOM's config", "Only the administrator accounts and profiles", "Settings and objects specific to the root VDOM"], "a": 3, "rat": "The notes explain: global is the global configuration (global and FortiGuard settings), root is settings and objects specific to the root VDOM, and all is global plus all VDOMs.", "src": "Video · 16:40", "diff": "medium"}, {"n": 778, "ln": 61, "lesson": 13, "section": "Monitori
