<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FortiGate 7.6 Administrator (NSE 4) Study Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E9ECEF; --surface:#FFFFFF; --surface-2:#F3F5F7; --surface-3:#EAEEF2;
  --ink:#14181D; --muted:#59636E; --faint:#8A939D; --border:#D8DDE3;
  --accent:#E4002B; --accent-2:#B00722;
  --ok:#0B8A54; --ok-tint:#E6F4EC; --ok-border:#9BD3B4;
  --bad:#C8102E; --bad-tint:#FBE9EC; --bad-border:#E9A9B4;
  --btn-bg:#14181D; --btn-fg:#FFFFFF; --btn-bg-hover:#000000;
  --focus:#1668E3; --chip:#EDF0F3;
  --shadow:0 1px 2px rgba(20,24,29,.06), 0 8px 24px rgba(20,24,29,.07);
  --shadow-sm:0 1px 2px rgba(20,24,29,.08);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0F1317; --surface:#171C22; --surface-2:#1E252C; --surface-3:#252E37;
    --ink:#E7ECF1; --muted:#93A0AD; --faint:#6B7783; --border:#2A333C;
    --accent:#FF3B4E; --accent-2:#FF6472;
    --ok:#35D08A; --ok-tint:#12251C; --ok-border:#1F6B47;
    --bad:#FF6472; --bad-tint:#2A1519; --bad-border:#7A2733;
    --btn-bg:#EAEEF2; --btn-fg:#14181D; --btn-bg-hover:#FFFFFF;
    --focus:#5AA0FF; --chip:#222A32;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1317; --surface:#171C22; --surface-2:#1E252C; --surface-3:#252E37;
  --ink:#E7ECF1; --muted:#93A0AD; --faint:#6B7783; --border:#2A333C;
  --accent:#FF3B4E; --accent-2:#FF6472;
  --ok:#35D08A; --ok-tint:#12251C; --ok-border:#1F6B47;
  --bad:#FF6472; --bad-tint:#2A1519; --bad-border:#7A2733;
  --btn-bg:#EAEEF2; --btn-fg:#14181D; --btn-bg-hover:#FFFFFF;
  --focus:#5AA0FF; --chip:#222A32;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif; margin:0; line-height:1.15; text-wrap:balance}
a{color:var(--accent)}
button{font-family:inherit}

.bar{position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:2px solid var(--accent); box-shadow:var(--shadow-sm)}
.bar-in{max-width:900px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:14px}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.mark{width:20px; height:20px; border-radius:4px; background:var(--accent); flex:none; box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.brand b{font-family:"Archivo"; font-weight:800; font-size:15px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand span{color:var(--faint); font-size:11px; letter-spacing:.12em; text-transform:uppercase}
.bar-spacer{flex:1}
.readout{font-size:12px; color:var(--muted); display:flex; gap:14px; align-items:center}
.readout b{color:var(--ink); font-weight:600}
.iconbtn{background:transparent; border:1px solid var(--border); color:var(--muted); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:15px; display:grid; place-items:center; transition:.15s}
.iconbtn:hover{color:var(--ink); border-color:var(--faint)}

main{max-width:900px; margin:0 auto; padding:28px 20px 80px}
.eyebrow{font-family:"IBM Plex Mono"; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600}
.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow)}

.hero{padding:40px 34px 34px}
.hero h1{font-size:clamp(30px,5vw,44px); font-weight:800; letter-spacing:-.02em; margin-top:14px}
.hero .lede{color:var(--muted); font-size:17px; max-width:62ch; margin:16px 0 0}
.pillrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:22px}
.pill{font-family:"IBM Plex Mono"; font-size:12px; padding:6px 11px; border-radius:999px; background:var(--chip); color:var(--muted); border:1px solid var(--border)}
.pill b{color:var(--ink)}

.lessons{display:grid; grid-template-columns:repeat(auto-fit,minmax(288px,1fr)); gap:16px; margin-top:26px}
.lesson-card{border:1px solid var(--border); border-radius:14px; background:var(--surface-2); padding:20px 20px 22px; display:flex; flex-direction:column}
.lesson-card .lnum{font-family:"IBM Plex Mono"; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:600}
.lesson-card h3{font-size:18px; font-weight:700; margin:7px 0 0; letter-spacing:-.01em}
.lesson-card .lc-count{font-family:"IBM Plex Mono"; font-size:12px; color:var(--muted); margin-top:4px}
.lesson-card ul{margin:14px 0 0; padding:0; list-style:none; display:grid; gap:7px}
.lesson-card li{position:relative; padding-left:20px; font-size:12.5px; color:var(--ink); line-height:1.4}
.lesson-card li::before{content:""; position:absolute; left:2px; top:7px; width:7px; height:7px; border-radius:2px}
.lesson-card .lc-btn{margin-top:auto; padding-top:18px}
.lesson-card button{width:100%; appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:10px; padding:11px 16px; font-size:14px; font-weight:600; cursor:pointer; transition:.15s}
.lesson-card button:hover{border-color:var(--faint); background:var(--surface-3)}
.lesson-card button:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

.toggles{display:flex; flex-wrap:wrap; gap:10px 22px; margin-top:26px; padding-top:22px; border-top:1px solid var(--border)}
.tog{display:flex; align-items:center; gap:9px; font-size:14px; color:var(--muted); cursor:pointer; user-select:none}
.tog input{position:absolute; opacity:0; width:0; height:0}
.sw{width:38px; height:22px; border-radius:999px; background:var(--surface-3); border:1px solid var(--border); position:relative; transition:.18s; flex:none}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.3); transition:.18s}
.tog input:checked + .sw{background:var(--accent); border-color:var(--accent)}
.tog input:checked + .sw::after{transform:translateX(16px)}
.tog input:focus-visible + .sw{outline:2px solid var(--focus); outline-offset:2px}
.cnt{display:flex; align-items:center; gap:9px; font-size:14px; color:var(--muted)}
.cnt select{appearance:auto; font:inherit; font-size:14px; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px 8px; cursor:pointer}
.cnt select:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:26px}

.btn{appearance:none; border:1px solid transparent; border-radius:10px; padding:12px 22px; font-size:15px; font-weight:600; cursor:pointer; transition:.15s}
.btn-primary{background:var(--btn-bg); color:var(--btn-fg)}
.btn-primary:hover{background:var(--btn-bg-hover)}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--border)}
.btn-ghost:hover{border-color:var(--faint); background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.btn:disabled{opacity:.45; cursor:default}

.qhead{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:22px 30px 0}
.qhead .eyebrow .lt{color:var(--faint)}
.diff{font-family:"IBM Plex Mono"; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:4px 9px; border-radius:6px; font-weight:600; white-space:nowrap; border:1px solid var(--border); color:var(--muted); background:var(--surface-2)}
.diff.easy{color:var(--ok); border-color:var(--ok-border); background:var(--ok-tint)}
.diff.hard{color:var(--accent); border-color:var(--border)}
.qtext{padding:14px 30px 4px; font-size:20px; font-weight:600; font-family:"Archivo"; letter-spacing:-.01em; line-height:1.32}
.opts{display:grid; gap:10px; padding:18px 30px 6px}
.opt{display:flex; align-items:flex-start; gap:13px; width:100%; text-align:left; background:var(--surface-2); border:1.5px solid var(--border); border-radius:11px; padding:13px 15px; cursor:pointer; transition:.13s; color:var(--ink); font-size:15.5px; line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--faint); background:var(--surface-3)}
.opt:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.opt .lz{font-family:"IBM Plex Mono"; font-weight:600; font-size:13px; width:24px; height:24px; border-radius:6px; background:var(--surface); border:1px solid var(--border); display:grid; place-items:center; flex:none; color:var(--muted); margin-top:1px; transition:.13s}
.opt.sel{border-color:var(--ink); background:var(--surface-3)}
.opt.sel .lz{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.opt.correct{border-color:var(--ok-border); background:var(--ok-tint)}
.opt.correct .lz{background:var(--ok); color:#fff; border-color:var(--ok)}
.opt.wrong{border-color:var(--bad-border); background:var(--bad-tint)}
.opt.wrong .lz{background:var(--bad); color:#fff; border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt .otext{flex:1; min-width:0}
.opt .fmark{font-weight:700; font-size:15px; flex:none; margin-top:1px}
.opt.correct .fmark{color:var(--ok)}
.opt.wrong .fmark{color:var(--bad)}

.feedback{margin:8px 30px 0; border-radius:12px; padding:0; max-height:0; overflow:hidden; transition:max-height .28s ease, margin .28s ease}
.feedback.show{max-height:460px; margin:16px 30px 0}
.fb-in{padding:16px 18px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2)}
.fb-in.ok{border-color:var(--ok-border); background:var(--ok-tint)}
.fb-in.no{border-color:var(--bad-border); background:var(--bad-tint)}
.fb-verdict{font-family:"Archivo"; font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:6px}
.fb-in.ok .fb-verdict{color:var(--ok)}
.fb-in.no .fb-verdict{color:var(--bad)}
.fb-rat{font-size:14.5px; color:var(--ink)}
.fb-src{margin-top:10px; font-family:"IBM Plex Mono"; font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.fb-src .tag{border:1px solid var(--border); border-radius:5px; padding:2px 7px; background:var(--surface)}

.qfoot{display:flex; align-items:center; gap:16px; padding:20px 30px 24px; margin-top:8px}
.progress{flex:1; height:7px; border-radius:999px; background:var(--surface-3); overflow:hidden}
.progress > i{display:block; height:100%; width:0; background:var(--accent); border-radius:999px; transition:width .35s ease}
.foot-btns{display:flex; gap:10px}
.btn-sm{padding:10px 18px; font-size:14px}
.hint{font-family:"IBM Plex Mono"; font-size:11px; color:var(--faint); text-align:center; margin-top:16px}
.hint kbd{background:var(--surface); border:1px solid var(--border); border-bottom-width:2px; border-radius:5px; padding:1px 6px; font-size:11px; color:var(--muted)}

.score-wrap{padding:38px 34px 30px; text-align:center}
.score-ring{width:150px; height:150px; margin:6px auto 0; position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .pct{position:absolute; inset:0; display:grid; place-items:center}
.score-ring .pct b{font-family:"Archivo"; font-weight:800; font-size:38px; letter-spacing:-.02em; display:block; line-height:1}
.score-ring .pct small{color:var(--muted); font-size:12px; font-family:"IBM Plex Mono"}
.verdict-line{font-family:"Archivo"; font-weight:700; font-size:22px; margin-top:18px}
.score-sub{color:var(--muted); margin-top:6px}
.tally{display:grid; gap:9px; padding:26px 34px; border-top:1px solid var(--border)}
.tally h3, .review h3{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-family:"IBM Plex Mono"; font-weight:600; margin-bottom:4px}
.tally .lesson-head{font-family:"Archivo"; font-weight:700; font-size:14px; color:var(--ink); margin-top:10px}
.trow{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center}
.trow .tn{font-size:13.5px; color:var(--ink)}
.trow .tv{font-family:"IBM Plex Mono"; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.tbar{grid-column:1/-1; height:6px; border-radius:999px; background:var(--surface-3); overflow:hidden}
.tbar > i{display:block; height:100%; border-radius:999px}
.review{padding:8px 34px 30px}
.miss{border:1px solid var(--border); border-radius:11px; padding:14px 16px; margin-top:12px; background:var(--surface-2)}
.miss .mq{font-weight:600; font-size:14.5px; margin-bottom:9px}
.miss .ml{font-size:13.5px; display:flex; gap:8px; align-items:baseline; margin-top:3px}
.miss .ml .k{font-family:"IBM Plex Mono"; font-size:11px; font-weight:600; padding:1px 6px; border-radius:4px; flex:none}
.miss .k.ok{background:var(--ok-tint); color:var(--ok); border:1px solid var(--ok-border)}
.miss .k.no{background:var(--bad-tint); color:var(--bad); border:1px solid var(--bad-border)}
.miss .msrc{font-family:"IBM Plex Mono"; font-size:11px; color:var(--faint); margin-top:9px}
.end-actions{display:flex; gap:12px; justify-content:center; padding:6px 34px 4px; flex-wrap:wrap}

.filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px}
.fchip{font-family:"IBM Plex Mono"; font-size:12px; padding:7px 13px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; transition:.13s}
.fchip:hover{border-color:var(--faint); color:var(--ink)}
.fchip.on{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.fchip:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.lesson-banner{display:flex; align-items:baseline; gap:12px; margin:26px 0 14px; padding-bottom:10px; border-bottom:2px solid var(--border)}
.lesson-banner .lb-tag{font-family:"IBM Plex Mono"; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase}
.lesson-banner h2{font-family:"Archivo"; font-size:20px; font-weight:700}
.sgroup{margin-bottom:12px}
.sgroup > summary{cursor:pointer; list-style:none; padding:15px 20px; background:var(--surface); border:1px solid var(--border); border-radius:12px; display:flex; align-items:center; gap:12px; font-family:"Archivo"; font-weight:700; font-size:15.5px}
.sgroup > summary::-webkit-details-marker{display:none}
.sgroup > summary .cnt{margin-left:auto; font-family:"IBM Plex Mono"; font-size:12px; color:var(--muted); font-weight:400}
.sgroup > summary .caret{color:var(--faint); transition:.2s; font-size:13px}
.sgroup[open] > summary .caret{transform:rotate(90deg)}
.sgroup[open] > summary{border-radius:12px 12px 0 0; border-bottom-color:transparent}
.sbody{border:1px solid var(--border); border-top:none; border-radius:0 0 12px 12px; padding:6px 20px 8px}
.sq{padding:18px 0; border-bottom:1px solid var(--border)}
.sq:last-child{border-bottom:none}
.sq .sqq{font-weight:600; font-size:15.5px; display:flex; gap:10px}
.sq .sqq .n{font-family:"IBM Plex Mono"; color:var(--accent); font-weight:600; flex:none}
.sopts{display:grid; gap:6px; margin:12px 0 0}
.sopt{display:flex; gap:11px; align-items:flex-start; padding:9px 12px; border-radius:9px; font-size:14.5px; border:1px solid transparent}
.sopt .sl{font-family:"IBM Plex Mono"; font-size:12px; color:var(--muted); flex:none; width:18px}
.sopt.ok{background:var(--ok-tint); border-color:var(--ok-border)}
.sopt.ok .sl{color:var(--ok); font-weight:600}
.sopt.ok .ck{color:var(--ok); margin-left:auto; font-weight:700}
.srat{margin-top:12px; font-size:14px; color:var(--muted); border-left:2px solid var(--border); padding-left:12px}
.ssrc{margin-top:9px; font-family:"IBM Plex Mono"; font-size:11px; color:var(--faint)}
.foot-note{text-align:center; color:var(--faint); font-size:12px; margin-top:40px; font-family:"IBM Plex Mono"; line-height:1.7}
.lesson-card.l1 .lnum{color:var(--accent)}
.lesson-card.l1 li::before{background:var(--accent)}
.qhead .eyebrow .lt.l1{color:var(--accent)}
.lesson-banner.l1 .lb-tag{color:var(--accent)}
.sq.l1 .sqq .n{color:var(--accent)}
.lesson-card.l2 .lnum{color:#2E7DE9}
.lesson-card.l2 li::before{background:#2E7DE9}
.qhead .eyebrow .lt.l2{color:#2E7DE9}
.lesson-banner.l2 .lb-tag{color:#2E7DE9}
.sq.l2 .sqq .n{color:#2E7DE9}
.lesson-card.l3 .lnum{color:#12A594}
.lesson-card.l3 li::before{background:#12A594}
.qhead .eyebrow .lt.l3{color:#12A594}
.lesson-banner.l3 .lb-tag{color:#12A594}
.sq.l3 .sqq .n{color:#12A594}
.lesson-card.l4 .lnum{color:#D08018}
.lesson-card.l4 li::before{background:#D08018}
.qhead .eyebrow .lt.l4{color:#D08018}
.lesson-banner.l4 .lb-tag{color:#D08018}
.sq.l4 .sqq .n{color:#D08018}

.lesson-card.l5 li::before{background:#8B5CF6}
.qhead .eyebrow .lt.l5{color:#8B5CF6}
.lesson-banner.l5 .lb-tag{color:#8B5CF6}
.sq.l5 .sqq .n{color:#8B5CF6}
.lesson-card.l6 .lnum{color:#0EA5E9}
.lesson-card.l6 li::before{background:#0EA5E9}
.qhead .eyebrow .lt.l6{color:#0EA5E9}
.lesson-banner.l6 .lb-tag{color:#0EA5E9}
.sq.l6 .sqq .n{color:#0EA5E9}
.lesson-card.l7 .lnum{color:#DB2777}
.lesson-card.l7 li::before{background:#DB2777}
.qhead .eyebrow .lt.l7{color:#DB2777}
.lesson-banner.l7 .lb-tag{color:#DB2777}
.sq.l7 .sqq .n{color:#DB2777}
.lesson-card.l8 .lnum{color:#65A30D}
.lesson-card.l8 li::before{background:#65A30D}
.qhead .eyebrow .lt.l8{color:#65A30D}
.lesson-banner.l8 .lb-tag{color:#65A30D}
.sq.l8 .sqq .n{color:#65A30D}
.lesson-card.l9 .lnum{color:#C2410C}
.lesson-card.l9 li::before{background:#C2410C}
.qhead .eyebrow .lt.l9{color:#C2410C}
.lesson-banner.l9 .lb-tag{color:#C2410C}
.sq.l9 .sqq .n{color:#C2410C}
.lesson-card.l10 .lnum{color:#4F46E5}
.lesson-card.l10 li::before{background:#4F46E5}
.qhead .eyebrow .lt.l10{color:#4F46E5}
.lesson-banner.l10 .lb-tag{color:#4F46E5}
.sq.l10 .sqq .n{color:#4F46E5}
.lesson-card.l11 .lnum{color:#0F766E}
.lesson-card.l11 li::before{background:#0F766E}
.qhead .eyebrow .lt.l11{color:#0F766E}
.lesson-banner.l11 .lb-tag{color:#0F766E}
.sq.l11 .sqq .n{color:#0F766E}
.lesson-card.l12 .lnum{color:#A16207}
.lesson-card.l12 li::before{background:#A16207}
.qhead .eyebrow .lt.l12{color:#A16207}
.lesson-banner.l12 .lb-tag{color:#A16207}
.sq.l12 .sqq .n{color:#A16207}
.lesson-card.l13 .lnum{color:#9333EA}
.lesson-card.l13 li::before{background:#9333EA}
.qhead .eyebrow .lt.l13{color:#9333EA}
.lesson-banner.l13 .lb-tag{color:#9333EA}
.sq.l13 .sqq .n{color:#9333EA}
.lesson-card.l14 .lnum{color:#0369A1}
.lesson-card.l14 li::before{background:#0369A1}
.qhead .eyebrow .lt.l14{color:#0369A1}
.lesson-banner.l14 .lb-tag{color:#0369A1}
.sq.l14 .sqq .n{color:#0369A1}
.lesson-card.l15 .lnum{color:#BE185D}
.lesson-card.l15 li::before{background:#BE185D}
.qhead .eyebrow .lt.l15{color:#BE185D}

<script>
const LESSONS = [{"id": 1, "name": "System and Network Settings", "short": "System and", "objectives": ["Describe FortiGate's role in modern networks, its deployment modes, and its platform design", "Configure FortiGate from factory default settings, including operating mode and first-login tasks", "Configure interface addressing, roles, aliases, DHCP server options, and the default route", "Configure and control administrator access using profiles, trusted hosts, ports, idle timeout, and per-interface protocols", "Check and verify FortiGuard licenses and explain how FortiGate communicates with FortiGuard services", "Describe the sequence of operations that initial session packets follow through FortiGate"], "sections": ["FortiGate Platform and Deployment", "Initial Setup and Factory Defaults", "Interfaces, DHCP, and Routing", "Administrative Access", "FortiGuard Services", "Life of a Packet"]}, {"id": 2, "name": "Logging and Monitoring", "short": "Logging and", "objectives": ["Describe the FortiGate logging workflow, log types and subtypes, severity levels, and log message layout", "Identify local and remote log storage options, their defaults, and their limitations", "Explain FortiAnalyzer analyzer and collector modes and how FortiGate registers with FortiAnalyzer", "Configure log upload options, reliable logging, and OFTPS encryption between FortiGate and FortiAnalyzer", "Manage log volume with logging scope, log rolling, and automatic deletion", "View and search logs on FortiGate (GUI and CLI) and FortiAnalyzer, distinguishing real-time from historical views"], "sections": ["Logging Workflow and Log Types", "Log Severity and Message Structure", "Log Storage Options", "FortiAnalyzer Modes and Registration", "Log Upload and Reliable Logging", "Log Management and Viewing"]}, {"id": 3, "name": "Firewall Policies and NAT", "short": "Firewall Policies", "objectives": ["Configure IPv4 firewall policies and understand how FortiGate matches traffic to them", "Manage policy order, IDs, and list views, and apply firewall policy best practices", "Choose between flow-based and proxy-based inspection modes", "Configure logging options and monitor traffic logs", "Configure SNAT using the outgoing interface address or IP pools", "Configure firewall policies to perform DNAT using VIPs"], "sections": ["Firewall Policy Fundamentals", "Policy Management and Inspection Modes", "Logging and Monitoring", "Source NAT and IP Pools", "VIPs and Destination NAT"]}, {"id": 4, "name": "Routing", "short": "Routing", "objectives": ["Explain how FortiGate performs route lookups, including the two lookups per session, the session table, and the RIB and FIB", "Describe the route lookup order across policy routes, ISDB routes, SD-WAN rules, route cache, and FIB", "Configure static routes using subnets, named addresses, and Internet Service Database entries", "Apply distance, metric, and priority to predict best route selection and standby routes", "Monitor and troubleshoot routing with the routing monitor, CLI commands, the GUI route lookup tool, and RPF", "Configure ECMP routing and choose among ECMP load balancing algorithms with and without SD-WAN"], "sections": ["Routing Fundamentals and the Route Lookup", "Static Routes, Named Addresses, and ISDB Routes", "Route Attributes and Best Route Selection", "Route Monitoring, Lookup Tool, and RPF", "ECMP Routing"]}, {"id": 5, "name": "Firewall Authentication", "short": "Firewall Authentication", "objectives": ["Describe why user-based firewall authentication is more reliable than IP- or device-based access, and list FortiGate's local, server-based, and two-factor methods", "Configure local users and remote LDAP and RADIUS authentication servers on FortiGate, and verify them with Test User Credentials and diagnose test authserver", "Explain LDAP structure (DN, identifier, binding, ports) and RADIUS message exchange, including VSA-based group membership", "Implement two-factor authentication with FortiTokens, email/SMS OTP, and push, and explain seed/time OTP validation and NTP requirements", "Deploy active and passive authentication in firewall policies, including required protocols, DNS, auth-on-demand, and captive portal", "Configure authentication timeouts and monitor or deauthenticate firewall users in the GUI"], "sections": ["Authentication Fundamentals and Local Users", "Remote Authentication: LDAP", "Remote Authentication: RADIUS and CLI Testing", "Two-Factor Authentication and FortiTokens", "Active and Passive Authentication in Firewall Policies", "Authentication Timeouts and User Monitoring"]}, {"id": 6, "name": "Fortinet Single Sign-On (FSSO)", "short": "Fortinet Single", "objectives": ["Describe how FSSO identifies users and lets FortiGate apply identity-based policies without prompting", "Compare DC agent mode, collector agent-based polling, and agentless polling, including ports and polling methods", "Install the collector and DC agents and configure FSSO connectors and group objects on FortiGate", "Configure collector agent access modes, group filters, ignore lists, timers, and advanced settings", "Monitor and troubleshoot FSSO with logs and diagnose commands"], "sections": ["FSSO Concepts and Deployment Modes", "Installing and Configuring FSSO", "Collector Agent Filters, Timers and Advanced Settings", "Logging, Monitoring and Troubleshooting"]}, {"id": 7, "name": "Certificate Operations", "short": "Certificate Operations", "objectives": ["Explain why and how FortiGate uses digital certificates and how it validates them", "Compare SSL certificate inspection and full SSL inspection", "Configure SSL/SSH inspection profiles, exemptions, and invalid or untrusted certificate actions", "Configure full SSL inspection for inbound traffic to protected servers", "Avoid certificate warnings and import certificates and CRLs on FortiGate"], "sections": ["Certificate Fundamentals and Trust", "SSL Inspection Modes", "SSL/SSH Inspection Profile Settings", "Inbound Full SSL Inspection", "Certificate Warnings and CA Deployment", "Importing Certificates and the Certificate Store"]}, {"id": 8, "name": "Antivirus", "short": "Antivirus", "objectives": ["Describe the antivirus scanning techniques FortiGate uses, including signature, grayware, AI/ML, outbreak prevention, EMS threat feed, and CDR, and the order in which they are applied.", "Compare flow-based and proxy-based inspection modes, their packet flows, trade-offs, and proxy-only features.", "Explain stream-based antivirus scanning and the features that disable it.", "Configure antivirus profiles, firewall policies, and protocol options, including handling of oversized and compressed files.", "Interpret antivirus block pages and logs, and troubleshoot licensing, update, and detection issues with GUI and CLI tools."], "sections": ["Antivirus Techniques and Detection", "Inspection Modes and Packet Flow", "Stream-Based Scanning", "Protocol Options, Large and Compressed Files", "Block Pages and Logging", "Troubleshooting Antivirus"]}, {"id": 9, "name": "Web Filtering", "short": "Web Filtering", "objectives": ["Explain when web filtering acts on HTTP and HTTPS traffic and how SSL certificate inspection uses SNI and the certificate CN", "Choose between flow-based and proxy-based inspection and configure matching SSL inspection and web filter profiles", "Configure FortiGuard category actions (Allow, Monitor, Block, Warning, Authenticate) and web rating overrides", "Configure static URL filters and describe the web filter inspection order", "Troubleshoot FortiGuard connectivity and web filtering configuration, and use web filter logs"], "sections": ["Inspection Modes and SSL", "Web Filter Profiles", "FortiGuard Category Filtering", "Static URL Filter and Inspection Order", "Troubleshooting and Logs"]}, {"id": 10, "name": "Intrusion Prevention and Application Control", "short": "Intrusion Prevention", "objectives": ["Identify the components of the FortiGate IPS and configure IPS sensors, signatures, and actions", "Apply IPS inspection to firewall policies and review IPS logs", "Troubleshoot IPS high CPU usage and IPS fail open", "Explain how application control identifies and controls network applications", "Configure, apply, and monitor application control profiles and troubleshoot override matching"], "sections": ["IPS Components and Sensors", "Applying and Monitoring IPS", "IPS Troubleshooting", "Application Control Fundamentals", "Application Control Profile Configuration", "Applying and Monitoring Application Control"]}, {"id": 11, "name": "IPsec VPN", "short": "IPsec VPN", "objectives": ["Explain IPsec protocols, encapsulation modes, IKE versions, and security associations", "Compare remote access, hub-and-spoke, and mesh VPN topologies", "Configure IPsec phase 1 network, authentication, and proposal settings", "Configure phase 2 selectors, proposals, and SA lifetime behavior", "Configure routes, firewall policies, and redundant route-based VPNs", "Monitor IPsec tunnels and troubleshoot common IPsec problems"], "sections": ["IPsec Fundamentals and Topologies", "Phase 1 Configuration", "Phase 2 Configuration", "Routing, Firewall Policies, and Redundancy", "Monitoring and Troubleshooting"]}, {"id": 12, "name": "SD-WAN Configuration and Monitoring", "short": "SD WAN", "objectives": ["Describe SD-WAN concepts, benefits, and the DIA, site-to-site, and remote internet access use cases", "Configure SD-WAN members, zones, and performance SLAs on FortiGate", "Explain SD-WAN rule strategies, match criteria, and the rule lookup process", "Analyze how firewall policies, policy routes, and static routes interact with SD-WAN", "Monitor and troubleshoot SD-WAN using the GUI, logs, and CLI diagnostics"], "sections": ["SD-WAN Concepts and Use Cases", "Members, Zones, and Performance SLAs", "SD-WAN Rules and Rule Lookup", "Firewall Policies, Policy Routes, and Routing", "Monitoring and Troubleshooting"]}, {"id": 13, "name": "High Availability", "short": "High Availability", "objectives": ["Describe active-passive and active-active HA modes and the cluster requirements", "Explain how the primary is elected with override disabled and enabled", "Identify primary and secondary tasks and what is or is not synchronized", "Identify the HA failover types and virtual MAC behavior", "Verify cluster operation from the GUI and CLI and configure HA management access"], "sections": ["HA Operation Modes and Primary Election", "HA Cluster Synchronization", "HA Failover", "Monitoring and Management"]}, {"id": 14, "name": "Diagnostics and Troubleshooting", "short": "Diagnostics and", "objectives": ["Establish a baseline of normal behavior and use network diagrams, monitoring tools, and get system status for general diagnosis", "Use execute ping and traceroute options to test connectivity from and through FortiGate", "Capture and interpret traffic with the CLI packet sniffer and the GUI Packet Capture tool, including filters, verbosity levels, and timestamp formats", "Run debug flow in the CLI and GUI and interpret its output to trace session creation, routing, policy matching, and NAT", "Describe the life of a packet through FortiGate, including mandatory stages and NP/CP offloading", "Diagnose high CPU and memory usage and memory conserve mode, including thresholds and fail-open behavior"], "sections": ["General Diagnosis", "Packet Sniffer and Packet Capture", "Debug Flow", "Life of a Packet", "CPU and Memory Troubleshooting", "Memory Conserve Mode"]}, {"id": 15, "name": "FortiGate in the Cloud", "short": "FortiGate in", "objectives": ["Identify threats and challenges in the public cloud", "Identify Fortinet public cloud solutions, licensing models, and use cases", "Describe AWS service components and core networking components", "Explain how traffic flows within, between, and out of AWS VPC subnets", "Define Azure core components, routing, and network security groups"], "sections": ["Cloud Threats and Fortinet Cloud Solutions", "FortiGate VM Licensing, Deployment, and Use Cases", "AWS Core Networking Components", "AWS VPC Traffic Flows", "Azure Core Components and Routing"]}, {"id": 16, "name": "FortiSASE", "short": "FortiSASE", "objectives": ["Describe the challenges of remote work and the SASE architecture", "Identify FortiSASE components and security features", "Identify agent-based, agentless, and site-based secure internet access deployments", "Describe user onboarding with SAML SSO", "Describe secure private access and secure SaaS access using inline CASB and FortiCASB"], "sections": ["Remote work challenges and SASE architecture", "FortiSASE components and security features", "Secure internet access deployments", "User onboarding with SAML SSO", "Secure private access and SaaS access"]}];
const QUESTIONS = [{"n": 1, "ln": 1, "lesson": 1, "section": "FortiGate Platform and Deployment", "topic": "Modern security context", "q": "Why can network administrators no longer inherently trust all users and devices inside the network perimeter?", "opts": ["Internal networks no longer use private IP addressing, so every internal host is directly reachable from the internet", "Perimeter firewalls can no longer inspect encrypted traffic of any kind, so internal sessions arrive uninspected", "Modern switches forward all internal traffic through the ISP, so every internal flow crosses an untrusted network", "Malware can bypass an entry-point firewall, for example on an infected USB stick or a compromised device"], "a": 3, "rat": "The notes explain that in the past administrators trusted everything inside the perimeter, but now malware can bypass any entry-point firewall through an infected USB stick or a compromised device, and attacks can come from inside, so internal users and devices cannot be inherently trusted.", "src": "Video · 0:25", "diff": "easy"}, {"n": 2, "ln": 2, "lesson": 1, "section": "FortiGate Platform and Deployment", "topic": "Deployment roles", "q": "An organization wants to deploy FortiGate internally so that if one network segment is compromised, the breach is contained. Which deployment role fits this goal?", "opts": ["Transparent-mode bridge at the internet edge", "Distributed enterprise firewall", "Data-center firewall", "Internal segmentation firewall (ISFW)"], "a": 3, "rat": "The notes state FortiGate can be deployed as an ISFW as a way to contain a network breach.", "src": "Video · 0:50", "diff": "easy"}, {"n": 3, "ln": 3, "lesson": 1, "section": "FortiGate Platform and Deployment", "topic": "Hardware acceleration", "q": "Why can most FortiGate models outperform a single-purpose security device that relies only on a CPU?", "opts": ["They borrow free RAM and CPU cycles from other devices in the Security Fabric to share the inspection load", "They run each security feature on a separate dedicated appliance that is chained behind the main FortiGate", "They offload all packet inspection to FortiGuard cloud servers, so the local CPU only forwards the traffic", "They include Fortinet-designed ASICs, such as CP and NP chips, that offload cryptography and packet forwarding"], "a": 3, "rat": "The Platform Design notes state most FortiGate models have ASICs engineered by Fortinet; a CP or NP chip handles cryptography and packet forwarding more efficiently than a CPU-only device. Virtualization platforms are the exception.", "src": "Video · 1:40", "diff": "easy"}, {"n": 4, "ln": 4, "lesson": 1, "section": "FortiGate Platform and Deployment", "topic": "Platform modularity", "q": "FortiGate is internally modular. How can an administrator avoid spending CPU and RAM on security features that a particular traffic flow does not need?", "opts": ["Purchase additional VPN seat licenses to free resources", "Enable or disable UTM and NGFW modules in each firewall policy", "Remove the unused FortiGuard databases from flash memory", "Switch the device from NAT mode to transparent mode"], "a": 1, "rat": "The Platform Design notes say that if you only need fast firewalling and antivirus, FortiGate will not waste CPU, RAM, and electricity on other features, because in each firewall policy you can enable or disable UTM and NGFW modules; you also do not pay more to add VPN seat licenses later.", "src": "Video · 2:05", "diff": "medium"}, {"n": 5, "ln": 5, "lesson": 1, "section": "FortiGate Platform and Deployment", "topic": "Security Fabric", "q": "As a network grows, which approach lets FortiGate distribute processing for deeper security and optimal performance?", "opts": ["Adding more standalone FortiGate devices, each configured separately with its own set of policies", "Replacing open standards with proprietary protocols between all devices on the network", "Leveraging other Fortinet products, such as FortiSandbox and FortiWeb, in a Security Fabric", "Consolidating all inspection onto a single CPU-only virtual appliance in the data center"], "a": 2, "rat": "The notes state that FortiGate prefers open standards and, as the network grows, can leverage other Fortinet products such as FortiSandbox and FortiWeb to distribute processing for deeper security and optimal performance, a total Security Fabric approach.", "src": "Video · 2:05", "diff": "medium"}, {"n": 6, "ln": 6, "lesson": 1, "section": "Initial Setup and Factory Defaults", "topic": "Factory defaults", "q": "A new mid-range FortiGate is unboxed. Where is the factory default IP address 192.168.1.99/24 configured?", "opts": ["On the WAN interface, obtained through DHCP", "On the management interface", "On port1 or the internal interface", "On every physical interface"], "a": 1, "rat": "The Factory Default Settings slide shows 192.168.1.99/24 on the management interface for high-end and mid-range models, and on port1 or the internal interface for entry-level models.", "src": "Video · 2:30", "diff": "easy"}, {"n": 7, "ln": 7, "lesson": 1, "section": "Initial Setup and Factory Defaults", "topic": "Factory defaults", "q": "Which statement about FortiGate factory default settings is correct?", "opts": ["The built-in DHCP server is enabled on the management interface of all models", "The default password is admin, and only the username is case sensitive", "Only HTTPS management is enabled by default; PING and SSH must be turned on", "The default login is user admin with a blank password, and both are case sensitive"], "a": 3, "rat": "The slide lists the default login as admin with a blank password, both case sensitive. PING, HTTPS, and SSH management are enabled; the DHCP server runs only on port1 or internal of entry-level models that support it.", "src": "Video · 2:30", "diff": "easy"}, {"n": 8, "ln": 8, "lesson": 1, "section": "Initial Setup and Factory Defaults", "topic": "First login", "q": "What happens when an administrator first logs in to FortiGate with the default login details?", "opts": ["The session opens with full access and no prompts, because the blank password stays until changed on the CLI", "It displays a message to change the default admin password, then prompts for host name, dashboards, and FortiCare", "FortiGate generates a random admin password automatically and emails it to the registered FortiCare account", "The GUI locks every page until a valid FortiGuard license file is uploaded from the administrator's workstation"], "a": 1, "rat": "The notes say that after logging in with the defaults you see a message instructing you to change the default admin password, and you should set a complex password before connecting FortiGate to your network; you are also asked for host name, dashboard setup, FortiCare registration, and so on.", "src": "Video · 2:55", "diff": "easy"}, {"n": 9, "ln": 9, "lesson": 1, "section": "Initial Setup and Factory Defaults", "topic": "CLI access", "q": "An administrator must reach the FortiGate CLI but the device has no working network configuration. Which option works?", "opts": ["Connect to the console or USB management port with a terminal emulator such as PuTTY", "Query the device over SNMP to open an interactive command shell session", "Open the CLI Console widget for the device from the FortiManager GUI", "Use SSH to the default address 192.168.1.99 from any subnet, since SSH needs no interface setup"], "a": 0, "rat": "The notes state all FortiGate models have a console port, a USB management port, or both, which provide CLI access without a network, using a terminal emulator such as PuTTY or Tera Term.", "src": "Video · 2:55", "diff": "easy"}, {"n": 10, "ln": 10, "lesson": 1, "section": "Initial Setup and Factory Defaults", "topic": "Operating modes", "q": "Which behavior describes FortiGate operating in transparent mode?", "opts": ["It is the default operation mode on new FortiGate devices and is used by most deployments", "Each interface must be assigned an IP address and subnet mask before it can pass any traffic", "It works as a layer 2 bridge with no interface IP addresses, only forwarding or blocking packets", "It routes packets at layer 3, using the destination IP address and the routing table to pick an egress"], "a": 2, "rat": "The Modes of Operation slide shows NAT mode (the default) as a layer 3 router with IP-addressed interfaces, while transparent mode is a layer 2 switch or bridge whose interfaces have no IP addresses and which cannot route, only forward or block.", "src": "Video · 3:20", "diff": "medium"}, {"n": 11, "ln": 11, "lesson": 1, "section": "Interfaces, DHCP, and Routing", "topic": "Interface addressing", "q": "In NAT mode, which methods can give a FortiGate interface the IP address it needs before it can be used?", "opts": ["Manual assignment, or automatic assignment using DHCP or PPPoE", "Only DHCP, because PPPoE is restricted to the management interface", "Automatic assignment from FortiGuard, or LLDP discovery", "Only manual assignment; automatic addressing requires transparent mode"], "a": 0, "rat": "The Interface IP Addresses slide says in NAT mode you cannot use interfaces until they have an IP address, assigned manually or automatically through DHCP or PPPoE, configured under Network > Interfaces.", "src": "Video · 3:45", "diff": "easy"}, {"n": 12, "ln": 12, "lesson": 1, "section": "Interfaces, DHCP, and Routing", "topic": "Interface role", "q": "An administrator sets an interface role to WAN. What happens in the GUI for that interface?", "opts": ["The same options are also removed from the CLI until the interface role is changed back", "All settings, including the DHCP server, remain visible in the GUI but are greyed out", "The DHCP server, device detection, and Ping access options are hidden from the GUI", "The interface is automatically given a WAN alias that is then used in firewall policies"], "a": 2, "rat": "The notes explain that with the WAN role there is no DHCP server or device detection configuration, and Ping is not displayed, mitigating the risk of responding to a DoS ICMP attack from the WAN. Settings hidden by a role are always available on the CLI.", "src": "Video · 4:35", "diff": "hard"}, {"n": 13, "ln": 13, "lesson": 1, "section": "Interfaces, DHCP, and Routing", "topic": "Interface role", "q": "An administrator needs a GUI setting that the current interface role hides. What is the simplest way to display it?", "opts": ["Switch the FortiGate operation mode from NAT to transparent mode", "Change the interface role to Undefined, which shows all settings", "Enable the Dedicated Management Port option on that interface", "Change the interface alias to match the name of the needed feature"], "a": 1, "rat": "The slide lists four roles (LAN, WAN, DMZ, Undefined), with Undefined showing all settings; the notes say that to use an option hidden by the current role you can always switch the role to Undefined.", "src": "Video · 4:35", "diff": "medium"}, {"n": 14, "ln": 14, "lesson": 1, "section": "Interfaces, DHCP, and Routing", "topic": "Role compared to alias", "q": "How does an interface alias differ from an interface role?", "opts": ["Both appear in the policy list, but only the role can be changed after the interface is created", "The alias is a friendly label shown in the policy list; the role groups settings and is not listed there", "The alias determines which settings are hidden, whereas the role labels the interface in the policy list", "The alias is mandatory in NAT mode, whereas the role is only used when FortiGate runs in transparent mode"], "a": 1, "rat": "The Interface Role Compared to Alias slide says the role defines grouped interface settings, prevents misconfiguration, and is not in a list of policies; the alias is a friendly descriptor used in the policy list to label interfaces by purpose.", "src": "Video · 4:10", "diff": "medium"}, {"n": 15, "ln": 15, "lesson": 1, "section": "Interfaces, DHCP, and Routing", "topic": "DHCP server", "q": "Clients in several subnets must get addresses from an existing external DHCP server rather than from FortiGate. Which FortiGate DHCP feature addresses this?", "opts": ["Custom IP address assignment rules", "Advanced DHCP options for DNS and NTP", "DHCP relay", "Setting the interface addressing mode to DHCP"], "a": 2, "rat": "The FortiGate as a DHCP Server notes say DHCP relay forwards requests to an external server, which is useful when managing IP addresses across multiple subnets.", "src": "Video · 5:00", "diff": "medium"}, {"n": 16, "ln": 16, "lesson": 1, "section": "Interfaces, DHCP, and Routing", "topic": "DHCP server", "q": "A printer must always receive the same address from the FortiGate DHCP server. Which DHCP server feature provides this control?", "opts": ["Custom IP address assignment rules that map an IP address to a MAC address", "DHCP relay that forwards the printer's requests to an external DHCP server", "Increasing the lease time so the printer keeps its address for longer", "Advanced DHCP options that push specific DNS and NTP servers to the client"], "a": 0, "rat": "The notes state custom IP address assignment rules provide precise control by mapping specific IP addresses to MAC addresses, or allocating address ranges, preventing conflicts.", "src": "Video · 5:00", "diff": "medium"}, {"n": 17, "ln": 17, "lesson": 1, "section": "Interfaces, DHCP, and Routing", "topic": "Static gateway", "q": "After initial setup, FortiGate cannot reach FortiGuard or route traffic to the internet. Which missing configuration is the most likely cause?", "opts": ["The DHCP server enabled on the internet-facing interface to lease a public address", "A firewall policy that allows traffic from the internet interface to FortiGate itself", "A default route (0.0.0.0/0) to the next-hop router on the internet-facing interface", "An interface alias on the WAN port so that FortiGuard can identify the uplink"], "a": 2, "rat": "The Static Gateway notes say that without a default route (0.0.0.0/0) FortiGate cannot respond outside its directly attached subnets, likely cannot connect to FortiGuard, and may fail to route traffic; routing must be configured before firewall policies.", "src": "Video · 5:25", "diff": "medium"}, {"n": 18, "ln": 18, "lesson": 1, "section": "Administrative Access", "topic": "Administration methods", "q": "Which administrative access method is read-only and cannot be used for basic FortiGate setup?", "opts": ["SNMP", "The API", "The CLI Console widget in the GUI", "SSH to the CLI"], "a": 0, "rat": "The Administration Methods notes list CLI (console, SSH, GUI widget), API, FortiManager, and GUI, and state that SNMP and some other administrative protocols are supported but read-only and cannot be used for basic setup.", "src": "Video · 6:15", "diff": "medium"}, {"n": 19, "ln": 19, "lesson": 1, "section": "Administrative Access", "topic": "Administration methods", "q": "Which protocol does FortiManager use to manage FortiGate?", "opts": ["SNMP", "CAPWAP", "FGFM Management Protocol", "HTTPS through the Fortinet Developer Network"], "a": 2, "rat": "The Administration Methods slide shows FortiManager managing FortiGate through the FGFM Management Protocol, the API through the Fortinet Developer Network, Ansible, and Terraform, and the GUI through HTTP or HTTPS.", "src": "Video · 6:15", "diff": "medium"}, {"n": 20, "ln": 20, "lesson": 1, "section": "Administrative Access", "topic": "Administrator profiles", "q": "An administrator must be able to view VPN settings but must not create firewall policies. How is this enforced?", "opts": ["Disable HTTPS admin access on every interface except the VPN interface", "Assign an administrator profile that grants only the needed permissions", "Restrict the account to a trusted host address on the VPN subnet", "Set the account's interface role to Undefined for the VPN interface"], "a": 1, "rat": "The Administrator Profiles slide (System > Admin Profiles) shows a hierarchy from super_admin with full access to profiles with partial access, such as a profile that can only view VPN; the notes say the profile determines what an administrator can access.", "src": "Video · 6:40", "diff": "easy"}, {"n": 21, "ln": 21, "lesson": 1, "section": "Administrative Access", "topic": "Idle timeout", "q": "What is the default administrator idle timeout on FortiGate, and how can it be changed for only certain administrators?", "opts": ["5 minutes; change the global value under System > Settings only", "480 minutes; set it per administrator account under System > Administrators", "30 minutes; set it per interface under Network > Interfaces", "5 minutes; use the Override Idle Timeout setting in the relevant administrator profile"], "a": 3, "rat": "The Ports and Password slide states the default Idle timeout is 5 minutes (range 1-480, under System > Settings), and the notes say it can be overridden for each administrator profile using Override Idle Timeout.", "src": "Video · 8:20", "diff": "easy"}, {"n": 22, "ln": 22, "lesson": 1, "section": "Administrative Access", "topic": "Ports and password", "q": "Which recommendation applies to FortiGate administrative ports and protocols?", "opts": ["HTTP must stay enabled, because HTTPS administrative access cannot use a self-signed certificate", "Port numbers are customizable, and only secure protocols such as SSH and HTTPS should be used", "Administrative port numbers can be changed only from a session on the console port", "Port numbers are fixed by FortiOS, and Telnet should be kept enabled as a fallback method"], "a": 1, "rat": "The Ports and Password slide states port numbers are customizable and Fortinet recommends using only secure access (SSH, HTTPS); the notes add that password complexity and changes should be enforced.", "src": "Video · 8:20", "diff": "easy"}, {"n": 23, "ln": 23, "lesson": 1, "section": "Administrative Access", "topic": "Trusted hosts", "q": "An admin account is restricted to trusted host 10.0.0.10/32, but the administrator's traffic passes through a NAT device before reaching FortiGate. What is the result?", "opts": ["The login succeeds because trusted hosts apply only to SSH, not to the GUI", "The login fails with an authentication failure because FortiGate sees the translated source address", "FortiGate automatically adds the NATed address to the trusted host list", "The login succeeds because trusted hosts are checked against the MAC address"], "a": 1, "rat": "The Trusted Sources slide shows that logging in from any IP other than the trusted host returns Authentication failure, and the notes warn that NAT between the device and FortiGate can prevent the administrator from logging in, defeating the purpose of trusted hosts.", "src": "Video · 7:30", "diff": "hard"}, {"n": 24, "ln": 24, "lesson": 1, "section": "Administrative Access", "topic": "Trusted hosts", "q": "What is required before an administrator account can be restricted to provisioning guest accounts only?", "opts": ["Two-factor authentication must be enabled on the account", "The account must be assigned the super_admin profile", "The account must have at least two trusted hosts", "A guest user group must be configured"], "a": 3, "rat": "The Trusted Sources slide and notes explain that you can restrict an admin to guest account provisioning only, and that this option requires you to configure a guest user group.", "src": "Video · 7:30", "diff": "medium"}, {"n": 25, "ln": 25, "lesson": 1, "section": "Administrative Access", "topic": "Management protocols", "q": "Which administrative access protocol must be enabled on a FortiGate interface to allow a FortiManager to manage it?", "opts": ["FTM", "Security Fabric Connection", "FMG-Access", "RADIUS Accounting"], "a": 2, "rat": "The Administrative Access Protocols slide lists FMG-Access, FTM, and RADIUS Accounting as protocols for which FortiGate is the destination. FMG-Access is for communicating with FortiManager when it manages FortiGate devices; FTM supports FortiToken Mobile push second-factor requests, and RADIUS Accounting is for SSO. Security Fabric connection covers CAPWAP and FortiTelemetry.", "src": "Video · 8:45", "diff": "easy"}, {"n": 26, "ln": 26, "lesson": 1, "section": "Administrative Access", "topic": "Management protocols", "q": "Which statement about per-interface administrative access and LLDP is correct?", "opts": ["IPv4 and IPv6 access are set separately, with IPv6 hidden by default; LLDP detects an upstream FortiGate", "IPv6 administrative access is shown by default in the GUI and always mirrors the IPv4 settings", "Administrative access is set once globally and applies identically to every FortiGate interface", "LLDP is used to push FortiGuard updates from the root FortiGate to downstream FortiGate devices"], "a": 0, "rat": "The Protocols slide says management protocols are enabled on each interface independently, with separate IPv4 and IPv6 settings and IPv6 hidden by default; the notes add that with LAN or WAN roles FortiGate uses LLDP to detect an upstream FortiGate and prompts you to join the Security Fabric.", "src": "Video · 8:45", "diff": "hard"}, {"n": 27, "ln": 27, "lesson": 1, "section": "FortiGuard Services", "topic": "FortiGuard services", "q": "FortiGate downloads antivirus and IPS package updates from FortiGuard. Which server and transport does it use?", "opts": ["service.fortiguard.net over UDP port 53 or 8888", "securewf.fortiguard.net over HTTPS on port 8888 only", "A FortiGuard DNS server over DNS over TLS", "update.fortiguard.net over TCP port 443"], "a": 3, "rat": "The FortiGuard Subscription Services slide lists package updates (antivirus and IPS) from update.fortiguard.net on TCP port 443 (SSL).", "src": "Video · 10:25", "diff": "medium"}, {"n": 28, "ln": 28, "lesson": 1, "section": "FortiGuard Services", "topic": "FortiGuard live queries", "q": "Which FortiGuard services use live queries rather than downloaded package updates?", "opts": ["Web filtering, DNS filtering, and antispam", "Antivirus and web filtering only", "Antivirus, IPS, and application control", "IPS, antispam, and DNS over TLS"], "a": 0, "rat": "The slide separates package updates (antivirus and IPS) from live queries (web filtering, DNS filtering, and antispam) sent to service.fortiguard.net on UDP 53 or 8888, or securewf.fortiguard.net over HTTPS on 443, 53, or 8888.", "src": "Video · 10:25", "diff": "hard"}, {"n": 29, "ln": 29, "lesson": 1, "section": "FortiGuard Services", "topic": "FortiGuard Distribution Network", "q": "How does FortiGate choose which FortiGuard Distribution Network (FDN) data center to use?", "opts": ["It uses whichever data center has the lowest ping time, ignoring load", "It always uses the North American data center, regardless of its location", "It chooses a data center at random for each update to spread the load", "It prefers the nearest time zone's data center but adjusts for server load"], "a": 3, "rat": "The slide states FDN has major data centers in North America, Asia, and Europe (or FDN through FortiManager), and that FortiGate prefers the data center in the nearest time zone but will adjust by server load.", "src": "Video · 10:25", "diff": "medium"}, {"n": 30, "ln": 30, "lesson": 1, "section": "FortiGuard Services", "topic": "FortiGuard behavior", "q": "FortiGate loses reliable internet connectivity after its antivirus and IPS databases are downloaded. What is the effect?", "opts": ["The features keep using the downloaded databases, but new threats go undetected while downloads fail", "All security profiles stop inspecting traffic until the connection to FortiGuard returns", "The FortiGuard license is revoked after one failed update, disabling antivirus and IPS", "FortiGate switches antivirus and IPS from local databases to live FortiGuard queries until it reconnects"], "a": 0, "rat": "The notes say package databases are downloaded over TCP and, once downloaded, their features continue to function even without reliable internet connectivity, but interruptions should be avoided because a device retrying downloads cannot detect new threats during that time.", "src": "Video · 10:25", "diff": "hard"}, {"n": 31, "ln": 31, "lesson": 1, "section": "FortiGuard Services", "topic": "FortiGuard DNS", "q": "When FortiOS uses FortiGuard servers for DNS, how is DNS traffic secured by default?", "opts": ["With DNS over TLS (DoT)", "With DNSSEC validation only", "With an IPsec tunnel to FortiGuard", "With plain UDP port 53 queries"], "a": 0, "rat": "The slide and notes state that FortiOS uses FortiGuard servers for DNS and, by default, uses DNS over TLS (DoT) to secure the DNS traffic.", "src": "Video · 10:25", "diff": "easy"}, {"n": 32, "ln": 32, "lesson": 1, "section": "FortiGuard Services", "topic": "FortiGuard licenses", "q": "Where in the FortiGate GUI can an administrator check FortiGuard license status and the versions of locally installed databases?", "opts": ["System > FortiGuard", "System > Settings", "System > Admin Profiles", "Network > Interfaces"], "a": 0, "rat": "The FortiGuard Licenses slide shows System > FortiGuard, and the notes say you can check FortiGuard license status, communication to FortiGuard, and the versions of locally installed databases there.", "src": "Video · 11:15", "diff": "easy"}, {"n": 33, "ln": 33, "lesson": 1, "section": "Life of a Packet", "topic": "Life of a packet", "q": "For the first packets of a new session, which operation does the FortiGate kernel perform first, before routing and the stateful policy lookup?", "opts": ["Flow-based inspection", "Traffic shaping", "Destination NAT", "Source NAT"], "a": 2, "rat": "The Life of a Packet flowchart lists the kernel steps in order: 1. Destination NAT, 2. Routing, RPF check, and SD-WAN, 3. Stateful inspection/policy lookup/session management. Source NAT, inspection, and traffic shaping occur later.", "src": "Video · 12:05", "diff": "hard"}, {"n": 34, "ln": 34, "lesson": 1, "section": "Life of a Packet", "topic": "Secure processing units", "q": "What is the collective name for the network processor (NP) and content processor (CP) that offload processes on FortiGate?", "opts": ["FortiGuard Distribution Network (FDN)", "Secure processing units (SPU)", "Unified threat management (UTM) modules", "Host protection engine (HPE)"], "a": 1, "rat": "The notes explain the flowchart shows which processes can be offloaded to the NP and CP, specially designed integrated circuits collectively known as secure processing units (SPU).", "src": "Video · 11:40", "diff": "easy"}, {"n": 35, "ln": 35, "lesson": 1, "section": "Life of a Packet", "topic": "Life of a packet", "q": "On the egress side of the life of a packet flowchart, which operation happens in the kernel immediately after forwarding?", "opts": ["Access control list (ACL) check", "Destination NAT", "Source NAT", "IPsec VPN decryption"], "a": 2, "rat": "The flowchart's egress kernel block lists 1. Forwarding and 2. Source NAT, followed by IPsec VPN encryption, traffic shaping, and WAN optimization; destination NAT, ACL, and IPsec decryption occur on ingress.", "src": "Video · 12:05", "diff": "medium"}, {"n": 36, "ln": 1, "lesson": 2, "section": "Logging Workflow and Log Types", "topic": "Logging workflow order", "q": "What is the correct order of the FortiGate logging workflow?", "opts": ["FortiGate records the activity in a log message, scans the traffic against firewall policies, forwards the message to FortiAnalyzer, then lets the traffic pass", "FortiGate writes a log file to FortiAnalyzer first, then scans the traffic against firewall policies, then records a matching log message locally", "Traffic passes, FortiGate scans and acts on it per policy, records a log message, then adds it to a log file on a log-capable device", "FortiGate scans the traffic against firewall policies, writes the result into a log file, then generates the log message from that file's contents"], "a": 2, "rat": "The Logging Workflow slide lists four steps: traffic passes through FortiGate, FortiGate scans and acts on it based on firewall policies, records the activity in a log message, and adds the message to a log file on a device capable of storing logs (local FortiGate or an external device such as FortiAnalyzer).", "src": "Video · 0:25", "diff": "medium"}, {"n": 37, "ln": 2, "lesson": 2, "section": "Logging Workflow and Log Types", "topic": "Traffic log subtypes", "q": "Which set lists the Traffic log subtypes on FortiGate?", "opts": ["Forward, VPN, Router", "Application control, Antivirus, Web filter", "Forward, Local, Sniffer", "System, User, Wireless"], "a": 2, "rat": "The Log Types and Subtypes table lists Forward, Local and Sniffer under Traffic; System/User/Wireless/VPN/Router are Event subtypes and Application control/Antivirus/Web filter are Security subtypes.", "src": "Video · 1:15", "diff": "easy"}, {"n": 38, "ln": 3, "lesson": 2, "section": "Logging Workflow and Log Types", "topic": "Security log type", "q": "Security logs contain entries based on the security profile type. Which log type value do they carry in the log header?", "opts": ["utm", "security", "traffic", "event"], "a": 0, "rat": "The slide and notes state that security logs are based on the security profile type (log type = utm), covering application control, antivirus, DLP, antispam, web filter, IPS, anomaly and WAF.", "src": "Video · 1:15", "diff": "easy"}, {"n": 39, "ln": 4, "lesson": 2, "section": "Logging Workflow and Log Types", "topic": "Missing security log menu", "q": "An administrator does not see a menu item for a particular security log subtype in the FortiGate GUI. What is the most likely explanation?", "opts": ["No logs of that subtype have been generated yet, so there is nothing to display", "Security logs are embedded in traffic logs and never have their own menu item", "Security logs can only be viewed from the CLI, never from the GUI", "The menu item only appears after the FortiGate is registered to FortiAnalyzer"], "a": 0, "rat": "The notes explain that security logs and subtypes are visible in the GUI only if logs are created within them; if no security logs exist, the menu item does not appear.", "src": "Video · 1:40", "diff": "medium"}, {"n": 40, "ln": 5, "lesson": 2, "section": "Logging Workflow and Log Types", "topic": "WAN optimization logs", "q": "Where are WAN optimization logs found on FortiGate?", "opts": ["In a separate log category handled apart from all default logs", "Within event logs under a dedicated WAN optimization subtype", "Within security logs under the Anomaly subtype", "Within traffic logs"], "a": 3, "rat": "A callout on the Log Types and Subtypes slide states that WAN optimization logs are found within traffic logs.", "src": "Video · 1:15", "diff": "hard"}, {"n": 41, "ln": 6, "lesson": 2, "section": "Log Severity and Message Structure", "topic": "Most severe level", "q": "Which log severity level indicates that the system is unstable?", "opts": ["1 - Alert", "7 - Debug", "0 - Emergency", "2 - Critical"], "a": 2, "rat": "The Log Severity Levels table shows 0 - Emergency described as 'System unstable'; 0 is the highest importance.", "src": "Video · 2:05", "diff": "easy"}, {"n": 42, "ln": 7, "lesson": 2, "section": "Log Severity and Message Structure", "topic": "Warning level", "q": "A FortiGate log entry's severity description reads 'Functionality could be affected'. Which severity level is it?", "opts": ["5 - Notification", "3 - Error", "4 - Warning", "2 - Critical"], "a": 2, "rat": "In the severity table, 4 - Warning is 'Functionality could be affected'; 3 - Error means an error exists that can affect functionality, 2 - Critical means functionality is affected, and 5 - Notification is information about normal events.", "src": "Video · 2:05", "diff": "medium"}, {"n": 43, "ln": 8, "lesson": 2, "section": "Log Severity and Message Structure", "topic": "Debug level", "q": "When is the debug log level (7) typically used?", "opts": ["As the recommended default level for all production event logs", "Automatically, whenever reliable logging is enabled on FortiGate", "Whenever historical FortiView data is required on the dashboard", "Rarely, mainly when actively investigating an issue with Fortinet Support"], "a": 3, "rat": "The slide callout and notes say the debug level adds diagnostic information to an event log and is rarely used unless you are actively investigating an issue with Fortinet Support.", "src": "Video · 2:05", "diff": "medium"}, {"n": 44, "ln": 9, "lesson": 2, "section": "Log Severity and Message Structure", "topic": "Lowest recommended level", "q": "Generally, what is the lowest log level you should use, and what caution applies to it?", "opts": ["Debug; it is the only level that captures every security event and blocked session", "Information; even it creates enough logs to cause premature hard disk failure", "Notification; the information level is not supported for disk logging on FortiGate", "Warning; FortiAnalyzer discards anything lower than warning when it receives the logs"], "a": 1, "rat": "The notes state that the lowest log level you should generally use is information, but even this level generates many logs and can cause premature hard disk failure.", "src": "Video · 2:05", "diff": "hard"}, {"n": 45, "ln": 10, "lesson": 2, "section": "Log Severity and Message Structure", "topic": "Header type and subtype", "q": "In the log header, what do the type and subtype fields represent?", "opts": ["The action taken by FortiGate", "The reason for the action", "The firewall policy applied to the session", "The name of the log file"], "a": 3, "rat": "The Log Message Layout slide states 'Type and subtype = Name of log file' in the log header; policyid, action and msg are body fields.", "src": "Video · 2:30", "diff": "medium"}, {"n": 46, "ln": 11, "lesson": 2, "section": "Log Severity and Message Structure", "topic": "Log body fields", "q": "What determines which fields appear in the body of a FortiGate log message?", "opts": ["The log type and subtype", "The VDOM that generated the log", "Whether the log is stored on disk or on FortiAnalyzer", "The severity level of the entry"], "a": 0, "rat": "The notes explain that the header is similar in all logs, while the type and subtype of logs determine which fields appear in the log body (the body varies by log type).", "src": "Video · 2:30", "diff": "medium"}, {"n": 47, "ln": 12, "lesson": 2, "section": "Log Storage Options", "topic": "Enable disk logging CLI", "q": "Which CLI configuration enables local disk logging on a FortiGate?", "opts": ["config log disk setting / set status enable", "config log memory setting / set status enable", "config system global / set disk-log enable", "config log fortianalyzer setting / set status enable"], "a": 0, "rat": "The Log Storage - Local slide shows '# config log disk setting' followed by 'set status enable' to store logs locally.", "src": "Video · 3:45", "diff": "easy"}, {"n": 48, "ln": 13, "lesson": 2, "section": "Log Storage Options", "topic": "FortiView without disk logging", "q": "What happens to FortiView when disk logging is disabled on FortiGate?", "opts": ["FortiView dashboards are removed from the GUI entirely", "FortiView logs are available only in real time", "FortiView keeps historical data in memory for 24 hours", "FortiView shows historical data only for security logs"], "a": 1, "rat": "The slide states that if disk logging is enabled the report daemon collects statistics for historical FortiView from disk; if disabled, FortiView logs are only available in real time.", "src": "Video · 4:10", "diff": "medium"}, {"n": 49, "ln": 14, "lesson": 2, "section": "Log Storage Options", "topic": "Local log retention", "q": "By default, how long does FortiGate keep logs on its local disk?", "opts": ["Logs older than 30 days are deleted; the value is fixed", "Logs older than 365 days are deleted; configurable only on FortiAnalyzer", "Logs older than seven days are deleted; the value is configurable", "Logs are never deleted; the oldest are overwritten when the disk is full"], "a": 2, "rat": "The slide states that by default logs older than seven days are deleted from disk, configurable via 'config log disk setting / set maximum-log-age <integer>'.", "src": "Video · 4:10", "diff": "easy"}, {"n": 50, "ln": 15, "lesson": 2, "section": "Log Storage Options", "topic": "Local logging prerequisite", "q": "Which statement about remote logging to FortiAnalyzer or FortiManager is correct?", "opts": ["Remote logging is only available on FortiGate models without an internal disk", "Local logging does not need to be enabled to configure logging to FortiAnalyzer or FortiManager", "Disk logging must be enabled first, because remote logs are uploaded from the local disk", "The remote logging device must be on the same network as FortiGate"], "a": 1, "rat": "The notes state that local logging is not required for you to configure logging to FortiAnalyzer or FortiManager, and that the logging device can be on the same network as FortiGate or outside it.", "src": "Video · 5:00", "diff": "medium"}, {"n": 51, "ln": 16, "lesson": 2, "section": "Log Storage Options", "topic": "WAN optimization and disk logging", "q": "A FortiGate with a single local disk uses that disk for WAN optimization. What is the logging implication?", "opts": ["Logs are written to disk only at the debug level", "The disk is automatically partitioned so that both functions share it", "WAN optimization is disabled automatically when disk logging is enabled", "It cannot also log to disk, but it can log to a remote FortiAnalyzer"], "a": 3, "rat": "The notes explain that if the local hard disk is used for WAN optimization and only one disk is available, you cannot also log to disk unless the device has two separate disks; you can log to remote FortiAnalyzer devices instead.", "src": "Video · 3:45", "diff": "hard"}, {"n": 52, "ln": 17, "lesson": 2, "section": "Log Storage Options", "topic": "FortiCloud retention", "q": "What log retention does FortiCloud provide?", "opts": ["The free tier keeps logs for one year, but without any reporting or FortiView access", "There is no free tier; any FortiCloud logging requires a paid subscription from day one", "A free tier keeps logs for 30 days; a paid upgrade retains them for five years", "A free tier keeps logs for seven days; a paid upgrade retains them for one year"], "a": 3, "rat": "The notes describe FortiCloud as a subscription-based hosted log retention service; every FortiGate offers a free tier that keeps logs for seven days, and you must upgrade to the paid service to retain logs for one year.", "src": "Video · 4:35", "diff": "medium"}, {"n": 53, "ln": 18, "lesson": 2, "section": "Log Storage Options", "topic": "FortiManager vs FortiAnalyzer logging", "q": "How does logging to FortiManager compare with logging to FortiAnalyzer?", "opts": ["FortiManager cannot accept log entries at all; only FortiAnalyzer can", "FortiManager's daily log volume is limited to a fixed amount lower than FortiAnalyzer's", "FortiManager has a higher log limit than FortiAnalyzer because it manages many devices", "Both have identical log limits because they share a common platform"], "a": 1, "rat": "The notes state that although FortiAnalyzer and FortiManager share a common platform and can both take logs, FortiManager's primary purpose is central management, so its log volumes are limited to a fixed amount per day, less than FortiAnalyzer, whose log limit is much higher (model dependent).", "src": "Video · 5:00", "diff": "hard"}, {"n": 54, "ln": 19, "lesson": 2, "section": "FortiAnalyzer Modes and Registration", "topic": "Default operating mode", "q": "What is the default FortiAnalyzer operating mode, and where can it be changed?", "opts": ["Collector; in System Settings > Advanced > Device Log Settings", "Analyzer; in the System Information widget on the dashboard", "Collector; in Device Manager, by editing the ADOM properties", "Analyzer; only from the CLI, and only after a factory reset"], "a": 1, "rat": "The Analyzer mode slide shows Dashboard > System Information with Operation Mode set to Analyzer and a callout 'Analyzer is the default mode'; the notes say the mode is changed in the System Information widget.", "src": "Video · 6:15", "diff": "medium"}, {"n": 55, "ln": 20, "lesson": 2, "section": "FortiAnalyzer Modes and Registration", "topic": "Collector mode behavior", "q": "Which statement describes FortiAnalyzer in collector mode?", "opts": ["It acts as the central log aggregator that receives logs from FortiAnalyzers in collector mode", "It accepts logs only from other FortiAnalyzers, never directly from FortiGate devices", "It normalizes logs and runs reports locally before forwarding summaries", "It collects logs from multiple devices and forwards them in their original binary format"], "a": 3, "rat": "The Collector slide and notes state that a collector collects logs from multiple devices and forwards them in their original binary format to another device such as an analyzer-mode FortiAnalyzer; it is archiving only and does not allow event management or reporting.", "src": "Video · 6:40", "diff": "medium"}, {"n": 56, "ln": 21, "lesson": 2, "section": "FortiAnalyzer Modes and Registration", "topic": "Collector to syslog/CEF", "q": "Under what condition can a FortiAnalyzer in collector mode forward logs to a syslog or CEF server?", "opts": ["Only in store-and-upload mode", "Never; a collector can forward only to another FortiAnalyzer", "Only in five-minute batch mode", "Only in real-time forwarding mode"], "a": 3, "rat": "The Collector slide states the collector can forward to a syslog/CEF server in real-time forwarding mode only.", "src": "Video · 6:40", "diff": "hard"}, {"n": 57, "ln": 22, "lesson": 2, "section": "FortiAnalyzer Modes and Registration", "topic": "Choosing modes", "q": "A company wants a branch FortiAnalyzer that only archives logs and passes them to a headquarters FortiAnalyzer that performs analytics and reporting. How should the two units be configured?", "opts": ["Branch in analyzer mode; headquarters in collector mode", "Both in collector mode", "Branch in collector mode; headquarters in analyzer mode", "Both in analyzer mode with reporting disabled at the branch"], "a": 2, "rat": "Collector mode collects logs and forwards them to a FortiAnalyzer in analyzer mode and is used for archiving only (no event management or reporting), while analyzer mode is the central log aggregator for one or more collectors.", "src": "Video · 6:40", "diff": "medium"}, {"n": 58, "ln": 23, "lesson": 2, "section": "FortiAnalyzer Modes and Registration", "topic": "Registration states", "q": "From FortiAnalyzer's perspective, what is the difference between a registered and an unregistered device?", "opts": ["A registered device has a FortiCare license; an unregistered device does not", "A registered device sends its logs over reliable TCP; an unregistered device sends logs only over UDP", "A registered device is authorized to store logs; an unregistered device is requesting to store logs", "A registered device is in the root ADOM; an unregistered device is in a custom ADOM"], "a": 2, "rat": "The Methods of Device Registration slide lists two states: Registered, authorized to store logs on FortiAnalyzer; Unregistered, requesting to store logs on FortiAnalyzer.", "src": "Video · 7:30", "diff": "easy"}, {"n": 59, "ln": 24, "lesson": 2, "section": "FortiAnalyzer Modes and Registration", "topic": "Add Device wizard", "q": "When adding a device with the FortiAnalyzer Add Device wizard, what can the device be added based on?", "opts": ["Its serial number or a pre-shared key", "FortiGate administrator credentials or an API token", "A FortiCare account ID or license file", "Its MAC address or hostname"], "a": 0, "rat": "The notes say you can add devices using the Add Device wizard based on the device serial number or a pre-shared key; if all details are correct, FortiAnalyzer registers the device.", "src": "Video · 7:30", "diff": "medium"}, {"n": 60, "ln": 25, "lesson": 2, "section": "FortiAnalyzer Modes and Registration", "topic": "FortiGate GUI path", "q": "On FortiGate, where does the administrator enable remote logging to FortiAnalyzer so the device sends a registration request?", "opts": ["Dashboard > System Information > Remote Log Destination Settings", "Log & Report > Log Settings > Local Logs > Disk Logging", "Security Fabric > Fabric Connectors > Logging & Analytics", "System > Settings > Log Upload > FortiAnalyzer Server IP"], "a": 2, "rat": "The Request From a Supported Device slide shows the FortiGate path Security Fabric > Fabric Connectors > Logging & Analytics with Status enabled and the FortiAnalyzer server IP.", "src": "Video · 7:55", "diff": "medium"}, {"n": 61, "ln": 26, "lesson": 2, "section": "FortiAnalyzer Modes and Registration", "topic": "Authorizing a request", "q": "After a supported FortiGate sends a registration request, where does it appear on FortiAnalyzer?", "opts": ["In Log View > Logs, pending until the first log arrives from FortiGate", "It is authorized automatically and placed in a new ADOM named after the FortiGate", "In System Settings > Advanced > Device Log Settings, as a pending entry", "In Device Manager under the root ADOM, as an unauthorized device awaiting authorization"], "a": 3, "rat": "The notes state the request automatically appears under the root ADOM in Device Manager; the FortiAnalyzer administrator reviews the unauthorized device, authorizes it, and can assign a device name.", "src": "Video · 7:55", "diff": "medium"}, {"n": 62, "ln": 27, "lesson": 2, "section": "FortiAnalyzer Modes and Registration", "topic": "Verify FortiAnalyzer certificate", "q": "After configuring the FortiAnalyzer IP and clicking Apply on FortiGate, the request reaches FortiAnalyzer. If Verify FortiAnalyzer certificate is enabled, what must the FortiGate administrator do?", "opts": ["Confirm the serial number of the FortiAnalyzer device", "Reboot FortiGate to establish the connection", "Enter the FortiAnalyzer administrator password", "Upload the FortiAnalyzer CA certificate to FortiGate"], "a": 0, "rat": "The notes state that after you click Apply and the request reaches FortiAnalyzer, you must confirm the FortiAnalyzer serial number if the Verify FortiAnalyzer certificate setting is enabled.", "src": "Video · 7:55", "diff": "hard"}, {"n": 63, "ln": 28, "lesson": 2, "section": "Log Upload and Reliable Logging", "topic": "Default upload option", "q": "What is the default upload option for FortiGate logs sent to FortiAnalyzer?", "opts": ["store-and-upload", "Real Time", "Every Minute", "Every 5 Minutes"], "a": 3, "rat": "The Upload Option slide lists store-and-upload (CLI only), Real Time, Every Minute and Every 5 Minutes, marked as the default.", "src": "Video · 8:20", "diff": "easy"}, {"n": 64, "ln": 29, "lesson": 2, "section": "Log Upload and Reliable Logging", "topic": "store-and-upload", "q": "Which statement about the store-and-upload option is correct?", "opts": ["It is CLI-only and available only on FortiGate models with an internal hard drive", "It sends logs in real time with consistent high-speed compression", "It is the GUI default upload option on all FortiGate models", "It requires a FortiCloud subscription and is set in Log Settings"], "a": 0, "rat": "The slide notes store-and-upload is CLI configuration only and a callout says it is available only on FortiGate devices that have an internal hard drive; logs are stored on disk and uploaded at a scheduled time.", "src": "Video · 8:20", "diff": "medium"}, {"n": 65, "ln": 30, "lesson": 2, "section": "Log Upload and Reliable Logging", "topic": "FortiAnalyzer disk full", "q": "By default, what happens when the FortiAnalyzer disk is full?", "opts": ["FortiAnalyzer stops logging, although it can be configured to overwrite the oldest logs", "Oldest logs are overwritten, thoug
